<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050914">
<title>JASON STORE - Officiel</title>
<style>
:root{--bg:#050914;--blue:#00d4ff;--gold:#d8aa45;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#101d35 0,var(--bg) 100%);color:white;font-family:Arial,sans-serif;min-height:100vh}
.container{max-width:1000px;margin:auto;padding:16px 14px 100px}.header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.logo{font-weight:900;color:var(--blue);font-size:18px}.badge{font-size:10px;border:1px solid #22c55e55;background:#22c55e15;color:var(--green);padding:7px 12px;border-radius:20px}.search{width:100%;background:#081222;border:1px solid #ffffff1b;color:white;border-radius:12px;padding:13px;margin:12px 0}.hero{padding:16px;border-radius:16px;background:linear-gradient(145deg,#1a2f55,#0c1627);border:1px solid #00d4ff38;margin-bottom:16px}.app-card{background:linear-gradient(145deg,#12213a,#0c1627);border:1px solid #d8aa4570;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 25px #0006}.app-icon{width:78px;height:78px;border-radius:19px;background:#000;border:2px solid var(--gold);overflow:hidden;flex-shrink:0}.app-icon img{width:100%;height:100%;object-fit:cover;display:block}.app-info{flex:1;min-width:0}.app-name{font-size:15px;font-weight:900}.app-meta{font-size:11px;color:#8e9aad;margin-top:5px}.app-desc{font-size:11px;color:#c5d2e5;margin-top:7px;line-height:1.5}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:900;font-size:12px;cursor:pointer}.btn-install{background:linear-gradient(100deg,#00d4ff,#0077ff);color:#001018;white-space:nowrap}.btn-free{background:#22c55e20;border:1px solid #22c55e40;color:#22c55e;padding:4px 7px;font-size:9px;border-radius:6px;margin-left:6px}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:3000;background:#12213a;border:1px solid #d8aa4540;padding:12px 16px;border-radius:12px;font-size:12px;transition:.25s;text-align:center;max-width:90%}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none;position:fixed;inset:0;background:#02050be8;z-index:1000;padding:16px;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{width:100%;max-width:500px;background:linear-gradient(145deg,#12213a,#091321);border:1px solid #e6bd6759;border-radius:22px;padding:20px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#050914fa;border-top:1px solid #ffffff14;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:900}.bottom-nav a{flex:1;text-decoration:none;color:#6b7a90;font-size:10px;font-weight:700;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom-nav a span.icon{font-size:20px}.bottom-nav a.active{color:var(--blue)}
</style>
</head>
<body>
<div class="container">
<div class="header"><div class="logo">JASON STORE</div><div class="badge">● GRATUIT</div></div>
<div class="hero"><h3 style="margin:0">👑 Jason Business Officiel</h3><p style="font-size:11px;color:#aab8cc;margin:7px 0 0">WEB • DESIGN • DIGITAL • IA</p><p style="font-size:12px;color:#22c55e;margin:10px 0 0">✓ Application disponible gratuitement</p></div>
<input class="search" id="search" placeholder="Rechercher une application...">
<div id="list" style="display:grid;gap:14px;margin-top:12px"></div>
<p style="text-align:center;color:#65748b;font-size:10px;margin-top:25px">JASON STORE © 2026 • Jason Aloma 🇨🇩</p>
</div>
<div class="overlay" id="modal"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<nav class="bottom-nav">
<a href="tableau%20de%20bord.html"><span class="icon">📊</span>Dashboard</a>
<a href="boutique.html"><span class="icon">🛍️</span>Boutique</a>
<a href="store.html" class="active"><span class="icon">🛒</span>Store</a>
<a href="profil.html"><span class="icon">👤</span>Profil</a>
</nav>
<script>
const $=id=>document.getElementById(id);
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),3000);}

// NOUVEAUX NOMS FINAUX
const ICON="./jason.png";
const ICON_RAW="https://raw.githubusercontent.com/djesonaloma-boop/Jason-business/principal/jason.png";
const APK="./jason.apk";
const APK_RELEASE="https://github.com/djesonaloma-boop/Jason-business/releases/download/v1.0/jason.apk";

const apps=[{id:"jason1",name:"Jason Business 1.0",version:"1.0.0",size:"28 MB",downloads:"5K+",cat:"Business",desc:"Découvre Jason Business : WEB, DESIGN, DIGITAL et IA. Accède à tes outils et services digitaux depuis ton téléphone.",icon:ICON,iconRaw:ICON_RAW,apk:APK,apkRelease:APK_RELEASE}];

function render(f=""){
  const term=f.toLowerCase().trim();
  const filtered=apps.filter(a=>(a.name+" "+a.desc).toLowerCase().includes(term));
  if(!filtered.length){ $("list").innerHTML='<div style="text-align:center;padding:30px;color:#8e9aad">Aucune app</div>';return;}
  $("list").innerHTML=filtered.map(a=>`
    <div class="app-card">
      <div class="app-icon" onclick="openDetail('${a.id}')"><img src="${a.icon}" onerror="this.onerror=null;this.src='${a.iconRaw}'" alt="JB"></div>
      <div class="app-info" onclick="openDetail('${a.id}')"><div class="app-name">${a.name}<span class="btn-free">GRATUIT</span></div><div class="app-meta">v${a.version} • ${a.size} • ${a.downloads}</div><div class="app-desc">${a.desc}</div></div>
      <button class="btn btn-install" onclick="event.stopPropagation(); downloadApp('${a.id}')">INSTALLER</button>
    </div>`).join("");
}

window.openDetail=function(id){
  const a=apps.find(x=>x.id===id);
  $("modalContent").innerHTML=`
    <div style="display:flex;gap:14px;align-items:center"><div class="app-icon" style="width:80px;height:80px;border-radius:20px;overflow:hidden;border:2px solid #d8aa45"><img src="${a.icon}" onerror="this.src='${a.iconRaw}'" style="width:100%;height:100%;object-fit:cover"></div><div><h3 style="margin:0 0 8px">${a.name}</h3><small style="color:#8e9aad">JASON BUSINESS</small><br><span class="btn-free" style="display:inline-block;margin:8px 0 0">OFFICIEL • GRATUIT</span></div></div>
    <p style="font-size:12px;color:#c5d2e5;line-height:1.7;margin-top:16px">${a.desc}</p>
    <button class="btn btn-install" style="width:100%;padding:15px" onclick="downloadApp('${a.id}')">📥 Télécharger gratuitement</button>
    <button class="btn" style="width:100%;margin-top:9px;background:#182943;color:white" onclick="closeModal()">Fermer</button>`;
  $("modal").classList.add("show");
};

window.closeModal=function(){ $("modal").classList.remove("show");};

window.downloadApp=function(id){
  toast("📥 Téléchargement Jason Business...");
  const a=apps.find(x=>x.id===id);
  // Essaye local, si 404 => Release
  fetch(a.apk,{method:'HEAD'}).then(r=>{
    if(r.ok){ window.location.href=a.apk; }
    else{ window.location.href=a.apkRelease; }
  }).catch(()=>{ window.location.href=a.apkRelease; });
  closeModal();
};

$("search").addEventListener("input",e=>render(e.target.value));
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
render();
</script>
</body>
</html>
