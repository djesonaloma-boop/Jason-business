<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050914">
<title>JASON STORE</title>

<style>
:root{
  --bg:#050914;
  --blue:#00d4ff;
  --blue2:#0077ff;
  --gold:#d8aa45;
  --green:#22c55e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top,#172b4c 0%,#0a1426 42%,var(--bg) 100%);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
button,input{font-family:inherit}
.container{
  max-width:1000px;
  margin:auto;
  padding:16px 14px 110px;
}

/* EN-TÊTE */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 0;
  animation:fadeDown .6s ease;
}
.logo{
  font-weight:900;
  color:var(--blue);
  font-size:18px;
  letter-spacing:1px;
  text-shadow:0 0 18px #00d4ff55;
}
.badge{
  font-size:10px;
  border:1px solid #22c55e66;
  background:linear-gradient(135deg,#22c55e20,#22c55e08);
  color:var(--green);
  padding:8px 12px;
  border-radius:20px;
  box-shadow:0 0 15px #22c55e0b;
  white-space:nowrap;
}

/* BANNIÈRE ORIGINALE */
.hero{
  position:relative;
  overflow:hidden;
  padding:19px 16px;
  border-radius:18px;
  background:linear-gradient(145deg,#1a3156,#101d33 60%,#0b1526);
  border:1px solid #00d4ff45;
  margin-bottom:16px;
  box-shadow:0 12px 35px #0004,inset 0 1px #ffffff08;
  animation:fadeUp .65s ease;
}
.hero:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  top:-85px;
  right:-45px;
  border-radius:50%;
  background:#00d4ff13;
  border:1px solid #00d4ff12;
  pointer-events:none;
}
.hero h3{
  position:relative;
  margin:0;
  font-size:17px;
  font-weight:900;
}
.hero p{position:relative}
.hero .subtitle{
  font-size:11px;
  color:#b5c5da;
  margin:8px 0 0;
  letter-spacing:1px;
}
.hero .free-text{
  font-size:12px;
  color:var(--green);
  margin:12px 0 0;
}

/* RECHERCHE */
.search{
  display:block;
  width:100%;
  background:linear-gradient(135deg,#0b1729,#081222);
  border:1px solid #ffffff1b;
  color:white;
  border-radius:13px;
  padding:14px;
  margin:12px 0 16px;
  outline:none;
  font-size:13px;
  transition:border-color .25s,box-shadow .25s;
  box-shadow:0 6px 18px #0002;
}
.search::placeholder{color:#8190a7}
.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #00d4ff14,0 6px 20px #0003;
}

/* APPLICATION */
#list{
  display:grid;
  gap:13px;
}
.app-card{
  background:linear-gradient(145deg,#142642,#0c1627);
  border:1px solid #d8aa4566;
  border-radius:20px;
  padding:14px;
  display:flex;
  gap:14px;
  align-items:center;
  box-shadow:0 12px 28px #0003;
  animation:fadeUp .5s ease both;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.app-card:active{transform:scale(.99)}
.app-icon{
  width:78px;
  height:78px;
  border-radius:19px;
  background:#000;
  border:2px solid var(--gold);
  overflow:hidden;
  flex-shrink:0;
  box-shadow:0 0 20px #d8aa451b;
}
.app-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.app-info{flex:1;min-width:0}
.app-name{
  font-size:15px;
  font-weight:900;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.app-meta{
  font-size:11px;
  color:#8e9aad;
  margin-top:5px;
}
.app-desc{
  font-size:11px;
  color:#c5d2e5;
  margin-top:7px;
  line-height:1.5;
}
.btn{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-weight:900;
  font-size:12px;
  cursor:pointer;
  transition:transform .15s,filter .2s;
}
.btn:active{transform:scale(.95)}
.btn-install{
  background:linear-gradient(110deg,#00d4ff,#0077ff);
  color:#001018;
  box-shadow:0 5px 18px #0077ff30;
}
.btn-free{
  display:inline-block;
  background:#22c55e20;
  border:1px solid #22c55e40;
  color:#22c55e;
  padding:4px 7px;
  font-size:9px;
  border-radius:6px;
  margin-left:6px;
  vertical-align:middle;
}

/* MESSAGE */
.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:3000;
  background:#12213a;
  border:1px solid #d8aa4560;
  box-shadow:0 8px 30px #0005;
  padding:12px 16px;
  border-radius:12px;
  font-size:12px;
  transition:opacity .25s,transform .25s;
  text-align:center;
  max-width:90%;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MENU INFÉRIEUR ORIGINAL */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
  background:rgba(5,9,20,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #ffffff14;
  padding:10px 4px calc(10px + env(safe-area-inset-bottom));
  z-index:9999;
  box-shadow:0 -8px 25px #0002;
}
.bottom-nav button{
  flex:1;
  background:none;
  border:0;
  color:#6b7a90;
  font-size:10px;
  font-weight:700;
  padding:6px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  transition:color .2s,transform .2s;
}
.bottom-nav button span.icon{font-size:22px}
.bottom-nav button.active{color:var(--blue)}
.bottom-nav button.active span.icon{
  filter:drop-shadow(0 0 7px #00d4ff65);
}
.bottom-nav button:active{transform:scale(.94)}

/* ANIMATIONS */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:translateY(0)}
}

/* PETITS ÉCRANS */
@media(max-width:420px){
  .container{padding:13px 11px 110px}
  .app-card{gap:10px;padding:11px}
  .app-icon{width:65px;height:65px;border-radius:16px}
  .app-name{font-size:13px}
  .app-meta{font-size:10px}
  .app-desc{font-size:10px}
  .btn-install{padding:11px 9px;font-size:10px}
}
@media(max-width:350px){
  .app-card{flex-wrap:wrap}
  .app-info{min-width:calc(100% - 80px)}
  .app-card>.btn-install{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="logo">JASON STORE</div>
    <div class="badge">● GRATUIT</div>
  </div>

  <div class="hero">
    <h3>👑 Jason Business Officiel</h3>
    <p class="subtitle">WEB • DESIGN • DIGITAL • IA</p>
    <p class="free-text">✓ Application disponible gratuitement</p>
  </div>

  <input
    class="search"
    id="search"
    placeholder="Rechercher..."
    autocomplete="off"
  >

  <div id="list"></div>

</div>

<div class="toast" id="toast"></div>

<!-- MENU ORIGINAL CONSERVÉ -->
<nav class="bottom-nav">
  <button onclick="goPage('dashboard.html')">
    <span class="icon">📊</span>Dashboard
  </button>
  <button onclick="goPage('boutique.html')">
    <span class="icon">🛍️</span>Boutique
  </button>
  <button class="active" onclick="goPage('store.html')">
    <span class="icon">🛒</span>Store
  </button>
  <button onclick="goPage('profil.html')">
    <span class="icon">👤</span>Profil
  </button>
</nav>

<script>
function goPage(p){
  window.location.href = p;
}

let toastTimer;
function toastMsg(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  },3000);
}

const ICON = "./jason.png";
const APK = "./jason.apk";

const apps = [
  {
    id:"jason1",
    name:"Jason Business 1.0",
    version:"1.0.0",
    size:"28 MB",
    desc:"Découvre Jason Business : WEB, DESIGN, DIGITAL et IA.",
    icon:ICON,
    apk:APK
  }
];

function render(){
  const list = document.getElementById("list");
  const query = document.getElementById("search")
    .value.trim().toLowerCase();

  const filtered = apps.filter(a =>
    (a.name + " " + a.desc + " " + a.version)
      .toLowerCase().includes(query)
  );

  list.innerHTML = "";

  if(filtered.length === 0){
    list.innerHTML =
      '<div style="text-align:center;padding:25px;color:#8e9aad;font-size:12px">Aucune application trouvée.</div>';
    return;
  }

  filtered.forEach(a => {
    const card = document.createElement("div");
    card.className = "app-card";

    const iconBox = document.createElement("div");
    iconBox.className = "app-icon";

    const img = document.createElement("img");
    img.src = a.icon;
    img.alt = a.name;

    img.onerror = function(){
      if(!this.dataset.fallback){
        this.dataset.fallback = "1";
        this.src = "https://raw.githubusercontent.com/djesonaloma-boop/Jason-business/principal/jason.png";
      }else{
        this.onerror = null;
      }
    };

    iconBox.appendChild(img);

    const info = document.createElement("div");
    info.className = "app-info";

    const name = document.createElement("div");
    name.className = "app-name";
    name.textContent = a.name;

    const free = document.createElement("span");
    free.className = "btn-free";
    free.textContent = "GRATUIT";
    name.appendChild(free);

    const meta = document.createElement("div");
    meta.className = "app-meta";
    meta.textContent = "v" + a.version + " • " + a.size;

    const desc = document.createElement("div");
    desc.className = "app-desc";
    desc.textContent = a.desc;

    info.append(name,meta,desc);

    const install = document.createElement("button");
    install.className = "btn btn-install";
    install.textContent = "INSTALLER";
    install.type = "button";
    install.addEventListener("click",downloadApp);

    card.append(iconBox,info,install);
    list.appendChild(card);
  });
}

function downloadApp(){
  toastMsg("📥 Téléchargement en cours...");

  const a = document.createElement("a");
  a.href = APK + "?t=" + Date.now();
  a.download = "jason.apk";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById("search").addEventListener("input",render);

render();
</script>
</body>
</html>
