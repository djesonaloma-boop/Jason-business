<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Admin - Total Control</title>
<style>
:root{--blue:#00d2ff;--bg:#030812;--card:rgba(255,255,255,.06);--red:#ff4757;--green:#00e676}
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:var(--bg);color:white;padding:15px}
h1{text-align:center;color:var(--blue)}.card{background:var(--card);border:1px solid rgba(0,210,255,.3);border-radius:15px;padding:15px;margin-bottom:15px}
button{padding:10px 15px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin:3px}
.btn-green{background:var(--green);color:black}.btn-red{background:var(--red);color:white}.btn-blue{background:var(--blue);color:black}
input{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:white;width:100%;margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
#loginAdmin{max-width:350px;margin:50px auto;text-align:center}
</style>
</head>
<body>

<div id="loginAdmin" class="card">
    <h1>🔐 JB ADMIN</h1>
    <p>Code secret</p>
    <input type="password" id="adminCode" placeholder="Code admin">
    <button class="btn-blue" style="width:100%" onclick="checkAdmin()">🔓 Ouvrir l'administration</button>
    <div id="adminStatus" style="margin-top:10px;color:#ffeb3b;font-weight:bold"></div>
</div>

<div id="adminPanel" style="display:none">
    <h1>👑 JASON BUSINESS - ADMIN TOTAL</h1>
    <div style="text-align:center;margin-bottom:10px">
        <button class="btn-red" onclick="logoutAdmin()">Déconnexion</button>
        <button class="btn-blue" onclick="loadUsers()">🔄 Actualiser</button>
    </div>

    <div class="card">
        <h3>💰 Dépôts en attente M-Pesa 0847500590</h3>
        <div id="depotList">Chargement...</div>
    </div>

    <div class="card">
        <h3>👥 Tous les utilisateurs Jasonuser/</h3>
        <div id="userList">Chargement...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
    authDomain: "starlink-investit.firebaseapp.com",
    databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com",
    projectId: "starlink-investit",
    storageBucket: "starlink-investit.firebasestorage.app",
    messagingSenderId: "807081599583",
    appId: "1:807081599583:web:e00ec3959bc4acdae031ea"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SECRET = "10092007";
const loginDiv = document.getElementById("loginAdmin");
const panelDiv = document.getElementById("adminPanel");
const statusEl = document.getElementById("adminStatus");

// Si déjà connecté
if(localStorage.getItem("jasonIsAdmin")==="true"){
    loginDiv.style.display="none";
    panelDiv.style.display="block";
    loadUsers();
}

window.checkAdmin = function(){
    const code = document.getElementById("adminCode").value.trim();
    if(code === SECRET){
        localStorage.setItem("jasonIsAdmin","true");
        localStorage.setItem("jasonBusinessUserPhone","jason_admin");
        statusEl.innerText="✅ Accès autorisé";
        statusEl.style.color="#00e676";
        setTimeout(()=>{
            loginDiv.style.display="none";
            panelDiv.style.display="block";
            loadUsers();
        },500);
    } else {
        statusEl.innerText="❌ Code incorrect. Réessayez";
        statusEl.style.color="#ff4757";
    }
}

window.logoutAdmin = function(){
    localStorage.clear();
    location.reload();
}

window.loadUsers = async function(){
    const userList = document.getElementById("userList");
    const depotList = document.getElementById("depotList");
    userList.innerHTML = "⏳ Chargement...";
    depotList.innerHTML = "⏳ Chargement...";

    try{
        // Plus de "Serveur indisponible" - on va direct dans Firebase
        const snap = await get(ref(db, "Jasonuser"));
        if(!snap.exists()){
            userList.innerHTML="Aucun utilisateur trouvé";
            depotList.innerHTML="Aucun dépôt";
            return;
        }
        const users = snap.val();
        let htmlUsers = `<table><tr><th>Numéro</th><th>Nom</th><th>Solde</th><th>Action</th></tr>`;
        let htmlDepots = "";
        let hasDepot = false;

        for(const phone in users){
            const u = users[phone];
            const solde = u.solde || u.balance || 0;
            const nom = u.nom || u.name || "Inconnu";
            htmlUsers += `<tr><td>${phone}</td><td>${nom}</td><td>${solde} FC</td><td><button class="btn-green" onclick="addSolde('${phone}',${solde})">+5000</button> <button class="btn-red" onclick="blockUser('${phone}')">Bloquer</button></td></tr>`;

            if(u.depotEnAttente || u.pendingDeposit){
                hasDepot = true;
                const montant = u.depotEnAttente || u.pendingDeposit;
                htmlDepots += `<div style="padding:8px;border-bottom:1px solid #333">📱 ${phone} (${nom}) - <b>${montant} FC</b> <button class="btn-green" onclick="confirmDepot('${phone}',${montant},${solde})">Confirmer</button> <button class="btn-red" onclick="refuseDepot('${phone}')">Refuser</button></div>`;
            }
        }
        htmlUsers += `</table>`;
        userList.innerHTML = htmlUsers;
        depotList.innerHTML = hasDepot? htmlDepots : "✅ Aucun dépôt en attente";

    }catch(e){
        console.error(e);
        userList.innerHTML = `❌ Erreur Firebase: ${e.message}<br><br><b>Solution:</b> Va sur Firebase Console > Realtime Database > Rules > Mets <code>{ "rules": { ".read": true, ".write": true } }</code> puis Publish`;
        depotList.innerHTML = "❌ Impossible de charger - Vérifie les Rules Firebase";
    }
}

window.confirmDepot = async function(phone, montant, ancienSolde){
    const nouveau = Number(ancienSolde) + Number(montant);
    await update(ref(db, `Jasonuser/${phone}`), { solde: nouveau, depotEnAttente: null, pendingDeposit: null });
    alert(`✅ ${montant} FC confirmé pour ${phone}. Nouveau solde: ${nouveau}`);
    loadUsers();
}
window.refuseDepot = async function(phone){
    await update(ref(db, `Jasonuser/${phone}`), { depotEnAttente: null, pendingDeposit: null });
    loadUsers();
}
window.addSolde = async function(phone, ancien){
    const m = prompt("Montant à ajouter (FC):","5000");
    if(!m) return;
    await update(ref(db, `Jasonuser/${phone}`), { solde: Number(ancien)+Number(m) });
    loadUsers();
}
window.blockUser = async function(phone){
    if(confirm(`Bloquer ${phone}?`)){
        await update(ref(db, `Jasonuser/${phone}`), { bloque: true, disabled: true });
        loadUsers();
    }
}
</script>
</body>
</html>
