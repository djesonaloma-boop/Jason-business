<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030812">
<meta name="description" content="JASON BUSINESS — Connexion à votre espace personnel">
<title>JASON Business — Connexion</title>
<style>
:root{--blue:#00d2ff;--blue2:#0077ff;--dark:#050a14;--card:rgba(0,0,0,.86);--red:#ff4757;--green:#00e676;--yellow:#ffeb3b}
*{box-sizing:border-box}html{min-height:100%}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(rgba(3,8,18,.65),rgba(3,8,18,.90)),url("IMG_0870.jpeg") center/cover fixed;color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.overlay-login{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,210,255,.08),transparent 45%);pointer-events:none}
.card{width:100%;max-width:390px;padding:30px 24px;background:var(--card);border:1px solid rgba(0,210,255,.55);border-radius:25px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 35px rgba(0,210,255,.20);position:relative;z-index:2}
.logo{width:75px;height:75px;margin:0 auto 15px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#001018;font-size:27px;font-weight:900;box-shadow:0 0 30px rgba(0,210,255,.45)}
h1{color:var(--blue);letter-spacing:3px;margin:0 0 6px;font-size:24px}.subtitle{margin:0 0 25px;font-size:13px;opacity:.65;letter-spacing:1px}
.input-group{text-align:left;margin-top:14px}.input-group label{display:block;margin-bottom:7px;font-size:12px;opacity:.65}
.input-box{position:relative}.input-box > span:first-child{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7;pointer-events:none}
input{width:100%;padding:15px 45px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);color:white;outline:none;font-size:15px;transition:.25s}
input::placeholder{color:rgba(255,255,255,.40)}input:focus{border-color:var(--blue);box-shadow:0 0 12px rgba(0,210,255,.15)}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;opacity:.6;user-select:none;z-index:3}
button{width:100%;padding:15px;margin-top:22px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),#00a8ff);color:#001018;font-size:15px;font-weight:900;letter-spacing:.5px;cursor:pointer;transition:.25s}
button:hover{box-shadow:0 0 20px rgba(0,210,255,.35)}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:not-allowed}
.status{min-height:22px;margin-top:15px;font-size:13px;color:var(--yellow);font-weight:bold;line-height:1.5}
.register{margin-top:22px;font-size:13px;line-height:1.6;opacity:.75}.register strong{color:white}.register a{color:var(--blue);text-decoration:none;font-weight:bold}.register a:hover{text-decoration:underline}
.security{margin-top:20px;padding:10px;border-radius:10px;background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.12);color:var(--green);font-size:10px}
@media(max-width:380px){body{padding:12px}.card{padding:25px 18px}h1{font-size:21px}.logo{width:68px;height:68px;font-size:24px}}
</style>
</head>
<body>
<div class="overlay-login"></div>
<div class="card">
    <div class="logo">JB</div>
    <h1>JASON BUSINESS</h1>
    <p class="subtitle">ACCÈS À VOTRE ESPACE</p>
    <div class="input-group">
        <label>NUMÉRO DE TÉLÉPHONE</label>
        <div class="input-box"><span>📱</span><input type="tel" id="jasonLoginPhone" placeholder="Ex : 243XXXXXXXXX" autocomplete="tel" inputmode="tel"></div>
    </div>
    <div class="input-group">
        <label>MOT DE PASSE</label>
        <div class="input-box"><span>🔐</span><input type="password" id="jasonLoginPassword" placeholder="Votre mot de passe" autocomplete="current-password"><span class="password-toggle" id="jasonPasswordToggle" title="Afficher">👁️</span></div>
    </div>
    <button id="jasonLoginButton" type="button">🚀 SE CONNECTER</button>
    <div id="jasonLoginStatus" class="status" aria-live="polite"></div>
    <div class="register">Nouveau sur <strong>Jason Business</strong> ?<br><a href="register.html">Créer un compte</a></div>
    <div class="security">🔒 Connexion sécurisée à votre espace Jason Business</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
    authDomain:"starlink-investit.firebaseapp.com",
    databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
    projectId:"starlink-investit",
    storageBucket:"starlink-investit.firebasestorage.app",
    messagingSenderId:"807081599583",
    appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// COMPATIBILITE ANCIEN + NOUVEAU CHEMIN
const PATHS_TO_CHECK = ["jasonBusiness/users", "Jasonuser", "users"];

const JASON_SESSION_KEY = "jasonBusinessUserPhone";

const loginPhoneInput = document.getElementById("jasonLoginPhone");
const loginPasswordInput = document.getElementById("jasonLoginPassword");
const loginButton = document.getElementById("jasonLoginButton");
const loginStatus = document.getElementById("jasonLoginStatus");
const passwordToggle = document.getElementById("jasonPasswordToggle");

// Si déjà connecté mais pas de forceLogout, on laisse dashboard gérer
const existing = localStorage.getItem("userPhone") || localStorage.getItem("jasonPhone") || localStorage.getItem(JASON_SESSION_KEY) || localStorage.getItem("phone");
if(existing){
  // on ne redirige pas direct, on vérifie d'abord si forceLogout
  // sinon la déconnexion forcée après reset ne marche pas
}

passwordToggle.addEventListener("click",()=>{
  if(loginPasswordInput.type==="password"){loginPasswordInput.type="text"; passwordToggle.innerText="🙈";}
  else{loginPasswordInput.type="password"; passwordToggle.innerText="👁️";}
});

function cleanJasonPhone(phone){
  return String(phone||"").trim().replace(/\s+/g,"").replace(/-/g,"").replace(/\(/g,"").replace(/\)/g,"");
}
function showJasonStatus(msg,type="warning"){
  loginStatus.innerText=msg;
  if(type==="success") loginStatus.style.color="#00e676";
  else if(type==="error") loginStatus.style.color="#ff4757";
  else loginStatus.style.color="#ffeb3b";
}
function resetLoginButton(){loginButton.disabled=false; loginButton.innerText="🚀 SE CONNECTER";}

function getStoredPassword(userData){
  // Lit TOUS les champs possibles
  return String(userData.password ?? userData.mot_de_passe ?? userData.motDePasse ?? userData.pass ?? userData.mdp ?? userData.code ?? "").trim();
}

async function loginJasonBusiness(){
  const phoneRaw = cleanJasonPhone(loginPhoneInput.value);
  const password = loginPasswordInput.value.trim();

  if(!phoneRaw){showJasonStatus("❌ Entrez votre numéro.","error"); loginPhoneInput.focus(); return;}
  if(!password){showJasonStatus("❌ Entrez votre mot de passe.","error"); loginPasswordInput.focus(); return;}

  loginButton.disabled=true; loginButton.innerText="⏳ AUTHENTIFICATION...";
  showJasonStatus("Connexion à Jason Business...","warning");

  try{
    let foundData = null;
    let foundPath = null;
    let foundKey = null;

    // 1. Cherche dans les 3 chemins possibles
    for(const basePath of PATHS_TO_CHECK){
      const r = ref(db, basePath + "/" + phoneRaw);
      const snap = await get(r);
      if(snap.exists()){
        foundData = snap.val()||{};
        foundPath = basePath;
        foundKey = phoneRaw;
        break;
      }
      // Essai aussi sans 0 initial si le numéro commence par 0
      if(phoneRaw.startsWith("0")){
        const withoutZero = phoneRaw.substring(1);
        const r2 = ref(db, basePath + "/" + withoutZero);
        const snap2 = await get(r2);
        if(snap2.exists()){
          foundData = snap2.val()||{};
          foundPath = basePath;
          foundKey = withoutZero;
          break;
        }
      }
    }

    if(!foundData){
      showJasonStatus("❌ Aucun compte trouvé pour ce numéro.","error");
      resetLoginButton(); return;
    }

    if(foundData.disabled===true || foundData.bloque===true || foundData.active===false){
      showJasonStatus("🚫 Ce compte a été désactivé.","error");
      resetLoginButton(); return;
    }

    // 2. Vérification mot de passe COMPATIBLE
    const savedPassword = getStoredPassword(foundData);
    if(savedPassword !== String(password).trim()){
      showJasonStatus("❌ Mot de passe incorrect.","error");
      resetLoginButton(); return;
    }

    // 3. Si forceLogout existe, on le nettoie après login réussi
    if(foundData.forceLogout){
      try{
        await update(ref(db, foundPath + "/" + foundKey), {forceLogout: null});
      }catch(e){}
    }

    // 4. SESSION COMPATIBLE AVEC TOUTES LES PAGES (profil, dashboard, admin)
    const finalPhone = foundKey; // garde la clé qui a matché
    localStorage.setItem("userPhone", finalPhone);
    localStorage.setItem("jasonPhone", finalPhone);
    localStorage.setItem("phone", finalPhone);
    localStorage.setItem("jasonBusinessPhone", finalPhone);
    localStorage.setItem(JASON_SESSION_KEY, finalPhone);
    localStorage.setItem("jasonBusinessLogged","true");
    localStorage.setItem("jasonBusinessLoginTime", Date.now().toString());
    localStorage.setItem("jasonBusinessUserName", String(foundData.nom||foundData.name||foundData.username||"Utilisateur"));

    showJasonStatus("✅ Accès autorisé. Bienvenue !","success");
    loginButton.innerText="✅ CONNEXION RÉUSSIE";

    setTimeout(()=>{window.location.replace("dashboard.html");},700);

  }catch(error){
    console.error(error);
    showJasonStatus("⚠️ Impossible de contacter Firebase.","error");
    resetLoginButton();
  }
}

loginButton.addEventListener("click",loginJasonBusiness);
loginPhoneInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); loginJasonBusiness();}});
loginPasswordInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); loginJasonBusiness();}});

window.addEventListener("load",()=>{
  // Vérifie si l'utilisateur a été forcé à se déconnecter par l'admin
  const checkForceLogout = async()=>{
    const phone = localStorage.getItem("userPhone") || localStorage.getItem("jasonPhone") || localStorage.getItem(JASON_SESSION_KEY);
    if(!phone) return;
    try{
      const snap = await get(ref(db, "jasonBusiness/users/"+phone));
      if(snap.exists() && snap.val().forceLogout){
        // Admin a reset le MDP, on déconnecte tout
        localStorage.clear(); sessionStorage.clear();
        showJasonStatus("🔑 Votre mot de passe a été réinitialisé. Reconnectez-vous avec le nouveau.","warning");
      }
    }catch(e){}
  };
  checkForceLogout();
  if(!loginPhoneInput.value) loginPhoneInput.focus();
});
</script>
</body>
</html>
