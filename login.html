<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030812">
<title>JASON Business — Connexion</title>
<style>
:root{--blue:#00d2ff;--blue2:#0077ff;--dark:#050a14;--card:rgba(0,0,0,.86);--red:#ff4757;--green:#00e676;--yellow:#ffeb3b}
*{box-sizing:border-box}html{min-height:100%}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(rgba(3,8,18,.65),rgba(3,8,18,.90)),url("IMG_0870.jpeg") center/cover fixed;color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.overlay-login{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,210,255,.08),transparent 45%);pointer-events:none}
.card{width:100%;max-width:390px;padding:30px 24px;background:var(--card);border:1px solid rgba(0,210,255,.55);border-radius:25px;backdrop-filter:blur(18px);box-shadow:0 0 35px rgba(0,210,255,.20);position:relative;z-index:2}
.logo{width:75px;height:75px;margin:0 auto 15px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#001018;font-size:27px;font-weight:900;box-shadow:0 0 30px rgba(0,210,255,.45)}
h1{color:var(--blue);letter-spacing:3px;margin:0 0 6px;font-size:24px}.subtitle{margin:0 0 25px;font-size:13px;opacity:.65;letter-spacing:1px}
.input-group{text-align:left;margin-top:14px}.input-group label{display:block;margin-bottom:7px;font-size:12px;opacity:.65}
.input-box{position:relative}.input-box > span:first-child{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7;pointer-events:none}
input{width:100%;padding:15px 45px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);color:white;outline:none;font-size:15px;transition:.25s}
input::placeholder{color:rgba(255,255,255,.40)}input:focus{border-color:var(--blue);box-shadow:0 0 12px rgba(0,210,255,.15)}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;opacity:.6;user-select:none;z-index:3}
button{width:100%;padding:15px;margin-top:22px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),#00a8ff);color:#001018;font-size:15px;font-weight:900;letter-spacing:.5px;cursor:pointer;transition:.25s}
button:hover{box-shadow:0 0 20px rgba(0,210,255,.35)}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:not-allowed}
.status{min-height:22px;margin-top:15px;font-size:13px;color:var(--yellow);font-weight:bold;line-height:1.5}
.register{margin-top:22px;font-size:13px;line-height:1.6;opacity:.75}.register strong{color:white}.register a{color:var(--blue);text-decoration:none;font-weight:bold}.register a:hover{text-decoration:underline}
.forgot-link{margin-top:14px;display:block;font-size:12px;color:var(--blue);cursor:pointer;text-decoration:none;font-weight:700}
.forgot-link:hover{text-decoration:underline}
.security{margin-top:20px;padding:10px;border-radius:10px;background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.12);color:var(--green);font-size:10px}

/* MODAL MOT DE PASSE OUBLIE */
.overlay{position:fixed;inset:0;background:rgba(2,5,11,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal-forgot{width:100%;max-width:390px;background:linear-gradient(145deg,#0f1f3a,#091121);border:1px solid rgba(0,210,255,.35);border-radius:22px;padding:24px;text-align:left;box-shadow:0 0 30px rgba(0,210,255,.20)}
.modal-forgot h3{margin:0 0 8px;color:var(--blue);text-align:center;letter-spacing:1px}
.modal-forgot p{font-size:12px;opacity:.7;text-align:center;margin:0 0 18px;line-height:1.5}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{width:34px;height:34px;border-radius:10px;border:1px solid #ffffff1c;background:#17253b;color:white;font-size:20px;cursor:pointer}
.btn-gold{background:linear-gradient(100deg,#c08a2c,#f1d48b);color:#111}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:380px){body{padding:12px}.card{padding:25px 18px}}
</style>
</head>
<body>
<div class="overlay-login"></div>
<div class="card">
    <div class="logo">JB</div>
    <h1>JASON BUSINESS</h1>
    <p class="subtitle">ACCÈS À VOTRE ESPACE</p>
    <div class="input-group">
        <label>NUMÉRO DE TÉLÉPHONE</label>
        <div class="input-box"><span>📱</span><input type="tel" id="jasonLoginPhone" placeholder="Ex : 243XXXXXXXXX" autocomplete="tel" inputmode="tel"></div>
    </div>
    <div class="input-group">
        <label>MOT DE PASSE</label>
        <div class="input-box"><span>🔐</span><input type="password" id="jasonLoginPassword" placeholder="Votre mot de passe" autocomplete="current-password"><span class="password-toggle" id="jasonPasswordToggle" title="Afficher">👁️</span></div>
    </div>
    <button id="jasonLoginButton" type="button">🚀 SE CONNECTER</button>
    <a class="forgot-link" id="openForgot">🔑 Mot de passe oublié ?</a>
    <div id="jasonLoginStatus" class="status" aria-live="polite"></div>
    <div class="register">Nouveau sur <strong>Jason Business</strong> ?<br><a href="register.html">Créer un compte</a></div>
    <div class="security">🔒 Connexion sécurisée à votre espace Jason Business</div>
</div>

<!-- MODAL RESET -->
<div class="overlay" id="forgotModal">
  <div class="modal-forgot">
    <div class="modal-head">
      <h3 style="margin:0">🔑 Nouveau mot de passe</h3>
      <button class="close" id="closeForgot">×</button>
    </div>
    <p>Entre ton numéro et crée un nouveau mot de passe. Pas besoin d'ancien mot de passe.</p>
    
    <div class="input-group">
      <label>NUMÉRO DE TÉLÉPHONE</label>
      <div class="input-box"><span>📱</span><input type="tel" id="forgotPhone" placeholder="243XXXXXXXXX"></div>
    </div>
    <div class="input-group">
      <label>NOUVEAU MOT DE PASSE</label>
      <div class="input-box"><span>🔐</span><input type="password" id="forgotNewPass" placeholder="Min 6 caractères"><span class="password-toggle" id="toggleNewPass">👁️</span></div>
    </div>
    <div class="input-group">
      <label>CONFIRMER MOT DE PASSE</label>
      <div class="input-box"><span>✅</span><input type="password" id="forgotConfirmPass" placeholder="Confirme le mot de passe"><span class="password-toggle" id="toggleConfirmPass">👁️</span></div>
    </div>

    <button id="forgotButton" type="button" class="btn-gold" style="margin-top:18px;border-radius:12px;padding:15px;font-weight:900;width:100%;border:0;cursor:pointer">🔄 CHANGER MON MOT DE PASSE</button>
    <div id="forgotStatus" class="status" style="text-align:center"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
    authDomain:"starlink-investit.firebaseapp.com",
    databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
    projectId:"starlink-investit",
    storageBucket:"starlink-investit.firebasestorage.app",
    messagingSenderId:"807081599583",
    appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const PATHS_TO_CHECK = ["jasonBusiness/users", "Jasonuser", "users"];
const JASON_SESSION_KEY = "jasonBusinessUserPhone";

const loginPhoneInput = document.getElementById("jasonLoginPhone");
const loginPasswordInput = document.getElementById("jasonLoginPassword");
const loginButton = document.getElementById("jasonLoginButton");
const loginStatus = document.getElementById("jasonLoginStatus");
const passwordToggle = document.getElementById("jasonPasswordToggle");

passwordToggle.addEventListener("click",()=>{
  if(loginPasswordInput.type==="password"){loginPasswordInput.type="text"; passwordToggle.innerText="🙈";}
  else{loginPasswordInput.type="password"; passwordToggle.innerText="👁️";}
});

function cleanJasonPhone(phone){
  return String(phone||"").trim().replace(/\s+/g,"").replace(/-/g,"").replace(/\(/g,"").replace(/\)/g,"");
}
function showJasonStatus(msg,type="warning"){
  loginStatus.innerText=msg;
  if(type==="success") loginStatus.style.color="#00e676";
  else if(type==="error") loginStatus.style.color="#ff4757";
  else loginStatus.style.color="#ffeb3b";
}
function resetLoginButton(){loginButton.disabled=false; loginButton.innerText="🚀 SE CONNECTER";}
function getStoredPassword(userData){
  return String(userData.password ?? userData.mot_de_passe ?? userData.motDePasse ?? userData.pass ?? userData.mdp ?? userData.code ?? "").trim();
}

async function findUserByPhone(phoneRaw){
  for(const basePath of PATHS_TO_CHECK){
    let r = ref(db, basePath + "/" + phoneRaw);
    let snap = await get(r);
    if(snap.exists()) return {data:snap.val(), path:basePath, key:phoneRaw};
    if(phoneRaw.startsWith("0")){
      const withoutZero = phoneRaw.substring(1);
      r = ref(db, basePath + "/" + withoutZero);
      snap = await get(r);
      if(snap.exists()) return {data:snap.val(), path:basePath, key:withoutZero};
    }
  }
  return null;
}

async function loginJasonBusiness(){
  const phoneRaw = cleanJasonPhone(loginPhoneInput.value);
  const password = loginPasswordInput.value.trim();
  if(!phoneRaw){showJasonStatus("❌ Entrez votre numéro.","error"); return;}
  if(!password){showJasonStatus("❌ Entrez votre mot de passe.","error"); return;}
  loginButton.disabled=true; loginButton.innerText="⏳ AUTHENTIFICATION...";
  showJasonStatus("Connexion à Jason Business...","warning");
  try{
    const found = await findUserByPhone(phoneRaw);
    if(!found){showJasonStatus("❌ Aucun compte trouvé.","error"); resetLoginButton(); return;}
    if(found.data.disabled===true || found.data.bloque===true || found.data.active===false){
      showJasonStatus("🚫 Compte désactivé.","error"); resetLoginButton(); return;
    }
    const savedPassword = getStoredPassword(found.data);
    if(savedPassword !== String(password).trim()){
      showJasonStatus("❌ Mot de passe incorrect.","error"); resetLoginButton(); return;
    }
    if(found.data.forceLogout){
      try{await update(ref(db, found.path + "/" + found.key), {forceLogout: null});}catch(e){}
    }
    const finalPhone = found.key;
    localStorage.setItem("userPhone", finalPhone);
    localStorage.setItem("jasonPhone", finalPhone);
    localStorage.setItem("phone", finalPhone);
    localStorage.setItem("jasonBusinessPhone", finalPhone);
    localStorage.setItem(JASON_SESSION_KEY, finalPhone);
    localStorage.setItem("jasonBusinessLogged","true");
    localStorage.setItem("jasonBusinessLoginTime", Date.now().toString());
    localStorage.setItem("jasonBusinessUserName", String(found.data.nom||found.data.name||"Utilisateur"));
    showJasonStatus("✅ Accès autorisé !","success");
    loginButton.innerText="✅ CONNEXION RÉUSSIE";
    setTimeout(()=>{window.location.replace("dashboard.html");},700);
  }catch(error){
    console.error(error); showJasonStatus("⚠️ Erreur Firebase.","error"); resetLoginButton();
  }
}
loginButton.addEventListener("click",loginJasonBusiness);
loginPhoneInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); loginJasonBusiness();}});
loginPasswordInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); loginJasonBusiness();}});

// ==== MOT DE PASSE OUBLIE ====
const forgotModal = document.getElementById("forgotModal");
const openForgot = document.getElementById("openForgot");
const closeForgot = document.getElementById("closeForgot");
const forgotPhone = document.getElementById("forgotPhone");
const forgotNewPass = document.getElementById("forgotNewPass");
const forgotConfirmPass = document.getElementById("forgotConfirmPass");
const forgotButton = document.getElementById("forgotButton");
const forgotStatus = document.getElementById("forgotStatus");

function showForgotStatus(msg,type="warning"){
  forgotStatus.innerText=msg;
  if(type==="success") forgotStatus.style.color="#00e676";
  else if(type==="error") forgotStatus.style.color="#ff4757";
  else forgotStatus.style.color="#ffeb3b";
}

openForgot.addEventListener("click",()=>{
  forgotPhone.value = cleanJasonPhone(loginPhoneInput.value);
  forgotModal.classList.add("show");
});
closeForgot.addEventListener("click",()=>forgotModal.classList.remove("show"));
forgotModal.addEventListener("click",e=>{if(e.target===forgotModal) forgotModal.classList.remove("show");});

document.getElementById("toggleNewPass").addEventListener("click",function(){
  if(forgotNewPass.type==="password"){forgotNewPass.type="text"; this.innerText="🙈";}else{forgotNewPass.type="password"; this.innerText="👁️";}
});
document.getElementById("toggleConfirmPass").addEventListener("click",function(){
  if(forgotConfirmPass.type==="password"){forgotConfirmPass.type="text"; this.innerText="🙈";}else{forgotConfirmPass.type="password"; this.innerText="👁️";}
});

forgotButton.addEventListener("click", async()=>{
  const phoneRaw = cleanJasonPhone(forgotPhone.value);
  const newPass = forgotNewPass.value.trim();
  const confirmPass = forgotConfirmPass.value.trim();

  if(!phoneRaw){showForgotStatus("❌ Entre ton numéro","error"); return;}
  if(newPass.length<6){showForgotStatus("❌ Min 6 caractères","error"); return;}
  if(newPass!==confirmPass){showForgotStatus("❌ Les mots de passe ne correspondent pas","error"); return;}

  forgotButton.disabled=true;
  const oldText=forgotButton.innerHTML;
  forgotButton.innerHTML=`<span class="spinner"></span> Traitement...`;
  showForgotStatus("Vérification du compte...","warning");

  try{
    const found = await findUserByPhone(phoneRaw);
    if(!found){showForgotStatus("❌ Aucun compte avec ce numéro","error"); forgotButton.disabled=false; forgotButton.innerHTML=oldText; return;}

    // MISE A JOUR MOT DE PASSE - compatible toutes versions
    await update(ref(db, found.path + "/" + found.key), {
      password: newPass,
      mot_de_passe: newPass,
      motDePasse: newPass,
      pass: newPass,
      lastPasswordReset: Date.now(),
      forceLogout: null
    });

    showForgotStatus("✅ Mot de passe changé ! Connecte-toi maintenant","success");
    forgotButton.innerHTML=`✅ CHANGÉ !`;
    setTimeout(()=>{
      forgotModal.classList.remove("show");
      loginPhoneInput.value=phoneRaw;
      loginPasswordInput.value=newPass;
      showJasonStatus("✅ Nouveau mot de passe défini, connecte-toi","success");
      forgotButton.disabled=false;
      forgotButton.innerHTML=oldText;
      forgotNewPass.value=""; forgotConfirmPass.value="";
    },1200);

  }catch(e){
    console.error(e);
    showForgotStatus("⚠️ Erreur: "+e.message,"error");
    forgotButton.disabled=false; forgotButton.innerHTML=oldText;
  }
});
</script>
</body>
</html>
