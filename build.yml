name: Build APK Direct
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nom app'
        required: true
      app_url:
        description: 'URL'
        required: true
      package_name:
        description: 'Package'
        required: true
      theme_color:
        description: 'Couleur'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        
      - name: Build APK
        run: |
          bubblewrap init --manifest ${{ inputs.app_url }}/manifest.json --manifestUrl ${{ inputs.app_url }}/manifest.json
          bubblewrap build
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-APK
          path: ./app/build/outputs/apk/release/*.apk
