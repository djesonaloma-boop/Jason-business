<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<title>JASON Business — Historique</title>

<style>
:root{
    --blue:#00d2ff;
    --blue2:#0077ff;
    --dark:#050a14;
    --glass:rgba(8,15,28,.90);
    --green:#00e676;
    --yellow:#ffeb3b;
    --red:#ff4757;
    --orange:#ff9800;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;
    min-height:100vh;
    padding-bottom:100px;
    background:
        linear-gradient(rgba(3,8,18,.84),rgba(3,8,18,.96)),
        url("IMG_0870.jpeg") center/cover fixed;
}

.header{
    padding:23px 18px;
    text-align:center;
    background:rgba(0,0,0,.68);
    border-bottom:1px solid rgba(0,210,255,.4);
    backdrop-filter:blur(15px);
}

.logo{
    color:var(--blue);
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
}

.subtitle{
    margin-top:6px;
    font-size:11px;
    opacity:.6;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:18px;
}

/* SOLDE */
.balance-card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,rgba(0,119,255,.22),rgba(0,210,255,.07));
    border:1px solid rgba(0,210,255,.4);
    border-radius:19px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.22);
}

.balance-card:after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    right:-35px;
    top:-45px;
    background:rgba(0,210,255,.08);
}

.balance-label{
    font-size:12px;
    opacity:.7;
}

.balance-value{
    font-size:29px;
    font-weight:900;
    color:var(--blue);
    margin:9px 0;
    overflow-wrap:anywhere;
}

.balance-note{
    font-size:10px;
    opacity:.55;
}

.balance-actions{
    display:flex;
    gap:9px;
    margin-top:16px;
}

.balance-btn{
    flex:1;
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(0,210,255,.35);
    border-radius:10px;
    padding:11px 5px;
    font-size:11px;
    font-weight:800;
}

/* COMPTEURS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    margin-bottom:18px;
}

.stat{
    background:rgba(8,15,28,.88);
    border:1px solid rgba(255,255,255,.09);
    border-radius:13px;
    padding:13px 5px;
    text-align:center;
}

.stat-icon{font-size:20px}
.stat-number{
    font-size:19px;
    font-weight:900;
    margin:5px 0;
}
.stat-label{
    font-size:9px;
    opacity:.6;
}

/* ONGLETS */
.tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    margin-bottom:18px;
}

.tab-btn{
    padding:12px 5px;
    border:1px solid rgba(0,210,255,.45);
    background:rgba(0,0,0,.35);
    color:white;
    border-radius:11px;
    cursor:pointer;
    font-weight:800;
    font-size:11px;
    transition:.2s;
}

.tab-btn.active{
    background:var(--blue);
    color:#001018;
    border-color:var(--blue);
}

.tab-btn:active{transform:scale(.97)}

.list-container{display:none}
.list-container.active{display:block}

/* TRANSACTIONS */
.trans-card{
    background:var(--glass);
    border:1px solid rgba(255,255,255,.10);
    padding:15px;
    border-radius:16px;
    margin-bottom:10px;
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.trans-left{min-width:0;flex:1}
.amount{font-weight:900;font-size:16px;overflow-wrap:anywhere}
.deposit{color:var(--green)}
.withdraw{color:var(--red)}
.order{color:var(--blue)}

.service{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
    overflow-wrap:anywhere;
}

.date{
    margin-top:6px;
    font-size:10px;
    opacity:.55;
    line-height:1.5;
}

.detail{
    margin-top:5px;
    font-size:10px;
    opacity:.65;
    word-break:break-word;
}

.status{
    flex-shrink:0;
    max-width:115px;
    padding:6px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:900;
    text-align:center;
    overflow-wrap:anywhere;
}

.status-attente{
    color:var(--yellow);
    background:rgba(255,235,59,.10);
    border:1px solid rgba(255,235,59,.25);
}
.status-valide{
    color:var(--green);
    background:rgba(0,230,118,.10);
    border:1px solid rgba(0,230,118,.25);
}
.status-rejete{
    color:var(--red);
    background:rgba(255,71,87,.10);
    border:1px solid rgba(255,71,87,.25);
}
.status-autre{
    color:var(--orange);
    background:rgba(255,152,0,.10);
    border:1px solid rgba(255,152,0,.25);
}

.empty,.loading{
    text-align:center;
    padding:35px 18px;
    opacity:.65;
    font-size:12px;
    line-height:1.7;
}

.empty-icon{font-size:34px;margin-bottom:10px}

.loader{
    display:inline-block;
    width:18px;
    height:18px;
    border:2px solid rgba(255,255,255,.15);
    border-top:2px solid var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:7px;
}

@keyframes spin{to{transform:rotate(360deg)}}

.error-box{
    color:#ff9ba5;
    border:1px solid rgba(255,71,87,.25);
    border-radius:12px;
    padding:15px;
    text-align:center;
    font-size:12px;
    line-height:1.6;
}

.navbar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(5,10,20,.97);
    border-top:1px solid rgba(0,210,255,.3);
    backdrop-filter:blur(18px);
}

.nav-link{
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:10px;
    opacity:.55;
    min-width:50px;
}

.nav-link span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-link.active{color:var(--blue);opacity:1}

@media(max-width:430px){
    .container{padding:13px}
    .trans-card{padding:12px;gap:7px}
    .amount{font-size:14px}
    .status{font-size:9px;padding:6px}
    .balance-value{font-size:25px}
    .tab-btn{font-size:10px}
}

@media(prefers-reduced-motion:reduce){
    *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">JASON BUSINESS</div>
    <div class="subtitle">HISTORIQUE DE VOS OPÉRATIONS</div>
</header>

<main class="container">

    <!-- SOLDE EN DIRECT -->
    <section class="balance-card">
        <div class="balance-label">💳 SOLDE DE MON COMPTE</div>
        <div class="balance-value" id="balanceValue">Chargement...</div>
        <div class="balance-note" id="balanceNote">
            Synchronisation avec Firebase...
        </div>
        <div class="balance-actions">
            <a class="balance-btn" href="recharge.html">＋ Déposer</a>
            <a class="balance-btn" href="retrait.html">↗ Retirer</a>
        </div>
    </section>

    <!-- STATISTIQUES -->
    <section class="stats">
        <div class="stat">
            <div class="stat-icon">💰</div>
            <div class="stat-number" id="countDepots">—</div>
            <div class="stat-label">DÉPÔTS</div>
        </div>
        <div class="stat">
            <div class="stat-icon">💸</div>
            <div class="stat-number" id="countRetraits">—</div>
            <div class="stat-label">RETRAITS</div>
        </div>
        <div class="stat">
            <div class="stat-icon">🛒</div>
            <div class="stat-number" id="countCommandes">—</div>
            <div class="stat-label">COMMANDES</div>
        </div>
    </section>

    <div class="tabs">
        <button class="tab-btn active" data-tab="depots">💰 DÉPÔTS</button>
        <button class="tab-btn" data-tab="retraits">💸 RETRAITS</button>
        <button class="tab-btn" data-tab="commandes">🛒 COMMANDES</button>
    </div>

    <section id="depots" class="list-container active">
        <div id="listeDepots" class="loading">
            <span class="loader"></span>Chargement des dépôts...
        </div>
    </section>

    <section id="retraits" class="list-container">
        <div id="listeRetraits" class="loading">
            <span class="loader"></span>Chargement des retraits...
        </div>
    </section>

    <section id="commandes" class="list-container">
        <div id="listeCommandes" class="loading">
            <span class="loader"></span>Chargement des commandes...
        </div>
    </section>

</main>

<nav class="navbar">
    <a href="dashboard.html" class="nav-link">
        <span>📊</span>Dash
    </a>
    <a href="shop.html" class="nav-link">
        <span>🛒</span>Shop
    </a>
    <a href="equipe.html" class="nav-link">
        <span>👥</span>Équipe
    </a>
    <a href="profil.html" class="nav-link">
        <span>👤</span>Profil
    </a>
</nav>

<script type="module">
import { initializeApp, getApps }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
    authDomain: "starlink-investit.firebaseapp.com",
    databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com",
    projectId: "starlink-investit",
    storageBucket: "starlink-investit.firebasestorage.app",
    messagingSenderId: "807081599583",
    appId: "1:807081599583:web:e00ec3959bc4acdae031ea"
};

const app = getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);

const db = getDatabase(app);

const userPhone =
    localStorage.getItem("userPhone") ||
    localStorage.getItem("jasonBusinessUserPhone");

if (!userPhone) {
    window.location.replace("login.html");
    throw new Error("Utilisateur non connecté.");
}

const $ = id => document.getElementById(id);

function formatFC(value) {
    return Math.floor(Number(value) || 0).toLocaleString("fr-FR");
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function normalizeStatus(status) {
    const value = String(status || "En attente").toLowerCase();

    if (value.includes("attente") || value.includes("pending"))
        return "attente";

    if (
        value.includes("valid") ||
        value.includes("accept") ||
        value.includes("approuv")
    ) return "valide";

    if (
        value.includes("rejet") ||
        value.includes("refus") ||
        value.includes("annul")
    ) return "rejete";

    return "autre";
}

function statusHTML(status) {
    const text = String(status || "En attente");
    return `<div class="status status-${normalizeStatus(text)}">${escapeHTML(text)}</div>`;
}

function showError(id, message) {
    $(id).innerHTML = `<div class="error-box">⚠️ ${escapeHTML(message)}</div>`;
}

/* SOLDE DU CLIENT : lecture en direct */
onValue(
    ref(db, "jasonBusiness/users/" + userPhone),
    snapshot => {
        const user = snapshot.val();

        if (!user) {
            $("balanceValue").textContent = "0 FC";
            $("balanceNote").textContent =
                "Compte introuvable. Vérifie ton profil.";
            return;
        }

        // Compatibilité avec plusieurs noms de champ déjà utilisés.
        const balance =
            user.solde_principal ??
            user.balance ??
            user.solde ??
            0;

        $("balanceValue").textContent = formatFC(balance) + " FC";
        $("balanceNote").textContent =
            "✓ Solde actualisé automatiquement";
    },
    error => {
        console.error("Erreur du solde :", error);
        $("balanceValue").textContent = "Indisponible";
        $("balanceNote").textContent =
            "Impossible de lire le solde. Vérifie la connexion.";
    }
);

/* ONGLETS */
document.querySelectorAll(".tab-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(btn =>
            btn.classList.remove("active")
        );

        document.querySelectorAll(".list-container").forEach(section =>
            section.classList.remove("active")
        );

        button.classList.add("active");
        $(button.dataset.tab).classList.add("active");
    });
});

/* LECTURE DES LISTES */
function loadTransactions(path, listId, countId, options) {
    onValue(
        ref(db, path),
        snapshot => {
            const list = $(listId);
            const items = [];

            snapshot.forEach(child => {
                const data = child.val() || {};

                if (String(data.telephone ?? "") !== String(userPhone))
                    return;

                items.push({
                    key: child.key,
                    data
                });
            });

            // Tri chronologique si timestamp disponible, sinon ordre inverse.
            items.sort((a, b) => {
                const ta = Number(a.data.timestamp || a.data.createdAtTimestamp || 0);
                const tb = Number(b.data.timestamp || b.data.createdAtTimestamp || 0);

                if (ta && tb) return tb - ta;
                return 0;
            });

            if (!items.some(item =>
                Number(item.data.timestamp || item.data.createdAtTimestamp || 0)
            )) {
                items.reverse();
            }

            $(countId).textContent = items.length;

            if (!items.length) {
                list.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">${options.icon}</div>
                        ${options.empty}
                    </div>`;
                return;
            }

            list.innerHTML = items.map(({data}) => {
                const amount = Number(
                    options.amount(data)
                ) || 0;

                const date = data.date || data.createdAt || "Date inconnue";
                const status = statusHTML(data.statut);

                const details = options.details(data);

                return `
                    <article class="trans-card">
                        <div class="trans-left">
                            <div class="amount ${options.color}">
                                ${options.sign} ${formatFC(amount)} FC
                            </div>
                            <div class="service">
                                ${escapeHTML(options.title(data))}
                            </div>
                            ${details ? `<div class="detail">${details}</div>` : ""}
                            <div class="date">${escapeHTML(date)}</div>
                        </div>
                        ${status}
                    </article>`;
            }).join("");
        },
        error => {
            console.error("Erreur Firebase :", path, error);
            $(countId).textContent = "—";
            showError(listId, "Impossible de charger les opérations. Vérifie les règles d'accès Firebase.");
        }
    );
}

/* DÉPÔTS */
loadTransactions(
    "demandes_recharges",
    "listeDepots",
    "countDepots",
    {
        icon: "💰",
        empty: "Aucun dépôt trouvé.",
        color: "deposit",
        sign: "+",
        amount: data => data.montant,
        title: () => "💰 Recharge du compte",
        details: data => {
            const id = data.transactionID || data.transactionId || data.transID || "";
            const method = data.methode || data.operateur || data.modePaiement || "";
            return [
                id ? "ID : " + escapeHTML(id) : "",
                method ? "Moyen : " + escapeHTML(method) : ""
            ].filter(Boolean).join("<br>");
        }
    }
);

/* RETRAITS */
loadTransactions(
    "demandes_retraits",
    "listeRetraits",
    "countRetraits",
    {
        icon: "💸",
        empty: "Aucun retrait trouvé.",
        color: "withdraw",
        sign: "−",
        amount: data => data.montant,
        title: data => "💸 " + (data.methode || "Retrait"),
        details: data => {
            const wallet = data.numero_reception || data.numero || "";
            return wallet
                ? "Réception : " + escapeHTML(wallet)
                : "";
        }
    }
);

/* COMMANDES */
loadTransactions(
    "commandes",
    "listeCommandes",
    "countCommandes",
    {
        icon: "🛒",
        empty: "Aucune commande trouvée.",
        color: "order",
        sign: "−",
        amount: data => data.prix,
        title: data => "🛒 " + (data.service || "Service"),
        details: data => {
            if (!data.details || typeof data.details !== "object")
                return "";

            return Object.entries(data.details)
                .filter(([, value]) =>
                    value !== "" &&
                    value !== null &&
                    value !== undefined &&
                    typeof value !== "object"
                )
                .slice(0, 2)
                .map(([key, value]) =>
                    escapeHTML(key) + " : " + escapeHTML(value)
                )
                .join(" • ");
        }
    }
);
</script>

</body>
</html>
