<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<title>JASON Business — Historique</title>

<style>
:root{
    --blue:#00d2ff;
    --blue2:#0077ff;
    --dark:#050a14;
    --glass:rgba(8,15,28,.90);
    --green:#00e676;
    --yellow:#ffeb3b;
    --red:#ff4757;
    --orange:#ff9800;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;
    min-height:100vh;
    padding-bottom:90px;
    background:
      linear-gradient(rgba(3,8,18,.84),rgba(3,8,18,.96)),
      url("IMG_0870.jpeg") center/cover fixed;
}
.header{
    padding:25px 18px;
    text-align:center;
    background:rgba(0,0,0,.68);
    border-bottom:1px solid rgba(0,210,255,.4);
    backdrop-filter:blur(15px);
}
.logo{
    color:var(--blue);
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
}
.subtitle{margin-top:6px;font-size:11px;opacity:.55}
.container{width:100%;max-width:700px;margin:auto;padding:18px}
.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
}
.tab-btn{
    padding:12px 6px;
    border:1px solid rgba(0,210,255,.45);
    background:rgba(0,0,0,.35);
    color:white;
    border-radius:11px;
    cursor:pointer;
    font-weight:800;
    font-size:11px;
    transition:.2s;
}
.tab-btn.active{background:var(--blue);color:#001018;border-color:var(--blue)}
.tab-btn:active{transform:scale(.96)}
.list-container{display:none}
.list-container.active{display:block}
.empty{text-align:center;padding:45px 20px;opacity:.65;font-size:13px}
.empty-icon{font-size:35px;margin-bottom:10px}
.trans-card{
    background:var(--glass);
    border:1px solid rgba(255,255,255,.10);
    padding:15px;
    border-radius:16px;
    margin-bottom:10px;
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    animation:appear .3s ease;
}
@keyframes appear{
    from{opacity:0;transform:translateY(7px)}
    to{opacity:1;transform:translateY(0)}
}
.trans-left{min-width:0;flex:1}
.amount{font-weight:900;font-size:16px}
.deposit{color:var(--green)}
.withdraw{color:var(--red)}
.order{color:var(--blue)}
.service{margin-top:7px;font-size:12px;font-weight:700}
.date{margin-top:7px;font-size:10px;opacity:.55;line-height:1.5}
.detail{margin-top:6px;font-size:10px;opacity:.65;word-break:break-word}
.status{
    flex-shrink:0;
    padding:6px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:900;
    text-align:center;
    max-width:115px;
}
.status-attente{color:var(--yellow);background:rgba(255,235,59,.10);border:1px solid rgba(255,235,59,.25)}
.status-valide{color:var(--green);background:rgba(0,230,118,.10);border:1px solid rgba(0,230,118,.25)}
.status-rejete{color:var(--red);background:rgba(255,71,87,.10);border:1px solid rgba(255,71,87,.25)}
.status-autre{color:var(--orange);background:rgba(255,152,0,.10);border:1px solid rgba(255,152,0,.25)}
.loading{text-align:center;padding:30px;font-size:12px;opacity:.65}
.loader{
    display:inline-block;width:20px;height:20px;
    border:2px solid rgba(255,255,255,.15);
    border-top:2px solid var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGOS DES MOYENS DE PAIEMENT */
.payment-method{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:8px;
    min-height:38px;
}
.payment-logo{
    width:78px;
    height:36px;
    object-fit:contain;
    object-position:left center;
    flex-shrink:0;
    background:rgba(255,255,255,.96);
    border-radius:7px;
    padding:4px;
}
.payment-logo.airtel{
    width:37px;
    height:37px;
    padding:3px;
}
.payment-logo.mpesa{
    width:76px;
    height:38px;
}
.payment-name{
    font-size:12px;
    font-weight:800;
    overflow-wrap:anywhere;
}
.logo-fallback{
    display:none;
    width:37px;
    height:37px;
    border-radius:8px;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:11px;
    font-weight:900;
    flex-shrink:0;
}
.logo-fallback.orange{background:#ff7900}
.logo-fallback.airtel{background:#e60000}
.logo-fallback.mpesa{background:#c8102e}

.navbar{
    position:fixed;bottom:0;left:0;width:100%;height:72px;
    z-index:1000;display:flex;justify-content:space-around;
    align-items:center;background:rgba(5,10,20,.97);
    border-top:1px solid rgba(0,210,255,.3);
    backdrop-filter:blur(18px);
}
.nav-link{
    color:white;text-decoration:none;text-align:center;
    font-size:10px;opacity:.5;transition:.2s;
}
.nav-link span{display:block;font-size:21px;margin-bottom:3px}
.nav-link.active{color:var(--blue);opacity:1}
@media(max-width:430px){
    .container{padding:13px}
    .trans-card{padding:12px;gap:8px}
    .amount{font-size:15px}
    .status{font-size:9px;padding:6px}
    .payment-logo{width:65px}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">JASON BUSINESS</div>
    <div class="subtitle">HISTORIQUE DE VOS OPÉRATIONS</div>
</header>

<main class="container">

    <div class="tabs">
        <button class="tab-btn active" data-tab="depots">💰 DÉPÔTS</button>
        <button class="tab-btn" data-tab="retraits">💸 RETRAITS</button>
        <button class="tab-btn" data-tab="commandes">🛒 COMMANDES</button>
    </div>

    <section id="depots" class="list-container active">
        <div id="listeDepots" class="loading">
            <span class="loader"></span>Chargement des dépôts...
        </div>
    </section>

    <section id="retraits" class="list-container">
        <div id="listeRetraits" class="loading">
            <span class="loader"></span>Chargement des retraits...
        </div>
    </section>

    <section id="commandes" class="list-container">
        <div id="listeCommandes" class="loading">
            <span class="loader"></span>Chargement des commandes...
        </div>
    </section>

</main>

<nav class="navbar">
    <a href="dashboard.html" class="nav-link">
        <span>📊</span>Dash
    </a>
    <a href="shop.html" class="nav-link">
        <span>🛒</span>Shop
    </a>
    <a href="equipe.html" class="nav-link">
        <span>👥</span>Équipe
    </a>
    <a href="profil.html" class="nav-link">
        <span>👤</span>Profil
    </a>
</nav>

<script type="module">
import { initializeApp, getApps }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIGURATION FIREBASE */
const firebaseConfig = {
    apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
    authDomain: "starlink-investit.firebaseapp.com",
    databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com",
    projectId: "starlink-investit",
    storageBucket: "starlink-investit.firebasestorage.app",
    messagingSenderId: "807081599583",
    appId: "1:807081599583:web:e00ec3959bc4acdae031ea"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getDatabase(app);

/* SESSION CLIENT */
const userPhone =
    localStorage.getItem("jasonBusinessUserPhone") ||
    localStorage.getItem("userPhone");

if (!userPhone) {
    window.location.replace("login.html");
    throw new Error("Session client absente.");
}

/* OUTILS */
function formatFC(value) {
    return Math.floor(Number(value) || 0).toLocaleString("fr-FR");
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function normalizeStatus(status) {
    const value = String(status || "En attente").toLowerCase();

    if (value.includes("attente") || value.includes("pending"))
        return "attente";

    if (value.includes("valid") ||
        value.includes("accept") ||
        value.includes("approuv") ||
        value.includes("termin"))
        return "valide";

    if (value.includes("rejet") ||
        value.includes("refus") ||
        value.includes("annul"))
        return "rejete";

    return "autre";
}

function statusHTML(status) {
    const text = status || "En attente";
    return `<div class="status status-${normalizeStatus(text)}">${escapeHTML(text)}</div>`;
}

/* LOGOS DES MOYENS DE PAIEMENT
   Les images proviennent de Wikimedia Commons.
   Si une image ne charge pas, un petit repère de secours apparaît.
*/
const paymentBrands = [
    {
        name: "orange",
        match: /orange\s*money|orangemoney/i,
        label: "Orange Money",
        src: "https://commons.wikimedia.org/wiki/Special:FilePath/Logo_Orange_Money.svg",
        initials: "OM",
        css: "orange",
        logoClass: ""
    },
    {
        name: "airtel",
        match: /airtel/i,
        label: "Airtel Money",
        src: "https://commons.wikimedia.org/wiki/Special:FilePath/Airtel_Africa_logo.svg",
        initials: "A",
        css: "airtel",
        logoClass: "airtel"
    },
    {
        name: "mpesa",
        match: /m[\s-]?pesa|mpesa/i,
        label: "M-Pesa",
        src: "https://commons.wikimedia.org/wiki/Special:FilePath/M-PESA_LOGO-01.svg",
        initials: "M-P",
        css: "mpesa",
        logoClass: "mpesa"
    }
];

function getPaymentBrand(method) {
    const value = String(method || "").trim();
    return paymentBrands.find(brand => brand.match.test(value)) || null;
}

function paymentHTML(method) {
    const brand = getPaymentBrand(method);

    if (!brand) {
        return `<div class="service">💳 ${escapeHTML(method || "Méthode inconnue")}</div>`;
    }

    const safeName = escapeHTML(brand.label);
    const safeSrc = escapeHTML(brand.src);

    return `
        <div class="payment-method">
            <img
                class="payment-logo ${brand.logoClass}"
                src="${safeSrc}"
                alt="Logo ${safeName}"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >
            <span class="logo-fallback ${brand.css}">${brand.initials}</span>
            <span class="payment-name">${safeName}</span>
        </div>
    `;
}

/* ONGLET */
document.querySelectorAll(".tab-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(btn =>
            btn.classList.remove("active")
        );

        document.querySelectorAll(".list-container").forEach(section =>
            section.classList.remove("active")
        );

        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
    });
});

/* AFFICHAGE DES DONNÉES FIREBASE */
function listenToHistory(path, elementId, type) {
    const list = document.getElementById(elementId);

    onValue(ref(db, path), snapshot => {
        list.innerHTML = "";

        const items = [];

        snapshot.forEach(child => {
            const data = child.val() || {};

            if (String(data.telephone || "") !== String(userPhone)) {
                return;
            }

            items.push({ key: child.key, data });
        });

        /* Plus récent en premier */
        items.reverse();

        if (!items.length) {
            const messages = {
                depots: ["💰", "Aucun dépôt trouvé."],
                retraits: ["💸", "Aucun retrait trouvé."],
                commandes: ["🛒", "Aucune commande trouvée."]
            };

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">${messages[type][0]}</div>
                    ${messages[type][1]}
                </div>
            `;
            return;
        }

        items.forEach(({data}) => {
            const amount = type === "commandes"
                ? Number(data.prix) || 0
                : Number(data.montant) || 0;

            const date = data.date || data.createdAt || "Date inconnue";
            const status = statusHTML(data.statut);

            let content = "";

            if (type === "depots") {
                const transaction =
                    data.transactionID ||
                    data.transactionId ||
                    data.transID ||
                    "";

                content = `
                    <div class="amount deposit">+ ${formatFC(amount)} FC</div>
                    <div class="service">💰 Recharge du compte</div>
                    ${transaction ? `<div class="detail">ID : ${escapeHTML(transaction)}</div>` : ""}
                    <div class="date">${escapeHTML(date)}</div>
                `;
            }

            if (type === "retraits") {
                const method = data.methode || "Méthode inconnue";
                const wallet = data.numero_reception || data.numero || "";

                content = `
                    <div class="amount withdraw">− ${formatFC(amount)} FC</div>
                    ${paymentHTML(method)}
                    ${wallet ? `<div class="detail">Réception : ${escapeHTML(wallet)}</div>` : ""}
                    <div class="date">${escapeHTML(date)}</div>
                `;
            }

            if (type === "commandes") {
                const service = data.service || "Service";
                let detailsText = "";

                if (data.details && typeof data.details === "object") {
                    detailsText = Object.entries(data.details)
                        .filter(([key, value]) =>
                            value !== "" && value !== null && value !== undefined
                        )
                        .slice(0, 2)
                        .map(([key, value]) => escapeHTML(value))
                        .join(" • ");
                }

                content = `
                    <div class="amount order">− ${formatFC(amount)} FC</div>
                    <div class="service">🛒 ${escapeHTML(service)}</div>
                    ${detailsText ? `<div class="detail">${detailsText}</div>` : ""}
                    <div class="date">${escapeHTML(date)}</div>
                `;
            }

            const card = document.createElement("article");
            card.className = "trans-card";

            const left = document.createElement("div");
            left.className = "trans-left";
            left.innerHTML = content;

            const statusContainer = document.createElement("div");
            statusContainer.innerHTML = status;

            card.append(left, statusContainer.firstElementChild);
            list.appendChild(card);
        });

    }, error => {
        console.error(`Erreur ${type} :`, error);
        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                Impossible de charger cet historique.
                Vérifie la connexion et les règles Firebase.
            </div>
        `;
    });
}

/* ÉCOUTE DES TROIS HISTORIQUES */
listenToHistory("demandes_recharges", "listeDepots", "depots");
listenToHistory("demandes_retraits", "listeRetraits", "retraits");
listenToHistory("commandes", "listeCommandes", "commandes");

</script>
</body>
</html>
