<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#030812">
<title>JASON BUSINESS - Services</title>
<style>
:root{--blue:#00d2ff;--blue2:#0077ff;--dark:#030812;--card:#0e1b2e;--card2:#13233d;--border:rgba(255,255,255,.08);--green:#00e676;--yellow:#ffd740;--muted:rgba(255,255,255,.55)}
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;padding-bottom:85px;font-family:"Segoe UI",Arial,sans-serif;color:white;background:#030812}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.top-left{display:flex;align-items:center;gap:12px}.top-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#00d2ff,#0077ff);display:flex;align-items:center;justify-content:center;font-weight:900}
.top-icons{display:flex;gap:10px}.top-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;font-size:14px}.badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ff4757;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900}
.hero{margin:16px;padding:22px;border-radius:22px;background:radial-gradient(circle at top,rgba(0,210,255,.15),transparent 40%),linear-gradient(180deg,#0f2340,#0a1528);border:1px solid rgba(0,210,255,.15);text-align:center}
.hero-title{font-size:26px;font-weight:900;letter-spacing:1px}.hero-sub{margin-top:6px;color:var(--muted);font-size:11px}.vip-btn{margin-top:16px;display:inline-block;padding:10px 22px;border-radius:22px;background:linear-gradient(135deg,#ffd740,#ff9800);color:#000;font-weight:900;font-size:11px;border:0}
.search{margin:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.search input{flex:1;background:transparent;border:0;color:white;outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px}.stat{padding:16px;text-align:center;border-radius:16px;background:var(--card);border:1px solid var(--border)}.stat-icon{font-size:18px;margin-bottom:6px}.stat-num{font-size:20px;font-weight:900}.stat-label{font-size:9px;color:var(--muted);margin-top:2px}
.container{max-width:1000px;margin:auto;padding:0 14px}
.section-label{margin:20px 0 12px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}.section-label::before{content:"";width:3px;height:16px;background:var(--yellow);border-radius:2px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.service-card{padding:16px;border-radius:18px;background:linear-gradient(145deg,#111f36,#0c182c);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;min-height:165px}
.service-card-top{display:flex;justify-content:space-between;align-items:flex-start}.service-icon{width:42px;height:42px;border-radius:12px;background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px}
.badge-vip{font-size:7px;font-weight:900;padding:4px 7px;border-radius:20px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:var(--yellow)}.badge-free{font-size:7px;font-weight:900;padding:4px 7px;border-radius:20px;background:rgba(0,230,118,.10);border:1px solid rgba(0,230,118,.25);color:var(--green)}
.service-name{margin-top:12px;font-size:13px;font-weight:900}.service-desc{margin-top:6px;font-size:10px;color:var(--muted);line-height:1.5;flex:1}
.order-btn{margin-top:12px;width:100%;padding:11px;border-radius:12px;border:0;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;font-weight:900;font-size:11px;cursor:pointer}
.open-btn{margin-top:12px;width:100%;padding:11px;border-radius:12px;border:0;background:linear-gradient(135deg,#2a4a8a,#3a6ac0);color:white;font-weight:900;font-size:11px;cursor:pointer}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;height:70px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(3,8,18,.98);border-top:1px solid var(--border);backdrop-filter:blur(20px)}
.nav-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.4);text-decoration:none;font-size:8px;font-weight:700}.nav-link.active{color:var(--blue)}.nav-link span{font-size:16px}
/* API HUB MODAL */
.api-hub{position:fixed;inset:0;z-index:600;display:none;background:#030812;overflow-y:auto;padding-bottom:90px}.api-hub.show{display:block}
.hub-header{padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:rgba(3,8,18,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:10}.hub-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:white;font-size:18px}
.hub-title{font-size:16px;font-weight:900}.api-list{padding:14px;display:grid;gap:12px}
.api-item{padding:16px;border-radius:16px;background:#0e1b2e;border:1px solid var(--border)}.api-item-top{display:flex;justify-content:space-between;gap:10px}.api-item-name{font-size:13px;font-weight:900}.api-item-method{font-size:9px;padding:4px 8px;border-radius:20px;background:var(--blue);color:#001018;font-weight:900}.api-item-url{margin-top:8px;font-size:9px;color:var(--blue);word-break:break-all}.api-item-desc{margin-top:8px;font-size:11px;color:var(--muted)}
.api-docs{margin-top:12px;display:none}.api-docs.show{display:block}
.doc-code{margin-top:8px;padding:10px;border-radius:8px;background:#000;border:1px solid #1a3a2a;color:#00e676;font-size:9px;white-space:pre-wrap;word-break:break-all}
.test-area{margin-top:12px}.test-input{width:100%;margin-top:8px;padding:10px;border-radius:10px;background:#050d18;border:1px solid #263247;color:white;font-size:11px}
.test-btn{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--yellow);color:#000;font-weight:900;font-size:11px}.test-result{margin-top:10px;padding:10px;border-radius:10px;background:#000;border:1px solid #1a3a5a;font-size:10px;white-space:pre-wrap;max-height:250px;overflow-y:auto}
.hub-actions{display:flex;gap:8px;margin-top:10px}.hub-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:white;font-size:10px;font-weight:900}
@media(max-width:500px){.services{grid-template-columns:1fr 1fr}.service-card{min-height:155px}}
</style>
</head>
<body>

<div class="top">
<div class="top-left"><div class="top-logo">JB</div><div style="font-size:10px;line-height:1.2"><b>JASON BUSINESS</b><br><span style="color:var(--muted)">En ligne</span></div></div>
<div class="top-icons"><div class="top-icon">🔔<span class="badge">0</span></div><div class="top-icon">🛒<span class="badge">0</span></div><div class="top-icon">👤</div></div>
</div>

<div class="hero">
<div class="hero-title">JASON SERVICES</div>
<div class="hero-sub">Applications • IA • Sites Web • VPN • Design</div>
<button class="vip-btn">⭐ JASON VIP</button>
</div>

<div class="container">
<div class="search">🔍 <input id="searchInput" placeholder="Rechercher un service..." oninput="filterServices()"></div>

<div class="stats">
<div class="stat"><div class="stat-icon">🛠️</div><div class="stat-num">25+</div><div class="stat-label">Services</div></div>
<div class="stat"><div class="stat-icon">👥</div><div class="stat-num">1K+</div><div class="stat-label">Clients</div></div>
<div class="stat"><div class="stat-icon">🎧</div><div class="stat-num">24/7</div><div class="stat-label">Support</div></div>
</div>

<div class="section-label">Services Premium</div>
<div class="services" id="premium"></div>

<div class="section-label">Services Gratuits</div>
<div class="services" id="free"></div>
</div>

<!-- API HUB VIEW -->
<div class="api-hub" id="apiHub">
<div class="hub-header"><button class="hub-back" onclick="closeHub()">‹</button><div class="hub-title">DAVBOT API - Tous les API (0 FC)</div></div>
<div class="api-list" id="apiList"></div>
</div>

<nav class="bottom-nav">
<a href="#" class="nav-link"><span>📰</span>Actualités</a>
<a href="dashboard.html" class="nav-link"><span>📊</span>Dashboard</a>
<a href="#" class="nav-link"><span>👑</span>VIP</a>
<a href="profil.html" class="nav-link"><span>👤</span>Profil</a>
<a href="#" class="nav-link"><span>⚙️</span>Paramètres</a>
<a href="#" class="nav-link"><span>🔌</span>API</a>
<a href="shop.html" class="nav-link active"><span>🛍️</span>Services</a>
<a href="equipe.html" class="nav-link"><span>👥</span>Amis</a>
<a href="#" class="nav-link"><span>💰</span>Finances</a>
<a href="#" class="nav-link"><span>💬</span>Chat</a>
</nav>

<script>
const API_BASE="https://davbot-outils.vercel.app";
const SERVICES_PREMIUM=[
{id:"app",name:"Application",desc:"Création application mobile Android / IOS professionnelle.",icon:"📱",price:10000},
{id:"site",name:"Site Web Pro",desc:"Création de sites modernes, rapides et responsive.",icon:"🌐",price:15000},
{id:"music",name:"DAVBOT Music Studio",desc:"Création de chansons IA : Afrobeat, Gospel, Rumba.",icon:"🎵",price:5000},
{id:"reseau",name:"Réseaux Sociaux",desc:"Boost visibilité, réseaux sociaux et marketing.",icon:"📱",price:7000},
{id:"vpn",name:"VPN Premium",desc:"Connexion sécurisée et protection avancées.",icon:"🛡️",price:8000},
{id:"ads",name:"DAVBOT ADS",desc:"Publicité intelligente et campagnes promotion digitale.",icon:"📢",price:6000}
];
const SERVICES_FREE=[
{id:"api",name:"DAVBOT API",desc:"API puissantes pour intégrer intelligence artificielle et automatiser vos projets.",icon:"</>",free:true,isApiHub:true},
{id:"qr",name:"Générateur QR",desc:"Création de QR codes pour sites, images et produits.",icon:"🔳",free:true},
{id:"heber",name:"Hébergement",desc:"Surveillance et hébergement de vos plateformes.",icon:"☁️",free:true},
{id:"store",name:"DAVBOT Store",desc:"Télécharger et publier des applications.",icon:"🏪",free:true}
];

const APIS=[
{ id:"ai", name:"DAVBOT IA Chat", method:"POST", url:"/api/intelligence-artificielle/ai", desc:"Chat IA conversationnel", example:{message:"Bonjour DAVBOT, présente-toi.",history:[]}},
{ id:"ask", name:"DAVBOT Vision (ask)", method:"POST", url:"/api/intelligence-artificielle/ask", desc:"Analyse d'image + knowledge + rules", example:{message:"Analyse cette image.",image:"data:image/jpeg;base64,...",knowledge:"",rules:"Réponds clairement.",history:[]}},
{ id:"translate", name:"Traduction IA", method:"POST", url:"/api/intelligence-artificielle/translate", desc:"Traduction multilingue", example:{text:"Bonjour tout le monde",source:"fr",target:"en"}},
{ id:"gen-img", name:"Générateur Image", method:"POST", url:"/api/genere-image/generate", desc:"Génère image par prompt", example:{prompt:"Une ville futuriste à Kinshasa",size:"1024x1024",n:1}},
{ id:"trans-img", name:"Transformation Image", method:"POST", url:"/api/genere-image/image", desc:"Transformer image en affiche", example:{prompt:"Transformer cette image en affiche futuriste",size:"1024x1024",n:1}},
{ id:"video", name:"Générateur Vidéo", method:"POST", url:"/api/media/video", desc:"Génère vidéo IA", example:{prompt:"Une ville futuriste de Kinshasa la nuit",duration:6}},
{ id:"music", name:"Générateur Musique", method:"POST", url:"/api/media/music", desc:"Génère musique IA", example:{prompt:"Afrobeat énergique et mélodique",duration:15}},
{ id:"ads", name:"DAVBOT ADS API", method:"POST", url:"/api/publicite/ads", desc:"API Publicité", example:{action:"catalog"}},
{ id:"data", name:"DAVBOT Data", method:"POST", url:"/api/data", desc:"Accès data", example:{action:"catalog"}},
{ id:"storage", name:"DAVBOT Storage", method:"POST", url:"/api/storage", desc:"Stockage cloud", example:{action:"list"}},
{ id:"hub", name:"DAVBOT Hub", method:"POST", url:"/api/hub", desc:"Hub central catalogue", example:{action:"catalog"}},
{ id:"admin", name:"Admin Auth", method:"POST", url:"/api/admin-auth", desc:"Auth admin", example:{action:"login"}}
];

function renderPremium(){
const c=document.getElementById("premium");c.innerHTML="";
SERVICES_PREMIUM.forEach(s=>{
c.innerHTML+=`<div class="service-card"><div class="service-card-top"><div class="service-icon">${s.icon}</div><div class="badge-vip">VIP PREMIUM</div></div><div class="service-name">${s.name}</div><div class="service-desc">${s.desc}</div><button class="order-btn" onclick="commander('${s.name}')">Commander</button></div>`;
});
}
function renderFree(){
const c=document.getElementById("free");c.innerHTML="";
SERVICES_FREE.forEach(s=>{
const btn = s.isApiHub ? `onclick="openHub()"` : `onclick="commander('${s.name}')"`;
c.innerHTML+=`<div class="service-card"><div class="service-card-top"><div class="service-icon">${s.icon}</div><div class="badge-free">GRATUIT</div></div><div class="service-name">${s.name}</div><div class="service-desc">${s.desc}</div><button class="open-btn" ${btn}>Ouvrir</button></div>`;
});
}
function openHub(){
document.getElementById("apiHub").classList.add("show");
renderApiList();
}
function closeHub(){document.getElementById("apiHub").classList.remove("show");}
function renderApiList(){
const list=document.getElementById("apiList");list.innerHTML="";
APIS.forEach(api=>{
list.innerHTML+=`
<div class="api-item">
<div class="api-item-top"><div class="api-item-name">${api.name}</div><div class="api-item-method">${api.method}</div></div>
<div class="api-item-url">${API_BASE}${api.url}</div>
<div class="api-item-desc">${api.desc}</div>
<div class="hub-actions">
<button class="hub-btn" onclick="toggleDocs('${api.id}')">📄 Docs</button>
<button class="hub-btn" onclick="toggleTest('${api.id}')">🧪 Tester</button>
</div>
<div class="api-docs" id="docs-${api.id}">
<div class="doc-code">JS:
const res = await fetch("${API_BASE}${api.url}",{
 method:"${api.method}",
 headers:{"Content-Type":"application/json"},
 body: JSON.stringify(${JSON.stringify(api.example,null,2)})
});
console.log(await res.json());

PYTHON:
import requests
url="${API_BASE}${api.url}"
data=${JSON.stringify(api.example,null,2)}
r=requests.post(url,json=data)
print(r.json())

CURL:
curl -X POST "${API_BASE}${api.url}" -H "Content-Type: application/json" -d '${JSON.stringify(api.example)}'
</div>
<div class="test-area" id="test-${api.id}" style="display:none">
<textarea class="test-input" id="input-${api.id}" rows="5">${JSON.stringify(api.example,null,2)}</textarea>
<button class="test-btn" onclick="testApi('${api.id}')">🚀 TESTER MAINTENANT</button>
<div class="test-result" id="result-${api.id}" style="display:none"></div>
</div>
</div>
</div>
`;
});
}
window.toggleDocs=function(id){
const el=document.getElementById("docs-"+id);
el.classList.toggle("show");
}
window.toggleTest=function(id){
const docs=document.getElementById("docs-"+id);
docs.classList.add("show");
const test=document.getElementById("test-"+id);
test.style.display = test.style.display==="none" ? "block" : "none";
}
window.testApi=async function(id){
const api=APIS.find(a=>a.id===id);
const input=document.getElementById("input-"+id);
const result=document.getElementById("result-"+id);
result.style.display="block";
result.textContent="⏳ Envoi...";
try{
const payload=JSON.parse(input.value);
const res=await fetch(API_BASE+api.url,{
method:api.method,
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify(payload)
});
const data=await res.json().catch(async()=>({text:await res.text()}));
result.textContent=`✅ Status ${res.status}\n\n${JSON.stringify(data,null,2)}`;
}catch(e){result.textContent="❌ Erreur: "+e.message}
}
window.filterServices=function(){
const q=document.getElementById("searchInput").value.toLowerCase();
document.querySelectorAll(".service-card").forEach(card=>{
card.style.display = card.textContent.toLowerCase().includes(q) ? "flex" : "none";
});
}
window.commander=function(name){alert("🛒 Commande "+name+" - Redirection vers boutique JASON BUSINESS"); window.location.href="shop.html";}

renderPremium();renderFree();
</script>
</body>
</html>
