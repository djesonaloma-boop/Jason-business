<style>
:root{--blue:#00d2ff;--blue2:#0077ff;--dark:#050a14;--green:#00e676;--red:#ff4757;--gold:#ffd700;--purple:#a855f7;--card:rgba(8,15,28,.94);--border:rgba(0,210,255,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;color:white;background:linear-gradient(rgba(3,8,18,.85),rgba(3,8,18,.98)),url("IMG_0870.jpeg") center/cover fixed;padding-bottom:90px}
.header{padding:18px 16px;text-align:center;background:rgba(0,0,0,.6);border-bottom:1px solid var(--border);backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}
.header h1{margin:0;font-size:20px;letter-spacing:2px;color:var(--blue)}.header h1 span{color:var(--gold)}
.balance-bar{margin:12px 16px;padding:12px 16px;border-radius:14px;background:linear-gradient(145deg,rgba(0,210,255,.15),rgba(0,0,0,.5));border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.balance-bar small{font-size:10px;opacity:.6;display:block}.balance-bar b{font-size:16px;color:var(--blue)}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tab{flex:1;min-width:90px;padding:12px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:white;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap;text-align:center}
.tab.active{background:var(--blue);color:#001018;border-color:var(--blue);box-shadow:0 0 20px rgba(0,210,255,.4)}
.container{max-width:650px;margin:auto;padding:0 16px}
.game-panel{display:none}.game-panel.active{display:block}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(18px)}
.game-area{position:relative;width:100%;height:280px;background:radial-gradient(circle at 30% 20%,#0f2040,#050a14 70%);border-radius:16px;border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center}
#aviatorCanvas,#jetxCanvas{position:absolute;inset:0;width:100%;height:100%}
.multiplier{position:absolute;z-index:2;font-size:42px;font-weight:900;color:white;text-shadow:0 0 20px var(--blue);transition:.1s}
.multiplier.crashed{color:var(--red);text-shadow:0 0 20px var(--red)}
.plane{position:absolute;z-index:3;font-size:32px;transition:transform .1s linear;filter:drop-shadow(0 0 10px var(--blue))}
.jet{position:absolute;z-index:3;font-size:34px;transition:transform .1s linear;filter:drop-shadow(0 0 12px var(--gold))}
.crash-text{position:absolute;z-index:4;font-size:18px;font-weight:900;color:var(--red);background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.input-group label{font-size:10px;opacity:.6;display:block;margin-bottom:6px}
.jb-input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:white;font-size:13px;outline:none}
.jb-input:focus{border-color:var(--blue)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-bet{background:var(--green);color:#001a0a}.btn-bet:disabled{background:#333;opacity:.5}
.btn-cash{background:var(--gold);color:#000}.btn-cash:disabled{background:#333;color:#777}
.btn-auto{margin-top:8px;padding:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:white;font-size:10px;border-radius:8px;cursor:pointer}
.btn-auto.active{background:var(--blue);color:#001018}
.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hist{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}
.hist.green{background:rgba(0,230,118,.15);color:var(--green)}.hist.red{background:rgba(255,71,87,.15);color:var(--red)}.hist.gold{background:rgba(255,215,0,.15);color:var(--gold)}

/* PENALTY */
.penalty-field{position:relative;width:100%;height:300px;background:linear-gradient(180deg,#1a4d1a 0,#0f2f0f 100%);border-radius:16px;border:2px solid rgba(255,255,255,.15);overflow:hidden}
.goal{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:70%;height:55%;border:4px solid white;border-bottom:none;background:rgba(255,255,255,.08);border-radius:4px 4px 0 0}
.goal-net{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 18px,rgba(255,255,255,.15) 18px,rgba(255,255,255,.15) 19px),repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(255,255,255,.15) 18px,rgba(255,255,255,.15) 19px)}
.keeper{position:absolute;left:50%;top:45%;transform:translateX(-50%);font-size:38px;transition:left .4s ease;z-index:2}
.ball{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:26px;transition:all .6s cubic-bezier(.25,.46,.45,.94);z-index:3}
.shoot-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.shoot-btn{padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:white;font-weight:900;cursor:pointer}
.shoot-btn:hover{border-color:var(--gold)}

.navbar{position:fixed;bottom:0;left:0;right:0;height:72px;display:flex;justify-content:space-around;align-items:center;background:rgba(4,10,20,.98);border-top:1px solid var(--border);backdrop-filter:blur(18px);z-index:100}
.nav{text-decoration:none;color:white;opacity:.5;text-align:center;font-size:11px;min-width:60px}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:var(--blue);opacity:1;font-weight:bold}
.status{margin-top:10px;text-align:center;font-size:11px;min-height:18px}
.success{color:var(--green)}.error{color:var(--red)}.loading{color:var(--gold)}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const phone=localStorage.getItem("userPhone")||localStorage.getItem("jasonPhone")||localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("phone");
if(!phone){location.replace("login.html");}
const userRef=ref(db,"jasonBusiness/users/"+phone);
let currentBalance=0, currentGains=0;

function fmt(n){return Math.floor(n).toLocaleString("fr-FR");}
function getPrincipal(d){return Number(d.solde_principal??d.solde??d.balance??0)||0;}
function getGains(d){return Number(d.solde_gains??d.gains??0)||0;}

onValue(userRef,snap=>{
 if(!snap.exists()) return;
 const d=snap.val();
 currentBalance=getPrincipal(d);
 currentGains=getGains(d);
 document.getElementById("jbBalance").textContent=fmt(currentBalance)+" FC";
 document.getElementById("jbGains").textContent=fmt(currentGains)+" FC";
});

async function deduct(amount){
 if(amount>currentBalance) throw new Error("Solde insuffisant");
 const res=await runTransaction(userRef,c=>{
  if(!c) return;
  const bal=Number(c.solde_principal??c.solde??0)||0;
  if(bal<amount) return;
  c.solde_principal=bal-amount;
  if(c.solde!==undefined) c.solde=c.solde_principal;
  return c;
 });
 if(!res.committed) throw new Error("Solde insuffisant");
 return true;
}
async function addWin(amount){
 await runTransaction(userRef,c=>{
  if(!c) return;
  c.solde_gains=(Number(c.solde_gains??0)||0)+amount;
  return c;
 });
}

// TABS
document.querySelectorAll(".tab").forEach(t=>{
 t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".game-panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("panel-"+t.dataset.game).classList.add("active");
 });
});

// ===== AVIATOR LOGIC =====
let avRunning=false, avMult=1.0, avCrash=0, avBet=0, avInterval=null, avTimer=5, avAutoBet=false, avAutoCash=false, avHasBet=false;
const avCanvas=document.getElementById("aviatorCanvas"), avCtx=avCanvas.getContext("2d");
function resizeAv(){avCanvas.width=avCanvas.offsetWidth*2; avCanvas.height=avCanvas.offsetHeight*2;}
resizeAv(); window.addEventListener("resize",resizeAv);
function genCrash(){
 // Distribution réaliste aviator: 5% crash <1.1, 95% >1.1, max 100x
 const r=Math.random();
 if(r<0.05) return 1+Math.random()*0.1;
 if(r<0.5) return 1.1+Math.random()*1.9;
 if(r<0.85) return 3+Math.random()*7;
 return 10+Math.random()*90;
}
function drawAvTrail(progress){
 avCtx.clearRect(0,0,avCanvas.width,avCanvas.height);
 avCtx.beginPath();
 avCtx.strokeStyle="#00d2ff"; avCtx.lineWidth=4; avCtx.shadowColor="#00d2ff"; avCtx.shadowBlur=10;
 avCtx.moveTo(0,avCanvas.height);
 for(let i=0;i<=progress*100;i++){
  const x=(i/100)*avCanvas.width*0.85;
  const y=avCanvas.height - Math.pow(i/100,1.6)*avCanvas.height*0.8 - (i/100)*20;
  avCtx.lineTo(x,y);
 }
 avCtx.stroke(); avCtx.shadowBlur=0;
}
function startAviatorRound(){
 avRunning=false; avMult=1.0; avCrash=genCrash();
 document.getElementById("aviatorPlane").style.display="block";
 document.getElementById("aviatorCrash").style.display="none";
 document.getElementById("aviatorMult").classList.remove("crashed");
 document.getElementById("aviatorMult").textContent="1.00x";
 avTimer=5;
 document.getElementById("aviatorBetBtn").style.display="block";
 document.getElementById("aviatorCashBtn").style.display="none";
 document.getElementById("aviatorBetBtn").disabled=false;
 document.getElementById("aviatorBetBtn").innerHTML=`✈️ MISER - Décollage dans <span id="aviatorTimer">${avTimer}</span>s`;
 const tInterval=setInterval(()=>{
  avTimer--; const el=document.getElementById("aviatorTimer"); if(el) el.textContent=avTimer;
  if(avTimer<=0){ clearInterval(tInterval); runAviator(); }
 },1000);
}
function runAviator(){
 avRunning=true;
 document.getElementById("aviatorBetBtn").style.display="none";
 if(avHasBet){ document.getElementById("aviatorCashBtn").style.display="block"; document.getElementById("aviatorCashBtn").disabled=false; }
 document.getElementById("aviatorStatus").textContent="✈️ En vol...";
 let start=Date.now();
 avInterval=setInterval(()=>{
  const elapsed=(Date.now()-start)/1000;
  avMult=1+elapsed*0.6+Math.pow(elapsed,1.8)*0.08;
  if(avMult>=avCrash){ crashAviator(); return; }
  document.getElementById("aviatorMult").textContent=avMult.toFixed(2)+"x";
  document.getElementById("aviatorCashMult").textContent=avMult.toFixed(2)+"x";
  const prog=Math.min(elapsed/15,1);
  document.getElementById("aviatorPlane").style.left=(prog*75)+"%";
  document.getElementById("aviatorPlane").style.bottom=(20+prog*65)+"%";
  document.getElementById("aviatorPlane").style.transform=`rotate(${prog*25}deg)`;
  drawAvTrail(prog);
  const autoVal=parseFloat(document.getElementById("aviatorAuto").value)||2;
  if(avAutoCash && avHasBet && avMult>=autoVal){ cashAviator(); }
 },50);
}
function crashAviator(){
 clearInterval(avInterval); avRunning=false;
 document.getElementById("aviatorMult").classList.add("crashed");
 document.getElementById("aviatorMult").textContent=avCrash.toFixed(2)+"x";
 document.getElementById("aviatorCrash").style.display="block";
 document.getElementById("aviatorPlane").style.display="none";
 document.getElementById("aviatorCashBtn").style.display="none";
 if(avHasBet){
  document.getElementById("aviatorStatus").textContent="💥 Crash! Tu as perdu "+fmt(avBet)+" FC";
  addHist("aviatorHistory",avCrash,false);
  avHasBet=false;
 }else{
  addHist("aviatorHistory",avCrash,false);
 }
 setTimeout(()=>{
  if(avAutoBet){ autoBetAviator(); }
  startAviatorRound();
 },3000);
}
async function cashAviator(){
 if(!avHasBet||!avRunning) return;
 clearInterval(avInterval); avRunning=false;
 const win=Math.floor(avBet*avMult);
 await addWin(win);
 document.getElementById("aviatorStatus").innerHTML=`<span class="success">✅ Encaissé ${fmt(win)} FC à ${avMult.toFixed(2)}x</span>`;
 document.getElementById("aviatorCashBtn").style.display="none";
 addHist("aviatorHistory",avMult,true);
 avHasBet=false;
 setTimeout(()=>{ startAviatorRound(); if(avAutoBet) autoBetAviator(); },2000);
}
function addHist(id,val,win){
 const c=document.getElementById(id); const d=document.createElement("span");
 d.className="hist "+(win?"green": val<2?"red": val<5?"green":"gold");
 d.textContent=val.toFixed(2)+"x"; c.prepend(d);
 if(c.children.length>12) c.lastChild.remove();
}
async function autoBetAviator(){
 const bet=parseInt(document.getElementById("aviatorBet").value)||500;
 try{ await deduct(bet); avBet=bet; avHasBet=true; document.getElementById("aviatorStatus").textContent=`🤖 Mise auto ${fmt(bet)} FC placée`; }catch(e){ document.getElementById("aviatorStatus").textContent="❌ Solde insuffisant pour mise auto"; avAutoBet=false; document.getElementById("aviatorAutoBet").textContent="🤖 Mise Auto: OFF"; document.getElementById("aviatorAutoBet").classList.remove("active"); }
}
document.getElementById("aviatorBetBtn").addEventListener("click",async()=>{
 const bet=parseInt(document.getElementById("aviatorBet").value)||500;
 if(bet<100){document.getElementById("aviatorStatus").textContent="❌ Minimum 100 FC"; return;}
 try{ await deduct(bet); avBet=bet; avHasBet=true; document.getElementById("aviatorBetBtn").disabled=true; document.getElementById("aviatorBetBtn").innerHTML="✅ Pari placé - En attente décollage"; document.getElementById("aviatorStatus").textContent=`✅ Pari ${fmt(bet)} FC placé`; }catch(e){ document.getElementById("aviatorStatus").textContent="❌ "+e.message; }
});
document.getElementById("aviatorCashBtn").addEventListener("click",cashAviator);
document.getElementById("aviatorAutoBet").addEventListener("click",function(){ avAutoBet=!avAutoBet; this.textContent="🤖 Mise Auto: "+(avAutoBet?"ON":"OFF"); this.classList.toggle("active",avAutoBet); });
document.getElementById("aviatorAutoCash").addEventListener("click",function(){ avAutoCash=!avAutoCash; this.textContent="💸 Cash Auto: "+(avAutoCash?"ON":"OFF"); this.classList.toggle("active",avAutoCash); });

// JETX - meme logique avec skin different
let jxRunning=false, jxMult=1.0, jxCrash=0, jxBet=0, jxInterval=null, jxHasBet=false, jxAutoBet=false, jxAutoCash=false;
const jxCanvas=document.getElementById("jetxCanvas"), jxCtx=jxCanvas.getContext("2d");
function resizeJx(){jxCanvas.width=jxCanvas.offsetWidth*2; jxCanvas.height=jxCanvas.offsetHeight*2;}
resizeJx();
function genJxCrash(){ const r=Math.random(); if(r<0.07) return 1+Math.random()*0.2; if(r<0.6) return 1.2+Math.random()*2.5; return 3.5+Math.random()*20; }
function drawJxTrail(p){
 jxCtx.clearRect(0,0,jxCanvas.width,jxCanvas.height);
 jxCtx.beginPath(); jxCtx.strokeStyle="#ffd700"; jxCtx.lineWidth=4; jxCtx.shadowColor="#ffd700"; jxCtx.shadowBlur=12;
 jxCtx.moveTo(0,jxCanvas.height);
 for(let i=0;i<=p*100;i++){ const x=(i/100)*jxCanvas.width*0.8; const y=jxCanvas.height-Math.pow(i/100,1.5)*jxCanvas.height*0.75; jxCtx.lineTo(x,y); }
 jxCtx.stroke(); jxCtx.shadowBlur=0;
}
function startJetxRound(){
 jxRunning=false; jxMult=1.0; jxCrash=genJxCrash();
 document.getElementById("jetxJet").style.display="block"; document.getElementById("jetxCrash").style.display="none";
 document.getElementById("jetxMult").classList.remove("crashed"); document.getElementById("jetxMult").textContent="1.00x";
 document.getElementById("jetxBetBtn").disabled=false; document.getElementById("jetxBetBtn").style.display="block"; document.getElementById("jetxBetBtn").textContent="🚀 MISER JETX";
 document.getElementById("jetxCashBtn").style.display="none";
 setTimeout(runJetx,2000);
}
function runJetx(){
 jxRunning=true;
 if(jxHasBet){ document.getElementById("jetxBetBtn").style.display="none"; document.getElementById("jetxCashBtn").style.display="block"; document.getElementById("jetxCashBtn").disabled=false; }
 let start=Date.now();
 jxInterval=setInterval(()=>{
  const elapsed=(Date.now()-start)/1000;
  jxMult=1+elapsed*0.7+Math.pow(elapsed,1.7)*0.09;
  if(jxMult>=jxCrash){ crashJetx(); return; }
  document.getElementById("jetxMult").textContent=jxMult.toFixed(2)+"x";
  document.getElementById("jetxCashMult").textContent=jxMult.toFixed(2)+"x";
  const prog=Math.min(elapsed/12,1);
  document.getElementById("jetxJet").style.left=(prog*70)+"%";
  document.getElementById("jetxJet").style.bottom=(15+prog*70)+"%";
  document.getElementById("jetxJet").style.transform=`rotate(${prog*30}deg)`;
  drawJxTrail(prog);
  const autoVal=parseFloat(document.getElementById("jetxAuto").value)||2.5;
  if(jxAutoCash && jxHasBet && jxMult>=autoVal){ cashJetx(); }
 },50);
}
function crashJetx(){
 clearInterval(jxInterval); jxRunning=false;
 document.getElementById("jetxMult").classList.add("crashed");
 document.getElementById("jetxMult").textContent=jxCrash.toFixed(2)+"x";
 document.getElementById("jetxCrash").style.display="block";
 document.getElementById("jetxJet").style.display="none";
 document.getElementById("jetxCashBtn").style.display="none";
 if(jxHasBet){ document.getElementById("jetxStatus").textContent="💥 Explosion! Perdu "+fmt(jxBet)+" FC"; addHist("jetxHistory",jxCrash,false); jxHasBet=false; }else{ addHist("jetxHistory",jxCrash,false); }
 setTimeout(()=>{ if(jxAutoBet) autoBetJetx(); startJetxRound(); },3000);
}
async function cashJetx(){
 if(!jxHasBet||!jxRunning) return;
 clearInterval(jxInterval); jxRunning=false;
 const win=Math.floor(jxBet*jxMult);
 await addWin(win);
 document.getElementById("jetxStatus").innerHTML=`<span class="success">✅ ${fmt(win)} FC à ${jxMult.toFixed(2)}x</span>`;
 document.getElementById("jetxCashBtn").style.display="none";
 addHist("jetxHistory",jxMult,true); jxHasBet=false;
 setTimeout(()=>{ startJetxRound(); if(jxAutoBet) autoBetJetx(); },2000);
}
async function autoBetJetx(){
 const bet=parseInt(document.getElementById("jetxBet").value)||500;
 try{ await deduct(bet); jxBet=bet; jxHasBet=true; }catch(e){ jxAutoBet=false; document.getElementById("jetxAutoBet").textContent="🤖 Mise Auto: OFF"; document.getElementById("jetxAutoBet").classList.remove("active"); }
}
document.getElementById("jetxBetBtn").addEventListener("click",async()=>{
 const bet=parseInt(document.getElementById("jetxBet").value)||500;
 try{ await deduct(bet); jxBet=bet; jxHasBet=true; document.getElementById("jetxBetBtn").disabled=true; document.getElementById("jetxBetBtn").textContent="✅ Pari placé"; if(jxRunning){ document.getElementById("jetxBetBtn").style.display="none"; document.getElementById("jetxCashBtn").style.display="block"; } }catch(e){ document.getElementById("jetxStatus").textContent="❌ "+e.message; }
});
document.getElementById("jetxCashBtn").addEventListener("click",cashJetx);
document.getElementById("jetxAutoBet").addEventListener("click",function(){ jxAutoBet=!jxAutoBet; this.textContent="🤖 Mise Auto: "+(jxAutoBet?"ON":"OFF"); this.classList.toggle("active",jxAutoBet); });
document.getElementById("jetxAutoCash").addEventListener("click",function(){ jxAutoCash=!jxAutoCash; this.textContent="💸 Cash Auto: "+(jxAutoCash?"ON":"OFF"); this.classList.toggle("active",jxAutoCash); });

// PENALTY
document.getElementById("penaltyBet").addEventListener("input",function(){
 const bet=parseInt(this.value)||0; document.getElementById("penaltyPotential").value=fmt(bet*2.8)+" FC";
});
document.querySelectorAll(".shoot-btn").forEach(btn=>{
 btn.addEventListener("click",async()=>{
  const dir=btn.dataset.dir;
  const bet=parseInt(document.getElementById("penaltyBet").value)||500;
  if(bet<100){ document.getElementById("penaltyStatus").textContent="❌ Minimum 100 FC"; return; }
  if(bet>currentBalance){ document.getElementById("penaltyStatus").textContent="❌ Solde insuffisant"; return; }
  try{ await deduct(bet); }catch(e){ document.getElementById("penaltyStatus").textContent="❌ "+e.message; return; }

  const keeperDir=["left","center","right"][Math.floor(Math.random()*3)];
  const keeperEl=document.getElementById("keeper");
  const ballEl=document.getElementById("ball");
  // move keeper
  if(keeperDir==="left") keeperEl.style.left="25%";
  if(keeperDir==="center") keeperEl.style.left="50%";
  if(keeperDir==="right") keeperEl.style.left="75%";

  document.getElementById("penaltyStatus").textContent="⚽ Tir en cours...";
  // move ball
  setTimeout(()=>{
   if(dir==="left"){ ballEl.style.left="30%"; ballEl.style.bottom="65%"; }
   if(dir==="center"){ ballEl.style.left="50%"; ballEl.style.bottom="68%"; }
   if(dir==="right"){ ballEl.style.left="70%"; ballEl.style.bottom="65%"; }
  },200);

  setTimeout(async()=>{
   if(dir===keeperDir){
    // gardien arrete
    document.getElementById("penaltyStatus").innerHTML=`<span class="error">🧤 Arrêté par le gardien ! Perdu ${fmt(bet)} FC (gardien: ${keeperDir})</span>`;
    addHist("penaltyHistory",0,false);
   }else{
    const win=Math.floor(bet*2.8);
    await addWin(win);
    document.getElementById("penaltyStatus").innerHTML=`<span class="success">⚽ BUT ! Gagné ${fmt(win)} FC x2.8 (gardien: ${keeperDir})</span>`;
    addHist("penaltyHistory",2.8,true);
   }
   setTimeout(()=>{
    ballEl.style.left="50%"; ballEl.style.bottom="20px"; keeperEl.style.left="50%";
   },1200);
  },800);
 });
});

startAviatorRound();
startJetxRound();
</script>
