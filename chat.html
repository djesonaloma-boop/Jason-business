
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>JASON BUSINESS — Messenger</title>

<style>
:root{
 --bg:#050914;
 --panel:#0b1425;
 --panel2:#101e32;
 --blue:#00d4ff;
 --gold:#d8aa45;
 --text:#f4f8ff;
 --muted:#91a3bb;
 --border:#1b3049;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif;height:100dvh;
 display:flex;flex-direction:column;overflow:hidden
}
header{
 height:66px;flex-shrink:0;background:var(--panel);
 border-bottom:1px solid var(--border);
 display:flex;align-items:center;padding:0 14px;gap:12px
}
.logo{
 width:42px;height:42px;border-radius:14px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#00d4ff,#1268a8);
 color:#00101a;font-weight:900;font-size:18px
}
.headinfo{flex:1;min-width:0}
.headinfo strong{font-size:15px;display:block}
.headinfo small{color:#20dca2;font-size:11px;display:block;margin-top:5px}
.headinfo small.offline{color:var(--muted)}
.headbtn{
 border:1px solid var(--border);background:var(--panel2);
 color:white;border-radius:12px;padding:10px;font-size:18px
}
#messages{
 flex:1;overflow-y:auto;padding:16px 12px 22px;
 display:flex;flex-direction:column;gap:12px;
 background:
 radial-gradient(ellipse at top,#0a1b30 0%,transparent 65%),
 var(--bg)
}
.welcome{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}
.message{max-width:82%;display:flex;flex-direction:column;gap:5px}
.message.mine{align-self:flex-end;align-items:flex-end}
.message.theirs{align-self:flex-start;align-items:flex-start}
.bubble{
 background:var(--panel2);border:1px solid var(--border);
 border-radius:16px 16px 16px 4px;padding:11px 13px;
 font-size:14px;line-height:1.5;overflow-wrap:anywhere
}
.mine .bubble{
 background:#073449;border-color:#07526b;
 border-radius:16px 16px 4px 16px
}
.bubble img,.bubble video{
 display:block;max-width:100%;max-height:300px;border-radius:10px
}
.bubble audio{width:min(250px,65vw);height:42px}
.meta{font-size:10px;color:var(--muted);padding:0 4px}
#recordStatus{
 display:none;text-align:center;padding:9px;color:#ff7070;
 background:#21121b;font-size:12px
}
#preview{
 display:none;padding:8px 12px;background:var(--panel);
 border-top:1px solid var(--border)
}
#preview img{max-height:90px;max-width:120px;border-radius:8px}
.composer{
 padding:10px;display:flex;align-items:flex-end;gap:7px;
 background:var(--panel);border-top:1px solid var(--border);
 padding-bottom:max(10px,env(safe-area-inset-bottom))
}
.tool{
 flex-shrink:0;width:42px;height:44px;border:1px solid var(--border);
 background:var(--panel2);color:var(--blue);
 border-radius:13px;font-size:20px;display:grid;place-items:center
}
.tool:active{transform:scale(.94)}
#micBtn.recording{
 color:white;background:#bd253b;border-color:#ff6577;
 animation:pulse 1s infinite
}
@keyframes pulse{50%{box-shadow:0 0 0 5px #bd253b30}}
#textInput{
 min-width:0;flex:1;max-height:110px;min-height:44px;
 resize:none;background:#07101e;color:white;
 border:1px solid var(--border);border-radius:14px;
 padding:12px;font-size:14px;outline:none;font-family:inherit
}
#textInput:focus{border-color:var(--blue)}
#sendBtn{
 width:44px;height:44px;flex-shrink:0;border:0;border-radius:14px;
 background:linear-gradient(135deg,var(--blue),#1689d2);
 color:#00121b;font-size:19px;font-weight:bold
}
#sendBtn:disabled{opacity:.4}
.hint{text-align:center;color:var(--muted);font-size:10px;padding:0 0 7px;background:var(--panel)}
#contactPanel{
 display:none;padding:14px;background:var(--panel);
 border-bottom:1px solid var(--border)
}
#contactPanel input{
 width:100%;background:#07101e;color:white;padding:12px;
 border:1px solid var(--border);border-radius:10px;margin-bottom:8px
}
#contactPanel button{
 background:var(--blue);color:#00121b;border:0;
 border-radius:9px;padding:10px;font-weight:bold
}
#fileInput{display:none}
</style>
</head>

<body>
<header>
 <div class="logo">JB</div>
 <div class="headinfo">
  <strong>JASON BUSINESS</strong>
  <small id="status">● Messenger vocal</small>
 </div>
 <button class="headbtn" id="contactBtn" aria-label="Configurer le contact">⋮</button>
</header>

<div id="contactPanel">
 <input id="myPhone" placeholder="Ton numéro de téléphone">
 <input id="friendPhone" placeholder="Numéro du destinataire">
 <button id="connectBtn">Ouvrir la conversation</button>
 <p style="font-size:11px;color:var(--muted)">Configure les deux numéros pour démarrer une conversation.</p>
</div>

<div id="messages">
 <div class="welcome">Bienvenue sur JASON BUSINESS Messenger 💙</div>
 <div class="welcome">Configure les numéros avec ⋮ pour commencer.</div>
</div>

<div id="recordStatus">🔴 Enregistrement en cours… appuie sur 🎙️ pour terminer</div>
<div id="preview"><img id="previewImg" alt="Photo à envoyer"><button id="cancelPhoto" class="tool">✕</button></div>

<div class="composer">
 <button class="tool" id="photoBtn" aria-label="Envoyer une photo">📷</button>
 <input type="file" id="fileInput" accept="image/*">
 <button class="tool" id="micBtn" aria-label="Enregistrer un message vocal">🎙️</button>
 <textarea id="textInput" rows="1" placeholder="Écrire un message…"></textarea>
 <button id="sendBtn" aria-label="Envoyer">➤</button>
</div>
<div class="hint">JASON BUSINESS • Web · Design · Digital · IA</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const messages = $("messages");
const textInput = $("textInput");
const sendBtn = $("sendBtn");
const micBtn = $("micBtn");
const recordStatus = $("recordStatus");
const fileInput = $("fileInput");
const preview = $("preview");
const previewImg = $("previewImg");

let recorder = null;
let recordingStream = null;
let audioChunks = [];
let selectedPhoto = null;
let recording = false;
let myNumber = "";
let friendNumber = "";
let firebaseReady = false;
let db = null;
let storage = null;
let unsubscribe = null;
let localMessages = [];
let lastRemoteKey = "";

function cleanPhone(value){
 return value.trim().replace(/[^\d+]/g,"");
}

function timeNow(){
 return new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

function showMessage(type, content, time=timeNow(), sender=""){
 const wrap=document.createElement("div");
 wrap.className="message "+(type==="mine"?"mine":"theirs");
 const bubble=document.createElement("div");
 bubble.className="bubble";

 if(content.kind==="text"){
  bubble.textContent=content.text;
 }else if(content.kind==="image"){
  const img=document.createElement("img");
  img.src=content.url;img.alt="Photo reçue";
  img.addEventListener("click",()=>window.open(content.url,"_blank"));
  bubble.appendChild(img);
 }else if(content.kind==="audio"){
  const audio=document.createElement("audio");
  audio.controls=true;audio.preload="metadata";audio.src=content.url;
  bubble.appendChild(audio);
 }else{
  bubble.textContent="Message";
 }
 const meta=document.createElement("div");
 meta.className="meta";
 meta.textContent=(sender?sender+" · ":"")+time;
 wrap.append(bubble,meta);
 messages.appendChild(wrap);
 messages.scrollTop=messages.scrollHeight;
}

function addLocalMessage(type, content){
 showMessage(type,content);
}

async function requestMicrophone(){
 if(!window.isSecureContext){
  alert("Le microphone exige une page HTTPS. Héberge ton application sur Vercel puis ouvre son adresse HTTPS.");
  return null;
 }
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  alert("Ce navigateur ne permet pas l'accès au microphone. Ouvre la page dans Chrome avec une adresse HTTPS.");
  return null;
 }
 try{
  return await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   }
  });
 }catch(error){
  console.error("Microphone:",error);
  if(error.name==="NotAllowedError" || error.name==="PermissionDeniedError"){
   alert("Accès au microphone refusé. Autorise le microphone pour ce site dans ton navigateur Android, puis réessaie.");
  }else if(error.name==="NotFoundError"){
   alert("Aucun microphone disponible sur cet appareil.");
  }else{
   alert("Impossible d'ouvrir le microphone : "+error.message);
  }
  return null;
 }
}

function chooseRecorderType(){
 if(!window.MediaRecorder) return "";
 const types=[
  "audio/webm;codecs=opus",
  "audio/webm",
  "audio/mp4"
 ];
 return types.find(type=>MediaRecorder.isTypeSupported(type)) || "";
}

async function toggleRecording(){
 if(recording){
  try{recorder?.stop();}catch(e){console.error(e);}
  return;
 }
 const stream=await requestMicrophone();
 if(!stream) return;

 if(!window.MediaRecorder){
  stream.getTracks().forEach(track=>track.stop());
  alert("L'enregistrement vocal n'est pas pris en charge par ce navigateur. Essaie avec Chrome à jour.");
  return;
 }

 recordingStream=stream;
 audioChunks=[];
 try{
  const mimeType=chooseRecorderType();
  recorder=mimeType
   ? new MediaRecorder(stream,{mimeType})
   : new MediaRecorder(stream);

  recorder.ondataavailable=event=>{
   if(event.data && event.data.size>0) audioChunks.push(event.data);
  };

  recorder.onerror=event=>{
   console.error("Erreur d'enregistrement",event);
   alert("Une erreur est survenue pendant l'enregistrement vocal.");
   stopRecordingUI();
  };

  recorder.onstop=async()=>{
   const blob=new Blob(audioChunks,{
    type:recorder.mimeType || "audio/webm"
   });
   stopRecordingUI();
   if(blob.size===0){
    alert("Aucun son enregistré. Réessaie.");
    return;
   }
   await sendAudio(blob);
  };

  recorder.start(250);
  recording=true;
  micBtn.classList.add("recording");
  micBtn.textContent="■";
  recordStatus.style.display="block";
 }catch(error){
  console.error(error);
  stream.getTracks().forEach(track=>track.stop());
  recordingStream=null;
  alert("Impossible de démarrer l'enregistrement vocal.");
 }
}

function stopRecordingUI(){
 recording=false;
 micBtn.classList.remove("recording");
 micBtn.textContent="🎙️";
 recordStatus.style.display="none";
 if(recordingStream){
  recordingStream.getTracks().forEach(track=>track.stop());
  recordingStream=null;
 }
}

async function sendAudio(blob){
 const extension=blob.type.includes("mp4")?"m4a":"webm";
 if(firebaseReady && storage && myNumber && friendNumber){
  try{
   const path=`jasonBusiness/chatMedia/${Date.now()}_${myNumber}.${extension}`;
   const ref=storage.ref().child(path);
   await ref.put(blob,{contentType:blob.type});
   const url=await ref.getDownloadURL();
   await saveRemoteMessage({kind:"audio",url});
   return;
  }catch(error){
   console.error(error);
   alert("L'envoi du vocal a échoué. Vérifie Firebase Storage et ses règles.");
   return;
  }
 }
 const url=URL.createObjectURL(blob);
 addLocalMessage("mine",{kind:"audio",url});
 alert("Vocal enregistré localement. Pour l'envoyer à un autre téléphone, connecte Firebase et configure la conversation.");
}

async function sendText(){
 const text=textInput.value.trim();
 if(!text) return;
 textInput.value="";
 textInput.style.height="44px";
 if(firebaseReady && myNumber && friendNumber){
  try{
   await saveRemoteMessage({kind:"text",text});
   return;
  }catch(error){
   console.error(error);
   alert("Impossible d'envoyer le message. Vérifie les règles Firebase.");
   return;
  }
 }
 addLocalMessage("mine",{kind:"text",text});
}

async function sendPhoto(file){
 if(!file) return;
 if(!file.type.startsWith("image/")){
  alert("Choisis un fichier image.");
  return;
 }
 if(file.size>10*1024*1024){
  alert("La photo doit faire moins de 10 Mo.");
  return;
 }

 if(firebaseReady && storage && myNumber && friendNumber){
  try{
   const path=`jasonBusiness/chatMedia/${Date.now()}_${myNumber}_${file.name.replace(/[^\w.-]/g,"_")}`;
   const ref=storage.ref().child(path);
   await ref.put(file,{contentType:file.type});
   const url=await ref.getDownloadURL();
   await saveRemoteMessage({kind:"image",url});
   clearPhoto();
   return;
  }catch(error){
   console.error(error);
   alert("L'envoi de la photo a échoué. Vérifie Firebase Storage et ses règles.");
   return;
  }
 }
 const url=URL.createObjectURL(file);
 addLocalMessage("mine",{kind:"image",url});
 clearPhoto();
 alert("Photo affichée localement. Pour l'envoyer à un autre téléphone, configure Firebase.");
}

function clearPhoto(){
 selectedPhoto=null;
 fileInput.value="";
 preview.style.display="none";
 previewImg.src="";
}

$("photoBtn").addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",()=>{
 const file=fileInput.files && fileInput.files[0];
 if(!file) return;
 selectedPhoto=file;
 previewImg.src=URL.createObjectURL(file);
 preview.style.display="flex";
 preview.style.alignItems="center";
 preview.style.gap="12px";
});

$("cancelPhoto").addEventListener("click",clearPhoto);

sendBtn.addEventListener("click",async()=>{
 if(selectedPhoto){
  const photo=selectedPhoto;
  await sendPhoto(photo);
 }else{
  await sendText();
 }
});

textInput.addEventListener("keydown",event=>{
 if(event.key==="Enter" && !event.shiftKey){
  event.preventDefault();
  sendBtn.click();
 }
});

textInput.addEventListener("input",()=>{
 textInput.style.height="44px";
 textInput.style.height=Math.min(textInput.scrollHeight,110)+"px";
});

micBtn.addEventListener("click",toggleRecording);

$("contactBtn").addEventListener("click",()=>{
 const panel=$("contactPanel");
 panel.style.display=panel.style.display==="block"?"none":"block";
});

$("connectBtn").addEventListener("click",async()=>{
 myNumber=cleanPhone($("myPhone").value);
 friendNumber=cleanPhone($("friendPhone").value);
 if(!myNumber || !friendNumber){
  alert("Entre ton numéro et celui du destinataire.");
  return;
 }
 if(myNumber===friendNumber){
  alert("Entre un numéro différent pour le destinataire.");
  return;
 }
 if(!firebaseReady){
  alert("La conversation locale est prête, mais Firebase n'est pas configuré dans cette version. Ajoute ta configuration Firebase pour synchroniser les messages entre téléphones.");
  return;
 }
 await connectConversation();
});

function conversationId(a,b){
 return [a,b].sort().join("_").replace(/[.#$[\]/]/g,"_");
}

/*
 Pour les messages entre deux téléphones, ajoute ta configuration Firebase
 dans le bloc prévu ci-dessous. N'utilise pas de mots de passe privés ici.
*/
async function connectConversation(){
 if(!db) return;
 const id=conversationId(myNumber,friendNumber);
 const ref=db.ref("jasonBusiness/chats/"+id+"/messages");
 if(unsubscribe) ref.off("child_added",unsubscribe);
 const seen=new Set();
 unsubscribe=snapshot=>{
  const data=snapshot.val();
  if(!data || seen.has(snapshot.key)) return;
  seen.add(snapshot.key);
  if(data.sender===myNumber) return;
  showMessage("theirs",data, data.time || timeNow(),data.sender || friendNumber);
 };
 ref.on("child_added",unsubscribe,error=>{
  console.error(error);
  alert("Erreur de lecture Firebase. Vérifie les règles de la base de données.");
 });
 $("contactPanel").style.display="none";
 $("status").textContent="● Connecté";
 $("status").classList.remove("offline");
 messages.innerHTML='<div class="welcome">Conversation ouverte 💙</div>';
}

async function saveRemoteMessage(content){
 if(!db || !myNumber || !friendNumber) throw new Error("Conversation non configurée");
 const id=conversationId(myNumber,friendNumber);
 await db.ref("jasonBusiness/chats/"+id+"/messages").push({
  ...content,
  sender:myNumber,
  time:timeNow(),
  timestamp:Date.now()
 });
}

/*
 FIREBASE :
 Ajoute le SDK Firebase App, Database et Storage et initialise firebase
 avec la configuration de TON projet avant ce script.
*/
try{
 if(window.firebase && firebase.apps && firebase.apps.length){
  db=firebase.database();
  storage=firebase.storage();
  firebaseReady=!!(db && storage);
 }
}catch(error){
 console.warn("Firebase non initialisé :",error);
}

if(!firebaseReady){
 $("status").textContent="● Mode local — Firebase à connecter";
 $("status").classList.add("offline");
}
</script>
</body>
</html>
