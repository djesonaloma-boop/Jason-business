<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JASON BUSINESS — Chat</title>
<style>
:root{--blue:#00d2ff;--dark:#050a14;--green:#00e676;--red:#ff4757;--border:rgba(0,210,255,.18)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:white;background:#050a14;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#050a14;border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--blue)}.btn{padding:7px 10px;border-radius:9px;border:1px solid rgba(0,210,255,.25);background:rgba(0,210,255,.08);color:var(--blue);font-size:11px;cursor:pointer}
.wrap{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 56px)}
.left{background:#0b1425;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.tab{padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;opacity:.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;color:var(--blue);border-bottom-color:var(--blue)}
.search{padding:10px;border-bottom:1px solid var(--border)}
.search input,.add-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #293850;background:#0c192b;color:white;outline:none}
.list{flex:1;overflow-y:auto;padding:6px}
.item{padding:10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.item:hover{background:rgba(0,210,255,.06)}.item.active{background:rgba(0,210,255,.14);border-color:var(--blue)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900}
.info{flex:1;min-width:0}.name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.prev{font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;background:#070e1e}
.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(5,10,20,.85)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:9px 11px;border-radius:16px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;border-bottom-right-radius:6px}
.msg.other{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.input{padding:10px;display:flex;gap:6px;background:#0a1425;border-top:1px solid var(--border)}
.input textarea{flex:1;min-height:42px;max-height:110px;padding:10px 12px;border-radius:18px;border:1px solid #293850;background:#0c192b;color:white;outline:none;resize:none}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid #293850;background:#0c192b;color:white;display:grid;place-items:center;cursor:pointer}
.send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;font-size:18px;cursor:pointer}
.debug{padding:8px 10px;background:#ffeb3b22;border:1px solid #ffeb3b44;color:#ffeb3b;font-size:10px;border-radius:8px;margin:6px}
.add-box{padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border)}
.empty{flex:1;display:grid;place-items:center;text-align:center;opacity:.6;padding:20px;font-size:12px}
.call-overlay{display:none;position:fixed;inset:0;z-index:5000;background:#050a14;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.call-overlay.show{display:flex}
.call-overlay video{width:100%;max-width:400px;height:240px;background:#000;border-radius:16px;margin:6px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.left{position:absolute;inset:0;z-index:20;display:none}.left.show{display:flex}}
</style>
</head>
<body>
<header>
  <div class="brand">💬 JASON CHAT — <span id="myPhoneShow">...</span></div>
  <div><a href="dashboard.html" class="btn">← Dashboard</a></div>
</header>
<div class="wrap">
  <aside class="left show" id="leftPanel">
    <div class="tabs"><div class="tab active" data-tab="chats">💬 Chats</div><div class="tab" data-tab="users">👥 Utilisateurs</div><div class="tab" data-tab="requests">🔔 Demandes <span id="reqCount" style="background:#ff4757;color:white;padding:1px 5px;border-radius:10px;font-size:9px;display:none">0</span></div></div>
    
    <!-- AJOUT MANUEL SI LISTE VIDE -->
    <div class="add-box">
      <input id="manualPhone" placeholder="+243... Ajouter numéro">
      <button class="btn" id="btnAddManual">+</button>
    </div>

    <div class="search"><input id="search" placeholder="🔍 Rechercher..."></div>
    <div id="debugArea"></div>
    <div class="list" id="list"><div style="padding:20px;text-align:center;opacity:.5">Chargement...</div></div>
  </aside>
  <section class="right">
    <div class="top"><div><h3 id="chatName" style="margin:0;font-size:14px">Sélectionne un chat</h3><small id="chatPhone">Messenger Jason Business</small></div><div style="display:flex;gap:6px"><button class="btn" id="voiceCallBtn">📞</button><button class="btn" id="videoCallBtn">🎥</button></div></div>
    <div class="msgs" id="msgs"><div class="empty">👥 Va dans Utilisateurs pour voir les comptes Jason Business<br><br>Si vide, ajoute le numéro manuellement en haut.</div></div>
    <div class="input"><label class="tbtn">🖼️<input type="file" id="photoInput" accept="image/*" hidden></label><button class="tbtn" id="recordBtn">🎤</button><textarea id="msgInput" placeholder="Message..." disabled></textarea><button class="send" id="sendBtn" disabled>➤</button></div>
  </section>
</div>

<div class="call-overlay" id="callOverlay"><h2 id="callStatus">📞 Appel...</h2><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video><div style="display:flex;gap:12px;margin-top:14px"><button class="btn" id="muteBtn">🎤 Mute</button><button class="btn" style="background:#ff4757;color:white" id="hangBtn">📵 Raccrocher</button><button class="btn" id="camBtn">🎥 Cam</button></div></div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, get, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);
const myPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone");
if(!myPhone){location.replace("login.html");throw new Error("no phone")}
$("myPhoneShow").textContent=myPhone;

let tab="chats", activeChat=null, allUsers={}, myRequests={}, myChats={}, manualUsers=JSON.parse(localStorage.getItem("jb_manual_users")||"[]");
let pc=null, localStream=null, currentCallId=null;

function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function timeStr(ts){return new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function getChatId(a,b){return [a,b].sort().join("_")}
function showDebug(msg){$("debugArea").innerHTML=`<div class="debug">DEBUG: ${esc(msg)}</div>`}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");tab=t.dataset.tab;render()});
$("search").oninput=()=>render();

// 1. ESSAIE 3 CHEMINS POUR TROUVER LES USERS
async function loadUsers(){
  showDebug("Chargement users...");
  try{
    // Chemin 1: jasonBusiness/users
    const snap1=await get(ref(db,"jasonBusiness/users"));
    if(snap1.exists()){
      allUsers=snap1.val()||{};
      showDebug(`✅ ${Object.keys(allUsers).length} users trouvés dans jasonBusiness/users`);
      render(); return;
    }
  }catch(e){ console.log("path1 error",e.message); }

  try{
    // Chemin 2: users
    const snap2=await get(ref(db,"users"));
    if(snap2.exists()){
      allUsers=snap2.val()||{};
      showDebug(`✅ ${Object.keys(allUsers).length} users trouvés dans users`);
      render(); return;
    }
  }catch(e){}

  try{
    // Chemin 3: jasonBusiness/allUsers list
    const snap3=await get(ref(db,"jasonBusiness/allUsers"));
    if(snap3.exists()){
      const arr=snap3.val();
      if(Array.isArray(arr)){
        arr.forEach(p=>allUsers[p]={telephone:p});
      }else{
        allUsers=arr;
      }
      showDebug(`✅ ${Object.keys(allUsers).length} users trouvés dans allUsers`);
      render(); return;
    }
  }catch(e){}

  // Si tout échoue -> mode manuel
  showDebug(`⚠️ Aucun user lisible (règles Firebase bloquent). Ajoute manuellement les numéros en haut. Ton téléphone: ${myPhone}`);
  allUsers={};
  render();
}
loadUsers();

// Ecoute temps réel aussi pour users (si règles permettent)
onValue(ref(db,"jasonBusiness/users"),snap=>{
  if(snap.exists()){
    allUsers=snap.val()||{};
    showDebug(`✅ Live: ${Object.keys(allUsers).length} users`);
    render();
  }
},err=>{
  showDebug(`❌ Permission refusée: ${err.message} — Utilise ajout manuel`);
});

onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{
  myRequests=snap.val()||{};
  const inc=Object.values(myRequests).filter(r=>r.type==="incoming"&&r.status==="pending").length;
  $("reqCount").textContent=inc;
  $("reqCount").style.display=inc>0?"inline-block":"none";
  render();
});
onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),snap=>{
  myChats=snap.val()||{};
  render();
});

// AJOUT MANUEL
$("btnAddManual").onclick=()=>{
  const p=$("manualPhone").value.trim();
  if(!p||p.length<8){alert("Numéro invalide");return}
  if(!manualUsers.includes(p)) manualUsers.push(p);
  localStorage.setItem("jb_manual_users",JSON.stringify(manualUsers));
  $("manualPhone").value="";
  render();
  alert("✅ "+p+" ajouté — tu peux maintenant lui envoyer une demande");
};

function getCombinedUsers(){
  const combined={...allUsers};
  manualUsers.forEach(p=>{ if(!combined[p]) combined[p]={telephone:p, manuel:true} });
  return combined;
}

function render(){
  const q=($("search").value||"").toLowerCase();
  const container=$("list");
  container.innerHTML="";
  const users= getCombinedUsers();

  if(tab==="users"){
    const entries=Object.entries(users);
    if(entries.length===0){
      container.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6">Aucun utilisateur trouvé.<br><br>1. Vérifie que tu as d'autres comptes créés<br>2. Ou ajoute un numéro manuellement en haut<br><br>Ton numéro: ${esc(myPhone)}</div>`;
      return;
    }
    entries.forEach(([phone,u])=>{
      if(phone===myPhone) return;
      if(q && !phone.toLowerCase().includes(q)) return;
      const chatId=getChatId(myPhone,phone);
      const isFriend=myChats[chatId]?.status==="accepted";
      const hasSent=myRequests[phone]?.status==="pending";
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`<div class="av">${phone.slice(-2)}</div><div class="info"><div class="name">${esc(phone)} ${u.manuel?"(manuel)":""}</div><div class="prev">${isFriend?"✅ Ami":hasSent?"⏳ Demande envoyée":"👤 Utilisateur Jason"}</div></div><div>${isFriend?"💬":hasSent?"⏳":"+"}</div>`;
      div.onclick=()=>{ if(isFriend) openChat(phone); else if(!hasSent) sendRequest(phone); };
      container.appendChild(div);
    });
  }
  else if(tab==="requests"){
    const reqs=Object.entries(myRequests).filter(([_,r])=>r.type==="incoming");
    if(reqs.length===0){container.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6">Aucune demande</div>`;return}
    reqs.forEach(([phone,r])=>{
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`<div class="av">${phone.slice(-2)}</div><div class="info"><div class="name">${esc(phone)}</div><div class="prev">Veut discuter</div></div><div style="display:flex;gap:4px"><button class="btn" style="background:#ffd700;color:#000" data-a="${phone}">Accepter</button><button class="btn" style="background:#ff475722" data-r="${phone}">Refuser</button></div>`;
      container.appendChild(div);
    });
    container.querySelectorAll("[data-a]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();acceptRequest(b.dataset.a)});
    container.querySelectorAll("[data-r]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();refuseRequest(b.dataset.r)});
  }
  else{
    const chatsList=Object.entries(myChats).filter(([_,c])=>c.status==="accepted").sort((a,b)=>(b[1].lastTime||0)-(a[1].lastTime||0));
    if(chatsList.length===0){container.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6">Aucun chat<br>Va dans Utilisateurs → envoyer demande</div>`;return}
    chatsList.forEach(([chatId,chat])=>{
      const other=chatId.split("_").find(p=>p!==myPhone);
      if(q&&!other.toLowerCase().includes(q))return;
      const div=document.createElement("div");
      div.className="item"+(activeChat===other?" active":"");
      div.innerHTML=`<div class="av">${other.slice(-2)}</div><div class="info"><div class="name">${esc(other)}</div><div class="prev">${esc((chat.lastMsg||"").slice(0,35))}</div></div><div style="font-size:9px">${timeStr(chat.lastTime)}${chat.unread?`<div style="background:#ff4757;padding:2px 6px;border-radius:10px;margin-top:3px">${chat.unread}</div>`:""}</div>`;
      div.onclick=()=>openChat(other);
      container.appendChild(div);
    });
  }
}

async function sendRequest(toPhone){
  if(!confirm(`Envoyer demande à ${toPhone} ?`)) return;
  await set(ref(db,`jasonBusiness/chat_requests/${myPhone}/${toPhone}`),{phone:toPhone,type:"outgoing",status:"pending",createdAt:Date.now()});
  await set(ref(db,`jasonBusiness/chat_requests/${toPhone}/${myPhone}`),{phone:myPhone,type:"incoming",status:"pending",createdAt:Date.now()});
  alert("✅ Demande envoyée à "+toPhone);
}
async function acceptRequest(fromPhone){
  const chatId=getChatId(myPhone,fromPhone);
  await set(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{with:fromPhone,status:"accepted",lastMsg:"Accepté",lastTime:Date.now(),unread:0});
  await set(ref(db,`jasonBusiness/user_chats/${fromPhone}/${chatId}`),{with:myPhone,status:"accepted",lastMsg:"Accepté",lastTime:Date.now(),unread:0});
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromPhone}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${fromPhone}/${myPhone}`));
  openChat(fromPhone);
}
async function refuseRequest(fromPhone){
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromPhone}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${fromPhone}/${myPhone}`));
}

function openChat(otherPhone){
  activeChat=otherPhone;
  $("chatName").textContent=otherPhone;
  $("chatPhone").textContent="En ligne";
  $("msgInput").disabled=false;
  $("sendBtn").disabled=false;
  const chatId=getChatId(myPhone,otherPhone);
  onValue(ref(db,`jasonBusiness/messages/${chatId}`),snap=>{
    const data=snap.val()||{};
    const msgs=Object.values(data).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderMessages(msgs);
    update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{unread:0});
  });
}
function renderMessages(msgs){
  const c=$("msgs");
  if(msgs.length===0){c.innerHTML=`<div style="flex:1;display:grid;place-items:center;opacity:.6">Nouvelle discussion avec ${esc(activeChat)}<br>Photos, vocaux, appels</div>`;return}
  c.innerHTML="";
  msgs.forEach(m=>{
    const isMe=m.from===myPhone;
    const div=document.createElement("div");
    div.className="msg "+(isMe?"me":"other");
    let html=esc(m.text||"");
    if(m.photo) html+=`<br><img src="${m.photo}" style="max-width:200px;border-radius:10px;margin-top:6px" onclick="window.open(this.src)">`;
    if(m.audio) html+=`<br><audio controls src="${m.audio}" style="width:200px;margin-top:6px"></audio>`;
    html+=`<div style="font-size:8px;opacity:.6;margin-top:4px;text-align:right">${timeStr(m.createdAt)}</div>`;
    div.innerHTML=html;
    c.appendChild(div);
  });
  c.scrollTop=c.scrollHeight;
}
async function sendText(){
  const text=$("msgInput").value.trim();
  if(!text||!activeChat) return;
  $("msgInput").value="";
  const chatId=getChatId(myPhone,activeChat);
  const newRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
  await set(newRef,{from:myPhone,to:activeChat,text,createdAt:Date.now()});
  const unreadSnap=await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}/unread`));
  const unread=(unreadSnap.val()||0)+1;
  await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:text,lastTime:Date.now()});
  await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:text,lastTime:Date.now(),unread});
}
$("sendBtn").onclick=sendText;
$("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}});

// Photo
$("photoInput").onchange=e=>{
  const file=e.target.files[0];
  if(!file||!activeChat) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    const chatId=getChatId(myPhone,activeChat);
    const newRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
    await set(newRef,{from:myPhone,to:activeChat,text:"📷 Photo",photo:reader.result,createdAt:Date.now()});
    await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:"📷 Photo",lastTime:Date.now()});
    await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:"📷 Photo",lastTime:Date.now(),unread:1});
  };
  reader.readAsDataURL(file);
  e.target.value="";
};

// Vocal
let mediaRecorder=null, audioChunks=[], isRecording=false;
$("recordBtn").onclick=async()=>{
  if(!activeChat){alert("Choisis un chat");return}
  if(!isRecording){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{
      const blob=new Blob(audioChunks,{type:"audio/webm"});
      const r=new FileReader();
      r.onload=async()=>{
        const chatId=getChatId(myPhone,activeChat);
        const newRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
        await set(newRef,{from:myPhone,to:activeChat,text:"🎤 Vocal",audio:r.result,createdAt:Date.now()});
        await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:"🎤 Vocal",lastTime:Date.now()});
        await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:"🎤 Vocal",lastTime:Date.now(),unread:1});
      };
      r.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    isRecording=true;
    $("recordBtn").textContent="⏹️";
  }else{
    mediaRecorder.stop();
    isRecording=false;
    $("recordBtn").textContent="🎤";
  }
};

// Appels simples (WebRTC)
$("voiceCallBtn").onclick=()=>startCall(false);
$("videoCallBtn").onclick=()=>startCall(true);
async function startCall(isVideo){
  if(!activeChat){alert("Choisis un chat");return}
  const callId=getChatId(myPhone,activeChat)+"_"+Date.now();
  currentCallId=callId;
  $("callOverlay").classList.add("show");
  $("callStatus").textContent=(isVideo?"🎥 Vidéo":"📞 Vocal")+" vers "+activeChat;
  localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true});
  $("localVideo").srcObject=localStream;
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) push(ref(db,`jasonBusiness/calls/${callId}/candidates/${myPhone}`),e.candidate.toJSON()); };
  pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0]};
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db,`jasonBusiness/calls/${callId}`),{from:myPhone,to:activeChat,isVideo,offer:{type:offer.type,sdp:offer.sdp},createdAt:Date.now(),status:"ringing"});
  onValue(ref(db,`jasonBusiness/calls/${callId}/answer`),async snap=>{
    const ans=snap.val();
    if(ans&&pc&&!pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(ans));
  });
}
$("hangBtn").onclick=()=>{
  $("callOverlay").classList.remove("show");
  if(pc){pc.close();pc=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  if(currentCallId){update(ref(db,`jasonBusiness/calls/${currentCallId}`),{status:"ended"});currentCallId=null}
};
// Recevoir appels
onValue(ref(db,"jasonBusiness/calls"),async snap=>{
  const calls=snap.val()||{};
  for(const [callId,call] of Object.entries(calls)){
    if(call.to===myPhone&&call.status==="ringing"&&!currentCallId){
      if(confirm(`📞 Appel ${call.isVideo?"vidéo":"vocal"} de ${call.from} — Accepter ?`)){
        currentCallId=callId;
        $("callOverlay").classList.add("show");
        $("callStatus").textContent="Appel de "+call.from;
        localStream=await navigator.mediaDevices.getUserMedia({video:call.isVideo,audio:true});
        $("localVideo").srcObject=localStream;
        pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
        localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
        pc.onicecandidate=e=>{ if(e.candidate) push(ref(db,`jasonBusiness/calls/${callId}/candidates/${myPhone}`),e.candidate.toJSON()); };
        pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0]};
        await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
        const answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await set(ref(db,`jasonBusiness/calls/${callId}/answer`),{type:answer.type,sdp:answer.sdp});
        await update(ref(db,`jasonBusiness/calls/${callId}`),{status:"accepted"});
      }else{
        await update(ref(db,`jasonBusiness/calls/${callId}`),{status:"ended"});
      }
    }
  }
});
</script>
</body>
</html>
