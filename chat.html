
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>JASON BUSINESS Messenger</title>

<style>
:root{
 --bg:#050914;--panel:#0b1425;--panel2:#101e33;
 --blue:#00d4ff;--blue2:#0077ff;--gold:#d8aa45;
 --text:#f4f7fb;--muted:#93a4ba;--border:rgba(255,255,255,.09);
 --mine:#075fce;--other:#15253b;--green:#20c879;--red:#ff5263;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:var(--bg)}
header{height:66px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 15px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0077ff,#00d4ff);font-weight:900;color:#031020}
.brand{flex:1;min-width:0}
.brand h1{font-size:16px;margin:0 0 4px;letter-spacing:.4px}
.brand p{font-size:11px;margin:0;color:var(--muted)}
.status{font-size:11px;color:var(--green)}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:310px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
.searchbox{padding:12px}
.searchbox input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:13px;padding:12px;outline:none}
.tabs{display:flex;gap:5px;padding:0 10px 10px}
.tab{flex:1;border:0;border-radius:10px;padding:10px 4px;background:transparent;color:var(--muted);font-size:12px}
.tab.active{background:rgba(0,212,255,.13);color:var(--blue)}
.list{flex:1;overflow-y:auto}
.person{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.035)}
.person:active,.person.selected{background:rgba(0,212,255,.08)}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#0077ff,#00d4ff);color:#001323;font-weight:bold}
.personinfo{min-width:0;flex:1}
.personinfo strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.personinfo small{display:block;color:var(--muted);font-size:11px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatarea{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at top right,rgba(0,119,255,.08),transparent 55%),var(--bg)}
.chathead{height:62px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.chathead .avatar{width:38px;height:38px}
.chatname{flex:1;min-width:0}
.chatname strong{font-size:14px}
.chatname small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.iconbtn{width:38px;height:38px;border:1px solid var(--border);background:var(--panel2);color:var(--blue);border-radius:12px;font-size:18px}
.messages{flex:1;overflow-y:auto;padding:16px 13px 22px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:25px}
.empty .big{font-size:43px;margin-bottom:8px}
.msgrow{width:100%;display:flex;flex-direction:column;align-items:flex-start}
.msgrow.mine{align-items:flex-end}
.bubble{max-width:min(82%,440px);min-width:35px;padding:10px 12px;border-radius:17px;background:var(--other);border:1px solid var(--border);font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.mine .bubble{background:linear-gradient(135deg,#075fce,#0875dd);border-color:rgba(0,212,255,.16);border-bottom-right-radius:5px}
.msgrow:not(.mine) .bubble{border-bottom-left-radius:5px}
.bubble img{display:block;max-width:100%;max-height:290px;object-fit:contain;border-radius:10px;margin-top:3px;cursor:pointer}
.bubble audio{max-width:100%;width:245px;height:42px}
.msgmeta{font-size:10px;color:var(--muted);padding:4px 5px 0}
.daylabel{text-align:center;color:var(--muted);font-size:10px;margin:5px 0}
.composer{flex-shrink:0;border-top:1px solid var(--border);padding:10px;background:var(--panel);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.preview{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px}
.previewitem{position:relative;flex-shrink:0}
.previewitem img{height:65px;width:65px;object-fit:cover;border-radius:10px}
.previewitem button{position:absolute;top:-5px;right:-5px;border:0;border-radius:50%;background:var(--red);color:white;width:22px;height:22px}
.inputrow{display:flex;align-items:flex-end;gap:7px}
.attach{width:39px;height:42px;flex-shrink:0;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--blue);font-size:19px}
#messageInput{flex:1;min-width:0;max-height:110px;resize:none;border:1px solid var(--border);border-radius:15px;background:var(--panel2);color:var(--text);padding:12px;outline:none;font-size:14px}
#sendBtn{height:42px;width:44px;border:0;border-radius:13px;background:linear-gradient(135deg,#0077ff,#00d4ff);color:#001323;font-weight:bold;font-size:19px}
#sendBtn:disabled{opacity:.45}
.recbar{display:none;margin-bottom:9px;padding:10px;border-radius:12px;background:rgba(255,82,99,.1);color:#ff7c89;align-items:center;gap:10px;font-size:12px}
.recbar.show{display:flex}
.recbar span{flex:1}
.recbar button{border:0;border-radius:9px;padding:9px 12px;background:var(--red);color:white}
.recbar .cancel{background:#27364b}
.notice{display:none;margin:8px 0 0;font-size:12px;color:#ff9eaa;overflow-wrap:anywhere}
.notice.show{display:block}
.mobileback{display:none}
footer{padding:9px;text-align:center;color:#52647c;font-size:10px;border-top:1px solid var(--border)}
@media(max-width:700px){
 .sidebar{width:100%;border-right:0}
 .chatarea{display:none;width:100%}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chatarea{display:flex}
 .mobileback{display:block}
 header{height:59px}
 .messages{padding:12px 10px}
 .bubble{max-width:88%}
}
</style>
</head>

<body>
<div class="app" id="app">
<header>
 <div class="logo">JB</div>
 <div class="brand">
  <h1>JASON BUSINESS <span style="color:var(--blue)">MESSENGER</span></h1>
  <p>Messagerie numérique • Jason Aloma 🇨🇩</p>
 </div>
 <div class="status" id="connectionStatus">Connexion…</div>
</header>

<div class="layout">
 <aside class="sidebar">
  <div class="searchbox">
   <input id="searchInput" placeholder="Rechercher une conversation…" autocomplete="off">
  </div>
  <div class="tabs">
   <button class="tab active" data-tab="chats">Messages</button>
   <button class="tab" data-tab="users">Utilisateurs</button>
   <button class="tab" data-tab="requests">Demandes</button>
  </div>
  <div class="list" id="peopleList">
   <div class="empty"><div class="big">💬</div>Chargement des conversations…</div>
  </div>
  <footer>JASON BUSINESS • Jason Aloma 🇨🇩</footer>
 </aside>

 <main class="chatarea">
  <div class="chathead">
   <button class="iconbtn mobileback" id="backBtn" aria-label="Retour">‹</button>
   <div class="avatar" id="chatAvatar">JB</div>
   <div class="chatname">
    <strong id="chatTitle">Choisis une conversation</strong>
    <small id="chatSubtitle">Tes messages apparaîtront ici</small>
   </div>
  </div>

  <div class="messages" id="messages">
   <div class="empty"><div class="big">💬</div>Sélectionne un contact pour commencer à discuter.</div>
  </div>

  <div class="composer">
   <div class="preview" id="photoPreview"></div>
   <div class="recbar" id="recBar">
    <span id="recLabel">🔴 Enregistrement en cours…</span>
    <button class="cancel" id="cancelRecBtn">Annuler</button>
    <button id="stopRecBtn">Terminer</button>
   </div>
   <div class="inputrow">
    <button class="attach" id="photoBtn" title="Envoyer une photo">＋</button>
    <input id="photoInput" type="file" accept="image/*" multiple hidden>
    <button class="attach" id="micBtn" title="Enregistrer un vocal">🎙</button>
    <textarea id="messageInput" rows="1" placeholder="Écris un message…" disabled></textarea>
    <button id="sendBtn" title="Envoyer" disabled>➤</button>
   </div>
   <div class="notice" id="notice"></div>
  </div>
 </main>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
 getDatabase, ref, get, set, push, update, onValue, off, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};

const $=id=>document.getElementById(id);
const appEl=$("app");
const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);

let myPhone="",myRawPhone="",myName="Moi";
let currentTab="chats",activeChat=null,activeChatId=null;
let users={},chatRecords={},requestRecords={};
let messageUnsubs=[],messageSets={};
let pendingPhotos=[],recorder=null,recordChunks=[],recordStream=null;
let recordingCancelled=false,recordingStartedAt=0,recordTimer=null;
let sending=false;

function normalizePhone(value){
 let p=String(value||"").trim().replace(/[^\d+]/g,"");
 if(p.startsWith("+"))p=p.slice(1);
 if(p.startsWith("243"))p="0"+p.slice(3);
 if(p.length===9&&!p.startsWith("0"))p="0"+p;
 return p;
}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function getChatId(a,b){
 return [normalizePhone(a),normalizePhone(b)].sort().join("_");
}
function setNotice(message,error=true){
 const n=$("notice");
 n.textContent=message;
 n.style.color=error?"#ff9eaa":"#20c879";
 n.classList.add("show");
}
function clearNotice(){
 $("notice").textContent="";
 $("notice").classList.remove("show");
}
function timeText(value){
 let date;
 if(typeof value==="number")date=new Date(value);
 else if(value&&typeof value==="object"&&value.seconds)date=new Date(value.seconds*1000);
 else date=new Date(value||0);
 if(!Number.isFinite(date.getTime())||date.getTime()<1000)return "";
 return date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
function safeDate(value){
 const n=Number(value||0);
 return Number.isFinite(n)?n:0;
}
function initials(name){
 return String(name||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
}
function getDisplayName(phone){
 const n=normalizePhone(phone);
 const u=users[n]||users[phone]||{};
 return u.nom||u.name||u.username||u.displayName||u.fullName||n||"Utilisateur";
}
function getAllChatIds(other){
 const a=normalizePhone(myPhone),b=normalizePhone(other);
 const ids=new Set([getChatId(a,b)]);
 const rawVariants=[myRawPhone,myPhone,a,other,b].filter(Boolean);
 for(const x of rawVariants){
  for(const y of rawVariants){
   if(normalizePhone(x)===a&&normalizePhone(y)===b){
    ids.add([String(x),String(y)].sort().join("_"));
   }
  }
 }
 return [...ids];
}

async function init(){
 try{
  myRawPhone=localStorage.getItem("jasonBusinessUserPhone")||
   localStorage.getItem("userPhone")||
   localStorage.getItem("phone")||
   localStorage.getItem("telephone")||"";
  myPhone=normalizePhone(myRawPhone);
  if(!myPhone){
   $("connectionStatus").textContent="Compte requis";
   $("peopleList").innerHTML='<div class="empty">Connecte-toi d’abord à JASON BUSINESS, puis reviens ici.</div>';
   return;
  }
  $("connectionStatus").textContent="En ligne";
  try{
   const snap=await get(ref(db,"jasonBusiness/users"));
   if(snap.exists()){
    const all=snap.val()||{};
    for(const [key,val] of Object.entries(all)){
     users[normalizePhone(key)]=val||{};
     users[key]=val||{};
    }
    const mine=users[myPhone]||users[myRawPhone]||{};
    myName=mine.nom||mine.name||mine.username||mine.displayName||"Moi";
   }
  }catch(e){console.warn("Lecture utilisateurs:",e)}
  listenChats();
  listenRequests();
  renderPeople();
 }catch(e){
  $("connectionStatus").textContent="Erreur";
  setNotice("Erreur Firebase : "+e.message);
 }
}

function listenChats(){
 onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),snap=>{
  chatRecords=snap.val()||{};
  renderPeople();
 },err=>setNotice("Impossible de charger les conversations : "+err.message));
 if(myRawPhone!==myPhone){
  onValue(ref(db,`jasonBusiness/user_chats/${myRawPhone}`),snap=>{
   chatRecords={...chatRecords,...(snap.val()||{})};
   renderPeople();
  },()=>{});
 }
}
function listenRequests(){
 onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{
  requestRecords=snap.val()||{};
  renderPeople();
 },()=>{});
}
function peopleForTab(){
 const search=$("searchInput").value.trim().toLowerCase();
 const out=[];
 if(currentTab==="chats"){
  for(const [key,record] of Object.entries(chatRecords)){
   if(!record)continue;
   const other=normalizePhone(record.with||record.phone||key.split("_").find(x=>normalizePhone(x)!==myPhone)||"");
   if(!other||other===myPhone)continue;
   const name=getDisplayName(other);
   if((name+" "+other).toLowerCase().includes(search))out.push({phone:other,name,record});
  }
 }else if(currentTab==="users"){
  const seen=new Set();
  for(const [key,u] of Object.entries(users)){
   const phone=normalizePhone(key);
   if(!phone||phone===myPhone||seen.has(phone))continue;
   seen.add(phone);
   const name=u.nom||u.name||u.username||u.displayName||phone;
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,record:{}});
  }
  out.sort((a,b)=>a.name.localeCompare(b.name));
 }else{
  for(const [key,r] of Object.entries(requestRecords)){
   if(!r)continue;
   const phone=normalizePhone(r.from||r.phone||key);
   if(!phone||phone===myPhone)continue;
   const name=getDisplayName(phone);
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,record:r});
  }
 }
 return out;
}
function renderPeople(){
 const list=$("peopleList");
 const people=peopleForTab();
 if(!people.length){
  list.innerHTML=`<div class="empty"><div class="big">${currentTab==="users"?"👥":"💬"}</div>${currentTab==="users"?"Aucun autre utilisateur trouvé.":"Aucune conversation à afficher."}</div>`;
  return;
 }
 list.innerHTML="";
 for(const p of people){
  const row=document.createElement("div");
  row.className="person"+(activeChat===p.phone?" selected":"");
  const avatar=document.createElement("div");
  avatar.className="avatar";avatar.textContent=initials(p.name);
  const info=document.createElement("div");info.className="personinfo";
  const name=document.createElement("strong");name.textContent=p.name;
  const small=document.createElement("small");
  small.textContent=p.record.lastMsg||p.phone;
  info.append(name,small);row.append(avatar,info);
  row.addEventListener("click",()=>openChat(p.phone,p.name));
  list.appendChild(row);
 }
}

function clearMessageListeners(){
 for(const stop of messageUnsubs){try{stop()}catch{}}
 messageUnsubs=[];
 messageSets={};
}
function openChat(phone,name){
 activeChat=normalizePhone(phone);
 activeChatId=getChatId(myPhone,activeChat);
 $("chatTitle").textContent=name||getDisplayName(activeChat);
 $("chatAvatar").textContent=initials(name||getDisplayName(activeChat));
 $("chatSubtitle").textContent=activeChat;
 $("messageInput").disabled=false;
 $("sendBtn").disabled=false;
 appEl.classList.add("chat-open");
 clearNotice();
 clearMessageListeners();
 $("messages").innerHTML='<div class="empty">Chargement des messages…</div>';
 const ids=getAllChatIds(activeChat);
 for(const chatId of ids){
  const path=`jasonBusiness/messages/${chatId}`;
  const messagesRef=ref(db,path);
  const stop=onValue(messagesRef,snap=>{
   messageSets[chatId]=snap.val()||{};
   renderMessages();
  },err=>setNotice("Lecture des messages impossible : "+err.message));
  messageUnsubs.push(()=>off(messagesRef,"value",stop));
 }
 markChatRead();
 renderPeople();
}
async function markChatRead(){
 if(!activeChat)return;
 try{
  await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${activeChatId}`),{
   unread:0,lastOpened:Date.now()
  });
 }catch(e){console.warn("Mise à jour lecture:",e)}
}

function mergeMessages(){
 const merged=new Map();
 for(const [chatId,items] of Object.entries(messageSets)){
  for(const [key,m] of Object.entries(items||{})){
   if(!m)continue;
   const stable=m.id||key;
   const signature=String(m.sender||m.from||"")+"|"+String(m.createdAt||m.timestamp||m.time||"")+"|"+String(m.text||m.message||m.photo||m.audio||"").slice(0,100);
   const unique=stable+"|"+signature;
   merged.set(unique,{...m,id:m.id||key,_chatId:chatId});
  }
 }
 return [...merged.values()].sort((a,b)=>
  safeDate(a.createdAt||a.timestamp||a.time)-safeDate(b.createdAt||b.timestamp||b.time)
 );
}
function renderMessages(){
 const container=$("messages");
 if(!activeChat){return}
 const msgs=mergeMessages();
 if(!msgs.length){
  container.innerHTML='<div class="empty"><div class="big">👋</div>Pas encore de message.<br>Envoie le premier message !</div>';
  return;
 }
 container.innerHTML="";
 for(const m of msgs){
  const sender=normalizePhone(m.sender||m.from||m.senderPhone||"");
  const mine=m.mine===true||m.sender===myPhone||m.from===myPhone||sender===myPhone;
  const row=document.createElement("div");
  row.className="msgrow"+(mine?" mine":"");
  const bubble=document.createElement("div");bubble.className="bubble";
  const text=m.text??m.message??"";
  if(text){
   const textNode=document.createElement("div");
   textNode.textContent=String(text);
   bubble.appendChild(textNode);
  }
  const photo=m.photo||m.image||m.imageUrl||"";
  if(photo){
   const img=document.createElement("img");
   img.src=photo;img.alt="Photo envoyée";img.loading="lazy";
   img.addEventListener("click",()=>showImage(photo));
   bubble.appendChild(img);
  }
  const audio=m.audio||m.audioUrl||m.voice||"";
  if(audio){
   const player=document.createElement("audio");
   player.controls=true;player.preload="metadata";player.src=audio;
   bubble.appendChild(player);
  }
  if(!text&&!photo&&!audio){
   const fallback=document.createElement("div");
   fallback.textContent="Message";
   bubble.appendChild(fallback);
  }
  const meta=document.createElement("div");meta.className="msgmeta";
  meta.textContent=timeText(m.createdAt||m.timestamp||m.time)+(mine?"  ✓✓":"");
  row.append(bubble,meta);
  container.appendChild(row);
 }
 container.scrollTop=container.scrollHeight;
}
function showImage(src){
 const overlay=document.createElement("div");
 overlay.style.cssText="position:fixed;inset:0;z-index:999;background:#000e;display:flex;align-items:center;justify-content:center;padding:15px";
 const img=document.createElement("img");
 img.src=src;img.style.cssText="max-width:100%;max-height:90dvh;object-fit:contain";
 overlay.appendChild(img);overlay.addEventListener("click",()=>overlay.remove());
 document.body.appendChild(overlay);
}

async function sendPayload(payload){
 if(!myPhone||!activeChat)throw new Error("Choisis d’abord une conversation.");
 const now=Date.now();
 const chatId=getChatId(myPhone,activeChat);
 const messageRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
 const message={
  ...payload,
  id:messageRef.key,
  sender:myPhone,
  from:myPhone,
  senderName:myName,
  createdAt:now,
  timestamp:now,
  serverTime:serverTimestamp()
 };
 // Écrire le message avant de mettre à jour la liste des conversations.
 await set(messageRef,message);
 // Afficher immédiatement côté expéditeur, sans attendre le prochain événement.
 if(!messageSets[chatId])messageSets[chatId]={};
 messageSets[chatId][messageRef.key]=message;
 renderMessages();
 const preview=payload.text|| (payload.photo?"📷 Photo":payload.audio?"🎙 Message vocal":"Message");
 const updates={};
 updates[`jasonBusiness/user_chats/${myPhone}/${chatId}`]={
  with:activeChat,status:"accepted",lastMsg:preview,lastTime:now,unread:0
 };
 updates[`jasonBusiness/user_chats/${activeChat}/${chatId}`]={
  with:myPhone,status:"accepted",lastMsg:preview,lastTime:now,unread:1
 };
 try{
  await update(ref(db),updates);
 }catch(e){
  console.warn("Message enregistré mais liste de conversation non mise à jour:",e);
 }
 renderPeople();
}

async function sendText(){
 if(sending)return;
 const input=$("messageInput");
 const text=input.value.trim();
 if(!text)return;
 if(!activeChat){setNotice("Choisis un contact avant d’envoyer.");return}
 sending=true;$("sendBtn").disabled=true;clearNotice();
 try{
  await sendPayload({text,type:"text"});
  input.value="";input.style.height="auto";
 }catch(e){
  setNotice("Échec de l’envoi : "+e.message);
 }finally{
  sending=false;$("sendBtn").disabled=!activeChat;
 }
}
$("sendBtn").addEventListener("click",sendText);
$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}
});
$("messageInput").addEventListener("input",e=>{
 e.target.style.height="auto";
 e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";
});

$("photoBtn").addEventListener("click",()=>{
 if(!activeChat){setNotice("Choisis une conversation avant d’envoyer une photo.");return}
 $("photoInput").click();
});
$("photoInput").addEventListener("change",async e=>{
 const files=[...e.target.files||[]];
 e.target.value="";
 if(!files.length)return;
 for(const file of files){
  if(!file.type.startsWith("image/")){setNotice("Choisis uniquement des images.");continue}
  if(file.size>900*1024){
   setNotice("Photo trop volumineuse. Choisis une image de moins de 900 Ko.");
   continue;
  }
  try{
   const data=await fileToDataURL(file);
   pendingPhotos.push({name:file.name,data});
  }catch(err){setNotice("Impossible de lire la photo : "+err.message)}
 }
 renderPhotoPreview();
});
function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error("lecture du fichier impossible"));
  reader.readAsDataURL(file);
 });
}
function renderPhotoPreview(){
 const box=$("photoPreview");box.innerHTML="";
 pendingPhotos.forEach((p,index)=>{
  const item=document.createElement("div");item.className="previewitem";
  const img=document.createElement("img");img.src=p.data;img.alt=p.name;
  const remove=document.createElement("button");remove.textContent="×";
  remove.addEventListener("click",()=>{pendingPhotos.splice(index,1);renderPhotoPreview()});
  item.append(img,remove);box.appendChild(item);
 });
 if(pendingPhotos.length){
  const send=document.createElement("button");
  send.textContent="Envoyer les photos";
  send.style.cssText="flex-shrink:0;border:0;border-radius:10px;padding:10px;background:#0077ff;color:white";
  send.addEventListener("click",sendPhotos);box.appendChild(send);
 }
}
async function sendPhotos(){
 if(!activeChat||!pendingPhotos.length)return;
 const photos=[...pendingPhotos];clearNotice();
 try{
  for(const p of photos){
   await sendPayload({photo:p.data,type:"photo",fileName:p.name});
  }
  pendingPhotos=[];renderPhotoPreview();
  setNotice("Photo(s) envoyée(s).",false);
 }catch(e){
  setNotice("Erreur lors de l’envoi de la photo : "+e.message);
 }
}

/* Enregistrement vocal : appuie une fois pour commencer,
   puis sur Terminer pour envoyer le vocal. */
$("micBtn").addEventListener("click",startRecording);
async function startRecording(){
 if(!activeChat){setNotice("Choisis une conversation avant d’enregistrer un vocal.");return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  setNotice("L’enregistrement vocal n’est pas disponible dans ce navigateur. Ouvre la page en HTTPS dans Chrome.");
  return;
 }
 clearNotice();
 try{
  recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordChunks=[];recordingCancelled=false;recordingStartedAt=Date.now();
  let options={};
  const types=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus","audio/ogg"];
  const supported=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(supported)options.mimeType=supported;
  recorder=new MediaRecorder(recordStream,options);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data)};
  recorder.onerror=()=>setNotice("Une erreur est survenue pendant l’enregistrement.");
  recorder.onstop=async()=>{
   clearInterval(recordTimer);
   $("recBar").classList.remove("show");
   $("micBtn").textContent="🎙";
   if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
   recordStream=null;
   if(recordingCancelled){recordChunks=[];return}
   const blob=new Blob(recordChunks,{type:recorder?.mimeType||"audio/webm"});
   recordChunks=[];
   if(!blob.size){setNotice("Aucun son enregistré. Réessaie.");return}
   if(blob.size>700*1024){
    setNotice("Vocal trop volumineux. Enregistre un message plus court.");
    return;
   }
   try{
    const data=await fileToDataURL(blob);
    await sendPayload({audio:data,type:"audio",audioType:blob.type,duration:Math.round((Date.now()-recordingStartedAt)/1000)});
    setNotice("Message vocal envoyé.",false);
   }catch(err){setNotice("Le vocal n’a pas pu être envoyé : "+err.message)}
  };
  recorder.start(250);
  $("recBar").classList.add("show");
  $("micBtn").textContent="🔴";
  $("recLabel").textContent="🔴 Enregistrement… 0 s";
  recordTimer=setInterval(()=>{
   const seconds=Math.floor((Date.now()-recordingStartedAt)/1000);
   $("recLabel").textContent="🔴 Enregistrement… "+seconds+" s";
   if(seconds>=30)stopRecording();
  },500);
 }catch(e){
  if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
  recordStream=null;
  setNotice("Microphone refusé ou indisponible. Autorise le microphone dans les paramètres du navigateur.");
 }
}
function stopRecording(){
 if(recorder&&recorder.state!=="inactive")recorder.stop();
}
$("stopRecBtn").addEventListener("click",stopRecording);
$("cancelRecBtn").addEventListener("click",()=>{
 recordingCancelled=true;
 if(recorder&&recorder.state!=="inactive")recorder.stop();
 else{
  $("recBar").classList.remove("show");
  if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
  recordStream=null;
 }
});

document.querySelectorAll(".tabs .tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  currentTab=btn.dataset.tab;
  document.querySelectorAll(".tabs .tab").forEach(b=>b.classList.toggle("active",b===btn));
  renderPeople();
 });
});
$("searchInput").addEventListener("input",renderPeople);
$("backBtn").addEventListener("click",()=>appEl.classList.remove("chat-open"));

window.addEventListener("beforeunload",()=>{
 clearMessageListeners();
 if(recordTimer)clearInterval(recordTimer);
 if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
});

init();
</script>
