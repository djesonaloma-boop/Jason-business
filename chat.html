
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>JASON BUSINESS — Chat</title>

<style>
:root{--blue:#00d2ff;--dark:#050a14;--red:#ff4757;--border:rgba(0,210,255,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:white;background:#050a14;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{height:56px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#050a14;border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--blue);font-size:13px}
.btn{padding:7px 10px;border-radius:9px;border:1px solid rgba(0,210,255,.25);background:rgba(0,210,255,.08);color:var(--blue);font-size:11px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{display:flex;flex:1;overflow:hidden;min-height:0}
.left{width:360px;flex-shrink:0;background:#0b1425;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;opacity:.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;color:var(--blue);border-bottom-color:var(--blue)}
.search{padding:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.search input,.add-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #293850;background:#0c192b;color:white;outline:none}
.list{flex:1;overflow-y:auto;padding:6px}
.item{padding:10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.item:hover{background:rgba(0,210,255,.06)}
.item.active{background:rgba(0,210,255,.14);border-color:var(--blue)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.prev{font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{flex:1;display:flex;flex-direction:column;background:#070e1e;overflow:hidden;min-width:0}
.top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--border);background:rgba(5,10,20,.95);flex-shrink:0}
.top-actions{display:flex;gap:6px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:75%;padding:8px 10px;border-radius:16px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;border-bottom-right-radius:6px}
.msg.other{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.photo-wrap{margin-top:6px;border-radius:12px;overflow:hidden;max-width:180px;background:#000;border:1px solid rgba(255,255,255,.15)}
.photo-wrap img{width:100%;max-height:200px;object-fit:cover;display:block}
.msg audio{display:block;margin-top:6px;width:230px;max-width:100%}
.input{padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end;background:#0a1425;border-top:1px solid var(--border);flex-shrink:0}
.input textarea{flex:1;min-width:0;min-height:40px;max-height:90px;padding:10px 12px;border-radius:18px;border:1px solid #293850;background:#0c192b;color:white;outline:none;resize:none;font-size:13px}
.tbtn{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid #293850;background:#0c192b;color:white;display:grid;place-items:center;cursor:pointer}
.tbtn.recording{background:#ff4757!important;border-color:#ff4757!important;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,71,87,.7)}70%{box-shadow:0 0 0 10px rgba(255,71,87,0)}100%{box-shadow:0 0 0 0 rgba(255,71,87,0)}}
.send{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:0;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;font-size:18px;cursor:pointer}
.debug{padding:8px 10px;background:#ffeb3b22;border:1px solid #ffeb3b44;color:#ffeb3b;font-size:10px;border-radius:8px;margin:6px}
.add-box{padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.empty{flex:1;display:grid;place-items:center;text-align:center;opacity:.6;padding:20px;font-size:12px}
.hidden{display:none!important}

/* APPEL */
.call-overlay{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#10203f 0%,#050a14 70%);align-items:center;justify-content:center;flex-direction:column;padding:20px}
.call-overlay.show{display:flex}
.call-avatar{width:110px;height:110px;border-radius:30px;background:linear-gradient(135deg,#00d2ff,#0077ff);display:grid;place-items:center;font-size:40px;font-weight:900;margin-bottom:14px;box-shadow:0 0 0 6px rgba(0,210,255,.1),0 0 40px rgba(0,210,255,.3);overflow:hidden}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-name{font-size:18px;font-weight:800;margin:6px 0;text-align:center}
.call-timer{font-size:13px;opacity:.8;margin:8px 0 14px;text-align:center}
.call-videos{position:relative;width:100%;max-width:430px;height:min(58vh,520px);background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--border);display:none}
.call-videos.show{display:block}
.call-videos video#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
.call-videos video#localVideo{position:absolute;right:12px;bottom:12px;width:90px;height:130px;border-radius:12px;border:2px solid white;object-fit:cover;background:#111;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.call-actions{display:flex;gap:14px;margin-top:18px;align-items:center;justify-content:center}
.cbtn{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;font-size:22px;cursor:pointer;color:white}
.cbtn.mute,.cbtn.cam{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.cbtn.hang{background:#ff4757;box-shadow:0 0 20px rgba(255,71,87,.4)}
.cbtn.accept{background:#18bd76;box-shadow:0 0 20px rgba(24,189,118,.4)}
.call-note{font-size:10px;opacity:.5;text-align:center;margin-top:16px}
@media(max-width:800px){
 .wrap{flex-direction:column}
 .left{position:absolute;inset:56px 0 0;z-index:20;width:100%}
 .left.hide{display:none}
 .msg{max-width:86%}
 .brand{font-size:11px}
 .top{padding:8px}
 .top-actions{gap:4px}
 .top-actions .btn{padding:7px 6px;font-size:10px}
}
</style>
</head>

<body>
<header>
  <div class="brand">💬 JASON CHAT — <span id="myPhoneShow">...</span></div>
  <div style="display:flex;gap:6px">
    <button class="btn" id="btnShowLeft">☰</button>
    <a href="dashboard.html" class="btn" style="text-decoration:none">Dashboard</a>
  </div>
</header>

<div class="wrap">
  <aside class="left" id="leftPanel">
    <div class="tabs">
      <div class="tab active" data-tab="chats">💬 Chats</div>
      <div class="tab" data-tab="users">👥 Utilisateurs</div>
      <div class="tab" data-tab="requests">🔔 Demandes <span id="reqCount" style="background:#ff4757;color:white;padding:1px 5px;border-radius:10px;font-size:9px;display:none">0</span></div>
    </div>
    <div class="add-box">
      <input id="manualPhone" placeholder="+243... Ajouter">
      <button class="btn" id="btnAddManual">+</button>
    </div>
    <div class="search"><input id="search" placeholder="🔍 Rechercher..."></div>
    <div id="debugArea"></div>
    <div class="list" id="list"></div>
  </aside>

  <section class="right">
    <div class="top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <div class="av" id="chatAvatar" style="width:36px;height:36px;font-size:12px">JB</div>
        <div style="min-width:0">
          <h3 id="chatName" style="margin:0;font-size:14px">Sélectionne un chat</h3>
          <small id="chatPhone" style="font-size:11px;opacity:.6">Messenger</small>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="voiceCallBtn">📞 Vocal</button>
        <button class="btn" id="videoCallBtn">🎥 Vidéo</button>
      </div>

    <div class="msgs" id="msgs"><div class="empty">Sélectionne un chat pour commencer.</div></div>
    <div class="input">
      <label class="tbtn" title="Envoyer une image">🖼️<input type="file" id="photoInput" accept="image/*" hidden></label>
      <button class="tbtn" id="recordBtn" title="Appuie pour enregistrer un vocal">🎤</button>
      <textarea id="msgInput" placeholder="Écris un message..." disabled rows="1"></textarea>
      <button class="send" id="sendBtn" disabled>➤</button>
    </div>
  </section>
</div>

<!-- ECRAN D'APPEL -->
<div class="call-overlay" id="callOverlay">
  <div id="callAvatarBox" class="call-avatar">JB</div>
  <div id="callName" class="call-name">JASON CHAT</div>
  <div id="callStatus" class="call-timer">Connexion...</div>

  <div id="callVideos" class="call-videos">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div class="call-actions">
    <button class="cbtn mute" id="muteBtn" title="Micro">🎤</button>
    <button class="cbtn accept hidden" id="acceptBtn" title="Accepter">📞</button>
    <button class="cbtn hang" id="hangBtn" title="Refuser ou raccrocher">📵</button>
    <button class="cbtn cam" id="camBtn" title="Caméra">🎥</button>
  </div>
  <div class="call-note">Autorise le micro et la caméra dans ton navigateur.</div>
</div>

<script type="module">
import {initializeApp,getApps,getApp}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
 getDatabase,ref,onValue,onChildAdded,push,set,get,remove,update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIGURATION FIREBASE DU PROJET */
const firebaseConfig={
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

const myPhone=localStorage.getItem("jasonBusinessUserPhone")
 ||localStorage.getItem("userPhone")
 ||localStorage.getItem("phone");

if(!myPhone){
 alert("Connecte-toi avant d'utiliser JASON CHAT.");
 location.replace("login.html");
 throw new Error("Utilisateur non connecté");
}

$("myPhoneShow").textContent=myPhone;

let tab="chats";
let activeChat=null;
let allUsers={};
let myRequests={};
let myChats={};
let manualUsers=JSON.parse(localStorage.getItem("jb_manual_users")||"[]");

let pc=null;
let localStream=null;
let currentCallId=null;
let currentCall=null;
let callRole=null;
let callSec=0;
let callTimerInt=null;
let ringContext=null;
let ringInterval=null;
let callBusy=false;
let callCleaned=false;
let messageUnsubscribe=null;
let candidateUnsubscribes=[];
let callUnsubscribes=[];
let processedCalls=new Set();
let pendingCandidates=[];
let remoteDescriptionReady=false;
let mediaRecorder=null;
let audioChunks=[];
let isRecording=false;
let recordStream=null;
let seenMessages=new Set();

function esc(s){
 return String(s??"").replaceAll("&","&amp;")
 .replaceAll("<","&lt;").replaceAll(">","&gt;")
 .replaceAll('"',"&quot;").replaceAll("'","&#39;");
}
function timeStr(ts){
 return ts?new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
}
function getChatId(a,b){return [a,b].sort().join("_")}
function showDebug(msg){$("debugArea").innerHTML=`<div class="debug">${esc(msg)}</div>`}
function getUserPhoto(phone){
 const u=allUsers[phone]||{};
 return u.photo||u.photoProfil||u.avatar||"";
}
function getUserName(phone){
 const u=allUsers[phone]||{};
 return u.nom||u.name||phone;
}

/* SONNERIE : fonctionne lorsque la page est ouverte
   et que le navigateur autorise la lecture audio. */
function stopRingtone(){
 if(ringInterval){clearInterval(ringInterval);ringInterval=null}
 if(ringContext){
  ringContext.close().catch(()=>{});
  ringContext=null;
 }
}
function playTone(){
 if(!ringContext||ringContext.state==="closed")return;
 try{
  const now=ringContext.currentTime;
  [0,0.32].forEach(offset=>{
   const osc=ringContext.createOscillator();
   const gain=ringContext.createGain();
   osc.type="sine";
   osc.frequency.value=offset===0?880:660;
   gain.gain.setValueAtTime(0.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(0.16,now+offset+0.025);
   gain.gain.setValueAtTime(0.16,now+offset+0.15);
   gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.28);
   osc.connect(gain);
   gain.connect(ringContext.destination);
   osc.start(now+offset);
   osc.stop(now+offset+0.3);
  });
 }catch(e){console.warn("Sonnerie",e)}
}
async function startRingtone(){
 stopRingtone();
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  ringContext=new AC();
  await ringContext.resume();
  playTone();
  ringInterval=setInterval(playTone,1500);
 }catch(e){
  console.warn("Lecture de la sonnerie impossible",e);
 }
}

/* LISTES */
document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  tab=t.dataset.tab;
  render();
 };
});
$("search").oninput=render;
$("btnShowLeft").onclick=()=> $("leftPanel").classList.remove("hide");

async function loadUsers(){
 try{
  const snap=await get(ref(db,"jasonBusiness/users"));
  allUsers=snap.val()||{};
  showDebug("Firebase : "+Object.keys(allUsers).length+" utilisateur(s)");
  render();
 }catch(e){
  showDebug("Erreur de lecture Firebase. Vérifie les règles.");
 }
}
loadUsers();

onValue(ref(db,"jasonBusiness/users"),snap=>{
 allUsers=snap.val()||{};
 render();
});

onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{
 myRequests=snap.val()||{};
 const count=Object.values(myRequests).filter(r=>
  r.type==="incoming"&&r.status==="pending"
 ).length;
 $("reqCount").textContent=count;
 $("reqCount").style.display=count?"inline-block":"none";
 render();
});

onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),snap=>{
 myChats=snap.val()||{};
 render();
});

$("btnAddManual").onclick=()=>{
 const p=$("manualPhone").value.trim();
 if(!p||p.length<8){alert("Numéro invalide");return}
 if(p===myPhone){alert("Tu ne peux pas t'ajouter toi-même.");return}
 if(!manualUsers.includes(p))manualUsers.push(p);
 localStorage.setItem("jb_manual_users",JSON.stringify(manualUsers));
 $("manualPhone").value="";
 render();
};

function getCombinedUsers(){
 const combined={...allUsers};
 manualUsers.forEach(p=>{
  if(!combined[p])combined[p]={telephone:p,manuel:true};
 });
 return combined;
}

function render(){
 const q=($("search").value||"").toLowerCase();
 const container=$("list");
 container.innerHTML="";
 const users=getCombinedUsers();

 if(tab==="users"){
  Object.entries(users).forEach(([phone,u])=>{
   if(phone===myPhone)return;
   if(q&&!phone.toLowerCase().includes(q)&&
      !String(u.nom||u.name||"").toLowerCase().includes(q))return;

   const chatId=getChatId(myPhone,phone);
   const isFriend=myChats[chatId]?.status==="accepted";
   const hasSent=myRequests[phone]?.type==="outgoing";
   const photo=getUserPhoto(phone);
   const div=document.createElement("div");
   div.className="item";
   div.innerHTML=`
    <div class="av">${photo?`<img src="${esc(photo)}">`:esc(phone.slice(-2))}</div>
    <div class="info">
     <div class="name">${esc(u.nom||u.name||phone)}</div>
     <div class="prev">${esc(phone)} • ${isFriend?"✅ Ami":hasSent?"⏳ Envoyée":"👤 Utilisateur"}</div>
    </div>
    <div>${isFriend?"💬":hasSent?"⏳":"+"}</div>`;
   div.onclick=()=>{
    if(isFriend)openChat(phone);
    else if(!hasSent)sendRequest(phone);
   };
   container.appendChild(div);
  });
 }else if(tab==="requests"){
  const reqs=Object.entries(myRequests).filter(([_,r])=>
   r.type==="incoming"&&r.status==="pending"
  );
  if(!reqs.length){
   container.innerHTML='<div class="empty">Aucune demande reçue</div>';
   return;
  }
  reqs.forEach(([phone])=>{
   const div=document.createElement("div");
   div.className="item";
   const photo=getUserPhoto(phone);
   div.innerHTML=`
    <div class="av">${photo?`<img src="${esc(photo)}">`:esc(phone.slice(-2))}</div>
    <div class="info"><div class="name">${esc(getUserName(phone))}</div>
    <div class="prev">Veut discuter</div></div>`;
   const actions=document.createElement("div");
   actions.style.display="flex";
   actions.style.gap="4px";
   actions.innerHTML=`
    <button class="btn" data-a="${esc(phone)}">Accepter</button>
    <button class="btn" data-r="${esc(phone)}">Refuser</button>`;
   div.appendChild(actions);
   container.appendChild(div);
  });
  container.querySelectorAll("[data-a]").forEach(b=>
   b.onclick=e=>{e.stopPropagation();acceptRequest(b.dataset.a)}
  );
  container.querySelectorAll("[data-r]").forEach(b=>
   b.onclick=e=>{e.stopPropagation();refuseRequest(b.dataset.r)}
  );
 }else{
  const chatsList=Object.entries(myChats)
   .filter(([_,c])=>c.status==="accepted")
   .sort((a,b)=>(b[1].lastTime||0)-(a[1].lastTime||0));

  const filtered=chatsList.filter(([chatId,chat])=>{
   const other=chatId.split("_").find(p=>p!==myPhone);
   return other&&(getUserName(other)+" "+other+" "+(chat.lastMsg||""))
    .toLowerCase().includes(q);
  });

  if(!filtered.length){
   container.innerHTML='<div class="empty">Aucun chat. Ouvre Utilisateurs pour ajouter un contact.</div>';
   return;
  }

  filtered.forEach(([chatId,chat])=>{
   const other=chatId.split("_").find(p=>p!==myPhone);
   if(!other)return;
   const photo=getUserPhoto(other);
   const div=document.createElement("div");
   div.className="item"+(activeChat===other?" active":"");
   div.innerHTML=`
    <div class="av">${photo?`<img src="${esc(photo)}">`:esc(other.slice(-2))}</div>
    <div class="info">
     <div class="name">${esc(getUserName(other))}</div>
     <div class="prev">${esc((chat.lastMsg||"Nouveau").slice(0,50))}</div>
    </div>
    <div style="font-size:9px;text-align:right">
     <div>${timeStr(chat.lastTime)}</div>
     ${chat.unread?`<div style="background:#ff4757;padding:2px 6px;border-radius:10px;margin-top:3px">${esc(chat.unread)}</div>`:""}
    </div>`;
   div.onclick=()=>openChat(other);
   container.appendChild(div);
  });
 }
}

async function sendRequest(toPhone){
 if(!confirm(`Envoyer une demande de discussion à ${toPhone} ?`))return;
 try{
  await set(ref(db,`jasonBusiness/chat_requests/${myPhone}/${toPhone}`),{
   phone:toPhone,type:"outgoing",status:"pending",createdAt:Date.now()
  });
  await set(ref(db,`jasonBusiness/chat_requests/${toPhone}/${myPhone}`),{
   phone:myPhone,type:"incoming",status:"pending",createdAt:Date.now()
  });
  alert("Demande envoyée.");
 }catch(e){alert("Impossible d'envoyer la demande. Vérifie Firebase.");}
}

async function acceptRequest(fromPhone){
 try{
  const chatId=getChatId(myPhone,fromPhone);
  await set(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{
   with:fromPhone,status:"accepted",lastMsg:"✅ Contact accepté",
   lastTime:Date.now(),unread:0
  });
  await set(ref(db,`jasonBusiness/user_chats/${fromPhone}/${chatId}`),{
   with:myPhone,status:"accepted",lastMsg:"✅ Contact accepté",
   lastTime:Date.now(),unread:0
  });
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromPhone}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${fromPhone}/${myPhone}`));
  tab="chats";
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelector('[data-tab="chats"]').classList.add("active");
  render();
  openChat(fromPhone);
 }catch(e){alert("Erreur lors de l'acceptation. Vérifie les règles Firebase.");}
}

async function refuseRequest(fromPhone){
 try{
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromPhone}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${fromPhone}/${myPhone}`));
 }catch(e){alert("Impossible de refuser la demande.");}
}

/* CONVERSATION */
function openChat(otherPhone){
 activeChat=otherPhone;
 const photo=getUserPhoto(otherPhone);
 $("chatName").textContent=getUserName(otherPhone);
 $("chatPhone").textContent=otherPhone;
 $("chatAvatar").innerHTML=photo
  ?`<img src="${esc(photo)}" style="width:100%;height:100%;object-fit:cover">`
  :esc(otherPhone.slice(-2));

 $("msgInput").disabled=false;
 $("sendBtn").disabled=false;

 if(window.innerWidth<=800)$("leftPanel").classList.add("hide");

 if(messageUnsubscribe){messageUnsubscribe();messageUnsubscribe=null}
 seenMessages.clear();

 const chatId=getChatId(myPhone,otherPhone);
 messageUnsubscribe=onValue(ref(db,`jasonBusiness/messages/${chatId}`),snap=>{
  const data=snap.val()||{};
  const msgs=Object.entries(data).map(([id,m])=>({...m,_id:id}))
   .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));

  renderMessages(msgs);

  update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{
   unread:0
  }).catch(()=>{});

  const unreadForOther=msgs.filter(m=>m.to===myPhone&&m.from===otherPhone);
  if(unreadForOther.length){
   update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{
    unread:0
   }).catch(()=>{});
  }
 });
 render();
}

function renderMessages(msgs){
 const c=$("msgs");
 c.innerHTML="";
 if(!msgs.length){
  c.innerHTML='<div class="empty">💬 Commence la conversation !</div>';
  return;
 }
 msgs.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg "+(m.from===myPhone?"me":"other");
  let html=esc(m.text||"");

  if(m.photo){
   html+=`<a class="photo-wrap" href="${esc(m.photo)}" target="_blank" rel="noopener"><img src="${esc(m.photo)}" alt="Image envoyée"></a>`;
  }
  if(m.audio){
   html+=`<audio controls preload="metadata" src="${esc(m.audio)}"></audio>`;
  }
  html+=`<div style="font-size:8px;opacity:.7;margin-top:4px;text-align:right">${timeStr(m.createdAt)} ${m.from===myPhone?"✓✓":""}</div>`;
  div.innerHTML=html;
  c.appendChild(div);
 });
 c.scrollTop=c.scrollHeight;
}

async function publishMessage(otherPhone,payload,label){
 const chatId=getChatId(myPhone,otherPhone);
 const messageRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
 const now=Date.now();

 await set(messageRef,{
  from:myPhone,to:otherPhone,...payload,createdAt:now
 });

 const mineRef=ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`);
 const otherRef=ref(db,`jasonBusiness/user_chats/${otherPhone}/${chatId}`);

 const [mineSnap,otherSnap]=await Promise.all([get(mineRef),get(otherRef)]);
 const mine=mineSnap.val()||{};
 const other=otherSnap.val()||{};

 await set(mineRef,{
  ...mine,with:otherPhone,status:"accepted",
  lastMsg:label,lastTime:now,unread:0
 });
 await set(otherRef,{
  ...other,with:myPhone,status:"accepted",
  lastMsg:label,lastTime:now,unread:(other.unread||0)+1
 });
}

async function sendText(){
 const text=$("msgInput").value.trim();
 if(!text||!activeChat)return;
 $("sendBtn").disabled=true;
 $("msgInput").value="";
 try{await publishMessage(activeChat,{text},text)}
 catch(e){alert("Message non envoyé. Vérifie ta connexion.");}
 finally{$("sendBtn").disabled=false;$("msgInput").focus()}
}
$("sendBtn").onclick=sendText;
$("msgInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}
});

/* ENVOI D'IMAGE */
$("photoInput").onchange=async e=>{
 const file=e.target.files[0];
 e.target.value="";
 if(!file||!activeChat)return;
 if(!file.type.startsWith("image/")){alert("Choisis une image.");return}
 if(file.size>700*1024){
  alert("Image trop volumineuse pour cette version. Choisis une image de moins de 700 Ko.");
  return;
 }
 try{
  const reader=new FileReader();
  reader.onload=async()=>{
   try{await publishMessage(activeChat,{text:"📷 Photo",photo:reader.result},"📷 Photo")}
   catch(err){alert("Image non envoyée. Vérifie Firebase.");}
  };
  reader.readAsDataURL(file);
 }catch(err){alert("Impossible de lire cette image.");}
};

/* MESSAGES VOCAUX */
$("recordBtn").onclick=async()=>{
 if(!activeChat){alert("Ouvre une conversation d'abord.");return}

 if(!isRecording){
  try{
   if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
    throw new Error("Ton navigateur ne prend pas en charge l'enregistrement vocal.");
   }

   recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
   let mime="";
   for(const t of ["audio/webm;codecs=opus","audio/webm","audio/mp4"]){
    if(MediaRecorder.isTypeSupported(t)){mime=t;break}
   }

   mediaRecorder=mime?new MediaRecorder(recordStream,{mimeType:mime}):new MediaRecorder(recordStream);
   audioChunks=[];
   mediaRecorder.ondataavailable=e=>{
    if(e.data&&e.data.size>0)audioChunks.push(e.data);
   };

   mediaRecorder.onstop=async()=>{
    const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
    recordStream?.getTracks().forEach(t=>t.stop());
    recordStream=null;
    isRecording=false;
    $("recordBtn").textContent="🎤";
    $("recordBtn").classList.remove("recording");

    if(blob.size<1000){alert("Vocal trop court.");return}
    if(blob.size>700*1024){
     alert("Vocal trop volumineux pour cette version. Enregistre un message plus court.");
     return;
    }

    const reader=new FileReader();
    reader.onload=async()=>{
     try{
      if(activeChat)await publishMessage(activeChat,{
       text:"🎤 Message vocal",audio:reader.result
      },"🎤 Message vocal");
     }catch(err){alert("Vocal non envoyé. Vérifie les règles Firebase.");}
    };
    reader.readAsDataURL(blob);
   };

   mediaRecorder.start();
   isRecording=true;
   $("recordBtn").textContent="⏹️";
   $("recordBtn").classList.add("recording");
   $("recordBtn").title="Appuie pour arrêter et envoyer";

   setTimeout(()=>{
    if(isRecording&&mediaRecorder?.state==="recording")mediaRecorder.stop();
   },45000);
  }catch(err){
   recordStream?.getTracks().forEach(t=>t.stop());
   recordStream=null;
   alert("Micro indisponible : "+err.message+"\nUtilise HTTPS et autorise le micro.");
  }
 }else if(mediaRecorder?.state==="recording"){
  mediaRecorder.stop();
 }
};

/* APPELS WEBRTC */
function startTimer(){
 clearInterval(callTimerInt);
 callSec=0;
 callTimerInt=setInterval(()=>{
  callSec++;
  const m=String(Math.floor(callSec/60)).padStart(2,"0");
  const s=String(callSec%60).padStart(2,"0");
  $("callStatus").textContent=`✅ En communication ${m}:${s}`;
 },1000);
}
function stopTimer(){
 clearInterval(callTimerInt);
 callTimerInt=null;
 callSec=0;
}
function clearCallListeners(){
 callUnsubscribes.forEach(fn=>{try{fn()}catch{}});
 candidateUnsubscribes.forEach(fn=>{try{fn()}catch{}});
 callUnsubscribes=[];
 candidateUnsubscribes=[];
}
function createPeer(){
 return new RTCPeerConnection({
  iceServers:[
   {urls:"stun:stun.l.google.com:19302"},
   {urls:"stun:stun1.l.google.com:19302"}
  ]
 });
}
function showCallScreen(phone,isVideo){
 const name=getUserName(phone);
 const photo=getUserPhoto(phone);
 $("callOverlay").classList.add("show");
 $("callName").textContent=name;
 $("callAvatarBox").innerHTML=photo
  ?`<img src="${esc(photo)}" alt="">`
  :esc(name.slice(0,2).toUpperCase());
 $("callVideos").classList.toggle("show",!!isVideo);
 $("callAvatarBox").style.display=isVideo?"none":"grid";
 $("localVideo").style.display=isVideo?"block":"none";
 $("acceptBtn").classList.add("hidden");
 $("muteBtn").textContent="🎤";
 $("camBtn").textContent="🎥";
 $("camBtn").style.display=isVideo?"grid":"none";
}
function attachPeerEvents(){
 if(!pc)return;

 pc.ontrack=e=>{
  if(e.streams&&e.streams[0]){
   $("remoteVideo").srcObject=e.streams[0];
  }
  if(currentCall?.isVideo)$("callVideos").classList.add("show");
  startTimer();
  $("callStatus").textContent="✅ En communication";
 };

 pc.onconnectionstatechange=()=>{
  if(!pc)return;
  if(pc.connectionState==="connected"){
   stopRingtone();
   startTimer();
   $("callStatus").textContent="✅ En communication";
  }else if(["failed","disconnected"].includes(pc.connectionState)){
   $("callStatus").textContent="⚠️ Connexion instable...";
  }else if(pc.connectionState==="closed"){
   stopTimer();
  }
 };

 pc.oniceconnectionstatechange=()=>{
  if(!pc)return;
  if(pc.iceConnectionState==="failed"){
   $("callStatus").textContent="⚠️ Connexion impossible. Vérifie Internet.";
  }
 };
}

async function addCandidateSafely(candidate){
 if(!pc||!candidate)return;
 try{
  if(!remoteDescriptionReady){
   pendingCandidates.push(candidate);
   return;
  }
  await pc.addIceCandidate(new RTCIceCandidate(candidate));
 }catch(e){console.warn("Candidat ICE ignoré",e)}
}
async function flushCandidates(){
 remoteDescriptionReady=true;
 const queue=[...pendingCandidates];
 pendingCandidates=[];
 for(const c of queue)await addCandidateSafely(c);
}
function listenCandidates(callId,phone){
 const unsub=onChildAdded(
  ref(db,`jasonBusiness/calls/${callId}/candidates/${phone}`),
  snap=>{if(snap.exists())addCandidateSafely(snap.val())}
 );
 candidateUnsubscribes.push(unsub);
}
function listenCallStatus(callId){
 const unsub=onValue(ref(db,`jasonBusiness/calls/${callId}/status`),snap=>{
  const status=snap.val();
  if(status==="ended"&&currentCallId===callId){
   finishCall(false,"Appel terminé");
  }
 });
 callUnsubscribes.push(unsub);
}
async function requestMedia(isVideo){
 if(!navigator.mediaDevices?.getUserMedia){
  throw new Error("Micro et caméra nécessitent HTTPS et un navigateur compatible.");
 }
 return await navigator.mediaDevices.getUserMedia({
  audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
  video:isVideo?{facingMode:"user",width:{ideal:640},height:{ideal:480}}:false
 });
}

/* APPEL SORTANT */
async function startCall(isVideo){
 if(!activeChat){alert("Ouvre une conversation d'abord.");return}
 if(callBusy){alert("Un appel est déjà en cours.");return}

 callBusy=true;
 callCleaned=false;
 callRole="caller";
 pendingCandidates=[];
 remoteDescriptionReady=false;

 const other=activeChat;
 showCallScreen(other,isVideo);
 $("callStatus").textContent=isVideo?"🎥 Appel vidéo en cours...":"📞 Appel vocal en cours...";
 await startRingtone();

 try{
  localStream=await requestMedia(isVideo);
  $("localVideo").srcObject=localStream;

  pc=createPeer();
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  attachPeerEvents();

  const callRef=push(ref(db,"jasonBusiness/calls"));
  currentCallId=callRef.key;
  currentCall={from:myPhone,to:other,isVideo};

  pc.onicecandidate=e=>{
   if(e.candidate&&currentCallId){
    push(ref(db,`jasonBusiness/calls/${currentCallId}/candidates/${myPhone}`),
     e.candidate.toJSON()).catch(console.error);
   }
  };

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(callRef,{
   from:myPhone,to:other,isVideo,
   offer:{type:offer.type,sdp:offer.sdp},
   createdAt:Date.now(),status:"ringing"
  });

  listenCandidates(currentCallId,other);
  listenCallStatus(currentCallId);

  callUnsubscribes.push(onValue(
   ref(db,`jasonBusiness/calls/${currentCallId}/answer`),
   async snap=>{
    const ans=snap.val();
    if(!ans||!pc||remoteDescriptionReady)return;
    try{
     await pc.setRemoteDescription(new RTCSessionDescription(ans));
     await flushCandidates();
     stopRingtone();
     $("callStatus").textContent="Connexion en cours...";
    }catch(e){console.error("Réponse WebRTC",e)}
   }
  ));
 }catch(e){
  alert("Impossible de démarrer l'appel : "+e.message);
  await finishCall(true,"Appel impossible");
 }
}

/* APPEL ENTRANT */
async function receiveCall(callId,call){
 if(callBusy||processedCalls.has(callId))return;
 if(call.to!==myPhone||call.from===myPhone||call.status!=="ringing")return;

 processedCalls.add(callId);
 callBusy=true;
 callCleaned=false;
 callRole="receiver";
 currentCallId=callId;
 currentCall=call;
 pendingCandidates=[];
 remoteDescriptionReady=false;

 showCallScreen(call.from,call.isVideo);
 $("callStatus").textContent=call.isVideo
  ?"📲 Appel vidéo entrant..."
  :"📲 Appel vocal entrant...";

 $("acceptBtn").classList.remove("hidden");
 $("hangBtn").title="Refuser l'appel";
 await startRingtone();

 const answerButton=$("acceptBtn");
 const declineButton=$("hangBtn");

 const cleanupButtons=()=>{
  answerButton.onclick=null;
  declineButton.onclick=null;
 };

 answerButton.onclick=async()=>{
  if(!currentCallId||currentCallId!==callId)return;
  cleanupButtons();
  stopRingtone();
  answerButton.classList.add("hidden");

  try{
   localStream=await requestMedia(!!call.isVideo);
   $("localVideo").srcObject=localStream;
   $("localVideo").style.display=call.isVideo?"block":"none";

   pc=createPeer();
   localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
   attachPeerEvents();

   pc.onicecandidate=e=>{
    if(e.candidate&&currentCallId){
     push(ref(db,`jasonBusiness/calls/${callId}/candidates/${myPhone}`),
      e.candidate.toJSON()).catch(console.error);
    }
   };

   listenCandidates(callId,call.from);
   listenCallStatus(callId);

   await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
   await flushCandidates();

   const answer=await pc.createAnswer();
   await pc.setLocalDescription(answer);

   await set(ref(db,`jasonBusiness/calls/${callId}/answer`),{
    type:answer.type,sdp:answer.sdp
   });
   await update(ref(db,`jasonBusiness/calls/${callId}`),{
    status:"accepted",acceptedAt:Date.now()
   });

   $("callStatus").textContent="Connexion en cours...";
  }catch(e){
   alert("Impossible de répondre : "+e.message);
   await finishCall(true,"Appel impossible");
  }
 };

 declineButton.onclick=async()=>{
  cleanupButtons();
  await finishCall(true,"Appel refusé");
 };
}

/* ECOUTE DES APPELS ENTRANTS */
onChildAdded(ref(db,"jasonBusiness/calls"),snap=>{
 const call=snap.val();
 if(!call)return;
 receiveCall(snap.key,call).catch(e=>console.error("Appel entrant",e));
});

/* ECOUTE DES CHANGEMENTS : un appel terminé est nettoyé */
onChildAdded(ref(db,"jasonBusiness/calls"),snap=>{
 const call=snap.val();
 if(call?.to===myPhone&&call.status==="ended"){
  processedCalls.add(snap.key);
 }
});

/* FIN D'APPEL */
async function finishCall(writeEnd=true,message="Appel terminé"){
 if(callCleaned)return;
 callCleaned=true;

 const id=currentCallId;
 stopRingtone();
 stopTimer();
 clearCallListeners();

 $("callOverlay").classList.remove("show");
 $("callVideos").classList.remove("show");
 $("acceptBtn").classList.add("hidden");
 $("callAvatarBox").style.display="grid";
 $("localVideo").srcObject=null;
 $("remoteVideo").srcObject=null;

 if(pc){pc.ontrack=null;pc.onicecandidate=null;pc.close();pc=null}
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}

 currentCallId=null;
 currentCall=null;
 callRole=null;
 callBusy=false;
 pendingCandidates=[];
 remoteDescriptionReady=false;
 $("callStatus").textContent=message;
 $("camBtn").style.display="grid";
 $("hangBtn").title="Refuser ou raccrocher";

 if(id&&writeEnd){
  try{
   await update(ref(db,`jasonBusiness/calls/${id}`),{
    status:"ended",endedAt:Date.now()
   });
  }catch(e){console.warn("Impossible de signaler la fin",e)}
 }
}
$("voiceCallBtn").onclick=()=>startCall(false);
$("videoCallBtn").onclick=()=>startCall(true);
$("hangBtn").onclick=()=>finishCall(true,"Appel terminé");

$("muteBtn").onclick=()=>{
 if(!localStream)return;
 const tracks=localStream.getAudioTracks();
 if(!tracks.length)return;
 const enabled=!tracks[0].enabled;
 tracks.forEach(t=>t.enabled=enabled);
 $("muteBtn").textContent=enabled?"🎤":"🔇";
 $("muteBtn").style.background=enabled?"rgba(255,255,255,.12)":"#ff4757";
};

$("camBtn").onclick=()=>{
 if(!localStream)return;
 const tracks=localStream.getVideoTracks();
 if(!tracks.length){
  alert("La caméra n'est pas activée pendant cet appel vocal.");
  return;
 }
 const enabled=!tracks[0].enabled;
 tracks.forEach(t=>t.enabled=enabled);
 $("camBtn").textContent=enabled?"🎥":"🚫";
 $("camBtn").style.background=enabled?"rgba(255,255,255,.12)":"#ff4757";
};

/* Nettoyage local si l'utilisateur ferme la page */
window.addEventListener("pagehide",()=>{
 stopRingtone();
 stopTimer();
 if(pc)pc.close();
 if(localStream)localStream.getTracks().forEach(t=>t.stop());
 if(recordStream)recordStream.getTracks().forEach(t=>t.stop());
 if(messageUnsubscribe)messageUnsubscribe();
});
</script>
