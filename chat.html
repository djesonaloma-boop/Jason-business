<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0866ff">
<title>JASON BUSINESS — Facebook Pro</title>
<style>
:root{--fb-blue:#0866ff;--fb-bg:#f0f2f5;--fb-card:#fff;--text:#050505;--muted:#65676b;--border:#dddfe2;--green:#31a24c;--red:#e41e3f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:SF Pro Text,Segoe UI,Arial;color:var(--text);background:var(--fb-bg);padding-bottom:60px}
body.dark{--fb-bg:#18191a;--fb-card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:#3e4042;background:#18191a}
header{position:sticky;top:0;z-index:200;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;background:var(--fb-card);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.logo{font-weight:900;color:var(--fb-blue);font-size:24px}
.h-actions{display:flex;gap:6px;align-items:center}
.h-btn{width:40px;height:40px;border-radius:50%;background:var(--fb-bg);border:0;display:grid;place-items:center;font-size:20px;cursor:pointer;position:relative;color:var(--text)}
body.dark .h-btn{background:#3a3b3c}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--red);color:white;font-size:11px;font-weight:800;display:grid;place-items:center}
.wrap{max-width:680px;margin:auto}
.stories{display:flex;gap:8px;padding:10px;overflow-x:auto;background:var(--fb-card);margin:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);scrollbar-width:none}
.s-card{width:112px;height:190px;flex-shrink:0;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:#000;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.s-card.create{background:var(--fb-card)}
.s-card.create .s-img{height:70%;background:var(--fb-bg);display:grid;place-items:center;font-size:36px}
.s-card.create .s-plus{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:var(--fb-blue);color:white;display:grid;place-items:center;font-size:20px;border:4px solid var(--fb-card)}
.s-card .s-img{width:100%;height:100%;object-fit:cover}
.s-card .s-top{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:3px solid var(--fb-blue);overflow:hidden;background:var(--fb-card);display:grid;place-items:center;font-weight:800;font-size:12px}
.s-card .s-top img{width:100%;height:100%;object-fit:cover}
.s-card .s-name{position:absolute;bottom:0;left:0;right:0;padding:30px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:white;font-size:11px;font-weight:600}
.s-card .s-note{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:white;padding:6px 10px;border-radius:16px;font-size:11px;font-weight:700;text-align:center;max-width:90%}
.create-post{margin:0 0 8px;background:var(--fb-card);padding:12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#0077ff);display:grid;place-items:center;color:white;font-weight:900;overflow:hidden;flex-shrink:0;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.create-post input{flex:1;padding:10px 14px;border-radius:20px;border:0;background:var(--fb-bg);color:var(--text);outline:none;font-size:14px}
body.dark .create-post input{background:#3a3b3c}
.post{margin:8px 0;background:var(--fb-card);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.p-head{padding:12px;display:flex;justify-content:space-between;align-items:center}
.p-user{display:flex;gap:10px;align-items:center}
.p-info h4{font-size:14px;font-weight:600}
.p-info small{font-size:11px;color:var(--muted)}
.p-text{padding:0 12px 10px;font-size:14px;line-height:1.4;white-space:pre-wrap}
.p-img{width:100%;max-height:600px;object-fit:cover;display:block;background:#000}
.p-stats{display:flex;justify-content:space-between;padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.p-actions{display:flex}
.p-act{flex:1;padding:8px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.p-act.active{color:var(--fb-blue)}
.c-list{padding:0 12px 6px}
.c-item{display:flex;gap:6px;margin-top:8px}
.c-bubble{background:var(--fb-bg);padding:7px 10px;border-radius:16px;font-size:12px;max-width:85%}
body.dark .c-bubble{background:#3a3b3c}
.c-bubble b{font-size:12px;display:block}
.comments{padding:8px 12px;background:var(--fb-bg);display:flex;gap:6px;align-items:center}
body.dark .comments{background:#3a3b3c}
.comments input{flex:1;padding:7px 10px;border-radius:20px;border:0;background:var(--fb-card);outline:none;font-size:12px;color:var(--text)}
body.dark .comments input{background:#242526}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:5000;display:none;place-items:center;padding:14px}
.modal.show{display:grid}
.m-card{width:100%;max-width:500px;background:var(--fb-card);border-radius:10px;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.m-head{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-weight:700}
.m-body{padding:14px;overflow-y:auto;flex:1}
.m-body textarea{width:100%;min-height:70px;padding:10px;border:0;background:var(--fb-bg);border-radius:8px;outline:none;font-size:15px;resize:none;color:var(--text)}
body.dark .m-body textarea{background:#3a3b3c}
.m-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.btn-blue{background:var(--fb-blue);color:white}
.btn-gray{background:var(--fb-bg);color:var(--text)}
.preview{margin-top:10px;border-radius:8px;overflow:hidden;max-height:280px}
.preview img{width:100%;object-fit:cover}
#storyViewer{position:fixed;inset:0;background:#000;z-index:6000;display:none;flex-direction:column}
#storyViewer.show{display:flex}
.sv-top{padding:12px;display:flex;justify-content:space-between;align-items:center;color:white;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.sv-img{flex:1;display:grid;place-items:center;position:relative}
.sv-img img{max-width:100%;max-height:100%;object-fit:contain}
.sv-note{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:white;padding:10px 16px;border-radius:20px;font-weight:800;font-size:14px;text-align:center}
.sv-views{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:white;padding:16px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--fb-card);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:grid;place-items:center;font-size:22px;cursor:pointer;position:relative;color:var(--muted)}
.nav-item.active{color:var(--fb-blue)}
.nav-item .badge{top:6px;right:18px}
.profile-head{background:var(--fb-card);padding-bottom:10px}
.cover{height:160px;background:linear-gradient(135deg,#00d2ff,#0077ff)}
.p-av-big{width:90px;height:90px;border-radius:50%;border:4px solid var(--fb-card);margin:-40px 0 0 16px;background:var(--fb-blue);display:grid;place-items:center;font-size:30px;color:white;font-weight:900;overflow:hidden}
.p-av-big img{width:100%;height:100%;object-fit:cover}
.p-name-box{padding:10px 16px}
.p-stats-row{display:flex;gap:14px;margin-top:6px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">jason business</div>
<div class="h-actions">
<button class="h-btn" onclick="showHome()">🏠</button>
<button class="h-btn" onclick="location.href='messenger.html'" id="msgBtn">💬<span class="badge" id="msgBadge" style="display:none">0</span></button>
<button class="h-btn" onclick="openNotif()" id="notifBtn">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
<button class="h-btn" onclick="openModal('menuModal')">☰</button>
</div>
</header>

<div class="wrap" id="homePage">
<div class="stories" id="stories"></div>
<div class="create-post"><div class="av" id="myAv">JA</div><input placeholder="Quoi de neuf ?" readonly onclick="openModal('postModal')"><span>🖼️</span></div>
<div id="feed"></div>
</div>

<div class="wrap" id="profilePage" style="display:none">
<div class="profile-head"><div class="cover"></div><div class="p-av-big" id="pAvBig">JA</div><div class="p-name-box"><h2 id="pName">Jason</h2><small id="pPhone" style="color:var(--muted)"></small><div class="p-stats-row"><span><b id="pPosts">0</b> posts</span><span><b id="pFollowers">0</b> abonnés</span><span><b id="pFollowing">0</b> suivis</span></div><button class="btn btn-blue" style="margin-top:10px;width:100%" onclick="openModal('editProfileModal')">✏️ Modifier profil (nom/photo)</button></div></div>
<div id="profileFeed"></div>
</div>

<div class="modal" id="postModal"><div class="m-card"><div class="m-head"><span>Créer publication</span><button onclick="closeModal('postModal')" class="h-btn">✕</button></div><div class="m-body"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div class="av" id="postAv">JA</div><div><b id="postName">Jason</b><br><small style="background:var(--fb-bg);padding:2px 6px;border-radius:4px;font-size:11px">🌍 Public</small></div></div><textarea id="postText" placeholder="Quoi de neuf, Jason ?"></textarea><div class="preview" id="postPreview"></div><input type="file" id="postFile" accept="image/*" hidden></div><div class="m-foot"><button class="btn btn-gray" onclick="document.getElementById('postFile').click()">🖼️ Photo</button><button class="btn btn-blue" id="publishBtn" onclick="publishPost()">Publier</button></div></div></div>

<div class="modal" id="storyModal"><div class="m-card"><div class="m-head"><span>Créer story + note</span><button onclick="closeModal('storyModal')" class="h-btn">✕</button></div><div class="m-body"><textarea id="storyNote" placeholder="Ajoute une note sur ta story (ex: Je suis à Kinshasa 🔥)..." style="min-height:50px;margin-bottom:10px"></textarea><div class="preview" id="storyPreview"></div><input type="file" id="storyFile" accept="image/*" hidden><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-gray" onclick="document.getElementById('storyFile').click()">🖼️ Photo story</button><button class="btn btn-blue" onclick="publishStory()">Publier story</button></div><small style="display:block;margin-top:10px;opacity:.6;font-size:11px">👁️ Seul toi verras qui a vu ta story et les j'aime. Comme Facebook.</small></div></div></div>

<div class="modal" id="menuModal"><div class="m-card"><div class="m-head"><span>Menu & Paramètres</span><button onclick="closeModal('menuModal')" class="h-btn">✕</button></div><div class="m-body" style="padding:0"><div style="padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border)" onclick="showProfile()"><div class="av" id="menuAv">JA</div><div><b id="menuName">Jason</b><br><small style="color:var(--muted)">Voir ton profil</small></div></div><button class="p-act" style="justify-content:flex-start;padding:14px" onclick="toggleTheme()">🌙 Mode sombre / lumineux</button><button class="p-act" style="justify-content:flex-start;padding:14px" onclick="openModal('editProfileModal')">✏️ Changer nom du compte & photo</button><button class="p-act" style="justify-content:flex-start;padding:14px" onclick="location.href='dashboard.html'">📊 Dashboard Business</button><button class="p-act" style="justify-content:flex-start;padding:14px" onclick="location.href='parametres.html'">⚙️ Paramètres Business (langue, monnaie)</button><button class="p-act" style="justify-content:flex-start;padding:14px;color:var(--red)" onclick="logout()">🚪 Déconnexion</button></div></div></div>

<div class="modal" id="editProfileModal"><div class="m-card"><div class="m-head"><span>Modifier profil</span><button onclick="closeModal('editProfileModal')" class="h-btn">✕</button></div><div class="m-body"><label style="font-size:12px">Nom du compte</label><input id="editName" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);margin:6px 0 12px;background:var(--fb-bg);color:var(--text)"><label style="font-size:12px">Photo de profil</label><input type="file" id="editPhotoFile" accept="image/*" style="margin:6px 0"><div class="preview" id="editPhotoPreview"></div></div><div class="m-foot"><button class="btn btn-gray" onclick="closeModal('editProfileModal')">Annuler</button><button class="btn btn-blue" onclick="saveProfile()">Enregistrer</button></div></div></div>

<div class="modal" id="notifModal"><div class="m-card"><div class="m-head"><span>🔔 Notifications</span><button onclick="closeModal('notifModal')" class="h-btn">✕</button></div><div class="m-body" id="notifList"></div></div></div>

<div id="storyViewer"><div class="sv-top"><div style="display:flex;gap:10px;align-items:center"><div class="av" id="svAv">JA</div><div><b id="svName">Jason</b><br><small id="svTime"></small></div></div><button onclick="closeStory()" style="background:rgba(255,255,255,.2);border:0;color:white;width:36px;height:36px;border-radius:50%">✕</button></div><div class="sv-img" id="svContent"></div><div class="sv-views" id="svViews"></div></div>

<nav><div class="nav-item active" id="navHome" onclick="showHome()">🏠</div><div class="nav-item" onclick="location.href='messenger.html'">💬<span class="badge" id="navMsgBadge" style="display:none">0</span></div><div class="nav-item" onclick="showProfile()">👤</div><div class="nav-item" onclick="openNotif()">🔔<span class="badge" id="navNotifBadge" style="display:none">0</span></div><div class="nav-item" onclick="openModal('menuModal')">☰</div></nav>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,set,push,get,update,remove} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);
const myPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||"";
if(!myPhone) location.replace("login.html");
let myName=localStorage.getItem("jb_display_name")||"Jason Aloma";
let myPhoto=localStorage.getItem("jb_display_photo")||"";
let postsCache=[],storiesCache=[],notifsCache=[];

if(localStorage.getItem("jb_theme")==="light") document.body.classList.remove("dark"); else document.body.classList.add("dark");
window.toggleTheme=()=>{const isDark=document.body.classList.contains("dark");document.body.classList.toggle("dark",!isDark);localStorage.setItem("jb_theme",!isDark?"dark":"light");};
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
window.openModal=id=>$(id).classList.add("show");
window.closeModal=id=>$(id).classList.remove("show");
window.showHome=()=>{$("homePage").style.display="block";$("profilePage").style.display="none";document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));$("navHome").classList.add("active");};
window.showProfile=()=>{$("homePage").style.display="none";$("profilePage").style.display="block";closeModal("menuModal");renderProfile();};
window.logout=()=>{localStorage.clear();location.href="login.html";};
window.openNotif=()=>{openModal("notifModal"); markNotifRead();};

onValue(ref(db,`jasonBusiness/users/${myPhone}`),s=>{
  if(s.exists()){
    const u=s.val();
    myName=u.nom||u.name||myName;
    if(u.photo) myPhoto=u.photo;
    localStorage.setItem("jb_display_name",myName);
    if(myPhoto) localStorage.setItem("jb_display_photo",myPhoto);
    $("pName").textContent=myName; $("postName").textContent=myName; $("menuName").textContent=myName; $("pPhone").textContent=myPhone;
    updateAvatars();
  }
});
function updateAvatars(){
  const html=myPhoto?`<img src="${myPhoto}">`:myName.slice(0,2).toUpperCase();
  ["myAv","postAv","menuAv","pAvBig"].forEach(id=>{if($(id)) $(id).innerHTML=html;});
}
updateAvatars();

// STORIES - SEUL PROPRIO VOIT VUES
onValue(ref(db,"jasonBusiness/stories"),s=>{
  storiesCache=Object.entries(s.val()||{}).map(([k,v])=>({...v,id:k})).sort((a,b)=>b.createdAt-a.createdAt);
  renderStories();
});
function renderStories(){
  const box=$("stories");
  box.innerHTML=`<div class="s-card create" onclick="openModal('storyModal')"><div class="s-img">👤</div><div class="s-plus">+</div><div class="s-name">Créer story</div></div>`;
  storiesCache.slice(0,20).forEach(st=>{
    const isMine=st.from===myPhone;
    const div=document.createElement("div"); div.className="s-card";
    div.innerHTML=`<img class="s-img" src="${st.photo}"><div class="s-top">${st.fromPhoto?`<img src="${st.fromPhoto}">`:esc((st.fromName||st.from).slice(0,2))}</div><div class="s-name">${esc(isMine?"Ta story":st.fromName||st.from)}${st.note?`<br><small>📝 ${esc(st.note.slice(0,18))}</small>`:""}</div>${st.note?`<div class="s-note">${esc(st.note)}</div>`:""}`;
    div.onclick=()=>viewStory(st);
    box.appendChild(div);
  });
}
let storyFileBase64=null;
$("storyFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{storyFileBase64=r.result;$("storyPreview").innerHTML=`<img src="${r.result}">`;};r.readAsDataURL(f);};
window.publishStory=async()=>{
  if(!storyFileBase64) return alert("Ajoute photo story");
  const note=$("storyNote").value.trim();
  const id=push(ref(db,"jasonBusiness/stories")).key;
  await set(ref(db,`jasonBusiness/stories/${id}`),{from:myPhone,fromName:myName,fromPhoto:myPhoto,photo:storyFileBase64,note,createdAt:Date.now(),views:{},likes:{}});
  closeModal("storyModal"); $("storyPreview").innerHTML=""; $("storyNote").value=""; storyFileBase64=null;
};
let currentStory=null;
window.viewStory=async(st)=>{
  currentStory=st; $("storyViewer").classList.add("show");
  $("svAv").innerHTML=st.fromPhoto?`<img src="${st.fromPhoto}">`:esc((st.fromName||"").slice(0,2));
  $("svName").textContent=st.fromName||st.from; $("svTime").textContent=new Date(st.createdAt).toLocaleTimeString();
  $("svContent").innerHTML=`<img src="${st.photo}">${st.note?`<div class="sv-note">${esc(st.note)}</div>`:""}`;
  if(st.from!==myPhone){
    await set(ref(db,`jasonBusiness/stories/${st.id}/views/${myPhone}`),{name:myName,time:Date.now()});
    $("svViews").innerHTML=`<div style="text-align:center"><button onclick="likeStory()" style="padding:8px 16px;border-radius:20px;border:0;background:#0866ff;color:white;font-weight:700">❤️ J'aime</button></div>`;
  }else{
    const views=Object.keys(st.views||{}).length; const likes=Object.keys(st.likes||{}).length;
    const list=Object.values(st.views||{}).map(v=>v.name||"").join(", ")||"Aucune vue";
    $("svViews").innerHTML=`👁️ <b>${views} vues</b> • ❤️ <b>${likes} j'aime</b><br><small style="opacity:.8">${esc(list)}</small><br><small style="opacity:.6">Seul toi vois ça - comme Facebook</small>`;
  }
};
window.closeStory=()=>{$("storyViewer").classList.remove("show");};
window.likeStory=async()=>{if(!currentStory) return; await set(ref(db,`jasonBusiness/stories/${currentStory.id}/likes/${myPhone}`),{name:myName,time:Date.now()}); alert("❤️ Liké! Le proprio verra ton j'aime");};

// POSTS FEED ACCUEIL
onValue(ref(db,"jasonBusiness/posts"),s=>{
  postsCache=Object.entries(s.val()||{}).map(([k,v])=>({...v,id:k})).sort((a,b)=>b.createdAt-a.createdAt);
  renderFeed(); renderProfile();
});
function renderFeed(){
  const feed=$("feed"); feed.innerHTML="";
  postsCache.forEach(p=>{
    const liked=p.likes&&p.likes[myPhone]; const likesCount=Object.keys(p.likes||{}).length; const cmCount=Object.keys(p.comments||{}).length;
    const div=document.createElement("div"); div.className="post";
    div.innerHTML=`<div class="p-head"><div class="p-user"><div class="av">${p.fromPhoto?`<img src="${p.fromPhoto}">`:esc((p.fromName||"").slice(0,2))}</div><div class="p-info"><h4>${esc(p.fromName||p.from)}</h4><small>${new Date(p.createdAt).toLocaleDateString()} • 🌍</small></div></div><div>⋯</div></div>${p.text?`<div class="p-text">${esc(p.text)}</div>`:""}${p.photo?`<img class="p-img" src="${p.photo}">`:""}<div class="p-stats"><span>👍❤️ ${likesCount} j'aime</span><span>${cmCount} commentaires • 0 partages</span></div><div class="p-actions"><button class="p-act ${liked?'active':''}" onclick="likePost('${p.id}')">👍 J'aime</button><button class="p-act" onclick="focusComment('${p.id}')">💬 Commenter</button><button class="p-act" onclick="sharePost('${p.id}')">↗️ Partager</button></div><div class="c-list">${Object.entries(p.comments||{}).map(([k,c])=>`<div class="c-item"><div class="av" style="width:32px;height:32px;font-size:10px">${c.fromPhoto?`<img src="${c.fromPhoto}">`:esc((c.fromName||"").slice(0,2))}</div><div class="c-bubble"><b>${esc(c.fromName||c.from)}</b>${esc(c.text)}</div></div>`).join("")}</div><div class="comments"><div class="av" style="width:32px;height:32px;font-size:10px">${myPhoto?`<img src="${myPhoto}">`:myName.slice(0,2)}</div><input placeholder="Écrire un commentaire..." id="inp-${p.id}" onkeydown="if(event.key==='Enter') commentPost('${p.id}')"></div>`;
    feed.appendChild(div);
  });
  $("pPosts").textContent=postsCache.filter(p=>p.from===myPhone).length;
  $("profileFeed").innerHTML=feed.innerHTML;
}
window.likePost=async(id)=>{const r=ref(db,`jasonBusiness/posts/${id}/likes/${myPhone}`);const snap=await get(r); if(snap.exists()) await remove(r); else await set(r,{name:myName,time:Date.now()});};
window.focusComment=id=>{document.getElementById(`inp-${id}`)?.focus();};
window.sharePost=id=>{navigator.clipboard.writeText(location.href); alert("Lien copié! 📋 Partagé comme Facebook");};
window.commentPost=async(id)=>{
  const inp=document.getElementById(`inp-${id}`); const txt=inp.value.trim(); if(!txt) return;
  const post=postsCache.find(p=>p.id===id);
  await set(push(ref(db,`jasonBusiness/posts/${id}/comments`)),{from:myPhone,fromName:myName,fromPhoto:myPhoto,text:txt,createdAt:Date.now()});
  inp.value="";
  if(post.from!==myPhone){
    await set(push(ref(db,`jasonBusiness/notifications/${post.from}`)),{from:myPhone,fromName:myName,type:"comment",postId:id,text:`a commenté: "${txt.slice(0,25)}"`,createdAt:Date.now(),read:false});
  }
};
let postFileBase64=null;
$("postFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{postFileBase64=r.result;$("postPreview").innerHTML=`<img src="${r.result}">`;};r.readAsDataURL(f);};
window.publishPost=async()=>{
  const text=$("postText").value.trim(); if(!text&&!postFileBase64) return;
  $("publishBtn").disabled=true;
  const id=push(ref(db,"jasonBusiness/posts")).key;
  await set(ref(db,`jasonBusiness/posts/${id}`),{from:myPhone,fromName:myName,fromPhoto:myPhoto,text,photo:postFileBase64||null,createdAt:Date.now(),likes:{},comments:{}});
  closeModal("postModal"); $("postText").value=""; $("postPreview").innerHTML=""; postFileBase64=null; $("publishBtn").disabled=false;
};

// NOTIFICATIONS CLOCHE
onValue(ref(db,`jasonBusiness/notifications/${myPhone}`),s=>{
  notifsCache=Object.entries(s.val()||{}).map(([k,v])=>({...v,id:k})).sort((a,b)=>b.createdAt-a.createdAt);
  const unread=notifsCache.filter(n=>!n.read).length;
  ["notifBadge","navNotifBadge"].forEach(id=>{const el=$(id); if(!el) return; el.style.display=unread?"grid":"none"; el.textContent=unread>9?"9+":unread;});
  renderNotifList();
});
function renderNotifList(){
  const box=$("notifList");
  if(!notifsCache.length) box.innerHTML='<div style="padding:20px;text-align:center;opacity:.6">Aucune notification</div>';
  else box.innerHTML=notifsCache.map(n=>`<div style="padding:12px;border-bottom:1px solid var(--border);display:flex;gap:10px"><div class="av" style="width:36px;height:36px">🔔</div><div><b>${esc(n.fromName||n.from)}</b> ${esc(n.text)}<br><small style="color:var(--muted)">${new Date(n.createdAt).toLocaleString()}</small></div></div>`).join("");
}
function markNotifRead(){ notifsCache.forEach(n=>{if(!n.read) update(ref(db,`jasonBusiness/notifications/${myPhone}/${n.id}`),{read:true});}); }

// MESSENGER BADGE - Même quand t'es à l'accueil tu vois 1,2,3
onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),s=>{
  const chats=s.val()||{}; let total=0; Object.values(chats).forEach(c=>{total+=Number(c.unread||0);});
  ["msgBadge","navMsgBadge"].forEach(id=>{const el=$(id); if(!el) return; el.style.display=total?"grid":"none"; el.textContent=total>9?"9+":total;});
});

// PROFILE
function renderProfile(){
  onValue(ref(db,`jasonBusiness/users`),s=>{
    const users=s.val()||{}; $("pFollowers").textContent=Object.keys(users).length; $("pFollowing").textContent=Object.keys(users).length;
  });
}

// EDIT PROFILE
let editPhotoBase64=null;
$("editPhotoFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{editPhotoBase64=r.result;$("editPhotoPreview").innerHTML=`<img src="${r.result}">`;};r.readAsDataURL(f);};
window.saveProfile=async()=>{
  const name=$("editName").value.trim()||myName;
  if(editPhotoBase64){ localStorage.setItem("jb_display_photo",editPhotoBase64); myPhoto=editPhotoBase64; await update(ref(db,`jasonBusiness/users/${myPhone}`),{photo:editPhotoBase64,nom:name});}
  else await update(ref(db,`jasonBusiness/users/${myPhone}`),{nom:name});
  localStorage.setItem("jb_display_name",name); myName=name; updateAvatars(); closeModal('editProfileModal'); alert("✅ Profil modifié!");
  location.reload();
};
$("editName").value=myName;
</script>
</body>
</html>
