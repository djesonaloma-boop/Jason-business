
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>JASON BUSINESS — Messenger</title>

<style>
:root{
--blue:#0084ff;--cyan:#00d2ff;--bg:#f0f2f5;
--card:#fff;--text:#050505;--muted:#65676b;
--border:rgba(0,0,0,.09);--green:#31a24c;--red:#ff3b30
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Segoe UI,Arial,sans-serif;color:var(--text);
background:var(--bg);display:flex;flex-direction:column;
height:100vh;height:100dvh;overflow:hidden
}
body.dark{
--bg:#18191a;--card:#242526;--text:#e4e6eb;
--muted:#b0b3b8;--border:rgba(255,255,255,.1)
}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{
height:56px;flex-shrink:0;display:flex;align-items:center;
justify-content:space-between;padding:0 14px;
background:var(--card);border-bottom:1px solid var(--border)
}
.brand{font-size:19px;font-weight:900;color:var(--blue)}
.header-actions{display:flex;gap:8px}
.icon-btn{
width:36px;height:36px;border-radius:50%;border:0;
background:var(--bg);color:var(--text);
display:grid;place-items:center;font-size:18px
}
.wrap{display:flex;flex:1;min-height:0;overflow:hidden}
.left{
width:360px;flex-shrink:0;background:var(--card);
border-right:1px solid var(--border);display:flex;
flex-direction:column;min-height:0
}
.left-header{
padding:12px 16px;display:flex;
justify-content:space-between;align-items:center
}
.left-header h2{font-size:24px;font-weight:900}
.search-box{
margin:8px 16px;padding:10px 12px;border-radius:22px;
background:var(--bg);display:flex;gap:8px
}
.search-box input{
flex:1;min-width:0;border:0;background:transparent;
color:var(--text);outline:none;font-size:14px
}
.tabs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto}
.tab{
padding:8px 12px;border-radius:20px;font-size:13px;
font-weight:600;white-space:nowrap;border:0;
background:var(--bg);color:var(--muted)
}
.tab.active{background:rgba(0,132,255,.13);color:var(--blue)}
.stories{
display:flex;gap:9px;padding:12px 14px;
overflow-x:auto;border-bottom:1px solid var(--border)
}
.story{width:56px;flex-shrink:0;text-align:center;cursor:pointer}
.story-av{
width:56px;height:56px;padding:3px;border-radius:50%;
background:linear-gradient(135deg,#00d2ff,#0077ff,#ff00ff)
}
.story-av div{
width:100%;height:100%;border-radius:50%;
background:var(--card);display:grid;place-items:center;
font-weight:900;overflow:hidden;border:3px solid var(--card)
}
.story-av img{width:100%;height:100%;object-fit:cover}
.story span{
display:block;font-size:11px;margin-top:4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.list{flex:1;min-height:0;overflow-y:auto;padding:7px}
.item{
padding:8px;border-radius:10px;display:flex;gap:10px;
align-items:center;cursor:pointer
}
.item:hover,.item.active{background:rgba(0,132,255,.1)}
.av,.top-av{
flex-shrink:0;border-radius:50%;
display:grid;place-items:center;color:white;
font-weight:900;overflow:hidden;
background:linear-gradient(135deg,#00d2ff,#0077ff);
position:relative
}
.av{width:54px;height:54px}
.av img,.top-av img{width:100%;height:100%;object-fit:cover}
.online-dot{
position:absolute;bottom:1px;right:1px;width:13px;height:13px;
border-radius:50%;background:var(--green);
border:2px solid var(--card)
}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:650}
.prev{
font-size:12px;color:var(--muted);margin-top:3px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.unread-badge{
background:var(--blue);color:white;padding:3px 7px;
border-radius:12px;font-size:12px;font-weight:bold
}
.right{
flex:1;min-width:0;display:flex;flex-direction:column;
background:var(--card);overflow:hidden;position:relative
}
.top{
flex-shrink:0;padding:8px 12px;display:flex;
justify-content:space-between;align-items:center;
border-bottom:1px solid var(--border);gap:8px
}
.top-left{display:flex;align-items:center;gap:9px;min-width:0}
.top-av{width:40px;height:40px}
.top-info{min-width:0}
.top-info h3{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-info small{font-size:12px;color:var(--muted)}
.msgs{
flex:1;min-height:0;overflow-y:auto;padding:16px;
display:flex;flex-direction:column;gap:5px;
overflow-wrap:anywhere
}
.date-sep{text-align:center;margin:12px;font-size:12px;color:var(--muted)}
.msg-row{display:flex;max-width:88%;align-self:flex-start}
.msg-row.me{align-self:flex-end}
.msg-bubble{
padding:9px 12px;border-radius:18px;background:#f0f2f5;
color:#171717;font-size:15px;line-height:1.4;
white-space:pre-wrap;overflow-wrap:anywhere;min-width:30px
}
body.dark .msg-bubble{background:#3a3b3c;color:#e4e6eb}
.msg-row.me .msg-bubble{
background:var(--blue);color:white;border-bottom-right-radius:4px
}
.msg-row.other .msg-bubble{border-bottom-left-radius:4px}
.msg-photo{
margin-top:5px;border-radius:12px;overflow:hidden;
max-width:240px;background:#111;cursor:pointer
}
.msg-photo img{display:block;width:100%;max-height:320px;object-fit:contain}
.msg-audio{margin-top:5px;max-width:100%}
.msg-audio audio{display:block;width:min(250px,65vw);max-width:100%}
.msg-meta{font-size:10px;color:var(--muted);margin:0 4px 5px}
.msg-meta.me{text-align:right}
.input-area{
flex-shrink:0;padding:8px 10px;background:var(--card);
border-top:1px solid var(--border)
}
.input-row{display:flex;gap:5px;align-items:flex-end}
.tbtn{
width:36px;height:36px;flex-shrink:0;border:0;
background:transparent;color:var(--blue);font-size:21px;
display:grid;place-items:center;border-radius:50%
}
.input-row textarea{
flex:1;min-width:0;min-height:38px;max-height:110px;
padding:10px 13px;border-radius:20px;border:0;
background:var(--bg);color:var(--text);outline:none;
resize:none;font-size:15px
}
.send-btn{
width:38px;height:38px;flex-shrink:0;border:0;
border-radius:50%;background:var(--blue);color:white;font-size:20px
}
button:disabled{opacity:.45;cursor:not-allowed}
#status{text-align:center;font-size:11px;color:var(--blue);margin-top:5px}
.rec-bar{
display:none;align-items:center;justify-content:space-between;
gap:8px;padding:10px;background:#ffebe9;color:#222;
border-radius:18px;margin-bottom:8px
}
body.dark .rec-bar{background:#4a1c1c;color:white}
.rec-bar.show{display:flex}
#photoPreview{
display:none;padding:10px;margin-bottom:8px;
border:1px solid var(--border);border-radius:14px
}
#photoPreview.show{display:block}
.preview-grid{
display:grid;grid-template-columns:repeat(4,1fr);
gap:5px;max-height:160px;overflow-y:auto
}
.preview-grid img{width:100%;height:70px;object-fit:cover;border-radius:7px}
.preview-actions{display:flex;gap:8px;margin-top:8px}
.preview-actions button,.action-btn{
flex:1;padding:10px;border:0;border-radius:10px;font-weight:bold
}
.btnSend{background:var(--blue);color:white}
.btnCancel{background:var(--bg);color:var(--text)}
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.65);
z-index:5000;display:none;place-items:center;padding:15px
}
.modal.show{display:grid}
.m-card{
width:100%;max-width:420px;background:var(--card);
color:var(--text);border-radius:14px;overflow:hidden
}
.m-head{
padding:14px;display:flex;justify-content:space-between;
align-items:center;border-bottom:1px solid var(--border)
}
.m-body{padding:15px}
.m-body textarea{
width:100%;min-height:70px;padding:10px;border-radius:10px;
border:1px solid var(--border);background:var(--bg);color:var(--text)
}
.m-foot{padding:12px;display:flex;gap:8px}
#storyViewer,#imgViewer{
position:fixed;inset:0;background:#000;z-index:6000;
display:none;flex-direction:column
}
#storyViewer.show,#imgViewer.show{display:flex}
.sv-top,.viewer-top{
padding:12px;display:flex;justify-content:space-between;
align-items:center;color:white
}
.sv-img,.viewer-content{
flex:1;min-height:0;display:grid;place-items:center;overflow:hidden
}
.sv-img img,.viewer-content img{
max-width:100%;max-height:100%;object-fit:contain
}
.sv-bottom{padding:16px;color:white;display:flex;justify-content:space-between}
.heart-btn{
border:1px solid #777;border-radius:20px;padding:8px 15px;
color:white;background:#333
}
#scrollDown{
position:absolute;right:14px;bottom:100px;z-index:10;
display:none;width:40px;height:40px;border-radius:50%;
border:1px solid var(--border);background:var(--card);
color:var(--blue);font-size:22px
}
#scrollDown.show{display:block}
@media(max-width:800px){
.left{position:absolute;inset:56px 0 0;width:100%;z-index:20}
.left.hide{display:none}
.right{width:100%}
}
</style>
</head>

<body>
<header>
  <div class="brand">
    JASON BUSINESS <span id="myPhoneShow" style="font-size:11px;opacity:.65;font-weight:400"></span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="location.href='dashboard.html'">📊</button>
    <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" onclick="location.reload()">🔄</button>
  </div>
</header>

<div class="wrap">
<aside class="left" id="leftPanel">
  <div class="left-header">
    <h2>Messenger</h2>
    <button class="icon-btn" onclick="openModal('storyModal')">📷</button>
  </div>

  <div class="search-box">
    🔍 <input id="search" placeholder="Rechercher un contact ou message">
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="chats">Boîte</button>
    <button class="tab" data-tab="users">👥 Utilisateurs</button>
    <button class="tab" data-tab="requests">🔔 Demandes <span id="reqCount"></span></button>
  </div>

  <div class="stories" id="stories">
    <div class="story" onclick="openModal('storyModal')">
      <div class="story-av"><div>➕</div></div>
      <span>Créer story</span>
    </div>
  </div>

  <div style="padding:8px 12px;display:flex;gap:6px;border-bottom:1px solid var(--border)">
    <input id="manualPhone" placeholder="+243..." style="flex:1;min-width:0;padding:9px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
    <button class="icon-btn" id="btnAddManual" style="background:var(--blue);color:white">+</button>
  </div>

  <div class="list" id="list"></div>

  <div style="padding:9px;display:flex;gap:8px;border-top:1px solid var(--border)">
    <button class="tab" style="flex:1" onclick="location.href='dashboard.html'">🏠 Dash</button>
    <button class="tab" style="flex:1" onclick="location.href='parametres.html'">⚙️ Param</button>
  </div>
</aside>

<section class="right">
  <div class="top">
    <div class="top-left">
      <div class="top-av" id="chatAvatar">JB</div>
      <div class="top-info">
        <h3 id="chatName">Sélectionne un chat</h3>
        <small id="chatPhone">Messages • Photos • Vocaux</small>
      </div>
    </div>
    <div style="display:flex;gap:5px">
      <button class="icon-btn" onclick="alert('Les appels audio nécessitent une signalisation WebRTC.')">📞</button>
      <button class="icon-btn" onclick="alert('Les appels vidéo nécessitent une signalisation WebRTC.')">📹</button>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div style="margin:auto;text-align:center;opacity:.6;padding:30px">
      <div style="font-size:50px">💬</div>
      <b>Vos messages</b>
      <div style="font-size:12px;margin-top:5px">Choisis un contact pour commencer.</div>
    </div>
  </div>

  <button id="scrollDown" onclick="scrollToBottom()">↓</button>

  <div class="input-area">
    <div id="photoPreview">
      <b id="previewCount">0 photo</b>
      <div class="preview-grid" id="previewGrid"></div>
      <textarea id="photoCaption" placeholder="Ajouter une légende..." style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)"></textarea>
      <div class="preview-actions">
        <button class="btnCancel" id="cancelPhoto">Annuler</button>
        <button class="btnSend" id="confirmPhoto">Envoyer</button>
      </div>
      <div id="uploadProgress" style="display:none;font-size:12px;text-align:center;margin-top:8px"></div>
    </div>

    <div class="rec-bar" id="recBar">
      <div>
        🔴 <b id="recTime">00:00</b>
        <small>Enregistrement...</small>
      </div>
      <div style="display:flex;gap:5px">
        <button id="recCancel" class="btnCancel">Annuler</button>
        <button id="recSend" class="btnSend" style="border-radius:20px;padding:8px 12px">Envoyer</button>
      </div>
    </div>

    <div class="input-row">
      <label class="tbtn" title="Choisir des photos">
        🖼️
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
      </label>
      <textarea id="msgInput" placeholder="Aa" rows="1" disabled></textarea>
      <button class="tbtn" id="recordBtn" disabled title="Enregistrer un vocal">🎙️</button>
      <button class="send-btn" id="sendBtn" disabled title="Envoyer">➤</button>
    </div>
    <div id="status">Connexion à Firebase...</div>
  </div>
</section>
</div>

<div class="modal" id="storyModal">
  <div class="m-card">
    <div class="m-head">
      <b>📸 Créer une story (24h)</b>
      <button class="icon-btn" onclick="closeModal('storyModal')">✕</button>
    </div>
    <div class="m-body">
      <textarea id="storyNote" placeholder="Écris quelque chose..."></textarea>
      <div id="storyPreview" style="margin-top:10px"></div>
      <input type="file" id="storyFile" accept="image/*" hidden>
      <div class="m-foot">
        <button class="action-btn btnCancel" onclick="document.getElementById('storyFile').click()">🖼️ Photo</button>
        <button class="action-btn btnSend" onclick="publishStory()">Publier</button>
      </div>
    </div>
  </div>
</div>

<div id="storyViewer">
  <div class="sv-top">
    <b id="svName">Story</b>
    <button class="icon-btn" onclick="closeStory()">✕</button>
  </div>
  <div class="sv-img" id="svContent"></div>
  <div class="sv-bottom">
    <span id="svViewsInfo">Story</span>
    <button class="heart-btn" id="heartBtn" onclick="heartStory()">❤️ <span id="heartCount">0</span></button>
  </div>
</div>

<div id="imgViewer">
  <div class="viewer-top">
    <b>Photo</b>
    <button class="icon-btn" onclick="closeViewer()">✕</button>
  </div>
  <div class="viewer-content"><img id="viewerImg" src="" alt="Photo reçue"></div>
</div>

<script type="module">
import {initializeApp,getApps,getApp}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
 getDatabase,ref,onValue,push,set,get,remove,update,onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

const rawPhone =
 localStorage.getItem("jasonBusinessUserPhone") ||
 localStorage.getItem("userPhone") ||
 localStorage.getItem("phone") ||
 localStorage.getItem("telephone") || "";

if(!rawPhone){
 location.replace("login.html");
 throw new Error("Connexion requise");
}

$("myPhoneShow").textContent = "• " + rawPhone;

function normalizePhone(phone){
 let s = String(phone || "").replace(/\D/g,"");
 if(s.startsWith("243") && s.length >= 12) s = "0" + s.slice(3);
 if(s.length === 9) s = "0" + s;
 return s;
}

const myPhone = normalizePhone(rawPhone);

const myPhoneVariants = [
 rawPhone,myPhone,"243"+myPhone.slice(1),
 "+243"+myPhone.slice(1),myPhone.slice(1)
].filter(Boolean);

let myName = localStorage.getItem("jb_display_name") || "Jason";
let myPhoto = localStorage.getItem("jb_display_photo") || "";

let tab = "chats";
let activeChat = null;
let activeChatRaw = null;
let allUsers = {};
let myRequests = {};
let myChats = {};
let presenceCache = {};
let manualUsers = [];
let storiesCache = [];
let currentStory = null;
let storyFileBase64 = null;
let pendingPhotos = [];
let messageUnsubs = [];
let chatToken = 0;
let messageCache = {};
let rec = null;
let recStream = null;
let chunks = [];
let recTimer = null;
let recSec = 0;
let recCancelled = false;
let recStarting = false;

try{
 manualUsers = JSON.parse(localStorage.getItem("jb_manual_users") || "[]")
  .map(normalizePhone);
}catch(e){manualUsers=[];}

if(localStorage.getItem("jb_theme") !== "light"){
 document.body.classList.add("dark");
}

window.toggleTheme = () => {
 document.body.classList.toggle("dark");
 localStorage.setItem(
  "jb_theme",
  document.body.classList.contains("dark") ? "dark" : "light"
 );
};

window.openModal = id => $(id).classList.add("show");
window.closeModal = id => $(id).classList.remove("show");
window.closeStory = () => $("storyViewer").classList.remove("show");
window.closeViewer = () => $("imgViewer").classList.remove("show");

function setStatus(message){
 $("status").textContent = message;
 console.log("[JASON CHAT]",message);
}

function esc(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function getChatId(a,b){
 return [normalizePhone(a),normalizePhone(b)].sort().join("_");
}

function getAllChatIds(a,b){
 const na=normalizePhone(a), nb=normalizePhone(b);
 const ra=String(a).replace(/\D/g,"");
 const rb=String(b).replace(/\D/g,"");
 return [...new Set([
  [na,nb].sort().join("_"),
  [ra,rb].sort().join("_"),
  `${na}_${nb}`,`${nb}_${na}`,
  `${ra}_${rb}`,`${rb}_${ra}`,
  `${a}_${b}`,`${b}_${a}`
 ])];
}

function isOnline(phone){
 const p=presenceCache[normalizePhone(phone)];
 return !!(p && p.online && Date.now()-(p.lastSeen||0)<90000);
}

function getUserPhoto(phone){
 const n=normalizePhone(phone);
 return allUsers[n]?.photo || allUsers[phone]?.photo || "";
}

function getCombinedUsers(){
 const combined={};
 Object.entries(allUsers).forEach(([key,user])=>{
  const n=normalizePhone(key);
  if(n) combined[n]=user;
 });
 manualUsers.forEach(phone=>{
  if(phone && !combined[phone]) combined[phone]={telephone:phone,nom:phone};
 });
 return combined;
}

// Présence
const presenceRef = ref(db,`jasonBusiness/presence/${myPhone}`);

set(presenceRef,{
 online:true,lastSeen:Date.now(),raw:rawPhone
}).catch(e=>setStatus("Présence : "+e.message));

onDisconnect(presenceRef).set({
 online:false,lastSeen:Date.now()
}).catch(()=>{});

setInterval(()=>{
 set(presenceRef,{
  online:true,lastSeen:Date.now(),activeChat:activeChat||""
 }).catch(()=>{});
},20000);

onValue(ref(db,".info/connected"),snap=>{
 if(snap.val()===true){
  onDisconnect(presenceRef).set({
   online:false,lastSeen:Date.now()
  }).catch(()=>{});
 }
});

onValue(ref(db,"jasonBusiness/presence"),snap=>{
 const values=snap.val()||{};
 const normalized={};
 Object.entries(values).forEach(([key,value])=>{
  normalized[normalizePhone(key)]=value;
  normalized[key]=value;
 });
 presenceCache=normalized;
 render();
});

onValue(ref(db,"jasonBusiness/users"),snap=>{
 const values=snap.val()||{};
 const normalized={};
 Object.entries(values).forEach(([key,value])=>{
  const n=normalizePhone(key);
  normalized[n]={...value,originalPhone:key};
  normalized[key]={...value,originalPhone:key};
 });
 allUsers=normalized;

 if(allUsers[myPhone]){
  myName=allUsers[myPhone].nom||myName;
  if(allUsers[myPhone].photo) myPhoto=allUsers[myPhone].photo;
 }
 render();
});

// Lire les conversations enregistrées sous plusieurs formats de numéro
function listenChats(){
 myPhoneVariants.forEach(variant=>{
  onValue(ref(db,`jasonBusiness/user_chats/${variant}`),snap=>{
   const data=snap.val()||{};
   Object.entries(data).forEach(([chatId,chatData])=>{
    const other=chatData.with||chatData.withRaw||
     chatId.split("_").find(p=>normalizePhone(p)!==myPhone);
    if(!other) return;
    const normId=getChatId(myPhone,other);
    if(!myChats[normId] ||
       (chatData.lastTime||0)>(myChats[normId].lastTime||0)){
     myChats[normId]={...chatData,with:normalizePhone(other)};
    }
   });
   render();
  },error=>{
   console.error("user_chats",error);
  });
 });
}
listenChats();

// Demandes de contact
onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{
 myRequests=snap.val()||{};
 const count=Object.values(myRequests).filter(
  r=>r.type==="incoming"&&r.status==="pending"
 ).length;

// Nettoyer les écouteurs Firebase de l'ancien chat
function clearMessageListeners(){
 messageUnsubs.forEach(stop=>{
  try{stop();}catch(e){}
 });
 messageUnsubs=[];
 messageCache={};
}

function openChat(other){
 const phone=normalizePhone(other);
 activeChat=phone;
 activeChatRaw=other;
 const token=++chatToken;

 clearMessageListeners();

 $("msgInput").disabled=false;
 $("sendBtn").disabled=false;
 $("recordBtn").disabled=false;

 const photo=getUserPhoto(phone);
 $("chatName").textContent=allUsers[phone]?.nom||other;
 $("chatPhone").textContent=isOnline(phone)?"En ligne":"Hors ligne • "+other;
 $("chatAvatar").innerHTML=photo?`<img src="${esc(photo)}">`:esc(phone.slice(-2));

 if(innerWidth<=800) $("leftPanel").classList.add("hide");

 $("msgs").innerHTML='<div style="margin:auto;padding:20px;text-align:center">Recherche des messages...</div>';

 const ids=new Set(getAllChatIds(myPhone,phone));
 const myVariants=[...myPhoneVariants];
 const otherVariants=[other,phone,"243"+phone.slice(1),"+243"+phone.slice(1),phone.slice(1)];

 myVariants.forEach(a=>{
  otherVariants.forEach(b=>{
   if(a&&b){
    ids.add(`${a}_${b}`);
    ids.add(`${b}_${a}`);
   }
  });
 });

 let loaded=0;

 function refresh(){
  if(token!==chatToken) return;
  const map=new Map();

  Object.values(messageCache).forEach(messages=>{
   Object.entries(messages||{}).forEach(([key,message])=>{
    const signature=message.messageId
     ?String(message.messageId)
     :`${normalizePhone(message.from)}|${message.createdAt||0}|${message.text||""}|${message.photo||""}|${message.audio||""}`;

    if(!map.has(signature)) map.set(signature,{...message,_key:key});
   });
  });

  allMessages=[...map.values()].sort((a,b)=>
   (a.createdAt||0)-(b.createdAt||0)
  );

  renderMessages();

  if(loaded===ids.size){
   setStatus(allMessages.length
    ?`✅ ${allMessages.length} messages chargés`
    :"Aucun ancien message trouvé. Tu peux envoyer un message.");
  }
 }

 ids.forEach(chatId=>{
  const stop=onValue(ref(db,`jasonBusiness/messages/${chatId}`),snap=>{
   if(token!==chatToken) return;
   messageCache[chatId]=snap.val()||{};
   loaded++;
   refresh();
  },error=>{
   if(token===chatToken){
    loaded++;
    refresh();
    console.error("Lecture salon",chatId,error);
   }
  });
  messageUnsubs.push(stop);
 });

 const mainId=getChatId(myPhone,phone);
 update(ref(db,`jasonBusiness/user_chats/${myPhone}/${mainId}`),{
  unread:0
 }).catch(()=>{});

 render();
 $("msgInput").focus();
}

window.forceMigrate=async()=>{
 if(!activeChat) return;
 const newId=getChatId(myPhone,activeChat);
 let count=0;

 if(!confirm("Copier les anciens messages vers le salon actuel ?")) return;

 try{
  for(const [chatId,messages] of Object.entries(messageCache)){
   if(chatId===newId) continue;

   for(const message of Object.values(messages||{})){
    const from=normalizePhone(message.from);
    const to=normalizePhone(message.to);
    if(![myPhone,activeChat].includes(from)) continue;
    if(to && ![myPhone,activeChat].includes(to)) continue;

    const signature=`${from}|${message.createdAt||0}|${message.text||""}|${message.photo||""}|${message.audio||""}`;
    const already=allMessages.some(m=>
     `${normalizePhone(m.from)}|${m.createdAt||0}|${m.text||""}|${m.photo||""}|${m.audio||""}`===signature
    );
    if(already) continue;

    await set(push(ref(db,`jasonBusiness/messages/${newId}`)),message);
    count++;
   }
  }
  alert(`${count} ancien(s) message(s) copié(s).`);
 }catch(e){
  alert("Migration impossible : "+e.message);
 }
};

// Envoi commun des messages texte, photo et audio
async function publishMessage(other,fields,lastMsg){
 const recipient=normalizePhone(other);
 const id=getChatId(myPhone,recipient);
 const now=Date.now();

 const data={
  ...fields,
  from:myPhone,
  fromRaw:rawPhone,
  to:recipient,
  toRaw:other,
  createdAt:now,
  status:"sent"
 };

 try{
  const messageRef=push(ref(db,`jasonBusiness/messages/${id}`));
  data.messageId=messageRef.key;
  await set(messageRef,data);

  const a=ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`);
  const b=ref(db,`jasonBusiness/user_chats/${recipient}/${id}`);

  const [sa,sb]=await Promise.all([get(a),get(b)]);
  const da=sa.val()||{};
  const dbb=sb.val()||{};

  await Promise.all([
   set(a,{
    ...da,with:recipient,status:"accepted",
    lastMsg,lastTime:now,unread:0
   }),
   set(b,{
    ...dbb,with:myPhone,status:"accepted",
    lastMsg,lastTime:now,unread:(Number(dbb.unread)||0)+1
   })
  ]);

  setStatus("✅ Message envoyé");
 }catch(error){
  console.error("Envoi Firebase",error);
  setStatus("❌ Échec de l'envoi : "+error.message);
  throw error;
 }
}

// Enregistrement vocal compatible avec les formats pris en charge
function cleanupRecorder(){
 clearInterval(recTimer);
 recTimer=null;

 if(recStream){
  recStream.getTracks().forEach(track=>track.stop());
  recStream=null;
 }

 $("recBar").classList.remove("show");
 $("recordBtn").textContent="🎙️";
 rec=null;
 recStarting=false;
}

$("recordBtn").onclick=async()=>{
 if(recStarting) return;

 if(rec && rec.state==="recording"){
  rec.stop();
  return;
 }

 if(!activeChat){
  alert("Ouvre d'abord une conversation.");
  return;
 }

 if(!navigator.mediaDevices?.getUserMedia ||
    typeof MediaRecorder==="undefined"){
  alert("L'enregistrement vocal nécessite un navigateur compatible et une page HTTPS.");
  return;
 }

 recStarting=true;
 recCancelled=false;

 try{
  recStream=await navigator.mediaDevices.getUserMedia({audio:true});

  const types=[
   "audio/webm;codecs=opus",
   "audio/webm",
   "audio/mp4"
  ];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t));

  rec=mime
   ?new MediaRecorder(recStream,{mimeType:mime})
   :new MediaRecorder(recStream);

  chunks=[];
  recSec=0;

  const recorder=rec;
  const recipient=activeChat;

  recorder.ondataavailable=event=>{
   if(event.data&&event.data.size>0) chunks.push(event.data);
  };

  recorder.onerror=event=>{
   console.error("MediaRecorder",event.error);
   setStatus("❌ Erreur d'enregistrement.");
  };

  recorder.onstop=async()=>{
   const cancelled=recCancelled;
   const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
   chunks=[];

   if(cancelled){
    cleanupRecorder();
    setStatus("Enregistrement annulé.");
    return;
   }

   if(blob.size<800){
    cleanupRecorder();
    setStatus("❌ Vocal trop court. Réessaie.");
    return;
   }

   if(blob.size>1024*1024){
    cleanupRecorder();
    alert("Le vocal dépasse 1 Mo. Enregistre un message plus court.");
    return;
   }

   try{
    setStatus("⏳ Envoi du vocal...");

    const audio=await new Promise((resolve,reject)=>{
     const reader=new FileReader();
     reader.onload=()=>resolve(reader.result);
     reader.onerror=()=>reject(new Error("Lecture du vocal impossible"));
     reader.readAsDataURL(blob);
    });

    await publishMessage(
     recipient,
     {audio,audioType:blob.type,type:"audio"},
     "🎙️ Message vocal"
    );

    setStatus("✅ Vocal envoyé !");
   }catch(error){
    console.error(error);
    alert("Échec de l'envoi du vocal : "+error.message);
   }finally{
    cleanupRecorder();
   }
  };

  recorder.start(250);
  $("recBar").classList.add("show");
  $("recordBtn").textContent="⏹️";
  $("recTime").textContent="00:00";
  setStatus("🎙️ Enregistrement en cours...");

  recTimer=setInterval(()=>{
   recSec++;
   $("recTime").textContent=
    String(Math.floor(recSec/60)).padStart(2,"0")+":"+
    String(recSec%60).padStart(2,"0");

   if(recSec>=30 && rec && rec.state==="recording"){
    rec.stop();
   }
  },1000);

 }catch(error){
  console.error(error);
  cleanupRecorder();
  alert("Impossible d'accéder au microphone. Autorise le micro dans ton navigateur et utilise HTTPS.\n"+error.message);
 }
};

$("recSend").onclick=()=>{
 if(rec && rec.state==="recording") rec.stop();
};

$("recCancel").onclick=()=>{
 if(rec && rec.state==="recording"){
  recCancelled=true;
  chunks=[];
  rec.stop();
 }else{
  cleanupRecorder();
 }
};

// Retour à la liste sur mobile
window.addEventListener("popstate",()=>{
 $("leftPanel").classList.remove("hide");
});

setStatus("Connecté au service Messenger. Chargement des contacts...");
</script>
</body>
</html>
