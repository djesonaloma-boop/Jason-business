<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>JASON BUSINESS — Messenger Pro</title>
<style>
:root{--blue:#00d2ff;--fb-blue:#0084ff;--fb-bg:#f0f2f5;--fb-card:#ffffff;--border:rgba(0,0,0,.08);--text:#050505;--muted:#65676b;--green:#31a24c;--red:#ff3b30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial;color:var(--text);background:var(--fb-bg);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.dark{--fb-bg:#18191a;--fb-card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:rgba(255,255,255,.1);background:#18191a}
header{height:56px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:var(--fb-card);border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.brand{font-weight:900;color:var(--fb-blue);font-size:20px;letter-spacing:.3px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--fb-bg);border:0;display:grid;place-items:center;font-size:18px;cursor:pointer;color:var(--text);transition:.2s}
.icon-btn:active{transform:scale(.92)}
body.dark .icon-btn{background:#3a3b3c}
.wrap{display:flex;flex:1;min-height:0;overflow:hidden}
.left{width:360px;flex-shrink:0;background:var(--fb-card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.left-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.left-header h2{font-size:24px;font-weight:900}
.search-box{margin:8px 16px;padding:10px 12px;border-radius:20px;background:var(--fb-bg);display:flex;align-items:center;gap:8px}
body.dark .search-box{background:#3a3b3c}
.search-box input{flex:1;border:0;background:transparent;color:var(--text);outline:none;font-size:14px}
.tabs{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--fb-bg);color:var(--muted);border:0;transition:.2s}
body.dark .tab{background:#3a3b3c}
.tab.active{background:rgba(0,132,255,.12);color:var(--fb-blue)}
.stories{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.story{width:56px;flex-shrink:0;text-align:center;cursor:pointer}
.story-av{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#00d2ff,#0077ff,#ff00ff);display:grid;place-items:center}
.story-av div{width:100%;height:100%;border-radius:50%;background:var(--fb-card);display:grid;place-items:center;font-weight:900;overflow:hidden;border:3px solid var(--fb-card)}
.story-av img{width:100%;height:100%;object-fit:cover}
.story span{font-size:11px;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px}
.item{padding:8px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:.15s;position:relative}
.item:hover{background:var(--fb-bg)}
body.dark .item:hover{background:#3a3b3c}
.item.active{background:rgba(0,132,255,.10)}
.av{width:56px;height:56px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;color:white;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.online-dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--fb-card)}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;align-items:center;gap:4px}
.right-info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.time{font-size:12px;color:var(--muted)}
.unread-badge{background:var(--fb-blue);color:white;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--fb-card);overflow:hidden;position:relative}
.top{flex-shrink:0;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--fb-card)}
.top-left{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.top-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;color:white;overflow:hidden;position:relative}
.top-av img{width:100%;height:100%;object-fit:cover}
.top-info h3{font-size:15px;font-weight:600;margin:0}
.top-info small{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px}
.call-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:0;display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--fb-blue)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:6px;background:var(--fb-card);overscroll-behavior:contain}
.date-sep{text-align:center;margin:16px 0 8px;font-size:12px;color:var(--muted);font-weight:500}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:85%;position:relative}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:#e4e6eb;font-size:10px;font-weight:700;overflow:hidden}
.msg-bubble{max-width:100%;padding:8px 12px;border-radius:18px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;position:relative;cursor:pointer}
.msg-row.me .msg-bubble{background:var(--fb-blue);color:white;border-bottom-right-radius:4px}
.msg-row.other .msg-bubble{background:#f0f2f5;color:var(--text);border-bottom-left-radius:4px}
body.dark .msg-row.other .msg-bubble{background:#3a3b3c;color:#e4e6eb}
.msg-photo{margin-top:6px;border-radius:12px;overflow:hidden;width:200px;height:200px;background:#000;cursor:pointer;position:relative;border:1px solid var(--border)}
.msg-photo img{width:100%;height:100%;object-fit:cover;display:block}
.msg-audio{margin-top:6px}
.msg-audio audio{width:220px;height:42px}
.input-area{flex-shrink:0;padding:8px 12px;background:var(--fb-card);border-top:1px solid var(--border)}
.rec-bar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#ffebe9;border-radius:20px;margin-bottom:8px}
body.dark .rec-bar{background:#4a1c1c}
.rec-bar.show{display:flex}
.preview{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px}
.previewitem{position:relative;flex-shrink:0}
.previewitem img{height:65px;width:65px;object-fit:cover;border-radius:10px}
.previewitem button{position:absolute;top:-5px;right:-5px;border:0;border-radius:50%;background:var(--red);color:white;width:22px;height:22px}
.input-row{display:flex;gap:8px;align-items:flex-end}
.tbtn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--fb-blue)}
.tbtn:active{background:rgba(0,132,255,.1)}
.input-row textarea{flex:1;min-width:0;min-height:36px;max-height:110px;padding:10px 14px;border-radius:20px;border:0;background:var(--fb-bg);color:var(--text);outline:none;resize:none;font-size:15px}
body.dark .input-row textarea{background:#3a3b3c}
.send-btn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:0;background:var(--fb-blue);color:white;font-size:18px;cursor:pointer;display:grid;place-items:center}
.send-btn:disabled{opacity:.4}
.notice{font-size:11px;color:var(--red);margin-top:6px;display:none}
.notice.show{display:block}
.scroll-down{position:absolute;bottom:80px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--fb-card);color:var(--fb-blue);border:1px solid var(--border);display:none;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:10;font-weight:900}
.scroll-down.show{display:grid}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.m-card{width:100%;max-width:420px;background:var(--fb-card);border-radius:12px;overflow:hidden}
.m-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-weight:700}
.m-body{padding:16px}
.m-body textarea{width:100%;min-height:60px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--fb-bg);color:var(--text);outline:none;resize:none}
.m-foot{padding:12px;display:flex;gap:8px;border-top:1px solid var(--border)}
.btn{flex:1;padding:10px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btnSend{background:var(--fb-blue);color:white}
.btnCancel{background:var(--fb-bg);color:var(--text)}
.previewBox{margin-top:10px;border-radius:12px;overflow:hidden;max-height:300px;background:var(--fb-bg)}
.previewBox img{width:100%;object-fit:cover}
#storyViewer{position:fixed;inset:0;background:#000;z-index:6000;display:none;flex-direction:column}
#storyViewer.show{display:flex}
.sv-top{padding:12px;display:flex;justify-content:space-between;align-items:center;color:white;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.sv-img{flex:1;display:grid;place-items:center;position:relative}
.sv-img img{max-width:100%;max-height:100%;object-fit:contain}
.sv-note{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:white;padding:10px 16px;border-radius:20px;font-weight:800;text-align:center}
.sv-bottom{padding:16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));color:white}
.heart-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:white;font-weight:700;cursor:pointer}
.heart-btn.liked{background:#ff3b30;border-color:#ff3b30}
#imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;display:none;flex-direction:column}
#imgViewer.show{display:flex}
.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#242526}
.viewer-content{flex:1;display:grid;place-items:center;overflow:hidden}
.viewer-content img{max-width:100%;max-height:100%;object-fit:contain}
@media(max-width:800px){.left{position:absolute;inset:56px 0 0;width:100%;z-index:20}.left.hide{display:none}.right{width:100%}.msg-row{max-width:90%}}
</style>
</head>
<body>
<header>
<div class="brand">jason business • <span id="myPhoneShow" style="font-size:12px;opacity:.6;font-weight:400"></span></div>
<div class="header-actions">

<div class="search-box">🔍<input id="searchInput" placeholder="Rechercher sur Messenger"></div>

<div style="padding:10px;display:flex;gap:8px;border-top:1px solid var(--border)"><button class="tab" style="flex:1" onclick="location.href='dashboard.html'">🏠 Dashboard</button><button class="tab" style="flex:1" onclick="location.href='parametres.html'">⚙️ Paramètres</button></div>
</aside>

<section class="right">
<div class="top" id="topBar">
<div class="top-left" id="topLeft"><div class="top-av" id="chatAvatar">JB</div><div class="top-info"><h3 id="chatTitle">Sélectionne un chat</h3><small id="chatPhone">Story 24h • Coeur ❤️ • Messages visibles</small></div></div>
<div class="top-actions"><button class="call-btn">📞</button><button class="call-btn">📹</button><button class="call-btn">ℹ️</button></div>
</div>

<div class="msgs" id="messages">
<div style="margin:auto;text-align:center;opacity:.5;padding:40px"><div style="font-size:50px">💬</div><div style="margin-top:10px;font-weight:700">Vos messages</div><div style="font-size:12px;margin-top:4px">Anciens + Nouveaux • Photos + Vocaux</div></div>
</div>

<div class="modal" id="storyModal"><div class="m-card"><div class="m-head"><span>📸 Créer story 24h</span><button onclick="closeModal('storyModal')" style="border:0;background:var(--fb-bg);width:32px;height:32px;border-radius:50%">✕</button></div><div class="m-body"><textarea id="storyNote" placeholder="Note optionnelle..."></textarea><div class="previewBox" id="storyPreview" style="margin-top:12px"></div><input type="file" id="storyFile" accept="image/*" hidden><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btnCancel" onclick="document.getElementById('storyFile').click()">🖼️ Photo</button><button class="btn btnSend" onclick="publishStory()">Publier</button></div></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, push, update, onValue, off, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};
const $=id=>document.getElementById(id);
const appEl=document.querySelector(".wrap");
const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);

let myPhone="",myRawPhone="",myName="Moi";
let currentTab="chats",activeChat=null,activeChatId=null;
let users={},chatRecords={},requestRecords={};
let messageUnsubs=[],messageSets={};
let pendingPhotos=[],recorder=null,recordChunks=[],recordStream=null;
let recordingCancelled=false,recordingStartedAt=0,recordTimer=null;
let sending=false;
let storiesCache=[];

function normalizePhone(value){
 let p=String(value||"").trim().replace(/[^\d+]/g,"");
 if(p.startsWith("+"))p=p.slice(1);
 if(p.startsWith("243"))p="0"+p.slice(3);
 if(p.length===9&&!p.startsWith("0"))p="0"+p;
 return p;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getChatId(a,b){return[normalizePhone(a),normalizePhone(b)].sort().join("_");}
function getAllChatIds(other){
 const a=normalizePhone(myPhone),b=normalizePhone(other);
 const ids=new Set([getChatId(a,b)]);
 const rawVariants=[myRawPhone,myPhone,a,other,b,String(other)].filter(Boolean);
 for(const x of rawVariants){for(const y of rawVariants){if(normalizePhone(x)===a&&normalizePhone(y)===b){ids.add([String(x),String(y)].sort().join("_"));}}}
 // Anciens formats possibles
 ids.add(`${myPhone}_${normalizePhone(other)}`);
 ids.add(`${normalizePhone(other)}_${myPhone}`);
 ids.add(`${myRawPhone}_${other}`);
 ids.add(`${other}_${myRawPhone}`);
 return [...ids];
}
function setNotice(msg,ok=false){const n=$("notice");n.textContent=msg;n.style.color=ok?"#20c879":"#ff5263";n.classList.add("show");setTimeout(()=>n.classList.remove("show"),4000);}
function timeText(v){let d;if(typeof v==="number")d=new Date(v);else d=new Date(v||0);if(!d.getTime()||d.getTime()<1000)return"";return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function safeDate(v){return Number(v||0)||0;}
function initials(n){return String(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();}
function getDisplayName(phone){const n=normalizePhone(phone);const u=users[n]||users[phone]||{};return u.nom||u.name||u.username||n||"Utilisateur";}
window.openModal=id=>$(id).classList.add("show");
window.closeModal=id=>$(id).classList.remove("show");
window.openStoryModal=()=>openModal('storyModal');

async function init(){
 try{
  myRawPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone")||"";
  myPhone=normalizePhone(myRawPhone);
  if(!myPhone){$("connStatus").textContent="❌";return;}
  $("myPhoneShow").textContent=myRawPhone;
  $("connStatus").textContent="●";$("connStatus").style.color="#20c879";
  const snap=await get(ref(db,"jasonBusiness/users"));
  if(snap.exists()){
   const all=snap.val()||{};
   for(const [k,v] of Object.entries(all)){users[normalizePhone(k)]=v||{};users[k]=v||{};}
   const mine=users[myPhone]||users[myRawPhone]||{};myName=mine.nom||mine.name||"Moi";
  }
  listenChats();listenRequests();listenStories();renderPeople();
 }catch(e){setNotice("Erreur Firebase: "+e.message);}
}
function listenChats(){
 const variants=[myPhone,myRawPhone,"243"+myPhone.slice(1),"+243"+myPhone.slice(1)].filter(Boolean);
 variants.forEach(v=>{
  onValue(ref(db,`jasonBusiness/user_chats/${v}`),snap=>{
   const data=snap.val()||{};
   Object.entries(data).forEach(([id,rec])=>{
    const normId=getChatId(myPhone, rec.with||id.split("_").find(x=>normalizePhone(x)!==myPhone)||"");
    if(!chatRecords[normId]||(rec.lastTime||0)>(chatRecords[normId].lastTime||0)) chatRecords[normId]=rec;
   });
   renderPeople();
  },()=>{});
 });
}
function listenRequests(){onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{requestRecords=snap.val()||{};renderPeople();},()=>{});}
function listenStories(){
 onValue(ref(db,"jasonBusiness/stories"),s=>{
  const all=Object.entries(s.val()||{}).map(([k,v])=>({...v,id:k}));
  const now=Date.now();
  storiesCache=all.filter(st=>{
   if(!st.createdAt) return true;
   if((now-st.createdAt)>86400000){remove(ref(db,`jasonBusiness/stories/${st.id}`));return false;}
   return true;
  }).sort((a,b)=>b.createdAt-a.createdAt);
  renderStories();
 });
}
function renderStories(){
 const box=$("stories");
 box.innerHTML=`<div class="story" onclick="openModal('storyModal')"><div class="story-av"><div>➕</div></div><span>Créer story</span></div>`;
 storiesCache.forEach(st=>{
  const isMine=normalizePhone(st.from)===myPhone;
  const views=Object.keys(st.views||{}).length,hearts=Object.keys(st.hearts||{}).length;
  const div=document.createElement("div");div.className="story";
  div.innerHTML=`<div class="story-av"><div>${st.fromPhoto?`<img src="${esc(st.fromPhoto)}">`:esc((st.fromName||st.from).slice(-2))}</div></div><span>${esc(isMine?"Ta story":(st.fromName||st.from).slice(0,10))}</span>${isMine?`<div style="position:absolute;top:-2px;right:0;background:#ff3b30;color:white;font-size:9px;padding:1px 4px;border-radius:8px">${views}👁️ ${hearts}❤️</div>`:""}`;
  div.onclick=()=>viewStory(st);box.appendChild(div);
 });
}
let storyFileBase64=null;
$("storyFile").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{storyFileBase64=r.result;$("storyPreview").innerHTML=`<img src="${r.result}" style="width:100%;border-radius:12px">`;};r.readAsDataURL(f);
};
window.publishStory=async()=>{
 if(!storyFileBase64) return alert("Choisis photo!");
 const note=$("storyNote").value.trim();
 const id=push(ref(db,"jasonBusiness/stories")).key;
 await set(ref(db,`jasonBusiness/stories/${id}`),{from:myPhone,fromRaw:myRawPhone,fromName:myName,fromPhoto:users[myPhone]?.photo||"",photo:storyFileBase64,note,createdAt:Date.now(),expireAt:Date.now()+86400000,views:{},hearts:{}});
 closeModal('storyModal');$("storyPreview").innerHTML="";$("storyNote").value="";storyFileBase64=null;
};
let currentStory=null;
window.viewStory=async(st)=>{
 currentStory=st;$("storyViewer").classList.add("show");
 $("svAv").innerHTML=st.fromPhoto?`<img src="${esc(st.fromPhoto)}">`:esc((st.fromName||"").slice(0,2));
 $("svName").textContent=st.fromName||st.from;$("svTime").textContent=new Date(st.createdAt).toLocaleTimeString();
 $("svContent").innerHTML=`<div style="position:relative;width:100%;height:100%;display:grid;place-items:center"><img src="${st.photo}" style="max-width:100%;max-height:100%;object-fit:contain">${st.note?`<div class="sv-note">${esc(st.note)}</div>`:""}</div>`;
 const v=Object.keys(st.views||{}).length,h=Object.keys(st.hearts||{}).length;
 $("svViewsInfo").textContent=`👁️ ${v} vues • ❤️ ${h}`;$("heartCount").textContent=h;
 if(normalizePhone(st.from)!==myPhone) await set(ref(db,`jasonBusiness/stories/${st.id}/views/${myPhone}`),{name:myName,time:Date.now()});
 $("heartBtn").classList.toggle("liked",!!(st.hearts&&st.hearts[myPhone]));
};
window.closeStory=()=>{$("storyViewer").classList.remove("show");};
window.heartStory=async()=>{
 if(!currentStory||normalizePhone(currentStory.from)===myPhone) return;
 const r=ref(db,`jasonBusiness/stories/${currentStory.id}/hearts/${myPhone}`);
 const snap=await get(r); if(snap.exists()) await remove(r); else await set(r,{name:myName,time:Date.now()});
};

function peopleForTab(){
 const search=$("searchInput").value.trim().toLowerCase();
 const out=[];
 if(currentTab==="chats"){
  for(const [key,record] of Object.entries(chatRecords)){
   if(!record)continue;
   const other=normalizePhone(record.with||record.phone||key.split("_").find(x=>normalizePhone(x)!==myPhone)||"");
   if(!other||other===myPhone)continue;
   const name=getDisplayName(other);
   if((name+" "+other).toLowerCase().includes(search))out.push({phone:other,name,record});
  }
 }else if(currentTab==="users"){
  const seen=new Set();
  for(const [key,u] of Object.entries(users)){
   const phone=normalizePhone(key); if(!phone||phone===myPhone||seen.has(phone))continue; seen.add(phone);
   const name=u.nom||u.name||u.username||phone;
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,record:{}});
  }
  out.sort((a,b)=>a.name.localeCompare(b.name));
 }else{
  for(const [key,r] of Object.entries(requestRecords)){
   const phone=normalizePhone(r.from||r.phone||key); if(!phone||phone===myPhone)continue;
   const name=getDisplayName(phone);
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,record:r});
  }
 }
 return out;
}
function renderPeople(){
 const list=$("peopleList");
 const people=peopleForTab();
 if(!people.length){list.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6;font-size:13px">Aucun ${currentTab==="users"?"utilisateur":"chat"}<br><small>Ajoute +243...</small></div>`;return;}
 list.innerHTML="";
 for(const p of people){
  const row=document.createElement("div");row.className="person"+(activeChat===p.phone?" selected":"");
  const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=initials(p.name);
  const info=document.createElement("div");info.className="personinfo";
  const name=document.createElement("strong");name.textContent=p.name;
  const small=document.createElement("small");small.textContent=p.record.lastMsg||p.phone;
  info.append(name,small);row.append(avatar,info);
  row.addEventListener("click",()=>openChat(p.phone,p.name));
  list.appendChild(row);
 }
}
function clearMessageListeners(){for(const stop of messageUnsubs){try{stop()}catch{}}messageUnsubs=[];messageSets={};}
function openChat(phone,name){
 activeChat=normalizePhone(phone);activeChatId=getChatId(myPhone,activeChat);
 $("chatTitle").textContent=name||getDisplayName(activeChat);
 $("chatAvatar").textContent=initials(name||getDisplayName(activeChat));
 $("chatSubtitle").textContent=activeChat;
 $("messageInput").disabled=false;$("sendBtn").disabled=false;$("micBtn").disabled=false;$("photoBtn").disabled=false;
 document.querySelector(".app")?.classList.add("chat-open");
 document.getElementById("leftPanel")?.classList.add("hide");
 clearMessageListeners();
 $("messages").innerHTML='<div style="margin:auto;text-align:center;opacity:.6;padding:20px">Chargement des messages…</div>';
 const ids=getAllChatIds(activeChat);
 for(const chatId of ids){
  const path=`jasonBusiness/messages/${chatId}`;
  const messagesRef=ref(db,path);
  const stop=onValue(messagesRef,snap=>{
   messageSets[chatId]=snap.val()||{};
   renderMessages();
  },err=>setNotice("Lecture impossible: "+err.message));
  messageUnsubs.push(()=>off(messagesRef,"value",stop));
 }
 renderPeople();
}
function mergeMessages(){
 const merged=new Map();
 for(const [chatId,items] of Object.entries(messageSets)){
  for(const [key,m] of Object.entries(items||{})){
   if(!m)continue;
   const stable=m.id||key;
   const sig=String(m.sender||m.from||"")+"|"+String(m.createdAt||m.timestamp||"")+"|"+String(m.text||m.photo||m.audio||"").slice(0,100);
   const unique=stable+"|"+sig;
   merged.set(unique,{...m,id:m.id||key,_chatId:chatId});
  }
 }
 return [...merged.values()].sort((a,b)=>safeDate(a.createdAt||a.timestamp)-safeDate(b.createdAt||b.timestamp));
}
function renderMessages(){
 const container=$("messages");
 if(!activeChat) return;
 const msgs=mergeMessages();
 if(!msgs.length){
  container.innerHTML='<div style="margin:auto;text-align:center;opacity:.5;padding:30px"><div style="font-size:40px">💬</div><div style="margin-top:8px;font-weight:700">Aucun message</div><div style="font-size:12px">Envoie le premier message!</div></div>';return;
 }
 container.innerHTML="";
 for(const m of msgs){
  const sender=normalizePhone(m.sender||m.from||"");
  const mine=sender===myPhone;
  const row=document.createElement("div");row.className="msgrow"+(mine?" mine":"");
  const bubble=document.createElement("div");bubble.className="bubble";
  const text=m.text||m.message||"";
  if(text){const d=document.createElement("div");d.textContent=text;bubble.appendChild(d);}
  const photo=m.photo||m.image||"";
  if(photo){const img=document.createElement("img");img.src=photo;img.loading="lazy";img.addEventListener("click",()=>showImage(photo));bubble.appendChild(img);}
  const audio=m.audio||m.voice||"";
  if(audio){const a=document.createElement("audio");a.controls=true;a.src=audio;bubble.appendChild(a);}
  if(!text&&!photo&&!audio){const f=document.createElement("div");f.textContent="Message";bubble.appendChild(f);}
  const meta=document.createElement("div");meta.className="msgmeta";meta.textContent=timeText(m.createdAt||m.timestamp)+(mine?"  ✓✓":"");
  row.append(bubble,meta);container.appendChild(row);
 }
 container.scrollTop=container.scrollHeight;
}
function showImage(src){
 const overlay=document.createElement("div");
 overlay.style.cssText="position:fixed;inset:0;z-index:999;background:#000e;display:flex;align-items:center;justify-content:center;padding:15px";
 const img=document.createElement("img");img.src=src;img.style.cssText="max-width:100%;max-height:90dvh;object-fit:contain";
 overlay.appendChild(img);overlay.addEventListener("click",()=>overlay.remove());document.body.appendChild(overlay);
}
async function sendPayload(payload){
 if(!myPhone||!activeChat) throw new Error("Choisis un contact");
 const now=Date.now();
 const chatId=getChatId(myPhone,activeChat);
 const messageRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
 const message={...payload,id:messageRef.key,sender:myPhone,from:myPhone,senderName:myName,createdAt:now,timestamp:now,serverTime:serverTimestamp()};
 await set(messageRef,message);
 if(!messageSets[chatId]) messageSets[chatId]={};
 messageSets[chatId][messageRef.key]=message;
 renderMessages();
 const preview=payload.text||(payload.photo?"📷 Photo":payload.audio?"🎙 Vocal":"Message");
 const updates={};
 updates[`jasonBusiness/user_chats/${myPhone}/${chatId}`]={with:activeChat,status:"accepted",lastMsg:preview,lastTime:now,unread:0};
 updates[`jasonBusiness/user_chats/${activeChat}/${chatId}`]={with:myPhone,status:"accepted",lastMsg:preview,lastTime:now,unread:1};
 try{await update(ref(db),updates);}catch(e){console.warn("user_chats update failed",e);}
 renderPeople();
}
async function sendText(){
 if(sending) return;
 const input=$("messageInput");
 const text=input.value.trim(); if(!text) return;
 if(!activeChat){setNotice("Choisis un contact");return;}
 sending=true;$("sendBtn").disabled=true;
 try{await sendPayload({text,type:"text"});input.value="";input.style.height="auto";setNotice("Envoyé ✓",true);}catch(e){setNotice("Échec: "+e.message);}finally{sending=false;$("sendBtn").disabled=!activeChat;}
}
$("sendBtn").addEventListener("click",sendText);
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}});
$("messageInput").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";});

$("photoBtn").addEventListener("click",()=>{if(!activeChat){setNotice("Choisis une conversation");return;}$("photoInput").click();});
$("photoInput").addEventListener("change",async e=>{
 const files=[...e.target.files||[]];e.target.value="";if(!files.length)return;
 for(const file of files){
  if(!file.type.startsWith("image/")){setNotice("Image seulement");continue;}
  if(file.size>900*1024){setNotice("Photo trop lourde (max 900Ko)");continue;}
  try{const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("lecture"));r.readAsDataURL(file);});pendingPhotos.push({name:file.name,data});}catch(err){setNotice("Lecture photo impossible");}
 }
 renderPhotoPreview();
});
function renderPhotoPreview(){
 const box=$("photoPreview");box.innerHTML="";
 pendingPhotos.forEach((p,i)=>{
  const item=document.createElement("div");item.className="previewitem";
  const img=document.createElement("img");img.src=p.data;
  const rm=document.createElement("button");rm.textContent="×";rm.addEventListener("click",()=>{pendingPhotos.splice(i,1);renderPhotoPreview();});
  item.append(img,rm);box.appendChild(item);
 });
 if(pendingPhotos.length){
  const btn=document.createElement("button");btn.textContent="Envoyer "+pendingPhotos.length+" photo(s)";btn.style.cssText="border:0;border-radius:10px;padding:10px;background:#0077ff;color:white;flex-shrink:0";btn.addEventListener("click",sendPhotos);box.appendChild(btn);
 }
}
async function sendPhotos(){
 if(!activeChat||!pendingPhotos.length) return;
 const photos=[...pendingPhotos];
 try{for(const p of photos){await sendPayload({photo:p.data,type:"photo",fileName:p.name});}pendingPhotos=[];renderPhotoPreview();setNotice("Photo(s) envoyée(s) ✓",true);}catch(e){setNotice("Erreur photo: "+e.message);}
}

$("micBtn").addEventListener("click",startRecording);
async function startRecording(){
 if(!activeChat){setNotice("Choisis une conversation");return;}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){setNotice("Vocal non supporté. Utilise Chrome en HTTPS");return;}
 try{
  recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordChunks=[];recordingCancelled=false;recordingStartedAt=Date.now();
  let opts={};const types=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus","audio/ogg"];const sup=types.find(t=>MediaRecorder.isTypeSupported(t));if(sup)opts.mimeType=sup;
  recorder=new MediaRecorder(recordStream,opts);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data);};
  recorder.onstop=async()=>{
   clearInterval(recordTimer);$("recBar").classList.remove("show");$("micBtn").textContent="🎙️";
   if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;
   if(recordingCancelled){recordChunks=[];return;}
   const blob=new Blob(recordChunks,{type:recorder?.mimeType||"audio/webm"});recordChunks=[];
   if(!blob.size){setNotice("Aucun son");return;}
   if(blob.size>700*1024){setNotice("Vocal trop lourd (max 700Ko) - fais plus court");return;}
   try{
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("lecture"));r.readAsDataURL(blob);});
    await sendPayload({audio:data,type:"audio",audioType:blob.type,duration:Math.round((Date.now()-recordingStartedAt)/1000)});
    setNotice("Vocal envoyé ✓",true);
   }catch(err){setNotice("Vocal échoué: "+err.message);}
  };
  recorder.start(250);$("recBar").classList.add("show");$("micBtn").textContent="🔴";$("recLabel").textContent="🔴 Enregistrement… 0 s";
  recordTimer=setInterval(()=>{const s=Math.floor((Date.now()-recordingStartedAt)/1000);$("recLabel").textContent="🔴 Enregistrement… "+s+" s";if(s>=30){$("stopRecBtn").click();}},500);
 }catch(e){setNotice("Micro refusé");if(recordStream)recordStream.getTracks().forEach(t=>t.stop());}
}
function stopRecording(){if(recorder&&recorder.state!=="inactive")recorder.stop();}
$("stopRecBtn").addEventListener("click",stopRecording);
$("cancelRecBtn").addEventListener("click",()=>{recordingCancelled=true;if(recorder&&recorder.state!=="inactive")recorder.stop();else{$("recBar").classList.remove("show");if(recordStream)recordStream.getTracks().forEach(t=>t.stop());}});

document.querySelectorAll(".tabs .tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  currentTab=btn.dataset.tab;
  document.querySelectorAll(".tabs .tab").forEach(b=>b.classList.toggle("active",b===btn));
  renderPeople();
 });
});
$("searchInput").addEventListener("input",renderPeople);
$("topLeft").addEventListener("click",()=>{if(innerWidth<=800) document.getElementById("leftPanel").classList.remove("hide");});
$("btnAddManual").addEventListener("click",()=>{
 let p=$("manualPhone").value.trim();if(!p||p.length<8)return;
 p=normalizePhone(p);if(p===myPhone)return;
 const id=getChatId(myPhone,p);
 set(ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`),{with:p,status:"accepted",lastMsg:"Nouveau chat",lastTime:Date.now(),unread:0});
 $("manualPhone").value="";renderPeople();
});
$("messages").addEventListener("scroll",()=>{$("scrollDown").classList.toggle("show",$("messages").scrollHeight-$("messages").scrollTop-$("messages").clientHeight>200);});
$("scrollDown").addEventListener("click",()=>{$("messages").scrollTop=$("messages").scrollHeight;});
window.closeViewer=()=>{$("imgViewer").classList.remove("show");};
window.openViewer=src=>{$("viewerImg").src=src;$("imgViewer").classList.add("show");};

init();
</script>
