<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>JASON BUSINESS Messenger</title>
<style>
:root{
 --bg:#050914;--panel:#0b1425;--panel2:#101e33;
 --blue:#00d4ff;--blue2:#0077ff;--gold:#d8aa45;
 --text:#f4f7fb;--muted:#93a4ba;--border:rgba(255,255,255,.09);
 --mine:#075fce;--other:#15253b;--green:#20c879;--red:#ff5263;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:var(--bg)}
header{height:66px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 15px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0077ff,#00d4ff);font-weight:900;color:#031020;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
.brand h1{font-size:16px;margin:0 0 4px;letter-spacing:.4px}
.brand p{font-size:11px;margin:0;color:var(--muted)}
.status{font-size:11px;color:var(--green)}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:310px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
.searchbox{padding:12px}
.searchbox input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:13px;padding:12px;outline:none}
.tabs{display:flex;gap:5px;padding:0 10px 10px}
.tab{flex:1;border:0;border-radius:10px;padding:10px 4px;background:transparent;color:var(--muted);font-size:12px}
.tab.active{background:rgba(0,212,255,.13);color:var(--blue)}
.list{flex:1;overflow-y:auto}
.person{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.035)}
.person:active,.person.selected{background:rgba(0,212,255,.08)}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#0077ff,#00d4ff);color:#001323;font-weight:bold;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.personinfo{min-width:0;flex:1}
.personinfo strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.personinfo small{display:block;color:var(--muted);font-size:11px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatarea{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at top right,rgba(0,119,255,.08),transparent 55%),var(--bg)}
.chathead{height:62px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.chathead .avatar{width:38px;height:38px}
.chatname{flex:1;min-width:0}
.chatname strong{font-size:14px}
.chatname small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.messages{flex:1;overflow-y:auto;padding:16px 13px 22px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:25px}
.empty .big{font-size:43px;margin-bottom:8px}
.msgrow{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.msgrow.mine{align-items:flex-end}
.msgrow.other{flex-direction:row;align-items:flex-end;gap:8px}
.msgrow.other .bubble{max-width:75%}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--other);font-size:10px;font-weight:bold;overflow:hidden;border:1px solid var(--border)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:min(82%,440px);min-width:35px;padding:10px 12px;border-radius:17px;background:var(--other);border:1px solid var(--border);font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.mine .bubble{background:linear-gradient(135deg,#075fce,#0875dd);border-color:rgba(0,212,255,.16);border-bottom-right-radius:5px}
.msgrow:not(.mine) .bubble{border-bottom-left-radius:5px}
.bubble img{display:block;max-width:100%;max-height:290px;object-fit:contain;border-radius:10px;margin-top:3px;cursor:pointer}
.bubble audio{max-width:100%;width:245px;height:42px}
.msgmeta{font-size:10px;color:var(--muted);padding:4px 5px 0}
.composer{flex-shrink:0;border-top:1px solid var(--border);padding:10px;background:var(--panel);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.preview{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px}
.previewitem{position:relative;flex-shrink:0}
.previewitem img{height:65px;width:65px;object-fit:cover;border-radius:10px}
.previewitem button{position:absolute;top:-5px;right:-5px;border:0;border-radius:50%;background:var(--red);color:white;width:22px;height:22px}
.inputrow{display:flex;align-items:flex-end;gap:7px}
.attach{width:39px;height:42px;flex-shrink:0;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--blue);font-size:19px}
#messageInput{flex:1;min-width:0;max-height:110px;resize:none;border:1px solid var(--border);border-radius:15px;background:var(--panel2);color:var(--text);padding:12px;outline:none;font-size:14px}
#sendBtn{height:42px;width:44px;border:0;border-radius:13px;background:linear-gradient(135deg,#0077ff,#00d4ff);color:#001323;font-weight:bold;font-size:19px}
#sendBtn:disabled{opacity:.45}
.recbar{display:none;margin-bottom:9px;padding:10px;border-radius:12px;background:rgba(255,82,99,.1);color:#ff7c89;align-items:center;gap:10px;font-size:12px}
.recbar.show{display:flex}
.recbar span{flex:1}
.recbar button{border:0;border-radius:9px;padding:9px 12px;background:var(--red);color:white}
.recbar .cancel{background:#27364b}
.notice{display:none;margin:8px 0 0;font-size:12px;color:#ff9eaa}
.notice.show{display:block}
.mobileback{display:none;width:38px;height:38px;border:1px solid var(--border);background:var(--panel2);color:var(--blue);border-radius:12px;font-size:18px}
footer{padding:9px;text-align:center;color:#52647c;font-size:10px;border-top:1px solid var(--border)}
@media(max-width:700px){
 .sidebar{width:100%;border-right:0}
 .chatarea{display:none;width:100%}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chatarea{display:flex}
 .mobileback{display:grid;place-items:center}
 header{height:59px}
 .messages{padding:12px 10px}
 .bubble{max-width:88%}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
 <div class="logo" id="myLogo">JB</div>
 <div class="brand">
  <h1>JASON BUSINESS <span style="color:var(--blue)">MESSENGER</span></h1>
  <p>Messagerie numérique • Jason Aloma 🇨🇩</p>
 </div>
 <div class="status" id="connectionStatus">En ligne</div>
</header>
<div class="layout">
 <aside class="sidebar">
  <div class="searchbox"><input id="searchInput" placeholder="Rechercher une conversation…"></div>
  <div class="tabs">
   <button class="tab active" data-tab="chats">Messages</button>
   <button class="tab" data-tab="users">Utilisateurs</button>
   <button class="tab" data-tab="requests">Demandes</button>
  </div>
  <div class="list" id="peopleList"><div class="empty"><div class="big">💬</div>Chargement…</div></div>
  <footer>JASON BUSINESS • Jason Aloma 🇨🇩</footer>
 </aside>
 <main class="chatarea">
  <div class="chathead">
   <button class="mobileback" id="backBtn">‹</button>
   <div class="avatar" id="chatAvatar">JB</div>
   <div class="chatname"><strong id="chatTitle">Choisis une conversation</strong><small id="chatSubtitle">Tes messages apparaîtront ici</small></div>
  </div>
  <div class="messages" id="messages"><div class="empty"><div class="big">💬</div>Sélectionne un contact pour discuter.</div></div>
  <div class="composer">
   <div class="preview" id="photoPreview"></div>
   <div class="recbar" id="recBar"><span id="recLabel">🔴 Enregistrement…</span><button class="cancel" id="cancelRecBtn">Annuler</button><button id="stopRecBtn">Terminer</button></div>
   <div class="inputrow">
    <button class="attach" id="photoBtn">＋</button>
    <input id="photoInput" type="file" accept="image/*" multiple hidden>
    <button class="attach" id="micBtn">🎙</button>
    <textarea id="messageInput" rows="1" placeholder="Écris un message…" disabled></textarea>
    <button id="sendBtn" disabled>➤</button>
   </div>
   <div class="notice" id="notice"></div>
  </div>
 </main>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, push, update, onValue, off, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={ apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain:"starlink-investit.firebaseapp.com", databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com", projectId:"starlink-investit", storageBucket:"starlink-investit.firebasestorage.app", messagingSenderId:"807081599583", appId:"1:807081599583:web:e00ec3959bc4acdae031ea" };
const $=id=>document.getElementById(id);
const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);
let myPhone="",myRawPhone="",myName="Moi",myPhoto="";
let currentTab="chats",activeChat=null,activeChatId=null;
let users={},chatRecords={},requestRecords={};
let messageUnsubs=[],messageCache={};
let pendingPhotos=[],recorder=null,recordChunks=[],recordStream=null;
let recordingCancelled=false,recordingStartedAt=0,recordTimer=null;
let sending=false;
let loadTimeout=null;

function normalizePhone(v){let p=String(v||"").replace(/\D/g,"");if(p.startsWith("243"))p="0"+p.slice(3);if(p.length===9&&!p.startsWith("0"))p="0"+p;return p;}
function getChatId(a,b){return[normalizePhone(a),normalizePhone(b)].sort().join("_");}
function setNotice(m,ok=false){const n=$("notice");n.textContent=m;n.style.color=ok?"#20c879":"#ff9eaa";n.classList.add("show");setTimeout(()=>n.classList.remove("show"),3000);}
function timeText(v){let d=new Date(Number(v||0));if(!d.getTime())return"";return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function initials(n){return String(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();}

// ✅ NOUVEAU: Récupère photo de profil
function getUserPhoto(phone){
 const n=normalizePhone(phone);
 const u=users[n]||users[phone]||{};
 return u.photo||u.photoProfil||u.avatar||u.image||u.profilePhoto||"";
}
function getDisplayName(phone){const n=normalizePhone(phone);const u=users[n]||users[phone]||{};return u.nom||u.name||u.username||n;}
function avatarHTML(name,photo,size="43px"){
 if(photo){
  return `<img src="${photo}" alt="${name}" loading="lazy" onerror="this.style.display='none'">`;
 }else{
  return initials(name);
 }
}

async function init(){
 myRawPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone")||"";
 myPhone=normalizePhone(myRawPhone);
 if(!myPhone){$("connectionStatus").textContent="Compte requis";return;}
 try{
  const snap=await get(ref(db,"jasonBusiness/users"));
  if(snap.exists()){
   const all=snap.val()||{};
   for(const [k,v] of Object.entries(all)){users[normalizePhone(k)]=v||{};users[k]=v||{};}
   const mine=users[myPhone]||users[myRawPhone]||{};myName=mine.nom||mine.name||"Moi";myPhoto=getUserPhoto(myPhone)||getUserPhoto(myRawPhone)||"";
   // Affiche MA photo en haut
   if(myPhoto){$("myLogo").innerHTML=`<img src="${myPhoto}" alt="Moi">`; }
  }
 }catch(e){}
 listenChats();listenRequests();renderPeople();
 $("connectionStatus").textContent="En ligne";
}
function listenChats(){
 const variants=[myPhone,myRawPhone].filter((v,i,a)=>a.indexOf(v)===i);
 variants.forEach(v=>{
  onValue(ref(db,`jasonBusiness/user_chats/${v}`),snap=>{
   const data=snap.val()||{};
   Object.entries(data).forEach(([id,rec])=>{
    const normId=getChatId(myPhone, rec.with||id.split("_").find(x=>normalizePhone(x)!==myPhone)||"");
    if(!chatRecords[normId]||(rec.lastTime||0)>(chatRecords[normId].lastTime||0)) chatRecords[normId]=rec;
   });
   renderPeople();
  },()=>{});
 });
}
function listenRequests(){onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),snap=>{requestRecords=snap.val()||{};renderPeople();});}
function peopleForTab(){
 const search=$("searchInput").value.trim().toLowerCase();const out=[];
 if(currentTab==="chats"){
  for(const [key,record] of Object.entries(chatRecords)){
   if(!record)continue;
   const other=normalizePhone(record.with||key.split("_").find(x=>normalizePhone(x)!==myPhone)||"");
   if(!other||other===myPhone)continue;
   const name=getDisplayName(other);
   if((name+" "+other).toLowerCase().includes(search))out.push({phone:other,name,photo:getUserPhoto(other),record});
  }
 }else if(currentTab==="users"){
  const seen=new Set();
  for(const [k,u] of Object.entries(users)){
   const phone=normalizePhone(k);if(!phone||phone===myPhone||seen.has(phone))continue;seen.add(phone);
   const name=u.nom||u.name||phone;
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,photo:getUserPhoto(phone),record:{}});
  }
  out.sort((a,b)=>a.name.localeCompare(b.name));
 }else{
  for(const [k,r] of Object.entries(requestRecords)){
   const phone=normalizePhone(r.from||r.phone||k);if(!phone||phone===myPhone)continue;
   const name=getDisplayName(phone);
   if((name+" "+phone).toLowerCase().includes(search))out.push({phone,name,photo:getUserPhoto(phone),record:r});
  }
 }
 return out;
}
function renderPeople(){
 const list=$("peopleList");const people=peopleForTab();
 if(!people.length){list.innerHTML=`<div class="empty"><div class="big">💬</div>Aucune conversation</div>`;return;}
 list.innerHTML="";
 for(const p of people){
  const row=document.createElement("div");row.className="person"+(activeChat===p.phone?" selected":"");
  const av=document.createElement("div");av.className="avatar";
  if(p.photo){const img=document.createElement("img");img.src=p.photo;img.loading="lazy";img.onerror=()=>{av.textContent=initials(p.name);};av.appendChild(img);}else{av.textContent=initials(p.name);}
  const info=document.createElement("div");info.className="personinfo";
  const nm=document.createElement("strong");nm.textContent=p.name;
  const sm=document.createElement("small");sm.textContent=p.record.lastMsg||p.phone;
  info.append(nm,sm);row.append(av,info);
  row.addEventListener("click",()=>openChat(p.phone,p.name));
  list.appendChild(row);
 }
}
function clearListeners(){for(const f of messageUnsubs){try{f()}catch{}}messageUnsubs=[];messageCache={};if(loadTimeout){clearTimeout(loadTimeout);loadTimeout=null;}}
function openChat(phone,name){
 activeChat=normalizePhone(phone);
 activeChatId=getChatId(myPhone,activeChat);
 const photo=getUserPhoto(phone);
 $("chatTitle").textContent=name||getDisplayName(activeChat);
 $("chatAvatar").innerHTML=photo?`<img src="${photo}" alt="${name}">`:initials(name||getDisplayName(activeChat));
 $("chatSubtitle").textContent=activeChat;
 $("messageInput").disabled=false;$("sendBtn").disabled=false;
 document.getElementById("app").classList.add("chat-open");
 clearListeners();
 $("messages").innerHTML='<div class="empty"><div class="big">⏳</div>Chargement des messages...</div>';
 loadTimeout=setTimeout(()=>{if(Object.keys(messageCache).length===0){renderMessages(true);}},3000);
 const chatId=getChatId(myPhone,activeChat);
 const path=`jasonBusiness/messages/${chatId}`;
 const messagesRef=ref(db,path);
 const stop=onValue(messagesRef,snap=>{
  messageCache=snap.val()||{};
  if(loadTimeout){clearTimeout(loadTimeout);loadTimeout=null;}
  renderMessages();
 },err=>{
  if(loadTimeout){clearTimeout(loadTimeout);loadTimeout=null;}
  renderMessages(true);
 });
 messageUnsubs.push(()=>off(messagesRef,"value",stop));
 renderPeople();
}
function renderMessages(forceEmpty=false){
 const container=$("messages");
 const entries=Object.entries(messageCache||{});
 if(!entries.length){
  if(forceEmpty||!loadTimeout){
   container.innerHTML='<div class="empty"><div class="big">👋</div>Pas encore de message.<br>Envoie le premier !</div>';
  }
  return;
 }
 const msgs=entries.map(([k,v])=>({...v,id:k})).sort((a,b)=>(Number(a.createdAt||a.timestamp||0)-Number(b.createdAt||b.timestamp||0)));
 container.innerHTML="";
 for(const m of msgs){
  const sender=normalizePhone(m.sender||m.from||"");
  const mine=sender===myPhone;
  const row=document.createElement("div");row.className="msgrow"+(mine?" mine":" other");
  const photoOther=!mine?getUserPhoto(sender):"";
  if(!mine){
   const av=document.createElement("div");av.className="msg-av";
   if(photoOther){const img=document.createElement("img");img.src=photoOther;img.loading="lazy";av.appendChild(img);}else{av.textContent=initials(getDisplayName(sender));}
   row.appendChild(av);
  }
  const bubble=document.createElement("div");bubble.className="bubble";
  if(m.text){const d=document.createElement("div");d.textContent=m.text;bubble.appendChild(d);}
  if(m.photo){const img=document.createElement("img");img.src=m.photo;img.loading="lazy";img.onclick=()=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:999;background:#000e;display:flex;align-items:center;justify-content:center";const i=document.createElement("img");i.src=m.photo;i.style.cssText="max-width:100%;max-height:90dvh";o.appendChild(i);o.onclick=()=>o.remove();document.body.appendChild(o);};bubble.appendChild(img);}
  if(m.audio){const a=document.createElement("audio");a.controls=true;a.src=m.audio;bubble.appendChild(a);}
  if(!m.text&&!m.photo&&!m.audio){bubble.textContent="Message";}
  const meta=document.createElement("div");meta.className="msgmeta";meta.textContent=timeText(m.createdAt||m.timestamp)+(mine?" ✓✓":"");
  if(mine){
   row.append(bubble,meta);
  }else{
   const col=document.createElement("div");col.style.display="flex";col.style.flexDirection="column";
   col.append(bubble,meta);
   row.appendChild(col);
  }
  container.appendChild(row);
 }
 container.scrollTop=container.scrollHeight;
}
async function sendPayload(payload){
 if(!myPhone||!activeChat) throw new Error("Choisis un contact");
 const now=Date.now();
 const chatId=getChatId(myPhone,activeChat);
 const messageRef=push(ref(db,`jasonBusiness/messages/${chatId}`));
 const message={...payload,id:messageRef.key,sender:myPhone,from:myPhone,senderName:myName,senderPhoto:myPhoto,createdAt:now,timestamp:now,serverTime:serverTimestamp()};
 await set(messageRef,message);
 if(!messageCache) messageCache={};
 messageCache[messageRef.key]=message;
 renderMessages();
 const preview=payload.text||(payload.photo?"📷 Photo":payload.audio?"🎙 Vocal":"Message");
 const updates={};
 updates[`jasonBusiness/user_chats/${myPhone}/${chatId}`]={with:activeChat,status:"accepted",lastMsg:preview,lastTime:now,unread:0};
 updates[`jasonBusiness/user_chats/${activeChat}/${chatId}`]={with:myPhone,status:"accepted",lastMsg:preview,lastTime:now,unread:1};
 try{await update(ref(db),updates);}catch(e){}
 renderPeople();
}
async function sendText(){
 if(sending) return;
 const input=$("messageInput");const text=input.value.trim();if(!text)return;
 if(!activeChat){setNotice("Choisis un contact");return;}
 sending=true;$("sendBtn").disabled=true;
 try{await sendPayload({text,type:"text"});input.value="";input.style.height="auto";setNotice("Envoyé ✓",true);}catch(e){setNotice(e.message);}finally{sending=false;$("sendBtn").disabled=!activeChat;}
}
$("sendBtn").addEventListener("click",sendText);
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}});
$("messageInput").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";});
$("photoBtn").addEventListener("click",()=>{if(!activeChat){setNotice("Choisis conversation");return;}$("photoInput").click();});
$("photoInput").addEventListener("change",async e=>{
 const files=[...e.target.files||[]];e.target.value="";if(!files.length)return;
 for(const file of files){
  if(file.size>900*1024){setNotice("Photo >900Ko");continue;}
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("lecture"));r.readAsDataURL(file);});
  pendingPhotos.push({name:file.name,data});
 }
 renderPhotoPreview();
});
function renderPhotoPreview(){
 const box=$("photoPreview");box.innerHTML="";
 pendingPhotos.forEach((p,i)=>{
  const item=document.createElement("div");item.className="previewitem";
  const img=document.createElement("img");img.src=p.data;
  const rm=document.createElement("button");rm.textContent="×";rm.onclick=()=>{pendingPhotos.splice(i,1);renderPhotoPreview();};
  item.append(img,rm);box.appendChild(item);
 });
 if(pendingPhotos.length){
  const btn=document.createElement("button");btn.textContent="Envoyer "+pendingPhotos.length+" photo(s)";btn.style.cssText="border:0;border-radius:10px;padding:10px;background:#0077ff;color:white;flex-shrink:0";btn.onclick=sendPhotos;box.appendChild(btn);
 }
}
async function sendPhotos(){
 if(!activeChat||!pendingPhotos.length) return;
 const photos=[...pendingPhotos];
 try{for(const p of photos){await sendPayload({photo:p.data,type:"photo"});}pendingPhotos=[];renderPhotoPreview();setNotice("Photo(s) envoyée(s)",true);}catch(e){setNotice(e.message);}
}
$("micBtn").addEventListener("click",startRecording);
async function startRecording(){
 if(!activeChat){setNotice("Choisis conversation");return;}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){setNotice("Vocal non supporté - Chrome HTTPS");return;}
 try{
  recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordChunks=[];recordingCancelled=false;recordingStartedAt=Date.now();
  let opts={};const types=["audio/webm;codecs=opus","audio/webm","audio/mp4"];const sup=types.find(t=>MediaRecorder.isTypeSupported(t));if(sup)opts.mimeType=sup;
  recorder=new MediaRecorder(recordStream,opts);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data);};
  recorder.onstop=async()=>{
   clearInterval(recordTimer);$("recBar").classList.remove("show");$("micBtn").textContent="🎙️";
   if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;
   if(recordingCancelled){recordChunks=[];return;}
   const blob=new Blob(recordChunks,{type:recorder?.mimeType||"audio/webm"});recordChunks=[];
   if(!blob.size){setNotice("Aucun son");return;}
   if(blob.size>700*1024){setNotice("Vocal trop lourd");return;}
   const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("lecture"));r.readAsDataURL(blob);});
   await sendPayload({audio:data,type:"audio"});
   setNotice("Vocal envoyé ✓",true);
  };
  recorder.start(250);$("recBar").classList.add("show");$("micBtn").textContent="🔴";$("recLabel").textContent="🔴 0 s";
  recordTimer=setInterval(()=>{const s=Math.floor((Date.now()-recordingStartedAt)/1000);$("recLabel").textContent="🔴 "+s+" s";if(s>=30)stopRecording();},500);
 }catch(e){setNotice("Micro refusé");if(recordStream)recordStream.getTracks().forEach(t=>t.stop());}
}
function stopRecording(){if(recorder&&recorder.state!=="inactive")recorder.stop();}
$("stopRecBtn").addEventListener("click",stopRecording);
$("cancelRecBtn").addEventListener("click",()=>{recordingCancelled=true;if(recorder&&recorder.state!=="inactive")recorder.stop();else{$("recBar").classList.remove("show");if(recordStream)recordStream.getTracks().forEach(t=>t.stop());}});
document.querySelectorAll(".tabs .tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  currentTab=btn.dataset.tab;
  document.querySelectorAll(".tabs .tab").forEach(b=>b.classList.toggle("active",b===btn));
  renderPeople();
 });
});
$("searchInput").addEventListener("input",renderPeople);
$("backBtn").addEventListener("click",()=>document.getElementById("app").classList.remove("chat-open"));
init();
</script>
