<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JASON BUSINESS - TEST VOCAL LOCAL</title>
<style>
:root{--blue:#00d2ff;--border:rgba(0,210,255,.18)}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:white;background:#050a14;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#050a14;border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--blue);font-size:13px}.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(0,210,255,.25);background:rgba(0,210,255,.08);color:var(--blue);font-size:11px;cursor:pointer}
.wrap{display:flex;flex:1;overflow:hidden}
.left{width:360px;background:#0b1425;border-right:1px solid var(--border);display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.tab{padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;opacity:.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;color:var(--blue);border-bottom-color:var(--blue)}
.search{padding:10px;border-bottom:1px solid var(--border)} .search input,.add-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #293850;background:#0c192b;color:white;outline:none}
.list{flex:1;overflow-y:auto;padding:6px} .item{padding:10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.item.active{background:rgba(0,210,255,.14);border-color:var(--blue)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0} .name{font-size:13px;font-weight:700} .prev{font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{flex:1;display:flex;flex-direction:column;background:#070e1e;overflow:hidden}
.top{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(5,10,20,.95)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 10px;border-radius:16px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#00d2ff,#0077ff);border-bottom-right-radius:6px}
.msg.other{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.msg audio{margin-top:6px;width:210px}
.input-area{padding:6px 8px;background:#0a1425;border-top:1px solid var(--border)}
.rec-bar{display:none;align-items:center;justify-content:space-between;padding:8px 12px;background:#ff47571a;border:1px solid #ff4757aa;border-radius:20px;margin-bottom:6px}
.rec-bar.show{display:flex}
.input{display:flex;gap:6px;align-items:center}
.input textarea{flex:1;min-height:38px;max-height:80px;padding:9px 12px;border-radius:18px;border:1px solid #293850;background:#0c192b;color:white;outline:none;resize:none;font-size:13px}
.tbtn{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:1px solid #293850;background:#0c192b;color:white;display:grid;place-items:center;font-size:18px;cursor:pointer}
.tbtn.hold{background:#ff4757!important;transform:scale(1.15)}
.send{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:0;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;font-size:18px;cursor:pointer}
@media(max-width:800px){.left{position:absolute;inset:0;z-index:20;width:100%}.left.hide{display:none}}
</style>
</head>
<body>
<header><div class="brand">JASON BUSINESS — TEST LOCAL VOCAL</div><div style="display:flex;gap:6px"><button class="btn" id="btnShowLeft">☰</button><button class="btn" onclick="location.reload()">Reload</button></div></header>
<div class="wrap">
<aside class="left" id="leftPanel">
<div class="tabs"><div class="tab active">💬 Chats</div></div>
<div class="search"><input placeholder="🔍 El mago"></div>
<div class="list"><div class="item active"><div class="av">EM</div><div class="info"><div class="name">El mago</div><div class="prev">Test vocal local</div></div></div></div>
</aside>
<section class="right">
<div class="top"><div style="display:flex;align-items:center;gap:8px"><div class="av">EM</div><div><h3 style="margin:0;font-size:13px">El mago</h3><small id="status" style="font-size:10px;opacity:.6">Test sans Firebase</small></div></div></div>
<div class="msgs" id="msgs">
<div class="msg other">Clique 🎤 en bas pour tester<br>Pas de Firebase, juste local</div>
</div>
<div class="input-area">
<div id="recBar" class="rec-bar"><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;background:#ff4757;border-radius:50%"></div><div id="recTime" style="font-weight:800;color:#ff6b7a">00:00</div><div style="font-size:11px">🔴 Enregistrement LOCAL</div></div><div style="display:flex;gap:6px"><button id="recCancel" type="button" style="padding:5px 10px;border-radius:10px;border:1px solid #ff4757;background:#ff475722;color:#ff6b7a">Annuler</button><button id="recSend" type="button" style="padding:5px 12px;border-radius:10px;border:0;background:#00d2ff;font-weight:800">Envoyer</button></div></div>
<div class="input">
<label class="tbtn">🖼️<input type="file" id="photoInput" accept="image/*" hidden></label>
<button type="button" id="recordBtn" class="tbtn" onclick="toggleVocal()">🎤</button>
<textarea id="msgInput" placeholder="Écris un message..." rows="1"></textarea>
<button type="button" class="send" id="sendBtn">➤</button>
</div>
<div id="hint" style="text-align:center;font-size:10px;opacity:.6;margin-top:4px">TEST LOCAL — Clique 🎤 → parle → re-clique ⏹️ → audio s'affiche</div>
</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
let isRecording=false, mediaRecorder=null, audioChunks=[], recordStream=null, timerInt=null, recSec=0;

function fmt(s){const m=String(Math.floor(s/60)).padStart(2,'0');const sec=String(s%60).padStart(2,'0');return `${m}:${sec}`}

function addMsg(html, me=true){
  const c=$("msgs");
  const div=document.createElement("div");
  div.className="msg "+(me?"me":"other");
  div.innerHTML=html+`<div style="font-size:8px;opacity:.6;margin-top:4px;text-align:right">${new Date().toLocaleTimeString()} ✓✓</div>`;
  c.appendChild(div);
  c.scrollTop=c.scrollHeight;
}

async function toggleVocal(){
  console.log("CLICK MIC", isRecording);
  if(!isRecording){
    try{
      $("hint").textContent="Demande permission micro...";
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordStream=stream;
      let mime="audio/webm;codecs=opus";
      if(!MediaRecorder.isTypeSupported(mime)) mime="audio/webm";
      if(!MediaRecorder.isTypeSupported(mime)) mime="audio/mp4";
      if(!MediaRecorder.isTypeSupported(mime)) mime="";
      mediaRecorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      audioChunks=[]; recSec=0;
      
      mediaRecorder.ondataavailable=e=>{if(e.data.size>0) audioChunks.push(e.data)};
      
      mediaRecorder.onstop=()=>{
        clearInterval(timerInt);
        $("recBar").classList.remove("show");
        $("recordBtn").classList.remove("hold");
        $("recordBtn").textContent="🎤";
        $("hint").textContent="Traitement...";
        const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
        console.log("BLOB LOCAL", blob.size, blob.type);
        if(blob.size<800){ $("hint").textContent="Trop court, reparle"; try{stream.getTracks().forEach(t=>t.stop())}catch{}; isRecording=false; return }
        
        // SANS FIREBASE - juste URL locale
        const url=URL.createObjectURL(blob);
        addMsg(`🎤 Vocal LOCAL TEST (${(blob.size/1024).toFixed(1)}ko)<br><audio controls src="${url}" style="width:210px;margin-top:6px"></audio>`, true);
        $("hint").textContent="✅ Vocal local affiché ! Si tu entends, ton micro marche. Le problème était Firebase.";
        $("status").textContent="✅ Micro OK - "+blob.size+" bytes";
        try{stream.getTracks().forEach(t=>t.stop())}catch{};
        isRecording=false;
      };
      
      mediaRecorder.start(100);
      isRecording=true;
      $("recBar").classList.add("show");
      $("recordBtn").classList.add("hold");
      $("recordBtn").textContent="⏹️";
      $("recTime").textContent="00:00";
      $("hint").textContent="🔴 Enregistrement LOCAL... Re-clique ⏹️ pour arrêter";
      timerInt=setInterval(()=>{recSec++;$("recTime").textContent=fmt(recSec); if(recSec>=20){try{mediaRecorder.stop()}catch{}}},1000);
      
    }catch(err){
      console.error(err);
      alert("Micro bloqué: "+err.name+"\n"+err.message+"\n\n1. Paramètres Android > Applis > Chrome > Autorisations > Micro > Autoriser\n2. Cadenas 🔒 en haut Chrome > Autoriser micro\n3. Recharge la page");
      $("hint").textContent="❌ Micro bloqué - voir alerte";
      isRecording=false;
    }
  }else{
    try{mediaRecorder.stop()}catch{}
  }
}

$("recSend").onclick=()=>{ if(isRecording) try{mediaRecorder.stop()}catch{} };
$("recCancel").onclick=()=>{
  if(!isRecording) return;
  try{mediaRecorder.stop()}catch{}
  audioChunks=[];
  setTimeout(()=>{ try{recordStream.getTracks().forEach(t=>t.stop())}catch{}; isRecording=false; $("recBar").classList.remove("show"); $("recordBtn").classList.remove("hold"); $("recordBtn").textContent="🎤"; $("hint").textContent="Annulé"; },100);
  clearInterval(timerInt);
};

$("sendBtn").onclick=()=>{
  const t=$("msgInput").value.trim();
  if(!t) return;
  addMsg(t, true);
  $("msgInput").value="";
};

$("photoInput").onchange=e=>{
  const file=e.target.files[0];
  if(!file) return;
  const url=URL.createObjectURL(file);
  addMsg(`📷 Photo LOCAL<br><img src="${url}" style="max-width:160px;border-radius:12px;margin-top:6px">`, true);
  e.target.value="";
};

$("btnShowLeft").onclick=()=>$("leftPanel").classList.toggle("hide");
</script>
</body>
</html>
