<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>JASON BUSINESS — Messenger FIX</title>
<style>
:root{--blue:#00d2ff;--fb-blue:#0084ff;--fb-bg:#f0f2f5;--fb-card:#fff;--border:rgba(0,0,0,.08);--text:#050505;--muted:#65676b;--green:#31a24c;--red:#ff3b30}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font-family:Segoe UI,Arial;color:var(--text);background:var(--fb-bg);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.dark{--fb-bg:#18191a;--fb-card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:rgba(255,255,255,.1);background:#18191a}
header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:var(--fb-card);border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--fb-blue);font-size:20px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--fb-bg);border:0;display:grid;place-items:center;font-size:18px;cursor:pointer}
body.dark .icon-btn{background:#3a3b3c}
.wrap{display:flex;flex:1;min-height:0;overflow:hidden}
.left{width:360px;flex-shrink:0;background:var(--fb-card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.left-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.left-header h2{font-size:24px;font-weight:900}
.search-box{margin:8px 16px;padding:10px 12px;border-radius:20px;background:var(--fb-bg);display:flex;gap:8px}
body.dark .search-box{background:#3a3b3c}
.search-box input{flex:1;border:0;background:transparent;color:var(--text);outline:none;font-size:14px}
.tabs{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--fb-bg);color:var(--muted);border:0}
body.dark .tab{background:#3a3b3c}
.tab.active{background:rgba(0,132,255,.12);color:var(--fb-blue)}
.stories{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.story{width:56px;flex-shrink:0;text-align:center;cursor:pointer}
.story-av{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#00d2ff,#0077ff,#ff00ff);display:grid;place-items:center}
.story-av div{width:100%;height:100%;border-radius:50%;background:var(--fb-card);display:grid;place-items:center;font-weight:900;overflow:hidden;border:3px solid var(--fb-card)}
.story-av img{width:100%;height:100%;object-fit:cover}
.story span{font-size:11px;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px}
.item{padding:8px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.item:hover{background:var(--fb-bg)}
body.dark .item:hover{background:#3a3b3c}
.item.active{background:rgba(0,132,255,.10)}
.av{width:56px;height:56px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;color:white;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.online-dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--fb-card)}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600}
.prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.unread-badge{background:var(--fb-blue);color:white;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--fb-card);overflow:hidden;position:relative}
.top{flex-shrink:0;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.top-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;color:white;overflow:hidden}
.top-av img{width:100%;height:100%;object-fit:cover}
.top-info h3{font-size:15px;font-weight:600;margin:0}
.top-info small{font-size:12px;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:6px;background:var(--fb-card)}
.date-sep{text-align:center;margin:16px 0 8px;font-size:12px;color:var(--muted)}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.msg-bubble{max-width:100%;padding:8px 12px;border-radius:18px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35}
.msg-row.me .msg-bubble{background:var(--fb-blue);color:white;border-bottom-right-radius:4px}
.msg-row.other .msg-bubble{background:#f0f2f5;color:var(--text);border-bottom-left-radius:4px}
body.dark .msg-row.other .msg-bubble{background:#3a3b3c;color:#e4e6eb}
.msg-photo{margin-top:6px;border-radius:12px;overflow:hidden;width:200px;height:200px;background:#000;cursor:pointer;border:1px solid var(--border)}
.msg-photo img{width:100%;height:100%;object-fit:cover}
.msg-audio{margin-top:6px}
.msg-audio audio{width:220px}
.input-area{flex-shrink:0;padding:8px 12px;background:var(--fb-card);border-top:1px solid var(--border)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.tbtn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--fb-blue)}
.input-row textarea{flex:1;min-height:36px;max-height:120px;padding:10px 14px;border-radius:20px;border:0;background:var(--fb-bg);color:var(--text);outline:none;resize:none;font-size:15px}
body.dark .input-row textarea{background:#3a3b3c}
.send-btn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:0;background:var(--fb-blue);color:white;font-size:18px;cursor:pointer;display:grid;place-items:center}
.send-btn:disabled{opacity:.4}
.rec-bar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#ffebe9;border-radius:20px;margin-bottom:8px}
body.dark .rec-bar{background:#4a1c1c}
.rec-bar.show{display:flex}
#photoPreview{display:none;background:var(--fb-card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:8px}
#photoPreview.show{display:block}
.preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:160px;overflow-y:auto}
.preview-grid img{width:100%;height:70px;object-fit:cover;border-radius:8px}
.preview-actions{display:flex;gap:8px;margin-top:8px}
.preview-actions button{flex:1;padding:10px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btnSend{background:var(--fb-blue);color:white}
.btnCancel{background:var(--fb-bg);color:var(--text)}
.scroll-down{position:absolute;bottom:80px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--fb-card);color:var(--fb-blue);border:1px solid var(--border);display:none;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:10;font-weight:900}
.scroll-down.show{display:grid}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.m-card{width:100%;max-width:420px;background:var(--fb-card);border-radius:12px;overflow:hidden}
.m-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-weight:700}
.m-body{padding:16px}
.m-body textarea{width:100%;min-height:60px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--fb-bg);color:var(--text);outline:none;resize:none}
.m-foot{padding:12px;display:flex;gap:8px;border-top:1px solid var(--border)}
.btn{flex:1;padding:10px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.preview{margin-top:10px;border-radius:12px;overflow:hidden;max-height:300px;background:var(--fb-bg)}
.preview img{width:100%;object-fit:cover}
#storyViewer{position:fixed;inset:0;background:#000;z-index:6000;display:none;flex-direction:column}
#storyViewer.show{display:flex}
.sv-top{padding:12px;display:flex;justify-content:space-between;align-items:center;color:white}
.sv-img{flex:1;display:grid;place-items:center;position:relative}
.sv-img img{max-width:100%;max-height:100%;object-fit:contain}
.sv-note{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:white;padding:10px 16px;border-radius:20px;font-weight:800;text-align:center}
.sv-bottom{padding:16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));color:white}
.heart-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:white;font-weight:700;cursor:pointer}
.heart-btn.liked{background:#ff3b30;border-color:#ff3b30}
#imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;display:none;flex-direction:column}
#imgViewer.show{display:flex}
.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#242526}
.viewer-content{flex:1;display:grid;place-items:center;overflow:hidden}
.viewer-content img{max-width:100%;max-height:100%;object-fit:contain}
@media(max-width:800px){.left{position:absolute;inset:56px 0 0;width:100%;z-index:20}.left.hide{display:none}.right{width:100%}}
</style>
</head>
<body>
<header>
<div class="brand">jason business • <span id="myPhoneShow" style="font-size:12px;opacity:.6;font-weight:400"></span></div>
<div class="header-actions">
<button class="icon-btn" onclick="location.href='dashboard.html'">📊</button>
<button class="icon-btn" onclick="location.reload()">🔄</button>
</div>
</header>
<div class="wrap">
<aside class="left" id="leftPanel">
<div class="left-header"><h2>Messenger</h2><div style="display:flex;gap:8px"><button class="icon-btn" onclick="openModal('storyModal')">📷</button><button class="icon-btn">⚙️</button></div></div>
<div class="search-box">🔍<input id="search" placeholder="Rechercher"></div>
<div class="tabs"><button class="tab active" data-tab="chats">Boîte</button><button class="tab" data-tab="users">👥 Utilisateurs</button><button class="tab" data-tab="requests">🔔 Demandes <span id="reqCount" style="background:#ff3b30;color:white;padding:2px 6px;border-radius:10px;font-size:10px;display:none">0</span></button></div>
<div class="stories" id="stories"><div class="story" onclick="openModal('storyModal')"><div class="story-av"><div>➕</div></div><span>Créer story</span></div></div>
<div style="padding:8px 16px;display:flex;gap:8px;border-bottom:1px solid var(--border)"><input id="manualPhone" placeholder="+243..." style="flex:1;padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--fb-bg);color:var(--text);outline:none"><button class="icon-btn" id="btnAddManual" style="background:var(--fb-blue);color:white">+</button></div>
<div class="list" id="list"></div>
<div style="padding:10px;display:flex;gap:8px;border-top:1px solid var(--border)"><button class="tab" style="flex:1" onclick="location.href='dashboard.html'">🏠 Dash</button><button class="tab" style="flex:1" onclick="location.href='parametres.html'">⚙️ Param</button></div>
</aside>
<section class="right">
<div class="top"><div class="top-left" id="topLeft"><div class="top-av" id="chatAvatar">JB</div><div class="top-info"><h3 id="chatName">Sélectionne un chat</h3><small id="chatPhone">Tape un message • Vocal • Photo</small></div></div><div style="display:flex;gap:8px"><button class="icon-btn">📞</button><button class="icon-btn">📹</button></div></div>
<div class="msgs" id="msgs"><div style="margin:auto;text-align:center;opacity:.5;padding:40px"><div style="font-size:50px">💬</div><div style="margin-top:10px;font-weight:700">Vos messages</div><div style="font-size:12px;margin-top:4px">Anciens + Nouveaux messages visibles</div><div id="debug" style="margin-top:10px;font-size:10px;color:var(--fb-blue)"></div></div></div>
<div id="scrollDown" class="scroll-down">↓</div>
<div class="input-area">
<div id="photoPreview"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b id="previewCount" style="color:var(--fb-blue)">0 photos</b></div><div id="previewGrid" class="preview-grid"></div><textarea id="photoCaption" placeholder="Légende..." style="margin-top:8px;width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--fb-bg);color:var(--text);resize:none;min-height:36px"></textarea><div class="preview-actions"><button class="btnCancel" id="cancelPhoto">Annuler</button><button class="btnSend" id="confirmPhoto">Envoyer</button></div><div id="uploadProgress" style="display:none;margin-top:8px;text-align:center;font-size:12px;color:var(--fb-blue)"></div></div>
<div id="recBar" class="rec-bar"><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;background:#ff3b30;border-radius:50%;animation:pulse 1s infinite"></div><div id="recTime" style="font-weight:800">00:00</div><small>Enregistrement...</small></div><div style="display:flex;gap:6px"><button id="recCancel" style="padding:6px 10px;border-radius:20px;border:1px solid #ff3b30;background:transparent;color:#ff3b30">Annuler</button><button id="recSend" style="padding:6px 12px;border-radius:20px;border:0;background:var(--fb-blue);color:white;font-weight:700">Envoyer</button></div></div>
<div class="input-row"><label class="tbtn">🖼️<input type="file" id="photoInput" accept="image/*" multiple hidden></label><textarea id="msgInput" placeholder="Aa" disabled rows="1"></textarea><button class="tbtn" id="recordBtn" disabled>🎙️</button><button class="send-btn" id="sendBtn" disabled>➤</button></div>
<div id="status" style="text-align:center;font-size:11px;color:var(--fb-blue);margin-top:4px">Prêt</div>
</div>
</section>
</div>

<div class="modal" id="storyModal"><div class="m-card"><div class="m-head"><span>📸 Story 24h</span><button onclick="closeModal('storyModal')" style="border:0;background:var(--fb-bg);width:32px;height:32px;border-radius:50%">✕</button></div><div class="m-body"><textarea id="storyNote" placeholder="Note..."></textarea><div class="preview" id="storyPreview" style="margin-top:12px"></div><input type="file" id="storyFile" accept="image/*" hidden><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btnCancel" onclick="document.getElementById('storyFile').click()">🖼️ Photo</button><button class="btn btnSend" onclick="publishStory()">Publier</button></div></div></div></div>
<div id="storyViewer"><div class="sv-top"><div style="display:flex;gap:10px;align-items:center"><div class="av" id="svAv" style="width:36px;height:36px">JA</div><div><b id="svName">Jason</b><br><small id="svTime"></small></div></div><button onclick="closeStory()" style="background:rgba(255,255,255,.2);border:0;color:white;width:36px;height:36px;border-radius:50%">✕</button></div><div class="sv-img" id="svContent"></div><div class="sv-bottom"><div id="svViewsInfo">👁️ 0 vues • ❤️ 0</div><button class="heart-btn" id="heartBtn" onclick="heartStory()">❤️ <span id="heartCount">0</span></button></div></div>
<div id="imgViewer"><div class="viewer-top"><button onclick="closeViewer()" style="background:transparent;border:0;color:white;font-size:22px">✕</button><span style="color:white">Photo</span><button onclick="closeViewer()" style="background:transparent;border:0;color:white;font-size:22px">✕</button></div><div class="viewer-content" id="viewerContent"><img id="viewerImg" src=""></div></div>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,push,set,get,remove,update,onDisconnect} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

// ✅ FIX NUMERO - TON CAS 0847500590
const rawPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone")||"";
if(!rawPhone) location.replace("login.html");
$("myPhoneShow").textContent=rawPhone;

// NORMALISE: 0847500590 et 243847500590 et +243847500590 => tous deviennent 0847500590
function normalizePhone(p){
  let s=String(p).replace(/[^0-9]/g,"");
  if(s.startsWith("243") && s.length>=12) s="0"+s.slice(3); // 243847500590 => 0847500590
  if(s.length===9) s="0"+s; // 847500590 => 0847500590
  return s;
}
const myPhone=normalizePhone(rawPhone);
const myPhoneVariants=[rawPhone, myPhone, "243"+myPhone.slice(1), "+243"+myPhone.slice(1), myPhone.slice(1)].filter(Boolean);
console.log("MY PHONE VARIANTS", myPhoneVariants);

let myName=localStorage.getItem("jb_display_name")||"Jason";
let myPhoto=localStorage.getItem("jb_display_photo")||"";
const jbTheme=localStorage.getItem("jb_theme")||"dark";
if(jbTheme==="light") document.body.classList.remove("dark"); else document.body.classList.add("dark");

let tab="chats",activeChat=null,activeChatRaw=null,allUsers={},myRequests={},myChats={},presenceCache={},manualUsers=[],unsub=null,allMessages=[],storiesCache=[],pendingPhotos=[];

try{manualUsers=JSON.parse(localStorage.getItem("jb_manual_users")||"[]").map(normalizePhone);}catch{manualUsers=[];}
window.goPage=p=>window.location.href=p;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getChatId(a,b){return[normalizePhone(a),normalizePhone(b)].sort().join("_");}
function getAllChatIds(a,b){
  const na=normalizePhone(a), nb=normalizePhone(b);
  const ra=String(a).replace(/[^0-9]/g,""), rb=String(b).replace(/[^0-9]/g,"");
  return [
    [na,nb].sort().join("_"),
    [ra,rb].sort().join("_"),
    `${na}_${nb}`,
    `${nb}_${na}`,
    `${ra}_${rb}`,
    `${rb}_${ra}`,
    `${a}_${b}`,
    `${b}_${a}`
  ].filter((v,i,arr)=>arr.indexOf(v)===i);
}
function isOnline(ph){const p=presenceCache[normalizePhone(ph)];return !!(p&&p.online&&Date.now()-(p.lastSeen||0)<90000);}
function getUserPhoto(ph){const norm=normalizePhone(ph); return allUsers[norm]?.photo||allUsers[ph]?.photo||"";}
window.openModal=id=>$(id).classList.add("show");
window.closeModal=id=>$(id).classList.remove("show");
window.openStoryModal=()=>openModal("storyModal");
function setStatus(t){$("status").textContent=t; console.log(t);}

const presenceRef=ref(db,`jasonBusiness/presence/${myPhone}`);
set(presenceRef,{online:true,lastSeen:Date.now(),raw:rawPhone}).catch(()=>{});
onDisconnect(presenceRef).set({online:false,lastSeen:Date.now()}).catch(()=>{});
setInterval(()=>set(presenceRef,{online:true,lastSeen:Date.now(),activeChat:activeChat}).catch(()=>{}),20000);

onValue(ref(db,"jasonBusiness/presence"),s=>{
  const val=s.val()||{}; const norm={};
  Object.entries(val).forEach(([k,v])=>{norm[normalizePhone(k)]=v; norm[k]=v;});
  presenceCache=norm; render();
});
onValue(ref(db,"jasonBusiness/users"),s=>{
  const val=s.val()||{}; const norm={};
  Object.entries(val).forEach(([k,v])=>{const n=normalizePhone(k); norm[n]= {...v, originalPhone:k}; norm[k]= {...v, originalPhone:k};});
  allUsers=norm;
  if(allUsers[myPhone]){myName=allUsers[myPhone].nom||myName; if(allUsers[myPhone].photo) myPhoto=allUsers[myPhone].photo;}
  render();
});

// ✅ FIX: LIRE user_chats SUR TOUS LES VARIANTS
function listenChats(){
  myPhoneVariants.forEach(variant=>{
    onValue(ref(db,`jasonBusiness/user_chats/${variant}`),snap=>{
      if(!snap.exists()) return;
      const data=snap.val()||{};
      Object.entries(data).forEach(([chatId,chatData])=>{
        const normId=getChatId(myPhone, chatData.with||chatId.split("_").find(p=>normalizePhone(p)!==myPhone)||"");
        // Fusionne
        if(!myChats[normId] || (chatData.lastTime||0) > (myChats[normId].lastTime||0)){
          myChats[normId]=chatData;
        }
      });
      render();
    });
  });
}
listenChats();

onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),s=>{myRequests=s.val()||{};const n=Object.values(myRequests).filter(r=>r.type==="incoming"&&r.status==="pending").length;$("reqCount").textContent=n;$("reqCount").style.display=n?"inline-block":"none";render();});

onValue(ref(db,"jasonBusiness/stories"),s=>{
  const all=Object.entries(s.val()||{}).map(([k,v])=>({...v,id:k}));
  const now=Date.now();
  storiesCache=all.filter(st=>{
    if(!st.createdAt) return true;
    if((now-st.createdAt)>86400000){remove(ref(db,`jasonBusiness/stories/${st.id}`));return false;}
    return true;
  }).sort((a,b)=>b.createdAt-a.createdAt);
  renderStories();
});

function renderStories(){
  const box=$("stories");
  box.innerHTML=`<div class="story" onclick="openModal('storyModal')"><div class="story-av"><div>➕</div></div><span>Créer story</span></div>`;
  storiesCache.forEach(st=>{
    const isMine=normalizePhone(st.from)===myPhone;
    const div=document.createElement("div");div.className="story";
    div.innerHTML=`<div class="story-av"><div>${st.fromPhoto?`<img src="${st.fromPhoto}">`:esc((st.fromName||st.from).slice(-2))}</div></div><span>${esc(isMine?"Ta story":(st.fromName||st.from).slice(0,10))}</span>`;
    div.onclick=()=>viewStory(st);box.appendChild(div);
  });
}

let storyFileBase64=null;
$("storyFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{storyFileBase64=r.result;$("storyPreview").innerHTML=`<img src="${r.result}" style="width:100%;border-radius:12px">`;};r.readAsDataURL(f);
};
window.publishStory=async()=>{
  if(!storyFileBase64) return alert("Choisis photo!");
  const note=$("storyNote").value.trim();
  const id=push(ref(db,"jasonBusiness/stories")).key;
  await set(ref(db,`jasonBusiness/stories/${id}`),{from:myPhone,fromRaw:rawPhone,fromName:myName,fromPhoto:myPhoto,photo:storyFileBase64,note,createdAt:Date.now(),expireAt:Date.now()+86400000,views:{},hearts:{}});
  closeModal("storyModal");$("storyPreview").innerHTML="";$("storyNote").value="";storyFileBase64=null;
};

let currentStory=null;
window.viewStory=async(st)=>{
  currentStory=st;$("storyViewer").classList.add("show");
  $("svAv").innerHTML=st.fromPhoto?`<img src="${st.fromPhoto}">`:esc((st.fromName||"").slice(0,2));
  $("svName").textContent=st.fromName||st.from;$("svTime").textContent=new Date(st.createdAt).toLocaleTimeString();
  $("svContent").innerHTML=`<div style="position:relative;width:100%;height:100%;display:grid;place-items:center"><img src="${st.photo}" style="max-width:100%;max-height:100%;object-fit:contain">${st.note?`<div class="sv-note">${esc(st.note)}</div>`:""}</div>`;
  const viewsCount=Object.keys(st.views||{}).length,heartsCount=Object.keys(st.hearts||{}).length;
  $("svViewsInfo").textContent=`👁️ ${viewsCount} vues • ❤️ ${heartsCount}`;
  $("heartCount").textContent=heartsCount;
  if(normalizePhone(st.from)!==myPhone) await set(ref(db,`jasonBusiness/stories/${st.id}/views/${myPhone}`),{name:myName,time:Date.now()});
};
window.closeStory=()=>{$("storyViewer").classList.remove("show");};
window.heartStory=async()=>{
  if(!currentStory||normalizePhone(currentStory.from)===myPhone) return;
  const refHeart=ref(db,`jasonBusiness/stories/${currentStory.id}/hearts/${myPhone}`);
  const snap=await get(refHeart);
  if(snap.exists()) await remove(refHeart); else await set(refHeart,{name:myName,time:Date.now()});
};

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");tab=t.dataset.tab;render();});
$("search").oninput=render;
$("topLeft").onclick=()=>{if(innerWidth<=800)$("leftPanel").classList.remove("hide");};
$("btnAddManual").onclick=()=>{let p=$("manualPhone").value.trim();if(!p||p.length<8)return;p=normalizePhone(p);if(p===myPhone)return;if(!manualUsers.includes(p))manualUsers.push(p);localStorage.setItem("jb_manual_users",JSON.stringify(manualUsers));$("manualPhone").value="";render();};

function getCombinedUsers(){
  const c={};Object.entries(allUsers).forEach(([k,v])=>{c[normalizePhone(k)]=v;});
  manualUsers.forEach(p=>{if(!c[p])c[p]={telephone:p,nom:p};});
  return c;
}

function render(){
 const q=($("search").value||"").toLowerCase(),cont=$("list");cont.innerHTML="";
 const users=getCombinedUsers();
 if(tab==="users"){
  Object.entries(users).forEach(([phone,u])=>{
   if(phone===myPhone)return;
   if(q&&!phone.includes(q)&&!String(u.nom||"").toLowerCase().includes(q))return;
   const id=getChatId(myPhone,phone),friend=myChats[id]?.status==="accepted",sent=myRequests[phone]?.type==="outgoing"&&myRequests[phone]?.status==="pending",photo=getUserPhoto(phone),online=isOnline(phone);
   const div=document.createElement("div");div.className="item";div.innerHTML=`<div class="av">${photo?`<img src="${esc(photo)}">`:esc(phone.slice(-2))}${online?'<div class="online-dot"></div>':''}</div><div class="info"><div class="name">${esc(u.nom||phone)}</div><div class="prev">${esc(phone)} ${online?'• En ligne':''}</div></div><div>${friend?"💬":sent?"⏳":"+"}</div>`;div.onclick=()=>friend?openChat(phone):!sent&&sendRequest(phone);cont.appendChild(div);
  });
 }else if(tab==="requests"){
  const reqs=Object.entries(myRequests).filter(([_,r])=>r.type==="incoming"&&r.status==="pending");
  if(!reqs.length){cont.innerHTML='<div style="padding:20px;text-align:center;opacity:.6">Aucune demande</div>';return;}
  reqs.forEach(([phone])=>{const div=document.createElement("div");div.className="item";div.innerHTML=`<div class="av">${esc(phone.slice(-2))}</div><div class="info"><div class="name">${esc(allUsers[phone]?.nom||phone)}</div><div class="prev">Veut vous contacter</div></div>`;const b=document.createElement("button");b.className="icon-btn";b.style.background="var(--fb-blue)";b.style.color="white";b.textContent="✓";b.onclick=()=>acceptRequest(phone);div.appendChild(b);cont.appendChild(div);});
 }else{
  const list=Object.entries(myChats).filter(([_,c])=>c.status==="accepted").sort((a,b)=>(b[1].lastTime||0)-(a[1].lastTime||0));
  if(!list.length){cont.innerHTML='<div style="padding:20px;text-align:center;opacity:.6">Aucun chat.<br>Va dans Utilisateurs pour ajouter.<br><br>Ton numéro: '+rawPhone+'<br>Normalisé: '+myPhone+'</div>';return;}
  list.forEach(([id,chat])=>{
    const other=id.split("_").find(p=>normalizePhone(p)!==myPhone)||chat.with||chat.withRaw; if(!other) return;
    const normOther=normalizePhone(other); const photo=getUserPhoto(normOther); const unread=Number(chat.unread)||0; const online=isOnline(normOther);
    const div=document.createElement("div");div.className="item"+(activeChat===normOther?" active":"");div.innerHTML=`<div class="av">${photo?`<img src="${esc(photo)}">`:esc(normOther.slice(-2))}${online?'<div class="online-dot"></div>':''}</div><div class="info"><div class="name">${esc(allUsers[normOther]?.nom||other)}</div><div class="prev">${esc((chat.lastMsg||"").slice(0,32))}</div></div><div style="text-align:right"><div style="font-size:11px;color:var(--muted)">${chat.lastTime?new Date(chat.lastTime).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""}</div>${unread?`<div class="unread-badge">${unread}</div>`:""}</div>`;div.onclick=()=>openChat(other);cont.appendChild(div);
  });
 }
}

async function sendRequest(to){
  const toNorm=normalizePhone(to);
  await Promise.all([set(ref(db,`jasonBusiness/chat_requests/${myPhone}/${toNorm}`),{phone:toNorm,phoneRaw:to,type:"outgoing",status:"pending",createdAt:Date.now()}),set(ref(db,`jasonBusiness/chat_requests/${toNorm}/${myPhone}`),{phone:myPhone,phoneRaw:rawPhone,type:"incoming",status:"pending",createdAt:Date.now()})]);
  setStatus("✅ Demande envoyée à "+toNorm);
}
async function acceptRequest(from){
  const fromNorm=normalizePhone(from);
  const id=getChatId(myPhone,fromNorm);
  await Promise.all([set(ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`),{with:fromNorm,withRaw:from,status:"accepted",lastMsg:"Vous êtes maintenant amis",lastTime:Date.now(),unread:0}),set(ref(db,`jasonBusiness/user_chats/${fromNorm}/${id}`),{with:myPhone,withRaw:rawPhone,status:"accepted",lastMsg:"Vous êtes maintenant amis",lastTime:Date.now(),unread:1}),remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromNorm}`)),remove(ref(db,`jasonBusiness/chat_requests/${fromNorm}/${myPhone}`))]);
  document.querySelector('[data-tab="chats"]').click();openChat(from);
}

function openChat(other){
  const otherNorm=normalizePhone(other);
  activeChat=otherNorm;activeChatRaw=other;
  if(unsub){unsub();unsub=null;}
  const photo=getUserPhoto(otherNorm);
  $("chatName").textContent=allUsers[otherNorm]?.nom||other;
  $("chatPhone").textContent=isOnline(otherNorm)?"En ligne • Actif":"Hors ligne • "+other;
  $("chatAvatar").innerHTML=photo?`<img src="${esc(photo)}">`:esc(otherNorm.slice(-2));
  $("msgInput").disabled=false;$("sendBtn").disabled=false;$("recordBtn").disabled=false;
  if(innerWidth<=800)$("leftPanel").classList.add("hide");
  
  // ✅ FIX ULTRA: Cherche dans TOUS les IDs possibles
  const ids=getAllChatIds(myPhone,otherNorm);
  setStatus("🔍 Recherche messages dans "+ids.length+" salons...");
  $("debug").textContent="IDs: "+ids.join(", ");
  
  let merged={};
  let remaining=ids.length;
  ids.forEach(chatId=>{
    onValue(ref(db,`jasonBusiness/messages/${chatId}`),snap=>{
      const data=snap.val()||{};
      Object.entries(data).forEach(([k,v])=>{
        merged[k]=v; // fusionne
      });
      remaining--;
      if(remaining===0 || Object.keys(merged).length>0){
        allMessages=Object.entries(merged).map(([k,v])=>({...v,_key:k})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
        renderMessages();
        if(allMessages.length>0) setStatus(`✅ ${allMessages.length} messages trouvés dans ${chatId}`);
      }
    });
  });
  
  // Listener principal sur ID normalisé
  const mainId=getChatId(myPhone,otherNorm);
  unsub=onValue(ref(db,`jasonBusiness/messages/${mainId}`),s=>{
    // Si on a déjà des messages d'autres IDs, on merge
    if(s.exists()){
      const data=s.val()||{};
      Object.entries(data).forEach(([k,v])=>{merged[k]=v;});
      allMessages=Object.entries(merged).map(([k,v])=>({...v,_key:k})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      renderMessages();
    }
    update(ref(db,`jasonBusiness/user_chats/${myPhone}/${mainId}`),{unread:0}).catch(()=>{});
  });
  
  render();$("msgInput").focus();
}

function renderMessages(){
  const container=$("msgs");
  if(!allMessages.length){
    container.innerHTML=`<div style="margin:auto;text-align:center;opacity:.6;padding:30px"><div style="font-size:50px">💬</div><div style="margin-top:10px;font-weight:700">Aucun ancien message trouvé</div><div style="font-size:12px;margin-top:6px">Mais tu peux envoyer un nouveau!<br>Ton salon: ${getChatId(myPhone,activeChat)}<br>Ancien salon peut-être: ${activeChatRaw}_${rawPhone}</div><div style="margin-top:10px"><button onclick="forceMigrate()" style="padding:8px 12px;border-radius:8px;border:1px solid var(--fb-blue);background:rgba(0,132,255,.1);color:var(--fb-blue)">🔄 Migrer anciens messages</button></div></div>`;
    return;
  }
  let html="",lastDate="";
  allMessages.forEach(m=>{
    const d=new Date(m.createdAt||0).toDateString(); if(d!==lastDate){lastDate=d; html+=`<div class="date-sep">${new Date(m.createdAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</div>`;}
    const mine=normalizePhone(m.from)===myPhone;
    let bubble="";
    if(m.text) bubble+=`<div>${esc(m.text)}</div>`;
    if(m.photo) bubble+=`<div class="msg-photo" onclick="openViewer('${m.photo}')"><img src="${m.photo}" loading="lazy"></div>`;
    if(m.audio) bubble+=`<div class="msg-audio"><audio controls src="${m.audio}"></audio></div>`;
    if(!bubble) bubble="<i style='opacity:.5'>Message vide</i>";
    html+=`<div class="msg-row ${mine?'me':'other'}"><div class="msg-bubble">${bubble}</div></div><div style="font-size:11px;color:var(--muted);margin:2px 0 8px ${mine?'auto 0':'0 auto'};text-align:${mine?'right':'left'}">${new Date(m.createdAt||0).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} ${mine?'✓':''}</div>`;
  });
  container.innerHTML=html; container.scrollTop=container.scrollHeight;
}
window.forceMigrate=async()=>{
  if(!activeChat) return;
  const oldIds=[`${activeChatRaw}_${rawPhone}`, `${rawPhone}_${activeChatRaw}`, `${activeChatRaw}_${myPhone}`, `${myPhone}_${activeChatRaw}`];
  let count=0;
  for(let oldId of oldIds){
    const snap=await get(ref(db,`jasonBusiness/messages/${oldId}`));
    if(snap.exists()){
      const data=snap.val();
      const newId=getChatId(myPhone,activeChat);
      for(let [k,v] of Object.entries(data)){
        await set(push(ref(db,`jasonBusiness/messages/${newId}`)),v);
        count++;
      }
    }
  }
  setStatus(`✅ Migré ${count} anciens messages vers ${getChatId(myPhone,activeChat)}`);
  alert(`Migré ${count} messages!`);
};

async function publishMessage(other,fields,lastMsg){
 const otherNorm=normalizePhone(other);
 const id=getChatId(myPhone,otherNorm),now=Date.now();
 const data={...fields,from:myPhone,fromRaw:rawPhone,to:otherNorm,toRaw:other,createdAt:now,status:"sent"};
 try{
   const newRef=push(ref(db,`jasonBusiness/messages/${id}`));
   await set(newRef,data);
   setStatus("✅ Message envoyé dans "+id);
   // Update chats
   const a=ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`),b=ref(db,`jasonBusiness/user_chats/${otherNorm}/${id}`);
   const [sa,sb]=await Promise.all([get(a),get(b)]);const da=sa.val()||{},dbb=sb.val()||{};
   await Promise.all([set(a,{...da,with:otherNorm,withRaw:other,status:"accepted",lastMsg,lastTime:now,unread:0}),set(b,{...dbb,with:myPhone,withRaw:rawPhone,status:"accepted",lastMsg,lastTime:now,unread:(Number(dbb.unread)||0)+1})]);
 }catch(e){
   setStatus("❌ Erreur: "+e.message);
   alert("Erreur envoi: "+e.message+" \nVérifie connexion Firebase Rules");
   throw e;
 }
}

$("photoInput").addEventListener("change",async e=>{
 const files=Array.from(e.target.files||[]); if(!files.length) return;
 if(!activeChat) return alert("Ouvre un chat d'abord");
 if(files.length>20) return alert("Max 20 photos");
 pendingPhotos=[]; const grid=$("previewGrid"); grid.innerHTML=""; $("photoPreview").classList.add("show");
 for(let file of files){
  if(file.size>2*1024*1024){alert(file.name+" trop grand (max 2MB)"); continue;}
  const b64=await new Promise(r=>{const fr=new FileReader();fr.readAsDataURL(file);fr.onload=()=>r(fr.result);});
  pendingPhotos.push(b64); const img=document.createElement("img"); img.src=b64; grid.appendChild(img);
 }
 $("previewCount").textContent=pendingPhotos.length+" photos"; $("confirmPhoto").textContent="Envoyer "+pendingPhotos.length;
});
$("cancelPhoto").onclick=()=>{$("photoPreview").classList.remove("show");pendingPhotos=[];$("previewGrid").innerHTML="";};
$("confirmPhoto").onclick=async()=>{
 if(!pendingPhotos.length||!activeChat) return;
 const other=activeChat; const caption=$("photoCaption").value.trim();
 $("confirmPhoto").disabled=true; $("uploadProgress").style.display="block";
 try{
   for(let i=0;i<pendingPhotos.length;i++){
     $("uploadProgress").textContent=`Envoi ${i+1}/${pendingPhotos.length}...`;
     await publishMessage(other,{photo:pendingPhotos[i],type:"image",text:i===pendingPhotos.length-1?caption:""}, caption||`📷 Photo`);
   }
   $("photoPreview").classList.remove("show"); pendingPhotos=[]; $("previewGrid").innerHTML=""; $("photoCaption").value=""; $("uploadProgress").style.display="none";
   setStatus("✅ Photos envoyées!");
 }catch(err){setStatus("❌ Erreur photo: "+err.message); alert(err.message);} finally{$("confirmPhoto").disabled=false;}
};

window.openViewer=src=>{$("viewerImg").src=src;$("imgViewer").classList.add("show");};
window.closeViewer=()=>{$("imgViewer").classList.remove("show");};

async function sendText(){
  const text=$("msgInput").value.trim(); if(!text||!activeChat) return;
  const other=activeChat; $("msgInput").value="";
  setStatus("⏳ Envoi en cours...");
  try{await publishMessage(other,{text},text); setStatus("✅ Envoyé!");}catch(e){$("msgInput").value=text; setStatus("❌ Erreur");}
  $("msgs").scrollTop=$("msgs").scrollHeight;
}
$("sendBtn").onclick=sendText;
$("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}});

// VOCAL FIX
let rec=null,chunks=[],recTimer=null,recSec=0;
$("recordBtn").onclick=async()=>{
  if(rec&&rec.state==="recording"){rec.stop();return;}
  if(!activeChat) return alert("Ouvre un chat");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];recSec=0;rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4'});
    rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
    rec.onstop=async()=>{
      const blob=new Blob(chunks,{type:rec.mimeType});
      if(blob.size<800){setStatus("❌ Vocal trop court"); return;}
      if(blob.size>1.5*1024*1024){setStatus("❌ Vocal trop long (max 30s)"); return;}
      const b64=await new Promise(r=>{const fr=new FileReader();fr.readAsDataURL(blob);fr.onload=()=>r(fr.result);});
      try{
        await publishMessage(activeChat,{audio:b64,type:"audio"},"🎙️ Vocal");
        setStatus("✅ Vocal envoyé!");
      }catch(e){setStatus("❌ Erreur vocal: "+e.message);}
      stream.getTracks().forEach(t=>t.stop());
      $("recBar").classList.remove("show");$("recordBtn").textContent="🎙️";clearInterval(recTimer);
    };
    rec.start();
    $("recBar").classList.add("show");$("recordBtn").textContent="⏹️";$("recTime").textContent="00:00";
    recTimer=setInterval(()=>{recSec++;$("recTime").textContent=`00:${String(recSec).padStart(2,"0")}`;if(recSec>=30) rec.stop();},1000);
    setStatus("🎙️ Enregistrement...");
  }catch(e){setStatus("❌ Micro refusé: "+e.message); alert("Autorise le micro!");}
};
$("recSend").onclick=()=>{if(rec) rec.stop();};
$("recCancel").onclick=()=>{if(rec){chunks=[];rec.stop();} $("recBar").classList.remove("show");clearInterval(recTimer);$("recordBtn").textContent="🎙️";setStatus("❌ Vocal annulé");};

$("msgs").addEventListener("scroll",()=>{const c=$("msgs");$("scrollDown").classList.toggle("show",c.scrollHeight-c.scrollTop-c.clientHeight>200);});
$("scrollDown").onclick=()=>{$("msgs").scrollTop=$("msgs").scrollHeight;};
</script>
