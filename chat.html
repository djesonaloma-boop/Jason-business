<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JASON BUSINESS — Chat Vocal Fix</title>
<style>
:root{--blue:#00d2ff;--dark:#050a14;--red:#ff4757;--border:rgba(0,210,255,.18)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:white;background:#050a14;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{height:56px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#050a14;border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--blue)}.btn{padding:7px 10px;border-radius:9px;border:1px solid rgba(0,210,255,.25);background:rgba(0,210,255,.08);color:var(--blue);font-size:11px;cursor:pointer}
.wrap{display:flex;flex:1;overflow:hidden}
.left{width:360px;flex-shrink:0;background:#0b1425;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.tab{padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;opacity:.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;color:var(--blue);border-bottom-color:var(--blue)}
.search{padding:10px;border-bottom:1px solid var(--border)}
.search input,.add-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #293850;background:#0c192b;color:white;outline:none}
.list{flex:1;overflow-y:auto;padding:6px}
.item{padding:10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.item:hover{background:rgba(0,210,255,.06)}.item.active{background:rgba(0,210,255,.14);border-color:var(--blue)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#00d2ff,#0077ff);font-weight:900;overflow:hidden;flex-shrink:0;position:relative}
.av img{width:100%;height:100%;object-fit:cover}.online-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;background:#00e676;border:2px solid #0b1425;border-radius:50%}
.info{flex:1;min-width:0}.name{font-size:13px;font-weight:700}.prev{font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{flex:1;display:flex;flex-direction:column;background:#070e1e;overflow:hidden;min-width:0}
.top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(5,10,20,.95);flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:8px 10px;border-radius:16px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;border-bottom-right-radius:6px}
.msg.other{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.msg .photo-wrap{margin-top:6px;border-radius:12px;overflow:hidden;max-width:160px;max-height:160px;background:#000;display:block;border:1px solid rgba(255,255,255,.15)}
.msg .photo-wrap img{width:100%;height:auto;max-width:160px;max-height:160px;object-fit:cover;display:block}
.msg audio{margin-top:6px;width:200px;max-width:100%}
.input{padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;background:#0a1425;border-top:1px solid var(--border);flex-shrink:0}
.input textarea{flex:1;min-height:40px;max-height:90px;padding:10px 12px;border-radius:18px;border:1px solid #293850;background:#0c192b;color:white;outline:none;resize:none;font-size:13px}
.tbtn{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:1px solid #293850;background:#0c192b;color:white;display:grid;place-items:center;cursor:pointer;font-size:18px;transition:.2s}
.tbtn.hold{background:#ff4757!important;border-color:#ff4757!important;transform:scale(1.15);box-shadow:0 0 15px rgba(255,71,87,.6)}
.send{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:0;background:linear-gradient(135deg,#00d2ff,#0077ff);color:white;font-size:18px;cursor:pointer}
.debug{padding:8px 10px;background:#ffeb3b22;border:1px solid #ffeb3b44;color:#ffeb3b;font-size:10px;border-radius:8px;margin:6px}
.add-box{padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border)}
.empty{flex:1;display:grid;place-items:center;text-align:center;opacity:.6;padding:20px;font-size:12px}
.rec-indicator{display:none;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.3);border-radius:20px;font-size:11px;color:#ff6b7a;margin-bottom:6px}
.rec-indicator.show{display:flex}
.rec-dot{width:8px;height:8px;background:#ff4757;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.call-overlay{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#10203f 0%,#050a14 80%);align-items:center;justify-content:center;flex-direction:column;padding:20px}
.call-overlay.show{display:flex}
.call-avatar{width:110px;height:110px;border-radius:30px;background:linear-gradient(135deg,#00d2ff,#0077ff);display:grid;place-items:center;font-size:40px;font-weight:900;margin-bottom:14px}
.call-avatar img{width:100%;height:100%;object-fit:cover;border-radius:30px}
.call-name{font-size:18px;font-weight:800;margin:6px 0}.call-timer{font-size:13px;opacity:.7;margin-bottom:10px}
.call-videos{position:relative;width:100%;max-width:380px;height:520px;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--border);display:none}
.call-videos.show{display:block}
.call-videos video#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
.call-videos video#localVideo{position:absolute;right:12px;bottom:12px;width:90px;height:130px;border-radius:12px;border:2px solid white;object-fit:cover;background:#111}
.call-actions{display:flex;gap:14px;margin-top:18px}
.cbtn{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;font-size:22px;cursor:pointer}
.cbtn.hang{background:#ff4757;color:white}
.incoming-popup{display:none;position:fixed;top:10px;left:10px;right:10px;z-index:10000;background:#0b1425;border:1px solid var(--blue);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.incoming-popup.show{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:800px){.left{position:absolute;inset:0;z-index:20;width:100%}.left.hide{display:none}.msg{max-width:82%}}
</style>
</head>
<body>

<div id="incomingPopup" class="incoming-popup">
  <div style="display:flex;gap:10px;align-items:center"><div id="incomingAvatar" class="av" style="width:48px;height:48px">JB</div><div><div id="incomingName" style="font-weight:800">Appel...</div><div id="incomingType" style="font-size:11px;opacity:.7">📞 Vocal</div></div></div>
  <div style="display:flex;gap:8px"><button id="declineIncoming" class="cbtn hang" style="width:46px;height:46px">📵</button><button id="acceptIncoming" class="cbtn" style="width:46px;height:46px;background:#00e676;color:white">📞</button></div>
</div>

<header><div class="brand">💬 JASON CHAT — <span id="myPhoneShow">...</span></div><div style="display:flex;gap:6px"><button class="btn" id="btnShowLeft">☰</button><a href="dashboard.html" class="btn">Dash</a></div></header>
<div class="wrap">
  <aside class="left" id="leftPanel">
    <div class="tabs"><div class="tab active" data-tab="chats">💬 Chats</div><div class="tab" data-tab="users">👥 Utilisateurs</div><div class="tab" data-tab="requests">🔔 Demandes <span id="reqCount" style="background:#ff4757;color:white;padding:1px 5px;border-radius:10px;font-size:9px;display:none">0</span></div></div>
    <div class="add-box"><input id="manualPhone" placeholder="+243..."><button class="btn" id="btnAddManual">+</button></div>
    <div class="search"><input id="search" placeholder="🔍 Rechercher..."></div>
    <div id="debugArea"></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="right">
    <div class="top"><div style="display:flex;align-items:center;gap:8px"><div class="av" id="chatAvatar" style="width:36px;height:36px">JB</div><div><h3 id="chatName" style="margin:0;font-size:14px">Sélectionne un chat</h3><small id="chatPhone" style="font-size:11px;opacity:.6">Messenger</small></div></div><div style="display:flex;gap:6px"><button class="btn" id="voiceCallBtn">📞</button><button class="btn" id="videoCallBtn">🎥</button></div></div>
    <div class="msgs" id="msgs"><div class="empty">Entre dans un chat → reste appuyé sur 🎤 pour parler</div></div>
    <div style="padding:0 10px"><div id="recIndicator" class="rec-indicator"><div class="rec-dot"></div><span id="recTimer">00:00</span> • Relâche pour envoyer, glisse pour annuler</div></div>
    <div class="input">
      <label class="tbtn">🖼️<input type="file" id="photoInput" accept="image/*" hidden></label>
      <button class="tbtn" id="recordBtn">🎤</button>
      <textarea id="msgInput" placeholder="Écris un message..." disabled rows="1"></textarea>
      <button class="send" id="sendBtn" disabled>➤</button>
    </div>
    <div style="text-align:center;font-size:9px;opacity:.4;padding:2px">🎤 Reste appuyé pour vocal • Relâche pour envoyer</div>
  </section>
</div>

<div class="call-overlay" id="callOverlay"><div id="callAvatarBox" class="call-avatar">JB</div><div id="callName" class="call-name">El mago</div><div id="callStatus" class="call-timer">📞 Appel...</div><div id="callVideos" class="call-videos"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video></div><div class="call-actions"><button class="cbtn" id="muteBtn" style="background:rgba(255,255,255,.12)">🎤</button><button class="cbtn hang" id="hangBtn">📵</button><button class="cbtn" id="camBtn" style="background:rgba(255,255,255,.12)">🎥</button></div></div>

<audio id="outgoingRing" loop preload="auto" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg"></audio>
<audio id="incomingRing" loop preload="auto" src="https://actions.google.com/sounds/v1/ringtones/phone_ringtone_1.ogg"></audio>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, get, remove, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);
const myPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone");
if(!myPhone){location.replace("login.html");throw new Error("no phone")}
$("myPhoneShow").textContent=myPhone;

let tab="chats", activeChat=null, allUsers={}, myRequests={}, myChats={}, manualUsers=JSON.parse(localStorage.getItem("jb_manual_users")||"[]");
let pc=null, localStream=null, currentCallId=null, callTimerInt=null, callSec=0;
let presenceCache={};

function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function timeStr(ts){if(!ts) return ""; return new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function getChatId(a,b){return [a,b].sort().join("_")}

// PRESENCE
const presenceRef=ref(db,`jasonBusiness/presence/${myPhone}`);
set(presenceRef,{online:true,lastSeen:Date.now(),phone:myPhone}).catch(()=>{});
onDisconnect(presenceRef).set({online:false,lastSeen:Date.now(),phone:myPhone});
setInterval(()=>{ set(presenceRef,{online:true,lastSeen:Date.now(),phone:myPhone}); },30000);
onValue(ref(db,"jasonBusiness/presence"),s=>{ presenceCache=s.val()||{}; render(); });
function isOnline(ph){ const p=presenceCache[ph]; return p && p.online && (Date.now()-p.lastSeen<90000); }

// SONNERIE
let ringInterval=null;
function startOutgoingRing(){ stopAllRings(); $("outgoingRing").play().catch(()=>{}); if(navigator.vibrate) navigator.vibrate([300,200,300]); }
function startIncomingRing(){ stopAllRings(); $("incomingRing").play().catch(()=>{}); if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]); }
function stopAllRings(){ $("outgoingRing").pause(); $("incomingRing").pause(); if(navigator.vibrate) navigator.vibrate(0); }

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");tab=t.dataset.tab;render();});
$("search").oninput=()=>render();
$("btnShowLeft").onclick=()=>{ $("leftPanel").classList.remove("hide"); };

async function loadUsers(){ try{ const s=await get(ref(db,"jasonBusiness/users")); if(s.exists()){ allUsers=s.val()||{}; render(); return; } }catch{} allUsers={}; render(); }
loadUsers();
onValue(ref(db,"jasonBusiness/users"),s=>{ if(s.exists()){ allUsers=s.val()||{}; render(); }});
onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),s=>{ myRequests=s.val()||{}; const inc=Object.values(myRequests).filter(r=>r.type==="incoming"&&r.status==="pending").length; $("reqCount").textContent=inc; $("reqCount").style.display=inc>0?"inline-block":"none"; render(); });
onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),s=>{ myChats=s.val()||{}; render(); });

$("btnAddManual").onclick=()=>{ const p=$("manualPhone").value.trim(); if(!p||p.length<8)return; if(!manualUsers.includes(p)) manualUsers.push(p); localStorage.setItem("jb_manual_users",JSON.stringify(manualUsers)); $("manualPhone").value=""; render(); };
function getCombinedUsers(){ const c={...allUsers}; manualUsers.forEach(p=>{ if(!c[p]) c[p]={telephone:p,manuel:true} }); return c; }
function getUserPhoto(ph){ const u=allUsers[ph]||{}; return u.photo||u.photoProfil||u.avatar||""; }

function render(){
  const q=($("search").value||"").toLowerCase(); const cont=$("list"); cont.innerHTML=""; const users=getCombinedUsers();
  if(tab==="users"){
    Object.entries(users).forEach(([phone,u])=>{
      if(phone===myPhone) return; if(q && !phone.toLowerCase().includes(q)) return;
      const chatId=getChatId(myPhone,phone); const isFriend=myChats[chatId]?.status==="accepted"; const hasSent=myRequests[phone]?.type==="outgoing"; const photo=getUserPhoto(phone); const online=isOnline(phone);
      const div=document.createElement("div"); div.className="item";
      div.innerHTML=`<div class="av">${photo?`<img src="${photo}">`:esc(phone.slice(-2))}${online?`<div class="online-dot"></div>`:""}</div><div class="info"><div class="name">${esc(u.nom||u.name||phone)} ${online?"🟢":""}</div><div class="prev">${esc(phone)} • ${online?"En ligne":isFriend?"✅ Ami":"👤"}</div></div><div>${isFriend?"💬":hasSent?"⏳":"+"}</div>`;
      div.onclick=()=>{ if(isFriend) openChat(phone); else if(!hasSent) sendRequest(phone); }; cont.appendChild(div);
    });
  }else if(tab==="requests"){
    const reqs=Object.entries(myRequests).filter(([_,r])=>r.type==="incoming"); if(reqs.length===0){cont.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6">Aucune demande</div>`;return}
    reqs.forEach(([phone])=>{
      const photo=getUserPhoto(phone); const div=document.createElement("div"); div.className="item";
      div.innerHTML=`<div class="av">${photo?`<img src="${photo}">`:esc(phone.slice(-2))}</div><div class="info"><div class="name">${esc(allUsers[phone]?.nom||phone)}</div><div class="prev">Veut discuter</div></div>`;
      const btns=document.createElement("div"); btns.style.display="flex"; btns.style.gap="4px"; btns.innerHTML=`<button class="btn" style="background:#ffd700;color:#000" data-a="${phone}">Accepter</button><button class="btn" style="background:#ff475722" data-r="${phone}">Refuser</button>`;
      div.appendChild(btns); cont.appendChild(div);
    });
    cont.querySelectorAll("[data-a]").forEach(b=>b.onclick=e=>{e.stopPropagation(); acceptRequest(b.dataset.a);});
    cont.querySelectorAll("[data-r]").forEach(b=>b.onclick=e=>{e.stopPropagation(); refuseRequest(b.dataset.r);});
  }else{
    const list=Object.entries(myChats).filter(([_,c])=>c.status==="accepted").sort((a,b)=>(b[1].lastTime||0)-(a[1].lastTime||0));
    if(list.length===0){cont.innerHTML=`<div style="padding:20px;text-align:center;opacity:.6">Aucun chat</div>`;return}
    list.forEach(([chatId,chat])=>{
      const other=chatId.split("_").find(p=>p!==myPhone); if(!other) return; const photo=getUserPhoto(other); const online=isOnline(other);
      const div=document.createElement("div"); div.className="item"+(activeChat===other?" active":"");
      div.innerHTML=`<div class="av">${photo?`<img src="${photo}">`:esc(other.slice(-2))}${online?`<div class="online-dot"></div>`:""}</div><div class="info"><div class="name">${esc(allUsers[other]?.nom||other)} ${online?"🟢":""}</div><div class="prev">${esc((chat.lastMsg||"").slice(0,35))||"Nouveau"}</div></div><div style="font-size:9px;text-align:right"><div>${timeStr(chat.lastTime)}</div>${chat.unread?`<div style="background:#ff4757;padding:2px 6px;border-radius:10px;margin-top:3px">${chat.unread}</div>`:""}</div>`;
      div.onclick=()=>openChat(other); cont.appendChild(div);
    });
  }
}

async function sendRequest(toPhone){
  if(!confirm(`Demande à ${toPhone} ?`)) return;
  await set(ref(db,`jasonBusiness/chat_requests/${myPhone}/${toPhone}`),{phone:toPhone,type:"outgoing",status:"pending",createdAt:Date.now()});
  await set(ref(db,`jasonBusiness/chat_requests/${toPhone}/${myPhone}`),{phone:myPhone,type:"incoming",status:"pending",createdAt:Date.now()});
}
async function acceptRequest(fromPhone){
  const chatId=getChatId(myPhone,fromPhone);
  await set(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{with:fromPhone,status:"accepted",lastMsg:"✅ Accepté",lastTime:Date.now(),unread:0});
  await set(ref(db,`jasonBusiness/user_chats/${fromPhone}/${chatId}`),{with:myPhone,status:"accepted",lastMsg:"✅ Accepté",lastTime:Date.now(),unread:1});
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${fromPhone}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${fromPhone}/${myPhone}`));
  tab="chats"; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); document.querySelector('[data-tab="chats"]').classList.add("active"); render(); setTimeout(()=>openChat(fromPhone),300);
}
async function refuseRequest(p){ await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${p}`)); await remove(ref(db,`jasonBusiness/chat_requests/${p}/${myPhone}`)); }

function openChat(other){
  activeChat=other; const photo=getUserPhoto(other); const name=allUsers[other]?.nom||other;
  $("chatName").textContent=name; $("chatPhone").textContent= isOnline(other)?other+" • En ligne 🟢":"Hors ligne";
  if(photo) $("chatAvatar").innerHTML=`<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`; else $("chatAvatar").textContent=other.slice(-2);
  $("msgInput").disabled=false; $("sendBtn").disabled=false; if(window.innerWidth<=800) $("leftPanel").classList.add("hide");
  const chatId=getChatId(myPhone,other);
  onValue(ref(db,`jasonBusiness/messages/${chatId}`),snap=>{ const data=snap.val()||{}; const msgs=Object.values(data).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); renderMessages(msgs); update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{unread:0}).catch(()=>{}); }); render();
}
function renderMessages(msgs){
  const c=$("msgs"); if(msgs.length===0){ c.innerHTML=`<div style="flex:1;display:grid;place-items:center;opacity:.6;padding:20px">💬 Début avec ${esc(allUsers[activeChat]?.nom||activeChat)}</div>`; return; }
  c.innerHTML=""; msgs.forEach(m=>{
    const isMe=m.from===myPhone; const div=document.createElement("div"); div.className="msg "+(isMe?"me":"other");
    let html=esc(m.text||""); if(m.photo) html+=`<div class="photo-wrap"><img src="${m.photo}" onclick="window.open(this.src,'_blank')"></div>`;
    if(m.audio) html+=`<audio controls preload="metadata" src="${m.audio}" style="width:200px;margin-top:6px"></audio>`;
    html+=`<div style="font-size:8px;opacity:.6;margin-top:4px;text-align:right">${timeStr(m.createdAt)} ${isMe?"✓✓":""}</div>`;
    div.innerHTML=html; c.appendChild(div);
  }); c.scrollTop=c.scrollHeight;
}
async function sendText(){
  const text=$("msgInput").value.trim(); if(!text||!activeChat) return; $("msgInput").value="";
  const chatId=getChatId(myPhone,activeChat); const nr=push(ref(db,`jasonBusiness/messages/${chatId}`));
  await set(nr,{from:myPhone,to:activeChat,text,createdAt:Date.now()});
  const u=( (await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}/unread`))).val()||0)+1;
  await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:text,lastTime:Date.now()});
  const oe=await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`));
  if(!oe.exists()) await set(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{with:myPhone,status:"accepted",lastMsg:text,lastTime:Date.now(),unread:u});
  else await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:text,lastTime:Date.now(),unread:u});
}
$("sendBtn").onclick=sendText; $("msgInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendText(); }});

$("photoInput").onchange=e=>{
  const file=e.target.files[0]; if(!file||!activeChat) return; if(file.size>4*1024*1024){alert("Max 4Mo");return}
  const r=new FileReader(); r.onload=async()=>{
    const chatId=getChatId(myPhone,activeChat); const nr=push(ref(db,`jasonBusiness/messages/${chatId}`));
    await set(nr,{from:myPhone,to:activeChat,text:"📷 Photo",photo:r.result,createdAt:Date.now()});
    await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:"📷 Photo",lastTime:Date.now()});
    const u=( (await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}/unread`))).val()||0)+1;
    await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:"📷 Photo",lastTime:Date.now(),unread:u});
  }; r.readAsDataURL(file); e.target.value="";
};

// ================== VOCAL FIX DEFINITIF - APPUI LONG ==================
let mediaRecorder=null, audioChunks=[], isRecording=false, recordStream=null, recTimerInt=null, recSec=0, startX=0, isCancelled=false;

function formatRecTime(s){ const m=String(Math.floor(s/60)).padStart(2,'0'); const sec=String(s%60).padStart(2,'0'); return `${m}:${sec}`; }

async function startRecording(){
  if(!activeChat){ alert("Entre d'abord dans un chat"); return; }
  if(isRecording) return;

  // Vérif support
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Micro non supporté. Ouvre dans Chrome (pas Facebook)");
    return;
  }

  try{
    // Demande micro
    recordStream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    
    let mime="audio/webm;codecs=opus";
    if(!MediaRecorder.isTypeSupported(mime)) mime="audio/webm";
    if(!MediaRecorder.isTypeSupported(mime)) mime="audio/mp4";
    if(!MediaRecorder.isTypeSupported(mime)) mime="";

    mediaRecorder = mime ? new MediaRecorder(recordStream,{mimeType:mime}) : new MediaRecorder(recordStream);
    audioChunks=[]; isCancelled=false; recSec=0;

    mediaRecorder.ondataavailable=e=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };

    mediaRecorder.onstop=async()=>{
      clearInterval(recTimerInt);
      $("recIndicator").classList.remove("show");
      $("recordBtn").classList.remove("hold");
      $("recordBtn").textContent="🎤";
      
      if(isCancelled){
        recordStream.getTracks().forEach(t=>t.stop());
        isRecording=false;
        return;
      }

      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      console.log("vocal size",blob.size);

      if(blob.size<1000){
        alert("Trop court, reste appuyé au moins 1 sec");
        recordStream.getTracks().forEach(t=>t.stop());
        isRecording=false;
        return;
      }
      if(blob.size>550*1024){
        alert("Trop long, max 12 sec. Parle plus court.");
        recordStream.getTracks().forEach(t=>t.stop());
        isRecording=false;
        return;
      }

      const reader=new FileReader();
      reader.onload=async()=>{
        try{
          const chatId=getChatId(myPhone,activeChat);
          const nr=push(ref(db,`jasonBusiness/messages/${chatId}`));
          await set(nr,{from:myPhone,to:activeChat,text:"🎤 Vocal",audio:reader.result,createdAt:Date.now()});
          await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${chatId}`),{lastMsg:"🎤 Vocal",lastTime:Date.now()});
          const u=( (await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}/unread`))).val()||0)+1;
          const oe=await get(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`));
          if(!oe.exists()) await set(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{with:myPhone,status:"accepted",lastMsg:"🎤 Vocal",lastTime:Date.now(),unread:u});
          else await update(ref(db,`jasonBusiness/user_chats/${activeChat}/${chatId}`),{lastMsg:"🎤 Vocal",lastTime:Date.now(),unread:u});
        }catch(e){
          alert("Erreur envoi vocal: "+e.message+" — Essaie vocal plus court (5 sec)");
        }
        recordStream.getTracks().forEach(t=>t.stop());
        isRecording=false;
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start(100);
    isRecording=true;
    $("recordBtn").classList.add("hold");
    $("recordBtn").textContent="🔴";
    $("recIndicator").classList.add("show");
    $("recTimer").textContent="00:00";

    recTimerInt=setInterval(()=>{
      recSec++;
      $("recTimer").textContent=formatRecTime(recSec);
      if(recSec>=12){ // auto envoi à 12 sec
        try{ mediaRecorder.stop(); }catch{}
      }
    },1000);

  }catch(err){
    console.error(err);
    $("recIndicator").classList.remove("show");
    $("recordBtn").classList.remove("hold");
    $("recordBtn").textContent="🎤";
    isRecording=false;
    if(err.name==="NotAllowedError"){
      alert("❌ Micro bloqué:\n1. Clique sur cadenas 🔒 en haut dans Chrome\n2. Autorisations → Micro → Autoriser\n3. Recharge");
    }else{
      alert("❌ Erreur micro: "+err.name+" "+err.message+"\nOuvre en HTTPS dans Chrome, pas dans Facebook");
    }
  }
}

function stopRecording(cancel=false){
  if(!isRecording) return;
  isCancelled=cancel;
  try{ mediaRecorder.stop(); }catch{ isRecording=false; $("recIndicator").classList.remove("show"); $("recordBtn").classList.remove("hold"); $("recordBtn").textContent="🎤"; }
}

// Events: souris + tactile (appui long)
const micBtn=$("recordBtn");
micBtn.addEventListener('mousedown', e=>{ e.preventDefault(); startX=e.clientX; startRecording(); });
micBtn.addEventListener('mouseup', e=>{ e.preventDefault(); const diff=e.clientX-startX; if(diff<-50) stopRecording(true); else stopRecording(false); });
micBtn.addEventListener('mouseleave', e=>{ if(isRecording) stopRecording(true); });

micBtn.addEventListener('touchstart', e=>{ e.preventDefault(); startX=e.touches[0].clientX; startRecording(); }, {passive:false});
micBtn.addEventListener('touchend', e=>{ e.preventDefault(); const endX=e.changedTouches[0].clientX; const diff=endX-startX; if(diff<-50) stopRecording(true); else stopRecording(false); }, {passive:false});
micBtn.addEventListener('touchmove', e=>{ if(!isRecording) return; const curX=e.touches[0].clientX; if(startX-curX>80){ $("recTimer").textContent="↩️ Annuler"; isCancelled=true; } });

// ================== APPELS AVEC SONNERIE ==================
function startTimer(){ callSec=0; callTimerInt=setInterval(()=>{ callSec++; const m=String(Math.floor(callSec/60)).padStart(2,'0'); const s=String(callSec%60).padStart(2,'0'); $("callStatus").textContent=`⏱️ ${m}:${s}`; },1000); }
function stopTimer(){ clearInterval(callTimerInt); }
async function startCall(isVideo){
  if(!activeChat){alert("Entre dans un chat");return}
  currentCallId=getChatId(myPhone,activeChat)+"_"+Date.now();
  $("callOverlay").classList.add("show"); $("callName").textContent=allUsers[activeChat]?.nom||activeChat;
  const photo=getUserPhoto(activeChat); $("callAvatarBox").innerHTML=photo?`<img src="${photo}">`:esc((allUsers[activeChat]?.nom||activeChat).slice(0,2).toUpperCase());
  if(isVideo){ $("callVideos").classList.add("show"); $("callAvatarBox").style.display="none"; $("callStatus").textContent="🎥 Appel vidéo - sonnerie..."; } else { $("callVideos").classList.remove("show"); $("callAvatarBox").style.display="grid"; $("callStatus").textContent="📞 Vocal - sonnerie..."; }
  startOutgoingRing();
  try{ localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true}); }catch(e){ alert("Autorise micro/cam en HTTPS: "+e.message); stopAllRings(); $("callOverlay").classList.remove("show"); return; }
  $("localVideo").srcObject=localStream; $("localVideo").style.display=isVideo?"block":"none";
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) push(ref(db,`jasonBusiness/calls/${currentCallId}/candidates/${myPhone}`),e.candidate.toJSON()); };
  pc.ontrack=e=>{ $("remoteVideo").srcObject=e.streams[0]; stopAllRings(); startTimer(); $("callStatus").textContent="✅ Connecté"; };
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await set(ref(db,`jasonBusiness/calls/${currentCallId}`),{from:myPhone,to:activeChat,isVideo,offer:{type:offer.type,sdp:offer.sdp},createdAt:Date.now(),status:"ringing",fromName:allUsers[myPhone]?.nom||myPhone});
  onValue(ref(db,`jasonBusiness/calls/${currentCallId}/answer`),async s=>{ const ans=s.val(); if(ans&&pc){ try{ await pc.setRemoteDescription(new RTCSessionDescription(ans)); }catch{} }});
  onValue(ref(db,`jasonBusiness/calls/${currentCallId}/candidates/${activeChat}`),s=>{ const cands=s.val()||{}; Object.values(cands).forEach(async c=>{ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch{} }); });
  onValue(ref(db,`jasonBusiness/calls/${currentCallId}`),s=>{ const d=s.val(); if(!d || d.status==="ended") endCall(); });
}
function endCall(){
  stopAllRings(); stopTimer(); $("callOverlay").classList.remove("show"); $("callVideos").classList.remove("show"); $("callAvatarBox").style.display="grid"; $("incomingPopup").classList.remove("show");
  if(pc){pc.close();pc=null} if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  if(currentCallId){ update(ref(db,`jasonBusiness/calls/${currentCallId}`),{status:"ended"}); setTimeout(()=>remove(ref(db,`jasonBusiness/calls/${currentCallId}`)),1500); currentCallId=null }
  $("localVideo").srcObject=null; $("remoteVideo").srcObject=null;
}
$("voiceCallBtn").onclick=()=>startCall(false); $("videoCallBtn").onclick=()=>startCall(true); $("hangBtn").onclick=endCall;
$("muteBtn").onclick=()=>{ if(localStream){ const a=localStream.getAudioTracks()[0]; if(a){ a.enabled=!a.enabled; $("muteBtn").textContent=a.enabled?"🎤":"🔇"; } } };
$("camBtn").onclick=()=>{ if(localStream){ const v=localStream.getVideoTracks()[0]; if(v){ v.enabled=!v.enabled; } } };

let pendingCall=null;
onValue(ref(db,"jasonBusiness/calls"),async snap=>{
  const calls=snap.val()||{};
  for(const [callId,call] of Object.entries(calls)){
    if(call.to===myPhone && call.status==="ringing" && !currentCallId && callId!==pendingCall){
      pendingCall=callId;
      const callerName=call.fromName||allUsers[call.from]?.nom||call.from; const callerPhoto=getUserPhoto(call.from);
      $("incomingPopup").classList.add("show"); $("incomingName").textContent=callerName+" appelle..."; $("incomingType").textContent=call.isVideo?"🎥 Vidéo":"📞 Vocal"; $("incomingAvatar").innerHTML=callerPhoto?`<img src="${callerPhoto}">`:esc(callerName.slice(0,2));
      startIncomingRing();
      setTimeout(()=>{ if(pendingCall===callId){ $("incomingPopup").classList.remove("show"); stopAllRings(); pendingCall=null; } },30000);
      $("acceptIncoming").onclick=async()=>{
        $("incomingPopup").classList.remove("show"); stopAllRings(); currentCallId=callId; $("callOverlay").classList.add("show"); $("callName").textContent=callerName; $("callAvatarBox").innerHTML=callerPhoto?`<img src="${callerPhoto}">`:esc(callerName.slice(0,2));
        if(call.isVideo){ $("callVideos").classList.add("show"); $("callAvatarBox").style.display="none"; } else { $("callVideos").classList.remove("show"); $("callAvatarBox").style.display="grid"; }
        try{ localStream=await navigator.mediaDevices.getUserMedia({video:call.isVideo,audio:true}); }catch(e){ alert(e.message); endCall(); return; }
        $("localVideo").srcObject=localStream; $("localVideo").style.display=call.isVideo?"block":"none";
        pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
        pc.onicecandidate=e=>{ if(e.candidate) push(ref(db,`jasonBusiness/calls/${callId}/candidates/${myPhone}`),e.candidate.toJSON()); };
        pc.ontrack=e=>{ $("remoteVideo").srcObject=e.streams[0]; startTimer(); $("callStatus").textContent="✅ Connecté"; };
        await pc.setRemoteDescription(new RTCSessionDescription(call.offer)); const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
        await set(ref(db,`jasonBusiness/calls/${callId}/answer`),{type:answer.type,sdp:answer.sdp}); await update(ref(db,`jasonBusiness/calls/${callId}`),{status:"accepted"});
        onValue(ref(db,`jasonBusiness/calls/${callId}/candidates/${call.from}`),s=>{ const cands=s.val()||{}; Object.values(cands).forEach(async c=>{ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch{} }); });
        pendingCall=null;
      };
      $("declineIncoming").onclick=async()=>{ $("incomingPopup").classList.remove("show"); stopAllRings(); pendingCall=null; await update(ref(db,`jasonBusiness/calls/${callId}`),{status:"ended"}); setTimeout(()=>remove(ref(db,`jasonBusiness/calls/${callId}`)),1000); };
    }
  }
});

document.body.addEventListener('click',()=>{ try{ $("outgoingRing").play().then(()=>$("outgoingRing").pause()); }catch{} }, {once:true});
</script>
