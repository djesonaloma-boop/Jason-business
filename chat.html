
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<meta name="description" content="JASON CHAT — Messagerie intelligente">
<title>JASON CHAT</title>

<style>
:root{
  --bg:#050a14;
  --panel:#0b1425;
  --panel2:#101e32;
  --blue:#00d2ff;
  --gold:#d8aa45;
  --text:#f4f8ff;
  --muted:#8da2bd;
  --border:rgba(0,210,255,.18);
  --mine:#073d58;
  --other:#13233a;
  --danger:#ff4566;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;height:100dvh;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}
header{
  min-height:68px;display:flex;align-items:center;gap:12px;
  padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--border);
}
.logo{
  width:43px;height:43px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#00d2ff,#07507c);
  color:#03101c;font-size:19px;font-weight:900;
  box-shadow:0 0 20px #00d2ff25;
}
.brand{flex:1;min-width:0}
.brand h1{font-size:17px;margin:0 0 4px;letter-spacing:1px}
.brand p{font-size:11px;color:var(--muted);margin:0}
.online{color:#35e6a0}
.icon-btn{
  border:1px solid var(--border);background:#101e32;color:var(--blue);
  width:42px;height:42px;border-radius:13px;font-size:19px;
}
.settings{
  padding:12px;background:var(--panel);
  border-bottom:1px solid var(--border);
}
.field-row{display:flex;gap:8px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}
.field input{
  width:100%;height:41px;border-radius:10px;
  border:1px solid var(--border);background:#050d1b;color:white;
  padding:0 10px;outline:none;
}
.field input:focus,.composer textarea:focus{border-color:var(--blue)}
.action-row{display:flex;gap:8px;margin-top:9px}
.small-btn{
  border:1px solid var(--border);background:#10233a;color:var(--blue);
  border-radius:10px;padding:9px 12px;font-size:12px;font-weight:bold;
}
.small-btn.primary{background:var(--blue);color:#04111d;border:0}
.contact-info{
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  background:#081222;border-bottom:1px solid var(--border);
}
.avatar{
  width:39px;height:39px;flex-shrink:0;border-radius:50%;
  display:grid;place-items:center;background:#102f4a;
  border:1px solid var(--border);color:var(--blue);font-weight:bold;
}
.contact-meta{flex:1;min-width:0}
.contact-meta strong{display:block;font-size:14px;overflow-wrap:anywhere}
.contact-meta small{color:var(--muted);font-size:11px}
.call-buttons{display:flex;gap:7px}
.call-btn{
  width:39px;height:39px;border-radius:12px;border:1px solid var(--border);
  background:#10233a;color:var(--blue);font-size:18px;
}
.call-btn.video{color:var(--gold)}
#messages{
  flex:1;overflow-y:auto;padding:15px 12px 20px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.empty{
  margin:auto;text-align:center;color:var(--muted);
  padding:25px;line-height:1.7;font-size:13px;
}
.empty .big{font-size:42px;margin-bottom:10px}
.message{max-width:84%;display:flex;flex-direction:column;gap:5px}
.message.mine{align-self:flex-end;align-items:flex-end}
.message.theirs{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:11px 13px;border:1px solid var(--border);
  border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap;
  line-height:1.45;font-size:14px;min-width:65px;
}
.mine .bubble{background:var(--mine);border-radius:16px 16px 4px 16px}
.theirs .bubble{background:var(--other);border-radius:16px 16px 16px 4px}
.msg-time{font-size:10px;color:var(--muted);padding:0 4px}
.voice-player{width:min(250px,65vw);display:block;margin-top:5px}
.voice-label{font-size:12px;color:var(--blue);margin-bottom:5px}
.message img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-top:6px}
.composer{
  background:var(--panel);border-top:1px solid var(--border);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
}
.composer-tools{display:flex;gap:7px;margin-bottom:9px}
.tool-btn{
  flex:1;min-height:38px;border-radius:10px;
  border:1px solid var(--border);background:#0e1c30;color:var(--blue);
  font-size:12px;font-weight:bold;
}
.tool-btn.recording{color:white;background:#8c1632;border-color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.compose-row{display:flex;align-items:flex-end;gap:8px}
.composer textarea{
  flex:1;resize:none;min-height:44px;max-height:120px;
  padding:12px;border:1px solid var(--border);border-radius:14px;
  background:#050d1b;color:white;outline:none;line-height:1.4;
}
.send-btn{
  width:46px;height:46px;border:0;border-radius:14px;
  background:var(--blue);color:#04111d;font-size:20px;font-weight:bold;
}
.status{font-size:11px;color:var(--muted);margin-top:7px;min-height:14px}
#callScreen{
  display:none;position:fixed;inset:0;z-index:20;
  background:radial-gradient(ellipse at top,#123452,#050914 65%);
  align-items:center;justify-content:center;flex-direction:column;
  padding:25px;text-align:center;
}
.call-avatar{
  width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:#103451;border:2px solid var(--blue);font-size:40px;
  margin-bottom:20px;box-shadow:0 0 35px #00d2ff25;
}
#callTitle{font-size:24px;margin:0 0 10px}
#callStatus{font-size:14px;color:var(--muted);margin-bottom:35px}
#remoteVideo{width:100%;max-height:48vh;border-radius:18px;background:#000;display:none}
#localVideo{
  width:110px;height:150px;object-fit:cover;border-radius:14px;
  position:absolute;right:15px;top:15px;background:#111;display:none;
}
.call-controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.round-control{
  width:57px;height:57px;border-radius:50%;border:1px solid var(--border);
  background:#14283d;color:white;font-size:21px;
}
.round-control.end{background:var(--danger);border:0}
.round-control.answer{background:#12ad70;border:0}
#incomingActions{display:none;gap:14px;margin-top:15px}
.toast{
  position:fixed;bottom:105px;left:50%;transform:translateX(-50%);
  background:#132940;border:1px solid var(--border);color:white;
  padding:11px 15px;border-radius:12px;font-size:12px;
  z-index:40;max-width:90%;display:none;text-align:center;
}
footer{
  text-align:center;font-size:10px;color:#60738d;padding:5px;
  background:var(--panel);
}
@media(min-width:650px){
  body{padding:12px}
  .app{height:calc(100dvh - 24px);border:1px solid var(--border);border-radius:18px;overflow:hidden}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">JC</div>
    <div class="brand">
      <h1>JASON CHAT</h1>
      <p><span class="online">●</span> Messagerie • Appels audio et vidéo</p>
    </div>
    <button class="icon-btn" id="settingsToggle" title="Paramètres">⚙</button>
  </header>

  <section class="settings" id="settings">
    <div class="field-row">
      <div class="field">
        <label>MON IDENTIFIANT</label>
        <input id="myId" placeholder="Ex. Jason243" autocomplete="off">
      </div>
      <div class="field">
        <label>IDENTIFIANT DU CONTACT</label>
        <input id="contactId" placeholder="Ex. Gloria243" autocomplete="off">
      </div>
    </div>
    <div class="action-row">
      <button class="small-btn primary" id="openChat">Ouvrir la discussion</button>
      <button class="small-btn" id="saveIds">Enregistrer</button>
    </div>
  </section>

  <div class="contact-info">
    <div class="avatar" id="contactAvatar">?</div>
    <div class="contact-meta">
      <strong id="contactName">Choisis un contact</strong>
      <small id="connectionStatus">Configure tes identifiants pour commencer</small>
    </div>
    <div class="call-buttons">
      <button class="call-btn" id="audioCall" title="Appel audio">☎</button>
      <button class="call-btn video" id="videoCall" title="Appel vidéo">▣</button>
    </div>
  </div>

  <main id="messages">
    <div class="empty">
      <div class="big">💬</div>
      <strong>Bienvenue sur JASON CHAT</strong><br>
      Entre tes identifiants, puis ouvre la discussion.
    </div>
  </main>

  <section class="composer">
    <div class="composer-tools">
      <button class="tool-btn" id="recordBtn">🎙 Message vocal</button>
      <button class="tool-btn" id="imageBtn">▧ Image</button>
      <button class="tool-btn" id="emojiBtn">☺ Emoji</button>
    </div>
    <div class="compose-row">
      <textarea id="messageInput" rows="1" placeholder="Écris ton message..."></textarea>
      <button class="send-btn" id="sendBtn" title="Envoyer">➤</button>
    </div>
    <div class="status" id="status">Prêt à discuter.</div>
    <input type="file" id="imageInput" accept="image/*" hidden>
  </section>
  <footer>JASON CHAT • Créé par Jason Aloma 🇨🇩</footer>
</div>

<div id="callScreen">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-avatar" id="callAvatar">☎</div>
  <h2 id="callTitle">Appel JASON CHAT</h2>
  <p id="callStatus">Connexion...</p>
  <div class="call-controls">
    <button class="round-control" id="muteBtn" title="Micro">🎙</button>
    <button class="round-control" id="cameraBtn" title="Caméra" style="display:none">▣</button>
    <button class="round-control" id="speakerBtn" title="Haut-parleur">🔊</button>
    <button class="round-control end" id="endCallBtn" title="Raccrocher">✕</button>
  </div>
  <div id="incomingActions">
    <button class="round-control answer" id="answerBtn">☎</button>
    <button class="round-control end" id="declineBtn">✕</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="ringAudio" loop></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";

/* CONFIGURATION FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
  authDomain: "starlink-investit.firebaseapp.com",
  databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com",
  projectId: "starlink-investit",
  storageBucket: "starlink-investit.firebasestorage.app",
  messagingSenderId: "807081599583",
  appId: "1:807081599583:web:e00ec3959bc4acdae031ea"
};

const $ = id => document.getElementById(id);
let db = null;
let myId = "";
let recipient = "";
let chatId = "";
let messagesRef = null;
let messageListener = null;
let activeChat = false;

let mediaRecorder = null;
let recordStream = null;
let audioChunks = [];
let isRecording = false;
let recordTimer = null;

let pc = null;
let localStream = null;
let currentCallRef = null;
let currentCallId = "";
let currentCallMode = "audio";
let incomingCall = null;
let callRole = "";
let remoteDescriptionReady = false;
let candidateListener = null;
let callStateListener = null;
let callTimeout = null;
let isMuted = false;
let cameraEnabled = true;
let speakerEnabled = true;
let ringtoneContext = null;
let ringtoneTimer = null;
let ringtoneOscillator = null;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  $("connectionStatus").textContent = "Firebase initialisé";
} catch (error) {
  console.error(error);
  showToast("Erreur Firebase : vérifie la configuration.");
  $("connectionStatus").textContent = "Firebase non connecté";
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.style.display = "none", 3500);
}

function setStatus(message) {
  $("status").textContent = message;
}

function cleanId(value) {
  return String(value || "").trim().replace(/[.#$[\]/]/g, "_").slice(0, 60);
}

function makeChatId(a, b) {
  return [a, b].sort().join("__");
}

function getIds() {
  const a = cleanId($("myId").value);
  const b = cleanId($("contactId").value);
  if (!a || !b) {
    showToast("Entre ton identifiant et celui de ton contact.");
    return null;
  }
  if (a === b) {
    showToast("Choisis un identifiant différent pour le contact.");
    return null;
  }
  return { a, b };
}

function saveIds() {
  const ids = getIds();
  if (!ids) return false;
  localStorage.setItem("jasonChatMyId", ids.a);
  localStorage.setItem("jasonChatContactId", ids.b);
  myId = ids.a;
  recipient = ids.b;
  $("contactName").textContent = recipient;
  $("contactAvatar").textContent = recipient.slice(0, 1).toUpperCase();
  showToast("Identifiants enregistrés sur cet appareil.");
  return true;
}

$("saveIds").addEventListener("click", saveIds);

$("settingsToggle").addEventListener("click", () => {
  const panel = $("settings");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
});

function clearMessageListener() {
  if (messagesRef && messageListener) {
    messagesRef.off("child_added", messageListener);
  }
  messagesRef = null;
  messageListener = null;
}

function openChat() {
  if (!db) {
    showToast("Firebase n'est pas initialisé.");
    return;
  }
  if (!saveIds()) return;

  clearMessageListener();
  chatId = makeChatId(myId, recipient);
  activeChat = true;
  $("messages").innerHTML = "";
  $("connectionStatus").textContent = "Discussion ouverte";
  $("settings").style.display = "none";

  messagesRef = db.ref("jasonChat/messages/" + chatId);
  messageListener = snapshot => {
    const data = snapshot.val();
    if (!data) return;
    renderMessage(data);
  };
  messagesRef.limitToLast(300).on("child_added", messageListener, error => {
    console.error(error);
    showToast("Impossible de lire les messages. Vérifie les règles Firebase.");
  });

  setStatus("Discussion ouverte avec " + recipient);
  listenForIncomingCalls();
}

$("openChat").addEventListener("click", openChat);

function renderMessage(data) {
  const empty = $("messages").querySelector(".empty");
  if (empty) empty.remove();

  const mine = data.sender === myId;
  const wrap = document.createElement("div");
  wrap.className = "message " + (mine ? "mine" : "theirs");

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (data.image) {
    const img = document.createElement("img");
    img.src = data.image;
    img.alt = "Image envoyée";
    img.loading = "lazy";
    img.addEventListener("click", () => window.open(data.image, "_blank"));
    bubble.appendChild(img);
  }

  if (data.audio) {
    const label = document.createElement("div");
    label.className = "voice-label";
    label.textContent = "🎙 Message vocal";
    bubble.appendChild(label);

    const audio = document.createElement("audio");
    audio.className = "voice-player";
    audio.controls = true;
    audio.preload = "metadata";
    audio.src = data.audio;
    bubble.appendChild(audio);
  }

  if (data.text) {
    const textNode = document.createElement("div");
    textNode.textContent = data.text;
    bubble.appendChild(textNode);
  }

  wrap.appendChild(bubble);

  const time = document.createElement("div");
  time.className = "msg-time";
  time.textContent = (mine ? "Vous" : (data.sender || "Contact")) +
    " • " + formatTime(data.timestamp);
  wrap.appendChild(time);

  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function formatTime(timestamp) {
  const date = timestamp ? new Date(timestamp) : new Date();
  return date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

async function publishMessage(target, content, label) {
  if (!db || !activeChat) {
    showToast("Ouvre d'abord une discussion.");
    return false;
  }
  try {
    const payload = Object.assign({}, content, {
      sender: myId,
      receiver: target,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });
    await db.ref("jasonChat/messages/" + chatId).push(payload);
    setStatus(label || "Message envoyé.");
    return true;
  } catch (error) {
    console.error(error);
    showToast("Échec de l'envoi. Vérifie la connexion et les règles Firebase.");
    return false;
  }
}

async function sendText() {
  const text = $("messageInput").value.trim();
  if (!text) return;
  if (!activeChat) {
    showToast("Ouvre d'abord une discussion.");
    return;
  }
  $("sendBtn").disabled = true;
  const success = await publishMessage(recipient, {text}, "Message envoyé.");
  $("sendBtn").disabled = false;
  if (success) {
    $("messageInput").value = "";
    $("messageInput").style.height = "44px";
  }
}

$("sendBtn").addEventListener("click", sendText);
$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendText();
  }
});
$("messageInput").addEventListener("input", () => {
  const el = $("messageInput");
  el.style.height = "44px";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
});

/* ENVOI D'IMAGES */
$("imageBtn").addEventListener("click", () => $("imageInput").click());

$("imageInput").addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!activeChat) {
    showToast("Ouvre d'abord une discussion.");
    event.target.value = "";
    return;
  }
  if (!file.type.startsWith("image/")) {
    showToast("Choisis un fichier image.");
    event.target.value = "";
    return;
  }
  if (file.size > 500 * 1024) {
    showToast("Image trop volumineuse. Choisis une image de moins de 500 Ko.");
    event.target.value = "";
    return;
  }

  try {
    setStatus("Préparation de l'image...");
    const reader = new FileReader();
    reader.onload = async () => {
      await publishMessage(recipient, {text:"📷 Image", image:reader.result}, "Image envoyée.");
      event.target.value = "";
    };
    reader.onerror = () => showToast("Impossible de lire cette image.");
    reader.readAsDataURL(file);
  } catch (error) {
    console.error(error);
    showToast("Erreur lors de la préparation de l'image.");
  }
});

/* EMOJIS */
$("emojiBtn").addEventListener("click", () => {
  const emoji = prompt("Choisis ou écris un emoji :", "😊 ❤️ 😂 🙏 🔥");
  if (emoji) {
    const input = $("messageInput");
    input.value += emoji;
    input.focus();
  }
});

/* MESSAGES VOCAUX : APPUI POUR DÉMARRER, SECOND APPUI POUR ENVOYER */
$("recordBtn").addEventListener("click", async () => {
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    return;
  }

  if (!activeChat) {
    showToast("Ouvre d'abord une discussion.");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    showToast("Ton navigateur ne permet pas l'enregistrement vocal ici. Ouvre le site en HTTPS.");
    return;
  }

  try {
    recordStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];

    let options = {};
    if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
      options.mimeType = "audio/webm;codecs=opus";
    } else if (MediaRecorder.isTypeSupported("audio/webm")) {
      options.mimeType = "audio/webm";
    } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
      options.mimeType = "audio/mp4";
    }

    mediaRecorder = new MediaRecorder(recordStream, options);

    mediaRecorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) audioChunks.push(event.data);
    };

    mediaRecorder.onerror = event => {
      console.error("MediaRecorder:", event);
      showToast("Erreur pendant l'enregistrement vocal.");
      resetRecorder();
    };

    mediaRecorder.onstop = async () => {
      const type = mediaRecorder && mediaRecorder.mimeType ?
        mediaRecorder.mimeType : "audio/webm";
      const blob = new Blob(audioChunks, {type});
      resetRecorder();

      if (blob.size < 1000) {
        showToast("Message vocal trop court. Réessaie.");
        return;
      }
      if (blob.size > 450 * 1024) {
        showToast("Vocal trop long ou trop volumineux. Enregistre un vocal plus court.");
        return;
      }

      setStatus("Envoi du message vocal...");
      const reader = new FileReader();
      reader.onload = async () => {
        await publishMessage(recipient, {
          text:"🎙 Message vocal",
          audio:reader.result,
          audioType:type
        }, "Message vocal envoyé.");
      };
      reader.onerror = () => showToast("Impossible de préparer le message vocal.");
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start(500);
    isRecording = true;
    $("recordBtn").classList.add("recording");
    $("recordBtn").textContent = "■ Arrêter et envoyer";
    setStatus("🔴 Enregistrement en cours... Appuie encore pour envoyer.");
    showToast("Enregistrement vocal démarré.");

    recordTimer = setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        showToast("Durée maximale atteinte. Envoi du vocal...");
      }
    }, 45000);

  } catch (error) {
    console.error(error);
    resetRecorder();
    if (error.name === "NotAllowedError") {
      showToast("Autorise l'accès au microphone dans ton navigateur.");
    } else {
      showToast("Impossible d'accéder au microphone.");
    }
  }
});

function resetRecorder() {
  isRecording = false;
  clearTimeout(recordTimer);
  recordTimer = null;
  $("recordBtn").classList.remove("recording");
  $("recordBtn").textContent = "🎙 Message vocal";

  if (recordStream) {
    recordStream.getTracks().forEach(track => track.stop());
    recordStream = null;
  }
  setStatus("Prêt à discuter.");
}

/* SONNERIE DES APPELS */
function startRingtone() {
  stopRingtone();
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    ringtoneContext = new AudioContextClass();
    if (ringtoneContext.state === "suspended") ringtoneContext.resume();

    const playTone = () => {
      if (!ringtoneContext) return;
      const osc = ringtoneContext.createOscillator();
      const gain = ringtoneContext.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.06;
      osc.connect(gain);
      gain.connect(ringtoneContext.destination);
      osc.start();
      osc.stop(ringtoneContext.currentTime + 0.25);
    };

    playTone();
    ringtoneTimer = setInterval(playTone, 1000);
  } catch (error) {
    console.warn("Sonnerie indisponible", error);
  }
}

function stopRingtone() {
  if (ringtoneTimer) clearInterval(ringtoneTimer);
  ringtoneTimer = null;
  if (ringtoneContext) {
    ringtoneContext.close().catch(() => {});
    ringtoneContext = null;
  }
}

function showCallScreen(title, status) {
  $("callScreen").style.display = "flex";
  $("callTitle").textContent = title;
  $("callStatus").textContent = status || "";
}

function hideCallScreen() {
  $("callScreen").style.display = "none";
  $("remoteVideo").style.display = "none";
  $("localVideo").style.display = "none";
  $("remoteVideo").srcObject = null;
  $("localVideo").srcObject = null;
  $("callAvatar").style.display = "grid";
  $("incomingActions").style.display = "none";
  $("cameraBtn").style.display = "none";
}

function stopCallListeners() {
  if (currentCallRef && callStateListener) {
    currentCallRef.off("value", callStateListener);
  }
  if (candidateListener && currentCallRef) {
    currentCallRef.child("candidates").off("child_added", candidateListener);
  }
  callStateListener = null;
  candidateListener = null;
}

function closePeerConnection() {
  if (pc) {
    pc.onicecandidate = null;
    pc.ontrack = null;
    pc.onconnectionstatechange = null;
    pc.close();
    pc = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  remoteDescriptionReady = false;
}

async function finishCall(updateDatabase = true) {
  stopRingtone();
  clearTimeout(callTimeout);
  stopCallListeners();

  if (updateDatabase && currentCallRef) {
    try {
      await currentCallRef.update({
        status:"ended",
        endedAt:firebase.database.ServerValue.TIMESTAMP
      });
    } catch (error) {
      console.warn(error);
    }
  }

  closePeerConnection();
  currentCallRef = null;
  currentCallId = "";
  incomingCall = null;
  callRole = "";
  isMuted = false;
  cameraEnabled = true;
  $("muteBtn").textContent = "🎙";
  $("cameraBtn").textContent = "▣";
  hideCallScreen();
}

$("endCallBtn").addEventListener("click", () => finishCall(true));
$("declineBtn").addEventListener("click", () => finishCall(true));

/* CRÉATION D'UN APPEL */
$("audioCall").addEventListener("click", () => startCall("audio"));
$("videoCall").addEventListener("click", () => startCall("video"));

async function startCall(mode) {
  if (!db) return showToast("Firebase n'est pas connecté.");
  if (!activeChat) return showToast("Ouvre d'abord une discussion.");
  if (pc || incomingCall) return showToast("Un appel est déjà en cours.");

  currentCallMode = mode;
  callRole = "caller";
  currentCallId = "call_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
  currentCallRef = db.ref("jasonChat/calls/" + recipient + "/" + currentCallId);

  try {
    showCallScreen("Appel vers " + recipient, "Autorise le microphone" +
      (mode === "video" ? " et la caméra" : "") + "...");

    localStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:mode === "video"
    });

    setupLocalVideo();
    createPeerConnection();

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    await currentCallRef.set({
      callId:currentCallId,
      caller:myId,
      callee:recipient,
      mode:mode,
      status:"ringing",
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    listenForCallUpdates();
    listenForCandidates(myId);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await currentCallRef.update({
      offer:{type:offer.type, sdp:offer.sdp}
    });

    $("callStatus").textContent = "Appel en cours... En attente de " + recipient;
    callTimeout = setTimeout(() => {
      if (pc) {
        showToast("Aucune réponse à l'appel.");
        finishCall(true);
      }
    }, 60000);

  } catch (error) {
    console.error(error);
    await finishCall(false);
    showToast("Appel impossible. Vérifie les autorisations micro/caméra et HTTPS.");
  }
}

function createPeerConnection() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.onicecandidate = event => {
    if (event.candidate && currentCallRef) {
      currentCallRef.child("candidates/" + myId).push(event.candidate.toJSON());
    }
  };

  pc.ontrack = event => {
    const remote = $("remoteVideo");
    if (event.streams && event.streams[0]) {
      remote.srcObject = event.streams[0];
      remote.style.display = currentCallMode === "video" ? "block" : "none";
      remote.play().catch(() => {});
      $("callAvatar").style.display = currentCallMode === "video" ? "none" : "grid";
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;
    const state = pc.connectionState;
    if (state === "connected") {
      clearTimeout(callTimeout);
      $("callStatus").textContent = "Connecté • " + (currentCallMode === "video" ? "Appel vidéo" : "Appel audio");
    } else if (state === "connecting") {
      $("callStatus").textContent = "Connexion à l'appel...";
    } else if (state === "failed") {
      $("callStatus").textContent = "Connexion échouée. Le réseau peut nécessiter un serveur TURN.";
    } else if (state === "disconnected") {
      $("callStatus").textContent = "Connexion interrompue...";
    }
  };
}

function setupLocalVideo() {
  if (!localStream) return;
  if (currentCallMode === "video") {
    $("localVideo").srcObject = localStream;
    $("localVideo").style.display = "block";
    $("remoteVideo").style.display = "block";
    $("callAvatar").style.display = "none";
    $("cameraBtn").style.display = "inline-block";
    $("localVideo").play().catch(() => {});
  } else {
    $("localVideo").style.display = "none";
    $("remoteVideo").style.display = "none";
    $("callAvatar").style.display = "grid";
  }
}

/* SIGNALISATION DE L'APPEL */
function listenForCallUpdates() {
  if (!currentCallRef) return;
  if (callStateListener) currentCallRef.off("value", callStateListener);

  callStateListener = async snapshot => {
    const call = snapshot.val();
    if (!call || !pc) return;

    if (call.status === "ended" || call.status === "declined") {
      showToast(call.status === "declined" ? "Appel refusé." : "Appel terminé.");
      await finishCall(false);
      return;
    }

    if (callRole === "caller" && call.answer && !remoteDescriptionReady) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(call.answer));
        remoteDescriptionReady = true;
        await flushCandidates();
      } catch (error) {
        console.error("Erreur de réponse WebRTC", error);
      }
    }

    if (call.status === "answered") {
      $("callStatus").textContent = "Appel accepté. Connexion...";
      clearTimeout(callTimeout);
    }
  };

  currentCallRef.on("value", callStateListener);
}

function listenForCandidates(senderId) {
  if (!currentCallRef) return;
  const ref = currentCallRef.child("candidates/" + senderId);

  candidateListener = async snapshot => {
    const candidate = snapshot.val();
    if (!candidate || !pc || !remoteDescriptionReady) return;
    try {
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    } catch (error) {
      console.warn("ICE candidate non ajouté", error);
    }
  };

  ref.on("child_added", candidateListener);
}

async function flushCandidates() {
  if (!currentCallRef || !pc) return;
  const otherId = callRole === "caller" ? recipient : incomingCall?.caller;
  if (!otherId) return;

  const snapshot = await currentCallRef.child("candidates/" + otherId).once("value");
  const values = snapshot.val() || {};
  for (const key of Object.keys(values)) {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(values[key]));
    } catch (error) {
      console.warn(error);
    }
  }
}

/* APPELS ENTRANTS : LA PAGE DOIT ÊTRE OUVERTE */
let incomingListenerAttached = false;

function listenForIncomingCalls() {
  if (!db || !myId || incomingListenerAttached) return;
  incomingListenerAttached = true;

  db.ref("jasonChat/calls/" + myId).on("child_added", snapshot => {
    const call = snapshot.val();
    if (!call || call.callee !== myId) return;
    if (call.status !== "ringing") return;
    if (pc || incomingCall) return;
    showIncomingCall(call, snapshot.ref);
  });

  db.ref("jasonChat/calls/" + myId).on("child_changed", snapshot => {
    const call = snapshot.val();
    if (!call) return;
    if (incomingCall && call.callId === incomingCall.callId &&
        (call.status === "ended" || call.status === "declined")) {
      stopRingtone();
      incomingCall = null;
      hideCallScreen();
      showToast("L'appel a été annulé.");
    }
  });
}

function showIncomingCall(call, ref) {
  incomingCall = call;
  currentCallRef = ref;
  currentCallId = call.callId;
  currentCallMode = call.mode || "audio";
  callRole = "callee";

  showCallScreen("Appel entrant", (currentCallMode === "video" ? "Appel vidéo de " : "Appel audio de ") + call.caller);
  $("callAvatar").textContent = "☎";
  $("incomingActions").style.display = "flex";
  $("endCallBtn").style.display = "none";
  $("muteBtn").style.display = "none";
  $("cameraBtn").style.display = "none";
  startRingtone();

  /* Si un autre écran d'appel s'affiche, la sonnerie continue jusqu'à réponse/refus. */
}

$("answerBtn").addEventListener("click", answerIncomingCall);

async function answerIncomingCall() {
  if (!incomingCall || !currentCallRef) return;
  const call = incomingCall;
  stopRingtone();
  $("incomingActions").style.display = "none";
  $("endCallBtn").style.display = "inline-block";
  $("muteBtn").style.display = "inline-block";
  $("callStatus").textContent = "Connexion à l'appel...";

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:currentCallMode === "video"
    });

    setupLocalVideo();
    createPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    listenForCandidates(call.caller);

    const snapshot = await currentCallRef.once("value");
    const currentData = snapshot.val();
    if (!currentData || !currentData.offer) {
      throw new Error("Offre d'appel absente.");
    }

    await pc.setRemoteDescription(new RTCSessionDescription(currentData.offer));
    remoteDescriptionReady = true;
    await flushCandidates();

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await currentCallRef.update({
      answer:{type:answer.type, sdp:answer.sdp},
      status:"answered",
      answeredAt:firebase.database.ServerValue.TIMESTAMP
    });

    incomingCall = null;
    listenForCallUpdates();
    $("callStatus").textContent = "Appel accepté. Connexion...";
    callTimeout = setTimeout(() => {
      if (pc && pc.connectionState !== "connected") finishCall(true);
    }, 60000);

  } catch (error) {
    console.error(error);
    await finishCall(true);
    showToast("Impossible de répondre. Vérifie les autorisations micro/caméra.");
  }
}

/* MICRO, CAMÉRA ET HAUT-PARLEUR */
$("muteBtn").addEventListener("click", () => {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
  $("muteBtn").textContent = isMuted ? "🔇" : "🎙";
  $("callStatus").textContent = isMuted ? "Micro coupé" : "Micro activé";
});

$("cameraBtn").addEventListener("click", () => {
  if (!localStream) return;
  cameraEnabled = !cameraEnabled;
  localStream.getVideoTracks().forEach(track => track.enabled = cameraEnabled);
  $("cameraBtn").textContent = cameraEnabled ? "▣" : "🚫";
});

$("speakerBtn").addEventListener("click", () => {
  speakerEnabled = !speakerEnabled;
  $("remoteVideo").muted = !speakerEnabled;
  $("speakerBtn").textContent = speakerEnabled ? "🔊" : "🔇";
});

/* RESTAURATION DES IDENTIFIANTS */
(function restoreIds() {
  $("myId").value = localStorage.getItem("jasonChatMyId") || "";
  $("contactId").value = localStorage.getItem("jasonChatContactId") || "";
  if ($("myId").value && $("contactId").value) {
    $("contactName").textContent = $("contactId").value;
    $("contactAvatar").textContent = $("contactId").value.slice(0,1).toUpperCase();
  }
})();

/* Détection de problèmes de réseau */
window.addEventListener("online", () => showToast("Connexion Internet rétablie."));
window.addEventListener("offline", () => showToast("Tu es hors connexion."));
window.addEventListener("beforeunload", () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    try { mediaRecorder.stop(); } catch (_) {}
  }
});
</script>
