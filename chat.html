
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>JASON CHAT</title>
<style>
:root{--blue:#00d2ff;--bg:#050a14;--panel:#0b1425;--border:rgba(0,210,255,.18);--green:#25d366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-weight:900;color:var(--blue)}
.btn{background:#0c192b;border:1px solid var(--border);color:var(--blue);border-radius:9px;padding:8px;cursor:pointer}
.wrap{display:flex;flex:1;min-height:0}
.left{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:12px 2px;font-size:11px;opacity:.6;cursor:pointer}
.tab.active{color:var(--blue);opacity:1;border-bottom:2px solid var(--blue)}
.search{padding:9px}
.search input,.add input{width:100%;padding:11px;border:1px solid #293850;background:#0c192b;color:white;border-radius:10px;outline:none}
.add{display:flex;gap:5px;padding:8px}
.list{overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:10px;padding:11px;cursor:pointer}
.item.active{background:#10243a}
.av{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:linear-gradient(135deg,#00d2ff,#0077ff);display:grid;place-items:center;font-weight:bold;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.name{font-size:13px;font-weight:bold}
.prev{font-size:11px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);gap:8px}
.top-left{display:flex;align-items:center;gap:8px;min-width:0}
#chatName{font-size:14px;margin:0 0 4px}
#chatPhone{font-size:10px;opacity:.6}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:85%;padding:9px 11px;border-radius:15px;font-size:13px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#00bde8,#0077ff);border-bottom-right-radius:5px}
.msg.other{align-self:flex-start;background:#152235;border-bottom-left-radius:5px}
.msg audio{width:230px;max-width:100%;display:block;margin-top:5px}
.msg img{max-width:180px;max-height:180px;border-radius:10px}
.time{font-size:9px;opacity:.65;text-align:right;margin-top:5px}
.input-area{background:#091321;padding:7px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0}
.rec-bar{display:none;align-items:center;gap:9px;background:#101e30;border:1px solid #24364a;border-radius:20px;padding:8px;margin-bottom:8px}
.rec-bar.show{display:flex}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#ff4757;animation:blink .8s infinite}
.rec-time{font-size:12px;color:#ff7180;font-weight:bold;white-space:nowrap}
.wave{flex:1;min-width:20px;height:30px}
#waveCanvas{width:100%;height:30px;display:block}
.rec-actions{display:flex;gap:6px}
.rec-action{width:34px;height:34px;border:0;border-radius:50%;cursor:pointer}
#recCancel{background:#38202b;color:#ff7280}
#recSend{background:var(--green);color:white}
.input{display:flex;align-items:center;gap:7px}
.smallbtn{width:37px;height:42px;flex-shrink:0;background:transparent;border:0;color:#9ba9b7;font-size:22px;display:grid;place-items:center;cursor:pointer}
#msgInput{flex:1;min-width:0;resize:none;height:42px;max-height:85px;border:1px solid #253548;border-radius:22px;padding:12px;background:#111d2b;color:white;outline:none;font-size:14px}
#sendBtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--blue);color:#00121a;font-size:20px;cursor:pointer}
#recordBtn{width:58px;height:58px;flex-shrink:0;border:0;border-radius:50%;background:var(--green);color:white;font-size:27px;display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .12s}
#recordBtn svg{width:28px;height:28px;fill:currentColor;pointer-events:none}
#recordBtn.recording{background:#ff4757;transform:scale(1.05);box-shadow:0 0 0 5px #ff475733}
.hint{text-align:center;font-size:9px;opacity:.45;padding-top:5px}
@keyframes blink{50%{opacity:.25}}
@media(max-width:700px){
 .left{position:absolute;z-index:5;inset:56px 0 0;width:100%}
 .left.hide{display:none}
 .right{width:100%}
}
</style>
</head>
<body>
<header>
 <div class="brand">💬 JASON CHAT <span id="myPhoneShow"></span></div>
 <div style="display:flex;gap:6px">
  <button class="btn" id="showContacts">☰</button>
  <button class="btn" onclick="location.href='dashboard.html'">Dash</button>
 </div>
</header>

<div class="wrap">
 <aside class="left" id="leftPanel">
  <div class="tabs">
   <div class="tab active" data-tab="chats">💬 Chats</div>
   <div class="tab" data-tab="users">👥 Utilisateurs</div>
   <div class="tab" data-tab="requests">🔔 Demandes</div>
  </div>
  <div class="add">
   <input id="manualPhone" placeholder="+243...">
   <button class="btn" id="addContact">+</button>
  </div>
  <div class="search"><input id="search" placeholder="🔍 Rechercher..."></div>
  <div class="list" id="list"></div>
 </aside>

 <main class="right">
  <div class="top">
   <div class="top-left">
    <div class="av" id="chatAvatar">JB</div>
    <div style="min-width:0">
     <h3 id="chatName">Sélectionne un chat</h3>
     <div id="chatPhone">Messenger</div>
    </div>
   </div>
   <div style="display:flex;gap:5px">
    <button class="btn" id="voiceCall">📞</button>
    <button class="btn" id="videoCall">🎥</button>
   </div>
  </div>

  <div class="msgs" id="msgs">
   <div style="margin:auto;text-align:center;opacity:.55">💬 Choisis un contact pour commencer.</div>
  </div>

  <div class="input-area">
   <div class="rec-bar" id="recBar">
    <div class="rec-dot"></div>
    <span class="rec-time" id="recTime">00:00</span>
    <div class="wave"><canvas id="waveCanvas" width="260" height="30"></canvas></div>
    <div class="rec-actions">
     <button class="rec-action" id="recCancel" title="Annuler">🗑️</button>
     <button class="rec-action" id="recSend" title="Envoyer">➤</button>
    </div>
   </div>

   <div class="input">
    <label class="smallbtn" title="Image">＋<input type="file" id="photoInput" accept="image/*" hidden></label>
    <textarea id="msgInput" placeholder="Écris un message..." disabled></textarea>
    <button id="sendBtn" disabled>➤</button>
    <button id="recordBtn" type="button" aria-label="Maintenir pour enregistrer" title="Maintenir pour parler">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11z"/></svg>
    </button>
   </div>
   <div class="hint">Maintiens 🎤 pour parler • Relâche pour envoyer • 🗑️ pour annuler</div>
  </div>
 </main>
</div>

<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,push,set,get,remove,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",
 authDomain:"starlink-investit.firebaseapp.com",
 databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",
 projectId:"starlink-investit",
 storageBucket:"starlink-investit.firebasestorage.app",
 messagingSenderId:"807081599583",
 appId:"1:807081599583:web:e00ec3959bc4acdae031ea"
};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app),$=id=>document.getElementById(id);
const myPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||localStorage.getItem("phone");
if(!myPhone){alert("Connecte-toi d'abord.");location.href="login.html";throw Error("Connexion requise")}
$("myPhoneShow").textContent=" · "+myPhone;

let users={},chats={},requests={},activeChat=null,tab="chats",messageUnsub=null;
let manual=[];
try{manual=JSON.parse(localStorage.getItem("jb_manual_users")||"[]")}catch{}

const cid=(a,b)=>[a,b].sort().join("_");
const userName=p=>users[p]?.nom||users[p]?.name||p;
const userPhoto=p=>users[p]?.photo||users[p]?.photoProfil||users[p]?.avatar||"";
const clock=t=>t?new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";

$("showContacts").onclick=()=>$("leftPanel").classList.toggle("hide");
$("search").oninput=renderList;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 t.classList.add("active");tab=t.dataset.tab;renderList();
});

onValue(ref(db,"jasonBusiness/users"),s=>{users=s.val()||{};renderList()});
onValue(ref(db,`jasonBusiness/user_chats/${myPhone}`),s=>{chats=s.val()||{};renderList()});
onValue(ref(db,`jasonBusiness/chat_requests/${myPhone}`),s=>{requests=s.val()||{};renderList()});

function renderList(){
 const list=$("list"),q=$("search").value.toLowerCase();list.innerHTML="";
 let entries=[];
 if(tab==="chats"){
  entries=Object.entries(chats).filter(([id,c])=>c.status==="accepted").map(([id,c])=>[c.with||id.split("_").find(p=>p!==myPhone),c]);
 }else if(tab==="users"){
  entries=Object.entries(users).filter(([p])=>p!==myPhone).map(([p])=>[p,{}]);
  manual.forEach(p=>{if(!users[p]&&p!==myPhone)entries.push([p,{}])});
 }else{
  entries=Object.entries(requests).filter(([p,r])=>r.type==="incoming"&&r.status==="pending").map(([p])=>[p,{}]);
 }
 entries.forEach(([p,c])=>{
  if(!p||!(p.toLowerCase().includes(q)||userName(p).toLowerCase().includes(q)))return;
  const el=document.createElement("div");el.className="item"+(p===activeChat?" active":"");
  const av=document.createElement("div");av.className="av";
  if(userPhoto(p)){const im=document.createElement("img");im.src=userPhoto(p);av.appendChild(im)}else av.textContent=p.slice(-2);
  const info=document.createElement("div");info.className="info";
  const n=document.createElement("div");n.className="name";n.textContent=userName(p);
  const prev=document.createElement("div");prev.className="prev";prev.textContent=c.lastMsg||p;
  info.append(n,prev);el.append(av,info);
  if(tab==="users"||tab==="requests"){
   const b=document.createElement("button");b.className="btn";b.textContent=tab==="requests"?"Accepter":chats[cid(myPhone,p)]?.status==="accepted"?"Ouvrir":"+";
   b.onclick=e=>{e.stopPropagation();if(tab==="requests")accept(p);else if(chats[cid(myPhone,p)]?.status==="accepted")openChat(p);else requestChat(p)};
   el.appendChild(b);
  }
  el.onclick=()=>{if(tab==="chats")openChat(p)};
  list.appendChild(el);
 });
 if(!list.children.length)list.innerHTML='<div style="padding:20px;text-align:center;opacity:.5">Aucun contact ici</div>';
}

$("addContact").onclick=()=>{
 const p=$("manualPhone").value.trim();
 if(p.length<8)return alert("Entre un numéro valide.");
 if(!manual.includes(p))manual.push(p);
 localStorage.setItem("jb_manual_users",JSON.stringify(manual));
 $("manualPhone").value="";renderList();
};

async function requestChat(p){
 try{
  await set(ref(db,`jasonBusiness/chat_requests/${myPhone}/${p}`),{type:"outgoing",status:"pending",createdAt:Date.now()});
  await set(ref(db,`jasonBusiness/chat_requests/${p}/${myPhone}`),{type:"incoming",status:"pending",createdAt:Date.now()});
  alert("Demande envoyée.");
 }catch(e){alert("Erreur Firebase : "+e.message)}
}
async function accept(p){
 const id=cid(myPhone,p),now=Date.now();
 try{
  await set(ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`),{with:p,status:"accepted",lastTime:now,unread:0});
  await set(ref(db,`jasonBusiness/user_chats/${p}/${id}`),{with:myPhone,status:"accepted",lastTime:now,unread:0});
  await remove(ref(db,`jasonBusiness/chat_requests/${myPhone}/${p}`));
  await remove(ref(db,`jasonBusiness/chat_requests/${p}/${myPhone}`));
  tab="chats";document.querySelector('[data-tab="chats"]').click();openChat(p);
 }catch(e){alert(e.message)}
}
function openChat(p){
 activeChat=p;$("chatName").textContent=userName(p);$("chatPhone").textContent=p;
 $("chatAvatar").innerHTML=userPhoto(p)?`<img src="${userPhoto(p)}">`:p.slice(-2);
 $("msgInput").disabled=false;$("sendBtn").disabled=false;
 if(innerWidth<700)$("leftPanel").classList.add("hide");
 if(messageUnsub)messageUnsub();
 messageUnsub=onValue(ref(db,`jasonBusiness/messages/${cid(myPhone,p)}`),s=>{
  const msgs=Object.values(s.val()||{}).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  renderMessages(msgs);
  update(ref(db,`jasonBusiness/user_chats/${myPhone}/${cid(myPhone,p)}`),{unread:0}).catch(()=>{});
 });
 renderList();
}
function renderMessages(messages){
 const box=$("msgs");box.innerHTML="";
 messages.forEach(m=>{
  const el=document.createElement("div");el.className="msg "+(m.from===myPhone?"me":"other");
  if(m.text){const t=document.createElement("div");t.textContent=m.text;el.appendChild(t)}
  if(m.photo){const im=document.createElement("img");im.src=m.photo;el.appendChild(im)}
  if(m.audio){const a=document.createElement("audio");a.controls=true;a.preload="metadata";a.src=m.audio;el.appendChild(a)}
  const tm=document.createElement("div");tm.className="time";tm.textContent=clock(m.createdAt);el.appendChild(tm);box.appendChild(el);
 });
 box.scrollTop=box.scrollHeight;
}
async function saveMessage(target,content){
 const id=cid(myPhone,target),now=Date.now();
 await set(push(ref(db,`jasonBusiness/messages/${id}`)),{from:myPhone,to:target,...content,createdAt:now});
 await update(ref(db,`jasonBusiness/user_chats/${myPhone}/${id}`),{with:target,status:"accepted",lastMsg:content.text||"Message",lastTime:now});
 const r=ref(db,`jasonBusiness/user_chats/${target}/${id}`),s=await get(r);
 await set(r,{with:myPhone,status:"accepted",lastMsg:content.text||"Message",lastTime:now,unread:Number(s.val()?.unread||0)+1});
}
$("sendBtn").onclick=async()=>{
 const text=$("msgInput").value.trim();if(!text||!activeChat)return;
 $("msgInput").value="";
 try{await saveMessage(activeChat,{text})}catch(e){alert("Envoi impossible : "+e.message)}
};
$("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("sendBtn").click()}});
$("photoInput").onchange=e=>{
 const f=e.target.files?.[0];if(!f||!activeChat)return;
 if(f.size>400*1024)return alert("Image maximum : 400 Ko.");
 const r=new FileReader();r.onload=()=>saveMessage(activeChat,{text:"📷 Photo",photo:r.result}).catch(err=>alert(err.message));r.readAsDataURL(f);e.target.value="";
};

/* BOUTON VOCAL VERT STYLE WHATSAPP */
const mic=$("recordBtn"),bar=$("recBar"),time=$("recTime");
const canvas=$("waveCanvas"),ctx=canvas.getContext("2d");
let recorder=null,stream=null,chunks=[],recording=false,starting=false;
let released=false,cancelled=false,seconds=0,timer=null,recordingTarget=null;
let audioContext=null,analyser=null,raf=null;

function drawWave(){
 if(!recording||!analyser)return;
 raf=requestAnimationFrame(drawWave);
 const data=new Uint8Array(analyser.fftSize);
 analyser.getByteTimeDomainData(data);
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.beginPath();ctx.strokeStyle="#25d366";ctx.lineWidth=2;
 data.forEach((v,i)=>{
  const x=i*canvas.width/data.length,y=v/128*canvas.height/2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 });
 ctx.stroke();
}
function cleanup(){
 recording=false;starting=false;clearInterval(timer);timer=null;
 if(raf)cancelAnimationFrame(raf);raf=null;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 if(audioContext){audioContext.close().catch(()=>{});audioContext=null}
 analyser=null;bar.classList.remove("show");mic.classList.remove("recording");
 mic.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11z"/></svg>';
}
async function startRecording(){
 if(recording||starting)return;
 if(!activeChat){alert("Ouvre d'abord une discussion.");return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  alert("Ouvre cette page sur HTTPS dans Chrome et autorise le microphone.");return;
 }
 starting=true;released=false;cancelled=false;recordingTarget=activeChat;
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
  await audioContext.resume();
  const source=audioContext.createMediaStreamSource(stream);
  analyser=audioContext.createAnalyser();analyser.fftSize=256;source.connect(analyser);
  let options={};
  for(const type of ["audio/webm;codecs=opus","audio/webm","audio/mp4"]){
   if(MediaRecorder.isTypeSupported(type)){options.mimeType=type;break}
  }
  recorder=new MediaRecorder(stream,options);chunks=[];seconds=0;
  recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  recorder.onerror=()=>{cancelled=true;cleanup();alert("Erreur pendant l'enregistrement.")};
  recorder.onstop=async()=>{
   const blob=new Blob(chunks,{type:recorder?.mimeType||"audio/webm"});
   const target=recordingTarget,send=!cancelled;
   cleanup();
   if(!send||!target)return;
   if(blob.size<1000){alert("Vocal trop court. Parle un peu plus longtemps.");return}
   if(blob.size>600*1024){alert("Vocal trop volumineux. Enregistre moins longtemps.");return}
   const reader=new FileReader();
   reader.onerror=()=>alert("Impossible de lire le vocal.");
   reader.onload=async()=>{
    try{await saveMessage(target,{text:"🎤 Message vocal",audio:reader.result})}
    catch(e){console.error(e);alert("Échec d'envoi. Vérifie les règles Firebase.")}
   };
   reader.readAsDataURL(blob);
  };
  recorder.start(200);recording=true;starting=false;
  mic.classList.add("recording");bar.classList.add("show");time.textContent="00:00";
  drawWave();
  timer=setInterval(()=>{
   seconds++;time.textContent="00:"+String(seconds).padStart(2,"0");
   if(seconds>=15)stopRecording(true);
  },1000);
  if(released)stopRecording(true);
 }catch(e){
  console.error(e);cleanup();
  alert("Microphone inaccessible. Autorise le micro dans Chrome et utilise HTTPS.");
 }
}
function stopRecording(send){
 if(starting&&!recording){released=true;cancelled=!send;return}
 if(!recording||!recorder)return;
 cancelled=!send;recording=false;clearInterval(timer);timer=null;
 if(recorder.state!=="inactive")recorder.stop();else cleanup();
}

/* Un seul système d'événements évite le double déclenchement sur Android. */
mic.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(e.button!==undefined&&e.button!==0)return;
 if(recording||starting)return;
 released=false;
 try{mic.setPointerCapture(e.pointerId)}catch(_){}
 startRecording();
});
mic.addEventListener("pointerup",e=>{
 e.preventDefault();released=true;
 if(recording)stopRecording(true);
});
mic.addEventListener("pointercancel",()=>{
 released=true;if(recording)stopRecording(false);
});
$("recCancel").onclick=()=>stopRecording(false);
$("recSend").onclick=()=>stopRecording(true);

$("voiceCall").onclick=()=>alert("La fonction d'appel nécessite une configuration WebRTC.");
$("videoCall").onclick=()=>alert("La fonction d'appel vidéo nécessite une configuration WebRTC.");
</script>
</body>
</html>
