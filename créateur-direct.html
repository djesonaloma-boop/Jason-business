<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APK DIRECT - JASON</title>
<style>
:root{--bg:#050914;--blue:#00d4ff;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b4c,#0a1426 42%,var(--bg));color:white;font-family:Arial;padding-bottom:100px}
.container{max-width:600px;margin:auto;padding:16px}
.card{background:linear-gradient(145deg,#142642,#0c1627);border:1px solid #ffffff14;border-radius:20px;padding:18px;margin:14px 0}
.input{width:100%;background:#0b1729;border:1px solid #ffffff1b;color:white;border-radius:12px;padding:14px;margin-bottom:14px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-weight:900;font-size:14px;cursor:pointer}
.btn-blue{background:linear-gradient(110deg,#00d4ff,#0077ff);color:#001018}
.btn-green{background:linear-gradient(110deg,#22c55e,#16a34a);color:white}
.progress{display:none;margin-top:14px}
.bar{height:8px;background:#0b1729;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#22c55e);transition:width 2s}
</style>
</head>
<body>
<div class="container">
  <h1 style="text-align:center;color:#00d4ff">👑 APK DIRECT</h1>
  <p style="text-align:center;font-size:11px;color:#8e9aad">GÉNÈRE UN VRAI APK EN 2 MINUTES - SANS AIGLE</p>
  
  <div class="card">
    <input class="input" id="appName" placeholder="Nom app: Ma Boutique" value="Ma Boutique">
    <input class="input" id="appUrl" placeholder="URL: https://..." value="https://jason-business.vercel.app">
    <input class="input" id="pkg" placeholder="Package: com.maboutique.app" value="com.maboutique.app">
    <button class="btn btn-blue" onclick="buildDirect()">🚀 GÉNÉRER APK DIRECT MAINTENANT</button>
    
    <div class="progress" id="progress">
      <div style="font-size:12px;margin:12px 0;text-align:center" id="status">⏳ Compilation APK en cours...</div>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
      <div style="font-size:11px;color:#8e9aad;margin-top:10px;text-align:center">Ton APK compile sur serveur gratuit... 90 secondes</div>
    </div>
    
    <div id="result" style="display:none;margin-top:14px">
      <div style="background:#22c55e20;border:1px solid #22c55e40;padding:12px;border-radius:12px;font-size:12px">
        ✅ <b>APK PRÊT!</b><br>
        <span id="resultText"></span>
      </div>
      <button class="btn btn-green" style="margin-top:10px" onclick="window.open('https://github.com/TON_GITHUB_USERNAME/jason-apk-builder/actions', '_blank')">📥 TÉLÉCHARGER MON APK</button>
    </div>
  </div>
</div>

<script>
async function buildDirect(){
  const appName = document.getElementById("appName").value;
  const appUrl = document.getElementById("appUrl").value;
  const pkg = document.getElementById("pkg").value;
  
  if(!appName || !appUrl){ alert("Remplis tout!"); return; }
  
  document.getElementById("progress").style.display = "block";
  document.getElementById("bar").style.width = "10%";
  
  // Lance le build
  try {
    const res = await fetch("/api/build", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ appName, appUrl, packageName: pkg, color: "#00d4ff" })
    });
    
    document.getElementById("bar").style.width = "50%";
    document.getElementById("status").textContent = "🔨 Serveur compile ton APK...";
    
    // Simule progression
    setTimeout(()=>{
      document.getElementById("bar").style.width = "100%";
      document.getElementById("status").textContent = "✅ APK compilé!";
      document.getElementById("result").style.display = "block";
      document.getElementById("resultText").innerHTML = `App: ${appName}<br>Va sur GitHub Actions pour télécharger ton vrai APK dans 1 minute!`;
    }, 3000);
    
  } catch(e) {
    // Si pas de serveur, méthode de secours direct PWABuilder
    document.getElementById("status").textContent = "Utilisation PWABuilder direct...";
    window.open(`https://www.pwabuilder.com/reportcard?site=${encodeURIComponent(appUrl)}`, '_blank');
  }
}
</script>
</body>
</html>
