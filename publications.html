<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JASON BUSINESS - Publications & Stories</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#050a14;color:white}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#050a14;border-bottom:1px solid #0f203f;position:sticky;top:0;z-index:10}
.brand{font-weight:900;color:#00d2ff}
.btn{padding:7px 12px;border-radius:10px;border:1px solid #00d2ff44;background:#00d2ff14;color:#00d2ff;font-size:11px;text-decoration:none;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #0f203f;background:#0b1425}
.tab{padding:13px;text-align:center;font-size:12px;font-weight:800;cursor:pointer;opacity:.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;color:#00d2ff;border-bottom-color:#00d2ff}
.wrap{max-width:600px;margin:0 auto}
.box{background:#0b1425;padding:12px;border-bottom:1px solid #0f203f}
textarea{width:100%;min-height:70px;padding:12px;border-radius:12px;border:1px solid #293850;background:#0c192b;color:white;outline:none;resize:none;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.tbtn{padding:8px 14px;border-radius:20px;border:1px solid #293850;background:#0c192b;color:white;font-size:12px;cursor:pointer}
.tbtn.blue{background:linear-gradient(135deg,#00d2ff,#0077ff);border:0;font-weight:800;color:white}
.colors{display:flex;gap:6px;margin-top:8px}
.color{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color.active{border-color:white}
#preview{margin-top:10px;display:none}
#preview img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#000}

/* STORIES BAR */
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;background:#0b1425;border-bottom:1px solid #0f203f}
.s-item{flex-shrink:0;width:64px;text-align:center;cursor:pointer}
.s-circle{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:grid;place-items:center;position:relative}
.s-circle div{width:100%;height:100%;border-radius:50%;background:#0b1425;display:grid;place-items:center;font-weight:900;overflow:hidden;border:2px solid #0b1425}
.s-circle img{width:100%;height:100%;object-fit:cover}
.s-circle.text-story div{color:white;font-size:11px;padding:4px;text-align:center;line-height:1.1}
.s-name{font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-add .s-circle{background:#1a2a44}

/* FEED */
.post{background:#0b1425;border-bottom:1px solid #0f203f;margin-top:6px}
.post-head{padding:10px 12px;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#0077ff);display:grid;place-items:center;font-weight:900}
.post-name{font-weight:700;font-size:13px} .post-time{font-size:10px;opacity:.5}
.post-text{padding:10px 12px;white-space:pre-wrap;font-size:14px;line-height:1.4}
.post-text.bg{padding:40px 20px;text-align:center;font-size:20px;font-weight:800;min-height:180px;display:grid;place-items:center;border-radius:0}
.post-img{width:100%;max-height:520px;object-fit:contain;background:#000;display:block}
.del{margin-left:auto;background:transparent;border:0;color:#ff4757;font-size:16px;cursor:pointer}

/* VIEWER */
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:9999;flex-direction:column}
#viewer.show{display:flex}
#viewerTop{display:flex;justify-content:space-between;padding:12px;align-items:center}
#viewerContent{flex:1;display:grid;place-items:center;padding:10px}
#viewerContent img{max-width:100%;max-height:80vh;object-fit:contain}
#viewerText{width:90%;max-width:400px;min-height:60%;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:900;padding:20px;border-radius:20px}
</style>
</head>
<body>
<header>
  <div class="brand">JASON BUSINESS</div>
  <div style="display:flex;gap:6px"><a href="chat.html" class="btn">💬 Chat</a><a href="dashboard.html" class="btn">Dash</a></div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="pubs">📢 PUBLICATIONS</div>
  <div class="tab" data-tab="stories">🔥 STORIES 24H</div>
</div>

<div class="wrap">
  <!-- STORIES BAR -->
  <div class="stories" id="storiesBar">
    <div class="s-item s-add" onclick="document.getElementById('storyFile').click()">
      <div class="s-circle"><div>+</div></div>
      <div class="s-name">Ta story</div>
    </div>
  </div>

  <!-- BOX PUBLICATION -->
  <div class="box" id="pubBox">
    <textarea id="pubText" placeholder="Écris une note..."></textarea>
    <div class="colors" id="pubColors"></div>
    <div id="preview"><img id="previewImg"><div style="text-align:right;margin-top:6px"><button class="tbtn" onclick="clearImage()">✕ Retirer photo</button></div></div>
    <div class="row">
      <label class="tbtn">🖼️ Photo <input type="file" id="pubFile" accept="image/*" hidden></label>
      <button class="tbtn blue" id="btnPub" style="margin-left:auto">Publier</button>
    </div>
    <div style="font-size:10px;opacity:.5;margin-top:6px">Note = texte coloré • Photo = image seule ou avec texte</div>
  </div>

  <!-- BOX STORY -->
  <div class="box" id="storyBox" style="display:none">
    <textarea id="storyText" placeholder="Note pour ta story 24h..."></textarea>
    <div class="colors" id="storyColors"></div>
    <div class="row">
      <label class="tbtn">🖼️ Photo Story <input type="file" id="storyFile" accept="image/*" hidden></label>
      <button class="tbtn blue" id="btnStory" style="margin-left:auto">Publier en Story</button>
    </div>
    <div style="font-size:10px;opacity:.5;margin-top:6px">Ta story s'efface automatiquement après 24h</div>
  </div>

  <!-- FEED -->
  <div id="feed"></div>
</div>

<!-- VIEWER STORY -->
<div id="viewer">
  <div id="viewerTop"><span id="viewerName"></span><button onclick="closeViewer()" style="background:transparent;border:0;color:white;font-size:22px">✕</button></div>
  <div id="viewerContent"></div>
  <div style="padding:12px;text-align:center;font-size:11px;opacity:.6" id="viewerTime"></div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.appspot.com",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app); const storage=getStorage(app);
const $=id=>document.getElementById(id);

const myPhone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||"0847500590";
const myName=localStorage.getItem("jasonBusinessUserName")||myPhone;

const bgColors=["#0b1425","#FF4757","#2ed573","#1e90ff","#ffa502","#a55eea","#3742fa","#2f3542","#ff6b81","#70a1ff"];
let selectedPubColor=bgColors[0], selectedStoryColor=bgColors[1];
let pubImageUrl="", storyImageUrl="";

function makeColors(container, type){
  container.innerHTML="";
  bgColors.forEach((c,i)=>{
    const d=document.createElement("div"); d.className="color"+(i===0?" active":""); d.style.background=c;
    d.onclick=()=>{
      container.querySelectorAll(".color").forEach(x=>x.classList.remove("active"));
      d.classList.add("active");
      if(type==="pub") selectedPubColor=c;
      else selectedStoryColor=c;
    };
    container.appendChild(d);
  });
}
makeColors($("pubColors"),"pub");
makeColors($("storyColors"),"story");

// IMAGE UPLOAD
$("pubFile").onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  $("preview").style.display="block"; $("previewImg").src=URL.createObjectURL(file);
  const path=`publications/${myPhone}/${Date.now()}_${file.name}`;
  const refS=sRef(storage,path); await uploadBytes(refS,file); pubImageUrl=await getDownloadURL(refS);
};
window.clearImage=()=>{ pubImageUrl=""; $("preview").style.display="none"; $("pubFile").value=""; };
$("storyFile").onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  const path=`stories/${myPhone}/${Date.now()}_${file.name}`;
  const refS=sRef(storage,path); await uploadBytes(refS,file); storyImageUrl=await getDownloadURL(refS);
  // publie direct photo story
  await push(ref(db,"jasonBusiness/stories"),{from:myPhone,name:myName,type:"photo",photo:storyImageUrl,createdAt:Date.now(),expiresAt:Date.now()+86400000});
  storyImageUrl=""; e.target.value=""; alert("✅ Story photo publiée pour 24h");
};

// TABS
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const tab=t.dataset.tab;
    $("pubBox").style.display=tab==="pubs"?"block":"none";
    $("storyBox").style.display=tab==="stories"?"block":"none";
    $("storiesBar").style.display=tab==="stories"?"flex":"flex";
    render();
  };
});

// PUBLICATION NOTE / PHOTO
$("btnPub").onclick=async()=>{
  const text=$("pubText").value.trim();
  if(!text && !pubImageUrl) return alert("Écris une note ou ajoute une photo");
  await push(ref(db,"jasonBusiness/publications"),{
    from:myPhone,name:myName,
    type: pubImageUrl ? "photo" : "note",
    text:text, image:pubImageUrl, bg:selectedPubColor,
    createdAt:Date.now()
  });
  $("pubText").value=""; clearImage();
};

// STORY NOTE
$("btnStory").onclick=async()=>{
  const text=$("storyText").value.trim();
  if(!text) return alert("Écris une note pour ta story");
  await push(ref(db,"jasonBusiness/stories"),{
    from:myPhone,name:myName,
    type:"note", text:text, bg:selectedStoryColor,
    createdAt:Date.now(), expiresAt:Date.now()+86400000
  });
  $("storyText").value=""; alert("✅ Story note publiée pour 24h");
};

// DATA
let allPubs={}, allStories={}, allUsers={};
onValue(ref(db,"jasonBusiness/users"),s=>{allUsers=s.val()||{}});
onValue(ref(db,"jasonBusiness/publications"),s=>{allPubs=s.val()||{}; render();});
onValue(ref(db,"jasonBusiness/stories"),s=>{
  allStories=s.val()||{};
  // nettoie expirés
  Object.entries(allStories).forEach(([id,st])=>{ if(st.expiresAt < Date.now()) remove(ref(db,"jasonBusiness/stories/"+id)); });
  renderStories(); render();
});

function renderStories(){
  const bar=$("storiesBar");
  const add=bar.firstElementChild;
  bar.innerHTML=""; bar.appendChild(add);
  Object.entries(allStories).forEach(([id,st])=>{
    if(st.expiresAt < Date.now()) return;
    const div=document.createElement("div"); div.className="s-item";
    if(st.type==="photo"){
      div.innerHTML=`<div class="s-circle"><div><img src="${st.photo}"></div></div><div class="s-name">${st.from===myPhone?"Toi":st.from.slice(-4)}</div>`;
    }else{
      div.innerHTML=`<div class="s-circle text-story"><div style="background:${st.bg}">${(st.text||"").slice(0,12)}</div></div><div class="s-name">${st.from===myPhone?"Toi":st.from.slice(-4)}</div>`;
    }
    div.onclick=()=>openViewer(id,"story");
    bar.appendChild(div);
  });
}

function render(){
  const feed=$("feed"); feed.innerHTML="";
  const activeTab=document.querySelector(".tab.active").dataset.tab;

  if(activeTab==="pubs"){
    const sorted=Object.entries(allPubs).sort((a,b)=>b[1].createdAt - a[1].createdAt);
    if(sorted.length===0){ feed.innerHTML="<div style='padding:30px;text-align:center;opacity:.5'>Aucune publication. Sois le premier !</div>"; return; }
    sorted.forEach(([id,p])=>{
      const div=document.createElement("div"); div.className="post";
      const time=new Date(p.createdAt).toLocaleString();
      let content="";
      if(p.type==="photo" && p.image){
        content=`${p.text?`<div class="post-text">${esc(p.text)}</div>`:""}<img class="post-img" src="${p.image}" onclick="openViewer('${id}','pub')">`;
      }else{
        content=`<div class="post-text bg" style="background:${p.bg||'#0b1425'}">${esc(p.text)}</div>`;
      }
      div.innerHTML=`
        <div class="post-head"><div class="av">${p.from.slice(-2)}</div><div><div class="post-name">${p.name||p.from}</div><div class="post-time">${time}</div></div>${p.from===myPhone?`<button class="del" onclick="delPub('${id}')">🗑️</button>`:""}</div>
        ${content}
      `;
      feed.appendChild(div);
    });
  }else{
    const sorted=Object.entries(allStories).sort((a,b)=>b[1].createdAt - a[1].createdAt);
    if(sorted.length===0){ feed.innerHTML="<div style='padding:30px;text-align:center;opacity:.5'>Aucune story. Publie une note ou photo, ça reste 24h</div>"; return; }
    sorted.forEach(([id,s])=>{
      const div=document.createElement("div"); div.className="post";
      let content="";
      if(s.type==="photo") content=`<img class="post-img" src="${s.photo}" onclick="openViewer('${id}','story')">`;
      else content=`<div class="post-text bg" style="background:${s.bg}">${esc(s.text)}</div>`;
      div.innerHTML=`
        <div class="post-head"><div class="av">${s.from.slice(-2)}</div><div><div class="post-name">${s.name} • Story 24h</div><div class="post-time">Expire: ${new Date(s.expiresAt).toLocaleString()}</div></div>${s.from===myPhone?`<button class="del" onclick="delStory('${id}')">🗑️</button>`:""}</div>
        ${content}
      `;
      feed.appendChild(div);
    });
  }
}
function esc(t){return String(t||"").replace(/</g,"&lt;")}

window.delPub=async(id)=>{ if(confirm("Supprimer ?")) await remove(ref(db,"jasonBusiness/publications/"+id)); };
window.delStory=async(id)=>{ if(confirm("Supprimer story ?")) await remove(ref(db,"jasonBusiness/stories/"+id)); };

window.openViewer=(id,type)=>{
  const data=type==="story"?allStories[id]:allPubs[id];
  if(!data) return;
  $("viewer").classList.add("show");
  $("viewerName").textContent=data.name||data.from;
  $("viewerTime").textContent=new Date(data.createdAt).toLocaleString() + (data.expiresAt? " - expire "+new Date(data.expiresAt).toLocaleString():"");
  const cont=$("viewerContent");
  if(data.type==="photo" || data.image || data.photo){
    const src=data.image||data.photo;
    cont.innerHTML=`<img src="${src}">`;
  }else{
    cont.innerHTML=`<div id="viewerText" style="background:${data.bg}">${esc(data.text)}</div>`;
  }
};
window.closeViewer=()=>{ $("viewer").classList.remove("show"); };

</script>
</body>
</html>
